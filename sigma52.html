    if (final === 'raise') {
      if (level <= 1) return [0, pr.pfr];
      if (level === 2) return [0, pr.vpip * pr.cont * pr.three];
      return [0, profile === 'maniaque' ? 0.07 : 0.025];
    }
    if (final === 'call') {
      if (level <= 1) return [pr.pfr, profile === 'station' ? pr.vpip : Math.min(pr.vpip, pr.pfr * 1.3)];
      if (level === 2) return [pr.vpip * pr.cont * pr.three, cheapCall ? pr.vpip : pr.vpip * pr.cont];
      return [profile === 'maniaque' ? 0.07 : 0.025, Math.max(pr.vpip * pr.cont * 0.35, profile === 'station' ? 0.12 : 0)];
    }
    return [0, 1]; // check de la grosse blinde : toutes les mains
  }

  // Range estimée d'un adversaire, en combinaisons, compte tenu des cartes connues du héros.
  // Repères tête-à-tête à 100 bb (approximatifs) : le bouton ouvre très large, la grosse blinde défend large.
  const HU = {
    open: '22+, A2+, K2+, Q2+, J2s+, J4o+, T2s+, T6o+, 93s+, 96o+, 84s+, 86o+, 73s+, 75o+, 63s+, 65o, 52s+, 54o, 42s+, 32s',
    three: '99+, ATs+, KJs+, A5s-A3s, AJo+, KQo, K7s, Q8s, J8s, T8s, 97s, 86s',
    call: '22-88, A2s-A9s, K2s-KTs, Q2s-QJs, J2s-JTs, T4s-T9s, 94s-98s, 84s-87s, 74s-76s, 63s-65s, 52s-54s, 42s-43s, 32s, A2o-ATo, K2o-KJo, Q5o-QJo, J7o-JTo, T7o-T9o, 97o-98o, 86o-87o, 76o, 65o',
  };
  // Profil de base d'un joueur (les styles « champions » sont estimés comme leur profil le plus proche).
  const K = (p) => (TS.kindOf ? TS.kindOf(TS.PROFILES[p.profile], p.profile) : p.profile);
  function villainRange(t, vi) {
    const p = t.players[vi], pr = TS.PROFILES[p.profile];
    const dead = [...t.players[0].cards, ...t.board];
    let lo = 0, hi = 1, level = 1;
    for (const s of t.seq) {
      if (s.street !== 'pre') break;
      if (s.i === vi) {
        const [a, b] = preflopInterval(pr, K(p), s.final, level, false);
        if (s.final !== 'fold') { lo = Math.max(lo, Math.min(a, b)); hi = Math.min(hi, Math.max(a, b)); }
      }
      if (s.final === 'raise') level++;
    }
    if (hi <= lo) hi = Math.min(1, lo + 0.03);
    const hands = E.ALL169.filter((h) => { const x = pctOf(h); return x >= lo && x < hi; });
    let combos = E.rangeCombos(new Set(hands), dead);
    // Postflop : on retire ce qu'il n'aurait pas joué ainsi.
    for (const street of ['flop', 'turn', 'river']) {
      const acts = t.seq.filter((s) => s.i === vi && s.street === street);
      if (!acts.length || t.board.length < STREET_N[street]) continue;
      const bd = t.board.slice(0, STREET_N[street]), last = acts[acts.length - 1].final;
      const keep = (c) => {
        const k = B.classify(c, bd), pair = k.made <= 11, draw = k.draws.length > 0;
        if (last === 'raise') return K(p) === 'maniaque' ? true : K(p) === 'station' ? k.made <= 10 : pair || draw;
        if (last === 'call') return K(p) === 'station' ? pair || draw || (c[0] >> 2) >= 11 || (c[1] >> 2) >= 11 : K(p) === 'maniaque' ? true : pair || draw;
        return true;
      };
      const f = combos.filter(keep);
      if (f.length >= 3) combos = f;
    }
    return { combos, lo, hi, pct: hands.reduce((a, h) => a + E.combos(h).length, 0) / 1326 };
  }

  function describeRange(r) {
    const byClass = new Map();
    for (const c of r.combos) { const h = E.abstractOf(c[0], c[1]); byClass.set(h, (byClass.get(h) || 0) + 1); }
    const top = [...byClass.entries()].sort((a, b) => pctOf(a[0]) - pctOf(b[0])).map(([h]) => h);
    return top.length > 14 ? top.slice(0, 10).join(' ') + ' … ' + top.slice(-3).join(' ') : top.join(' ');
  }

  const inRange = (str, h) => E.parseRange(str).has(h);

  function advise(t, opts = {}) {
    const hero = t.players[0], L = t.legal(), pos = TS.posName(t, 0), hand = E.abstractOf(hero.cards[0], hero.cards[1]);
    const villains = t.players.map((p, i) => i).filter((i) => i > 0 && t.players[i].inHand);
    const ranges = villains.map((vi) => ({ vi, name: t.players[vi].name, profile: K(t.players[vi]), real: t.players[vi].profile, ...villainRange(t, vi) }));
    const stationIn = ranges.some((r) => r.profile === 'station');
    const why = [], cats = [];
    let rec = L.canCheck ? 'check' : 'fold', to = 0, eq = null;
    const need = L.toCall > 0 ? L.toCall / (L.pot + L.toCall) : 0;
    const preSeq = t.seq.filter((s) => s.street === 'pre');
    const raisesBefore = preSeq.filter((s) => s.final === 'raise').length;
    const limpers = preSeq.filter((s) => s.final === 'call').length;
    const heroActedPre = preSeq.some((s) => s.i === 0);

    const hu = t.active().length === 2;
    if (t.street === 'pre') {
      if (raisesBefore === 0 && limpers === 0 && !heroActedPre && pos !== 'BB') {
        cats.push('rfi');
        const R = hu ? HU.open : C.RFI[pos].range, inR = E.parseRange(R).has(hand);
        rec = inR ? 'raise' : 'fold'; to = t.bb * (hu ? 2.5 : pos === 'SB' ? 3 : 2.5);
        why.push(hu ? `Tête-à-tête au bouton : ${hand} est ${inR ? 'dans' : 'hors de'} la range d'ouverture de référence (${E.rangePct(E.parseRange(R)).toFixed(0)} % des mains) : on relance très large à deux.` : `Premier à entrer en ${pos} : ${hand} est ${inR ? 'dans' : 'hors de'} la range d'ouverture (${E.rangePct(E.parseRange(R)).toFixed(0)} % des mains).`);
        if (!inR && ranges.some((r) => (r.vi === t.sbi || r.vi === t.bbi) && r.profile === 'station') && pctOf(hand) < 0.6) why.push('Une calling station est aux blindes : élargir légèrement est défendable, mais la référence reste le fold.');
      } else if (raisesBefore === 0 && limpers > 0) {
        cats.push('iso');
        const lim = preSeq.filter((s) => s.final === 'call').map((s) => t.players[s.i]);
        const vsFish = lim.some((p) => K(p) === 'station');
        const thr = pos === 'BB' ? 0.12 : vsFish ? 0.3 : 0.2, good = pctOf(hand) < thr;
        rec = good ? 'raise' : L.canCheck ? 'check' : 'fold'; to = t.bb * (3.5 + limpers + (vsFish ? 1 : 0));
        why.push(`${limpers} limper${limpers > 1 ? 's' : ''} devant toi${vsFish ? ', dont un fish passif' : ''}. ${good ? `${hand} est assez fort pour isoler : relance à ${(to / t.bb).toFixed(1).replace('.', ',')} bb (3,5 bb + 1 par limper${vsFish ? ' + 1 contre un fish' : ''}).` : `${hand} est trop faible pour isoler${L.canCheck ? ' : check gratuit' : ' : fold'}.`}`);
        if (good) why.push('Objectif : jouer le coup seul contre lui, en position si possible, avec la meilleure range.');
      } else if (raisesBefore === 1) {
        cats.push('pfdef');
        const openIdx = preSeq.find((s) => s.final === 'raise').i, opener = t.players[openIdx], oPos = TS.posName(t, openIdx);
        const callers = preSeq.filter((s, k) => s.final === 'call' && k > preSeq.findIndex((x) => x.final === 'raise')).length;
        let act = callers === 0 ? (hu && pos === 'BB' ? (inRange(HU.three, hand) ? '3bet' : inRange(HU.call, hand) ? 'call' : 'fold') : C.facingAction(oPos, pos, hand)) : null;
        if (hu && pos === 'BB' && callers === 0) why.push('Tête-à-tête en grosse blinde : la défense est très large (référence approximative à 100 bb).');
        if (!act) act = inRange('QQ+, AK', hand) ? '3bet' : inRange('JJ-22, AQs-ATs, KQs, QJs, JTs, T9s, 98s', hand) && (pos === 'BTN' || pos === 'BB' || pos === 'CO') ? 'call' : 'fold';
        if (K(opener) === 'station' && act === '3bet' && !inRange('TT+, AQ+, KQs', hand)) { act = pos === 'SB' ? 'fold' : 'call'; why.push(`Contre ${opener.name}, fish passif, pas de 3-bet bluff : il paie. ${hand} devient un ${act === 'call' ? 'call' : 'fold'}.`); }
        if (K(opener) === 'station' && act === 'fold' && inRange('99+, AJ+, KQ', hand)) { act = '3bet'; why.push(`Contre un fish qui ouvre large et paie, ${hand} se 3-bette pour la valeur.`); }
        rec = act === '3bet' ? 'raise' : act === 'call' ? 'call' : (L.canCheck ? 'check' : 'fold');
        const ip = !['SB', 'BB'].includes(pos);
        to = t.cur * (ip ? 3 : 4) + t.cur * callers;
        why.push(`${opener.name} (${oPos}) a ouvert${callers ? `, ${callers} joueur${callers > 1 ? 's ont' : ' a'} suivi` : ''}. Référence pour ${hand} en ${pos} : ${act === '3bet' ? `3-bet à ${(to / t.bb).toFixed(1).replace('.', ',')} bb (${ip ? '3' : '4'} × l'ouverture${callers ? ' + 1 par caller' : ''})` : act === 'call' ? 'call' : 'fold'}.`);
      } else {
        cats.push('pfdef');
        const lastR = [...preSeq].reverse().find((s) => s.final === 'raise'), agg = t.players[lastR.i];

        const callR = four ? '' : K(agg) === 'nit' ? 'JJ-TT, AQs' : 'JJ-88, AQs, AJs, KQs, JTs, T9s';
        if (inRange(valueR, hand)) { rec = 'raise'; to = four ? L.maxTo : t.cur * 2.3; }
        else if (callR && inRange(callR, hand)) rec = 'call';

        why.push(`${agg.name} (${TS.PROFILES[agg.profile].label}) a ${four ? '4-betté' : 'sur-relancé'}. ${rec === 'raise' ? `${hand} est assez fort pour ${four ? 'aller à tapis' : '4-better (≈ 2,3 × la relance)'}.` : rec === 'call' ? `${hand} se paie, de préférence en position.` : `${hand} ne tient pas face à cette range.`}`);
        if (K(agg) === 'nit') why.push('Un nit ne sur-relance qu\'avec le haut de sa range : resserre-toi.');
      }

      if (ranges.length) eq = E.equity([{ hand: hero.cards }, ...ranges.map((r) => ({ combos: r.combos }))], [], { iterations: opts.iterations || 2500 }).equity[0];
    } else {
      eq = E.equity([{ hand: hero.cards }, ...ranges.map((r) => ({ combos: r.combos }))], t.board, { iterations: opts.iterations || 3000 }).equity[0];
      const k = B.classify(hero.cards, t.board), multi = ranges.length > 1, river = t.street === 'river';
      const drawNote = k.draws.length ? ` Tirage : ${k.draws.map((d) => B.DRAWS[d].toLowerCase()).join(', ')}.` : '';
      why.push(`Ta main : ${B.MADE[k.made].toLowerCase()}.${drawNote} Équité contre ${multi ? 'les ranges estimées' : 'la range estimée'} : ${fmtP(eq)}.`);
      if (L.toCall > 0) {
        cats.push('odds');
        const implied = k.draws.length && stationIn && !river ? 0.04 : 0;

        else if (eq + implied >= need) { rec = 'call'; why.push(`Cotes : ${fmtP(need)} requis, ${fmtP(eq)} d'équité${implied ? ' plus des gains implicites contre un fish qui paiera ton tirage' : ''} : call rentable.`); }
        else { rec = 'fold'; why.push(`Cotes : ${fmtP(need)} requis, seulement ${fmtP(eq)} d'équité : le call perd de l'argent.`); }

        if (bp && K(bp) === 'maniaque') why.push(`${bp.name} est un maniaque : sa range de mise contient beaucoup de bluffs, d'où une équité plus haute qu'on ne le croit.`);

          why.push(`Avec ${fmtP(eq)} d'équité, mise pour la valeur : environ ${Math.round(frac * 100)} % du pot${stationIn ? ', car une calling station paie les grosses mises avec pire' : ''}.`);
        } else if (stationIn && eq < 0.45) {

          cats.push('bluff'); rec = 'raise'; to = Math.max(L.minTo, L.pot * 0.33);
          why.push(`Tu as l'initiative contre un ${TS.PROFILES[ranges[0].real].label.toLowerCase()} qui rate souvent le flop : petit continuation bet (≈ 33 % du pot).`);
        } else { rec = 'check'; why.push('Main moyenne ou faible sans bonne raison de miser : check.'); }

    return { pos, hand, rec, to, eq, need, toCall: L.toCall, pot: L.pot, cats, why, ranges: ranges.map((r) => ({ name: r.name, profile: r.profile, label: TS.PROFILES[r.real].label, n: r.combos.length, pct: r.pct, desc: describeRange(r) })) };
  }


  // Tapis courts (Expresso, fins de tournoi) : tapis ou couché.
  // Tête-à-tête SB contre BB : équilibre de Nash exact (solveur). À 3 joueurs : estimation contre les seuils connus des bots.
  const freqBelow = (thr) => E.ALL169.map((h) => (pctOf(h) < thr ? 1 : 0));
  function pushFoldAdvice(t) {
    if (t.street !== 'pre') return null;
    const hero = t.players[0], L = t.legal(), S = t.effStack(0) / t.bb;
    if (S > 15) return null;
    const hand = E.abstractOf(hero.cards[0], hero.cards[1]), hi = SV.idx(hand), pos = TS.posName(t, 0);
    const act = t.active().length, why = [], fmtBb = (x) => (x / t.bb).toFixed(1).replace('.', ',') + ' bb';
    const nashS = Math.max(1, Math.min(25, Math.round(S * 2) / 2)), sol = SV.solveChip(nashS);
    const aggr = [...t.seq].reverse().find((x) => x.street === 'pre' && x.final === 'raise');

    if (!aggr) {

        ev = sol.evPush[hi]; rec = ev > 0 ? 'raise' : (L.canCheck ? 'check' : 'fold');

      } else {
        // Estimation : chaque adversaire restant paie selon son seuil ; au plus un caller.

          const th = t.pfThresholds(k, Math.min(25, t.effStack(k) / t.bb)), f = th.call;

          pAllFold *= 1 - f;
        }
        ev = (pAllFold * pot + evCall) / t.bb; rec = ev > 0 ? 'raise' : (L.canCheck ? 'check' : 'fold');
        why.push(`${act} joueurs, ${fmtBb(t.effStack(0))} effectifs en ${pos}. Les adversaires se couchent tous ${fmtP(pAllFold)} du temps d'après leur profil. Pousser ${hand} vaut environ ${ev >= 0 ? '+' : '−'}${Math.abs(ev).toFixed(2).replace('.', ',')} bb (estimation).`);
      }
    } else {
      const pk = aggr.i, th = t.pfThresholds(pk, Math.min(25, t.effStack(pk) / t.bb));
      if (act === 2 && pk === t.sbi) {
        ev = sol.evCall[hi]; rec = ev > 0 ? 'call' : 'fold'; eq = SV.eqVsRange(hi, sol.push);
        why.push(`Tête-à-tête : la SB pousse ${fmtP(sol.pushPct)} des mains à l'équilibre, la BB paie ${fmtP(sol.callPct)}. Payer avec ${hand} vaut ${ev >= 0 ? '+' : '−'}${Math.abs(ev).toFixed(2).replace('.', ',')} bb par rapport à se coucher.`);
      } else {
        eq = SV.eqVsRange(hi, freqBelow(th.push)); rec = eq >= need ? 'call' : 'fold';
        why.push(`${t.players[pk].name} (${TS.PROFILES[t.players[pk].profile].label}) pousse environ ${fmtP(th.push)} des mains à cette profondeur. Ton équité contre cette range : ${fmtP(eq)} ; il t'en faut ${fmtP(need)}.`);
      }
      if (K(t.players[pk]) === 'maniaque') why.push('Un maniaque pousse plus large que l\'équilibre : paie un peu plus large.');
      if (K(t.players[pk]) === 'nit') why.push('Un nit pousse plus serré que l\'équilibre : paie plus serré.');
    }
    why.push('Expresso : le gagnant prend tout, donc les jetons valent leur poids en argent ; l\'équilibre en jetons s\'applique.');
    return { pos, hand, rec, to: L.maxTo, eq, need, ev, toCall: L.toCall, pot: L.pot, cats: ['pushfold'], why, ranges: [] };
  }

  // Note une action du héros par rapport à la recommandation.
  function grade(adv, act, to, t) {
    const norm = (a) => (a === 'check' ? 'check' : a);
    let ok = norm(act) === norm(adv.rec) || (adv.rec === 'fold' && act === 'check');
    let note = '';

  const pct1 = (x) => (x * 100).toFixed(1).replace('.', ',') + ' %';

  // Calculs d'une étape : board visible, équité contre la range, cotes, ou solution Nash / ICM.
  function stepInfo(sc, k, opts = {}) {
    const st = sc.steps[k], hero = E.parseCards(sc.hero), board = E.parseCards(sc.board).slice(0, N[st.street]);
    const info = { board, hero, need: st.toCall > 0 ? st.toCall / (st.pot + st.toCall) : 0 };
    if (st.kind === 'nash') {
      const sol = Solver.solveChip(st.S), i = Solver.idx(st.hand), push = st.role === 'sb';
      const ev = push ? sol.evPush[i] : sol.evCall[i];
      info.best = ev > 0 ? 0 : 1; info.ev = ev; info.nash = { pushPct: sol.pushPct, callPct: sol.callPct };
      info.line = `Solveur : à ${st.S} bb, la SB pousse ${pct1(sol.pushPct)} des mains et la BB paie ${pct1(sol.callPct)}. ${push ? 'Pousser' : 'Payer'} ${st.hand} vaut ${ev >= 0 ? '+' : '−'}${Math.abs(ev).toFixed(2).replace('.', ',')} bb par rapport à se coucher.`;
    } else if (st.kind === 'icm') {
      const o = Solver.icmOutcomes(st.stacks, st.sb, st.bb, st.payouts), sol = Solver.solveOutcomes(o.V), i = Solver.idx(st.hand);
      const chip = Solver.solveChip(Math.min(st.stacks[st.sb], st.stacks[st.bb]));
      info.best = sol.evCall[i] > 0 ? 0 : 1; info.ev = sol.evCall[i];
      info.line = `En jetons, payer ${st.hand} vaut ${chip.evCall[i] >= 0 ? '+' : '−'}${Math.abs(chip.evCall[i]).toFixed(2).replace('.', ',')} bb. En ICM, payer vaut ${sol.evCall[i] >= 0 ? '+' : '−'}${Math.abs(sol.evCall[i]).toFixed(2).replace('.', ',')} point de % du prize pool. La BB paie ${pct1(chip.callPct)} des mains en jetons, ${pct1(sol.callPct)} en ICM.`;
    } else {
      const combos = E.rangeCombos(st.range, [...hero, ...board]);
      const r = E.equity([{ hand: hero }, { combos }], board, { iterations: opts.iterations || 20000 });
      info.eq = r.equity[0]; info.combos = combos.length;
      info.line = `Ton équité contre sa range (${combos.length} combinaisons) : ${pct1(info.eq)}.` + (st.toCall > 0 ? ` Il te faut ${pct1(info.need)} pour payer (${String(st.toCall).replace('.', ',')} bb dans un pot final de ${String(st.pot + st.toCall).replace('.', ',')} bb).` : '');
    }
    return info;
  }
  // Note d'une option : 2/1/0, ou calculée par le solveur pour les étapes Nash et ICM.
  function optionGrade(sc, k, oi, info) {
    const o = sc.steps[k].options[oi];

<script>// Programme de 17 semaines : de débutant à joueur complet, jusqu'aux techniques Élite, au live et au métier. Chaque tâche se coche toute seule à partir de ta progression.
// Types de tâches : mod (module maîtrisé au quiz), spot (maîtrise sur les 30 dernières réponses), guided (main guidée réussie),
// table (mains jouées au simulateur), expresso (parties jouées), journal (sessions saisies), bankroll (bankroll renseignée), import (historique analysé),
// solver (spots résolus au solveur), trainer (décisions river notées par l'entraîneur solveur).
(function (root) {
  const W = [
    { title: 'Le cadre et les règles', why: 'Jouer légalement, sans erreur de règle ni de lecture de main.', tasks: [['mod', 'cadre'], ['mod', 'regles'], ['mod', 'mains'], ['spot', 'meilleure', 0.8, 20], ['bankroll']] },
    { title: 'Positions et ouvertures', why: 'La première source de gains : ouvrir les bonnes mains aux bonnes positions.', tasks: [['mod', 'positions'], ['mod', 'preflop'], ['spot', 'rfi', 0.85, 30], ['table', 50]] },
    { title: 'Les maths de base', why: 'Payer ou se coucher selon les cotes, plus jamais au feeling.', tasks: [['mod', 'maths'], ['spot', 'odds', 0.85, 30], ['spot', 'outs', 0.7, 20], ['guided', 'nitriver']] },
    { title: 'Bankroll et jeu en ligne', why: 'Protéger ton capital et installer une routine.', tasks: [['mod', 'bankroll'], ['mod', 'online'], ['mod', 'online2'], ['mod', 'live'], ['table', 150], ['journal', 1]] },
    { title: 'Préflop complet', why: '3-bet, défense des blindes, squeeze : la moitié des erreurs des micro-limites.', tasks: [['mod', 'preflop2'], ['spot', 'vsopen', 0.8, 30], ['guided', 'squeeze'], ['guided', 'vsthreebet']] },
    { title: 'Postflop', why: 'Textures, continuation bet, plan de main sur trois rues.', tasks: [['mod', 'postflop'], ['mod', 'turnriver'], ['spot', 'tirage', 0.7, 20], ['guided', 'cbetdry'], ['guided', 'thinvalue']] },
    { title: 'Exploiter les fish', why: 'Ton argent vient d\'eux : valeur grosse, zéro bluff, isolation.', tasks: [['mod', 'fish'], ['mod', 'adversaires'], ['guided', 'iso3'], ['guided', 'nobluff'], ['guided', 'maniac'], ['table', 300]] },

    { title: 'Bloqueurs et stratégie de flop', why: 'Choisir ses bluffs, sa taille de c-bet et sa défense hors de position.', tasks: [['mod', 'bloqueurs'], ['mod', 'avantage'], ['mod', 'oopplay'], ['spot', 'combos', 0.8, 30], ['solver', 8]] },

  ];

  // État d'une tâche à partir de l'état de l'application : { done, label, progress (0..1), go (onglet / action) }.
  function taskStatus(task, st, K, S) {
    const [kind, a, b, c] = task, p = st.progress;
    if (kind === 'mod') { const m = K.MODULES.find((x) => x.id === a), sc = p.quiz?.[a] ?? 0; return { done: sc >= 0.8, label: `Module « ${m ? m.title : a} » maîtrisé (quiz ≥ 80 %)`, progress: Math.min(1, sc / 0.8), go: ['mod', a] }; }
    if (kind === 'spot') { const h = p.hist?.[a] || [], m = h.length ? h.reduce((x, y) => x + y, 0) / h.length : 0; return { done: h.length >= c && m >= b, label: `Spots « ${S.TYPES[a]} » : ${Math.round(b * 100)} % sur au moins ${c} réponses`, progress: Math.min(1, (h.length / c) * Math.min(1, m / b)), go: ['spot', a] }; }
    if (kind === 'guided') { const sc = p.guided?.[a] ?? 0; return { done: sc >= 0.75, label: `Main guidée « ${(root.Guided || require('./guided.js')).SCENARIOS.find((x) => x.id === a)?.title || a} » réussie`, progress: Math.min(1, sc / 0.75), go: ['guided', a] }; }
    if (kind === 'table') { const n = p.tableHands || 0; return { done: n >= a, label: `${a} mains au simulateur (cumul)`, progress: Math.min(1, n / a), go: ['sim', 'table'] }; }
    if (kind === 'expresso') { const n = p.expresso?.games || 0; return { done: n >= a, label: `${a} parties d'Expresso simulées`, progress: Math.min(1, n / a), go: ['sim', 'expresso'] }; }
    if (kind === 'journal') { const n = st.journal.sessions.length; return { done: n >= a, label: `${a} session${a > 1 ? 's' : ''} réelle${a > 1 ? 's' : ''} saisie${a > 1 ? 's' : ''} dans le Journal`, progress: Math.min(1, n / a), go: ['tab', 'journal'] }; }
    if (kind === 'bankroll') { const ok = +st.settings.bankroll0 > 0; return { done: ok, label: 'Bankroll de départ renseignée dans le Journal', progress: ok ? 1 : 0, go: ['tab', 'journal'] }; }
    if (kind === 'solver') { const n = p.solves || 0; return { done: n >= a, label: `${a} spots résolus et étudiés au solveur (cumul)`, progress: Math.min(1, n / a), go: ['tab', 'solveur'] }; }
    if (kind === 'trainer') { const n = p.trainer?.n || 0; return { done: n >= a, label: `${a} décisions river notées par l'entraîneur solveur (cumul)`, progress: Math.min(1, n / a), go: ['trainer', 1] }; }
    if (kind === 'champ') { const n = Object.values(p.champs?.by || {}).reduce((x, y) => x + y.sessions, 0); return { done: n >= a, label: `${a} sessions complètes contre les styles Champions`, progress: Math.min(1, n / a), go: ['tab', 'champions'] }; }
    if (kind === 'import') { const ok = !!st.notes.lastImport; return { done: ok, label: 'Tes historiques analysés au moins une fois', progress: ok ? 1 : 0, go: ['tab', 'analyse'] }; }
    return { done: false, label: kind, progress: 0, go: null };
  }
  function weekStatus(st, K, S) {
    return W.map((w, i) => { const tasks = w.tasks.map((t) => taskStatus(t, st, K, S)); return { n: i + 1, ...w, tasks, done: tasks.every((t) => t.done), progress: tasks.reduce((a, t) => a + t.progress, 0) / tasks.length }; });
  }
  const api = { WEEKS: W, taskStatus, weekStatus };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.Plan = api;
})(typeof window !== 'undefined' ? window : globalThis);
</script>

      ${['Je suis reposé, calme, sans perte récente qui me travaille.', 'J\'ai fait mes révisions et mes 10 spots du jour.', ms ? `Ma bankroll permet la limite que je vais jouer (maximum : ${ms}).` : 'Ma bankroll permet la limite que je vais jouer (renseigne-la dans Journal).', 'Mon stop-loss est fixé : 3 caves perdues, j\'arrête.', 'SIGMA 52 sera fermé pendant toute la session.']

  };

  // ---------- Cours ----------
  let openMod = null, qAns = {}, showGloss = false;
  const quizScore = (id) => state.progress.quiz?.[id];
  const mastered = (m) => (quizScore(m.id) ?? 0) >= 0.8;
  function quizAnswer(m, qi, i) {

      const item = { key, spot: { type: 'situations', title: 'Quiz · ' + m.title, prompt: esc(q.q), opts: q.opts, ok: q.ok, why: q.why, sid: key }, iv: 1, due: addDays(1) };
      if (idx >= 0) p.review[idx] = item; else p.review.push(item);
    }
    if (Object.keys(qAns).length === m.quiz.length) {
      const sc = m.quiz.filter((qq, k) => qAns[k] === qq.ok).length / m.quiz.length;

  }
  VIEWS.cours = () => {
    if (openMod) {
      const m = K.MODULES.find((x) => x.id === openMod), i = K.MODULES.indexOf(m), nxt = K.MODULES[i + 1], L = K.LEVELS[m.level - 1];

          ${a !== undefined ? `<div class="verdict ${a === q.ok ? 'good' : 'bad'}"><b>${a === q.ok ? 'Juste.' : 'Non : ' + esc(q.opts[q.ok]) + '.'}</b><span>${esc(q.why)}</span></div>` : ''}</div>`;

          <section class="panel" style="background:var(--good-bg);border-color:transparent"><h3>À retenir</h3><ul>${m.keys.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></section></div></article>
      <section style="display:grid;gap:10px"><div class="row" style="justify-content:space-between"><h2>Quiz du module</h2>${quizScore(m.id) !== undefined ? `<span class="pill ${mastered(m) ? 'good' : ''}">Meilleur score : ${pct(quizScore(m.id))}</span>` : ''}</div>${quiz}
        ${done ? `<div class="verdict ${right / m.quiz.length >= 0.8 ? 'good' : 'bad'}"><b>${right}/${m.quiz.length} · ${right / m.quiz.length >= 0.8 ? 'Module maîtrisé.' : 'Seuil de maîtrise : 80 %. Relis les sections concernées puis recommence.'}</b>${right < m.quiz.length ? '<span>Tes erreurs reviennent demain dans les Révisions.</span>' : ''}</div><div class="row"><button class="btn" data-act="qreset">Recommencer le quiz</button></div>` : ''}</section>

        ${nxt ? `<button class="btn primary" data-act="openmod" data-id="${nxt.id}">Module suivant →</button>` : ''}</div>`;
    }
    const total = K.MODULES.length, nM = K.MODULES.filter(mastered).length;
    return head('Cours', `De débutant à professionnel, en ${K.LEVELS.length} niveaux et ${total} modules. Chaque module : objectifs, cours, erreurs fréquentes, points à retenir, quiz noté et exercice lié. Un module est maîtrisé à 80 % au quiz.`) +
      `<div class="stats"><div class="stat hero"><span>Modules maîtrisés</span><b>${nM}/${total}</b><span>quiz réussis à 80 % ou plus</span></div>${K.LEVELS.map((L) => { const ms = K.MODULES.filter((m) => m.level === L.n); return `<div class="stat"><span>Niveau ${L.n} · ${L.title}</span><b>${ms.filter(mastered).length}/${ms.length}</b><span>${ms.reduce((a, m) => a + m.minutes, 0)} min</span></div>`; }).join('')}</div>

      <section class="panel"><div class="row" style="justify-content:space-between"><h2>Lexique</h2><button class="btn small" data-act="gloss">${showGloss ? 'Masquer' : 'Afficher les ' + K.GLOSSARY.length + ' termes'}</button></div>
        ${showGloss ? `<div class="tw"><table class="t"><tbody>${K.GLOSSARY.map(([w, d]) => `<tr><td style="min-width:120px"><strong>${esc(w)}</strong></td><td>${esc(d)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="note">Les termes des tables et des contenus de poker, en français et en anglais.</p>'}</section>`;

  };

  // ---------- Spots ----------
  let spotMode = 'mix', sitCat = '', spot = null, answered = null, daily = false, reviewItem = null;

  function newSpot() {
    answered = null; reviewItem = null;

    const h = p.hist[spot.type] || (p.hist[spot.type] = []); h.push(ok ? 1 : 0); if (h.length > 30) h.shift();

    // Répétition espacée : une erreur entre dans la file ; une réussite en révision espace la suivante (1, 3, 7, 18, 45 jours).
    const key = spotKey(spot), idx = p.review.findIndex((r) => r.key === key);
    if (!ok) { const item = { key, spot: JSON.parse(JSON.stringify(spot)), iv: 1, due: addDays(1) }; if (idx >= 0) p.review[idx] = item; else p.review.push(item); if (p.review.length > 150) p.review.shift(); }
    else if (idx >= 0) { const r = p.review[idx]; r.iv = r.iv === 1 ? 3 : Math.round(r.iv * 2.5); r.due = addDays(r.iv); if (r.iv > 40) p.review.splice(idx, 1); }

  }
  VIEWS.spots = () => {
    if (!spot) newSpot();

      : spot.cards || spot.board ? `<div class="felt">${spot.board ? `<span class="eyebrow">Board</span>${cardsHTML(spot.board)}` : ''}${spot.cards ? `<span class="eyebrow">Ta main</span>${cardsHTML(spot.cards)}` : ''}${spot.vil ? `<span class="eyebrow">Adversaire</span>${cardsHTML(spot.vil, true)}` : ''}</div>` : '';

      `<div class="row" role="group" aria-label="Type de spot">${[['mix', 'Mix'], ...Object.entries(S.TYPES)].map(([k, l]) => `<button class="chip" aria-pressed="${spotMode === k}" data-act="mode" data-mode="${k}">${l}</button>`).join('')}
        <button class="chip" aria-pressed="${spotMode === 'review'}" data-act="mode" data-mode="review" ${due ? '' : 'disabled'}>Révisions (${due})</button></div>
      ${spotMode === 'situations' ? `<label class="f" style="max-width:260px">Catégorie<select id="sitcat"><option value="">Toutes</option>${cats.map((c) => `<option ${c === sitCat ? 'selected' : ''}>${c}</option>`).join('')}</select></label>` : ''}
      ${daily ? `<div class="row"><span class="pill acc">Entraînement du jour · ${d.date === today() ? d.done : 0}/10</span></div>` : ''}

      <section class="panel"><div class="row" style="justify-content:space-between"><span class="eyebrow">${esc(spot.title)}</span><span class="note mono">${st.n ? pct(st.ok / st.n) + ' sur ' + st.n : 'premier essai'} · série ${state.progress.streak}</span></div>
        <p style="font-size:17px">${spot.prompt}</p>${visual}
        <div class="opts">${spot.opts.map((o, i) => `<button class="opt${answered !== null && i === spot.ok ? ' ok' : ''}${answered === i && i !== spot.ok ? ' ko' : ''}" data-act="ans" data-i="${i}" ${answered !== null ? 'disabled' : ''}><span class="mono note">${i + 1}</span> ${esc(o)}</button>`).join('')}</div>
        ${answered !== null ? `<div class="verdict ${ok ? 'good' : 'bad'}"><b>${ok ? 'Juste.' : 'Non : ' + esc(spot.opts[spot.ok]) + '.'}</b>${evLine ? `<div>${evLine}</div>` : ''}<span>${esc(spot.why)}</span>${!ok ? '<span class="note">Ajouté à tes révisions : il revient demain.</span>' : ''}</div>
        <div class="row"><button class="btn primary" data-act="next">Spot suivant</button>${['tirage', 'meilleure', 'outs'].includes(spot.type) ? '<button class="btn" data-act="toEq">Analyser dans Équité</button>' : ''}${spot.type === 'pushfold' ? '<button class="btn" data-act="toPF">Voir le tableau Nash</button>' : ''}</div>` : ''}
      </section>`;
  };

  const LINEUPS = { equilibree: ['station', 'reg', 'maniaque', 'station', 'nit'], fish: ['station', 'station', 'reg', 'station', 'maniaque'], regs: ['reg', 'reg', 'nit', 'reg', 'maniaque'] };

  // ---------- Outils ----------
  let tool = 'equite';
  const TOOLS = [['equite', 'Équité'], ['board', 'Board'], ['pushfold', 'Push/Fold & ICM'], ['ranges', 'Ranges']];
  const TOOLVIEWS = {};

    `<div class="subtabs" role="tablist">${TOOLS.map(([k, l]) => `<button class="chip" aria-pressed="${tool === k}" data-act="tool" data-t="${k}">${l}</button>`).join('')}</div>` + TOOLVIEWS[tool]();

  // Équité
  const eqIn = { p: ['AhKh', 'QcQs', '', ''], board: '2h7hJd' };

    s = (s || '').trim(); if (!s) return null;

    return { combos: E.rangeCombos(s), label: s, set: E.parseRange(s) };
  }
  function runEquity() {
    try {
      const board = E.parseCards(eqIn.board);
      const ps = eqIn.p.map(parsePlayer).map((p, i) => p && { ...p, idx: i }).filter(Boolean);
      if (ps.length < 2) throw new Error('Il faut au moins deux joueurs.');
      if (board.length > 5 || board.length === 1 || board.length === 2) throw new Error('Le board fait 0, 3, 4 ou 5 cartes.');
      const all = [...board, ...ps.flatMap((p) => p.hand || [])];
      if (new Set(all).size !== all.length) throw new Error('Une carte apparaît deux fois.');
      const t0 = performance.now(), r = E.equity(ps, board, { iterations: 80000 });
      let outs = null, matrix = null;
      if (ps.length === 2 && ps[0].hand && ps[1].hand && (board.length === 3 || board.length === 4)) outs = E.outs(ps[0].hand, ps[1].hand, board);

      }

    } catch (e) { eqOut = { err: e.message }; }
  }
  const EQEX = [['AA contre KK', ['AsAh', 'KdKc', '', ''], ''], ['Tirage couleur contre top paire', ['AhKh', 'QcQs', '', ''], '2h7hJd'], ['AK contre une range de 3-bet', ['AdKc', 'QQ+, AK', '', ''], ''], ['Ouverture UTG contre BTN', [C.RFI.UTG.range, C.RFI.BTN.range, '', ''], ''], ['Paire de 5 contre 3 joueurs', ['5s5c', 'random', 'random', 'random'], '']];
  TOOLVIEWS.equite = () => {

    return `<section class="panel"><p class="note">Comment une range touche un board : la base pour choisir ta taille de mise et tes bluffs.</p>
      <div class="row">${C.POS.map((p) => `<button class="chip" aria-pressed="${bdIn.label === p}" data-act="bdpos" data-p="${p}">Ouverture ${p}</button>`).join('')}</div>
      <div class="form"><label class="f" style="grid-column:1/-1">Range<input id="bdr" data-bd="range" value="${esc(bdIn.range)}" spellcheck="false"></label><label class="f">Board<input id="bdb" data-bd="board" value="${esc(bdIn.board)}" spellcheck="false"></label></div>
      <div class="row">${['Kh7c2d', '9h8h7c', 'As5s5d', 'QhJhTd', '2c2d2h', 'Ah9s4d6c'].map((b) => `<button class="btn small" data-act="bdex" data-b="${b}">${b}</button>`).join('')}</div></section>${out}`;
  };

  // Push/Fold & ICM
  const pf = { S: 10, ante: 0, view: 'push', icm: false, n: 3, stacks: [12, 8, 20], payouts: '50, 30, 20', sb: 1, bb: 2, sol: null, icmVals: null, err: null };
  const PAYPRESETS = [['Expresso (le gagnant prend tout)', '100'], ['Sit&Go 6 joueurs 65/35', '65, 35'], ['Sit&Go 9 joueurs 50/30/20', '50, 30, 20'], ['Table finale 30/20/14/10/8/6', '30, 20, 14, 10, 8, 6']];
  function solvePF() {
    if (!pf.icm) { pf.sol = SV.solveChip(pf.S, pf.ante); pf.icmVals = null; pf.err = null; return; }
    try {
      const st = pf.stacks.slice(0, pf.n).map(Number), pay = pf.payouts.split(/[;\s,]+/).map((x) => +x).filter((x) => x > 0);
      if (st.some((x) => !(x > 1))) throw new Error('Chaque tapis doit dépasser 1 bb.');
      if (pf.sb === pf.bb || pf.sb >= pf.n || pf.bb >= pf.n) throw new Error('Choisis deux joueurs différents pour la SB et la BB.');
      if (!pay.length) throw new Error('Indique au moins un gain.');
      const o = SV.icmOutcomes(st, pf.sb, pf.bb, pay, pf.ante);
      pf.sol = SV.solveOutcomes(o.V); pf.chip = SV.solveChip(Math.min(st[pf.sb], st[pf.bb]), pf.ante);
      pf.icmVals = { now: SV.icm(st, pay), st, pay, eff: Math.min(st[pf.sb], st[pf.bb]), total: pay.reduce((a, b) => a + b, 0) }; pf.err = null;
    } catch (e) { pf.err = e.message; pf.sol = null; }
  }
  TOOLVIEWS.pushfold = () => {
    if (!pf.sol && !pf.err) solvePF();
    const sol = pf.sol, freq = sol ? (pf.view === 'push' ? sol.push : sol.call) : null, iv = pf.icmVals;
    const g = sol ? grid169((h, i) => `<button class="rc${freq[i] > 0.001 ? ' heat' : ''}" ${heat(freq[i])} data-act="pfcell" data-h="${h}" aria-label="${h} ${Math.round(freq[i] * 100)} %">${h}</button>`) : '';
    const icmBlock = `<div class="form">
        <label class="f">Joueurs<select id="pfn" data-pf="n">${[2, 3, 4, 5, 6].map((n) => `<option ${n === pf.n ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
        ${Array.from({ length: pf.n }, (_, i) => `<label class="f">Tapis J${i + 1} (bb)<input id="pfs${i}" data-pfs="${i}" inputmode="decimal" value="${pf.stacks[i] ?? 10}"></label>`).join('')}
        <label class="f">Petite blinde<select id="pfsb" data-pf="sb">${Array.from({ length: pf.n }, (_, i) => `<option value="${i}" ${i === pf.sb ? 'selected' : ''}>J${i + 1}</option>`).join('')}</select></label>
        <label class="f">Grosse blinde<select id="pfbb" data-pf="bb">${Array.from({ length: pf.n }, (_, i) => `<option value="${i}" ${i === pf.bb ? 'selected' : ''}>J${i + 1}</option>`).join('')}</select></label>
        <label class="f" style="grid-column:1/-1">Gains par place (% du prize pool)<input id="pfpay" data-pf="payouts" value="${esc(pf.payouts)}"></label></div>
      <div class="row">${PAYPRESETS.map(([l, v]) => `<button class="btn small" data-act="pfpreset" data-v="${v}">${l}</button>`).join('')}</div>`;
    return `<section class="panel"><div class="row"><button class="chip" aria-pressed="${!pf.icm}" data-act="pfmode" data-m="chip">En jetons (cash, Expresso)</button><button class="chip" aria-pressed="${pf.icm}" data-act="pfmode" data-m="icm">ICM (Sit&Go, tournoi)</button></div>
      ${pf.icm ? icmBlock : `<label class="f">Tapis effectif : <b class="mono" id="pfsv">${pf.S} bb</b><input type="range" id="pfS" min="1" max="25" step="0.5" value="${pf.S}" data-pf="S"></label>`}
      <label class="check"><input type="checkbox" id="pfante" data-act="pfante" ${pf.ante ? 'checked' : ''}><span>Antes de 12,5 % de la BB par joueur</span></label>
      ${pf.err ? `<p class="pill bad" style="white-space:normal">${esc(pf.err)}</p>` : ''}</section>
      ${sol ? `<div class="stats"><div class="stat hero"><span>La SB pousse</span><b>${pct(sol.pushPct, 1)}</b><span>des mains</span></div><div class="stat"><span>La BB paie</span><b>${pct(sol.callPct, 1)}</b><span>des mains</span></div>
        ${iv ? `<div class="stat"><span>Effet de l'ICM</span><b>${sgn((sol.callPct - pf.chip.callPct) * 100, 1)} pts</b><span>sur les calls de la BB. En jetons, à ${fr(iv.eff, 1)} bb : tapis ${pct(pf.chip.pushPct, 1)}, call ${pct(pf.chip.callPct, 1)}</span></div>` : ''}</div>
      <section class="panel"><div class="row"><button class="chip" aria-pressed="${pf.view === 'push'}" data-act="pfview" data-v="push">Tapis de la SB</button><button class="chip" aria-pressed="${pf.view === 'call'}" data-act="pfview" data-v="call">Call de la BB</button></div>
        ${g}<div class="legend"><span><i style="background:var(--accent)"></i>toujours</span><span><i style="background:color-mix(in srgb, var(--accent) 55%, var(--sunk))"></i>mixte</span><span><i style="background:var(--sunk)"></i>jamais</span></div>
        <p class="note" id="pfdetail">Clique une main pour voir son EV. Solveur : meilleures réponses itérées (400 passes) sur la matrice préflop, effet de blocage inclus. Contrôle : à 10 bb en jetons, la SB pousse 58,4 % des mains, comme la référence publiée.</p></section>
      ${iv ? `<section class="panel"><h2>Équité ICM actuelle</h2><div class="tw"><table class="t"><thead><tr><th>Joueur</th><th class="n">Tapis</th><th class="n">Part des jetons</th><th class="n">Équité ICM</th></tr></thead><tbody>${iv.st.map((s, i) => `<tr><td>J${i + 1}${i === pf.sb ? ' (SB)' : i === pf.bb ? ' (BB)' : ''}</td><td class="n">${fr(s, 1)} bb</td><td class="n">${pct(s / iv.st.reduce((a, b) => a + b, 0), 1)}</td><td class="n">${pct(iv.now[i] / iv.total, 1)}</td></tr>`).join('')}</tbody></table></div>
        <p class="note">Modèle de Malmuth-Harville. Avec une seule place payée, l'équité ICM égale la part de jetons : l'ICM ne change rien en Expresso.</p></section>` : ''}` : ''}`;
  };

  // Ranges
  let rPos = 'BTN', custom = null;
  TOOLVIEWS.ranges = () => {
    const set = custom || E.parseRange(C.RFI[rPos].range);
    return `<section class="panel"><div class="row">${C.POS.map((p) => `<button class="chip" aria-pressed="${p === rPos && !custom}" data-act="pos" data-p="${p}">${p}</button>`).join('')}${custom ? '<span class="pill acc">Range perso</span>' : ''}</div>
      <div class="row" style="justify-content:space-between"><h2>${custom ? 'Range perso' : C.RFI[rPos].label}</h2><b class="mono" style="font-size:20px">${fr(E.rangePct(set), 1)} %</b></div>
      ${grid169((h) => `<button class="rc${set.has(h) ? ' on' : ''}" data-act="cell" data-h="${h}" aria-pressed="${set.has(h)}" aria-label="${h}">${h}</button>`)}
      <p class="note">Premier à entrer, 6-max, 100 bb. Diagonale : paires. Au-dessus : assorties (s). En dessous : dépareillées (o). Ouverture : ${C.RFI[rPos].size}. Clique une case pour créer ta range.</p>
      <p class="mono note" style="overflow-wrap:anywhere">${esc([...set].join(', '))}</p>
      <div class="row"><button class="btn" data-act="r2eq">Envoyer vers Équité</button><button class="btn" data-act="r2bd">Envoyer vers Board</button>${custom ? '<button class="btn" data-act="rreset">Revenir au standard</button>' : ''}<button class="btn" data-act="drill" data-type="rfi">S'entraîner</button></div></section>`;
  };

  // ---------- Analyse ----------
  let anText = '', anRes = null, anOpen = null, anErr = '';
  // kind : 'real' (tes mains, enregistrées), 'table' (table d'entraînement), 'sample' (exemple simulé). Seules les vraies mains alimentent tes fiches.
  function runAnalysis(text, kind) {
    try {
      const r = HH.analyze(text);
      if (!r.hands) throw new Error('Aucune main reconnue. Colle le texte brut des historiques Winamax ou PokerStars (une main commence par « Winamax Poker - » ou « PokerStars Hand »).');
      if (!r.hero) throw new Error('Mains reconnues, mais aucune ligne « Dealt to … » : impossible de savoir qui tu es.');
      const me = r.me;
      r.ev100 = me.hands ? (me.netBB - me.allins.reduce((a, x) => a + x.luck / x.bb, 0)) / me.hands * 100 : 0;
      r.kind = kind; anRes = r; anErr = ''; anOpen = null;
      if (kind === 'real') {
        state.notes.lastImport = { hands: r.hands, bb100: me.hands ? me.netBB / me.hands * 100 : 0, ev100: r.ev100, from: r.from, to: r.to, leaks: r.leaks.limps.length + r.leaks.tooLoose.length + r.leaks.tooTight.length, at: today() };
        for (const o of r.opponents) {
          const prev = state.notes.opponents[o.name] || { hands: 0, vpip: 0, pfr: 0, aggr: 0, calls: 0, sd: 0, sawFlop: 0 };
          state.notes.opponents[o.name] = { hands: prev.hands + o.hands, vpip: prev.vpip + o.vpip, pfr: prev.pfr + o.pfr, aggr: prev.aggr + o.aggr, calls: prev.calls + o.calls, sd: prev.sd + o.sd, sawFlop: prev.sawFlop + o.sawFlop, at: today() };
        }
        const names = Object.keys(state.notes.opponents);
        if (names.length > 400) names.sort((a, b) => state.notes.opponents[a].hands - state.notes.opponents[b].hands).slice(0, names.length - 400).forEach((n) => delete state.notes.opponents[n]);
        Store.save('notes');
      }
    } catch (e) { anErr = e.message; anRes = null; }
  }
  const rate = (a, b) => (b ? pct(a / b, 0) : '—');
  VIEWS.analyse = () => {
    let res = '';
    if (anRes) {
      const r = anRes, me = r.me, bb100 = me.hands ? me.netBB / me.hands * 100 : 0;
      const posOrder = ['UTG', 'UTG+1', 'UTG+2', 'LJ', 'HJ', 'CO', 'BTN', 'SB', 'BB'];
      const leakRow = (l, arr, why) => `<tr><td>${l}</td><td class="n">${arr.length}</td><td class="note">${arr.slice(0, 6).map((x) => x.hand + ' ' + x.pos).join(', ')}${arr.length > 6 ? '…' : ''}</td><td class="note">${why}</td></tr>`;
      res = `${r.kind === 'sample' ? '<div class="warnbox"><strong>Exemple simulé</strong> : 300 mains jouées automatiquement par un bot régulier à la table d\'entraînement. Ce ne sont pas tes mains.</div>' : r.kind === 'table' ? '<div class="warnbox"><strong>Mains de la table d\'entraînement</strong> : elles n\'alimentent pas tes fiches adversaires.</div>' : ''}
      <div class="stats"><div class="stat hero"><span>Résultat</span><b>${sgn(bb100, 1)}</b><span>bb/100 sur ${me.hands} mains (${esc(r.hero)})</span></div>
        <div class="stat"><span>EV des all-in</span><b>${sgn(r.ev100, 1)}</b><span>bb/100 si chaque all-in avait rapporté son équité · ${me.allins.length} all-in</span></div>
        <div class="stat"><span>VPIP / PFR</span><b>${rate(me.vpip, me.hands)} / ${rate(me.pfr, me.hands)}</b><span>repère 6-max : 22-28 / 17-23</span></div>
        <div class="stat"><span>3-bet</span><b>${rate(me.three, me.threeOpp)}</b><span>repère : 6-10 %</span></div>
        <div class="stat"><span>Abattage</span><b>${rate(me.sd, me.sawFlop)}</b><span>WTSD · gagné à l'abattage ${rate(me.wsd, me.sd)}</span></div>
        <div class="stat"><span>C-bet flop</span><b>${rate(me.cbet, me.cbetOpp)}</b><span>sur ${me.cbetOpp} occasions · fold face au c-bet ${rate(me.ftc, me.ftcOpp)}</span></div></div>
      <p class="note">Écart entre résultat et EV des all-in = ta chance sur les tapis : ${sgn(bb100 - r.ev100, 1)} bb/100 sur cet échantillon.</p>
      <section class="panel"><h2>Résultat par position</h2><div class="tw"><table class="t"><thead><tr><th>Position</th><th class="n">Mains</th><th class="n">bb gagnées</th><th class="n">bb/100</th></tr></thead><tbody>
        ${posOrder.filter((p) => me.byPos[p]).map((p) => { const x = me.byPos[p]; return `<tr><td>${p}</td><td class="n">${x.hands}</td><td class="n">${sgn(x.bb, 1)}</td><td class="n" style="color:var(${x.bb >= 0 ? '--good' : '--bad'})">${sgn(x.bb / x.hands * 100, 0)}</td></tr>`; }).join('')}</tbody></table></div>
        <p class="note">Les blindes perdent chez presque tous les joueurs. Le bouton et le cutoff doivent être tes positions les plus gagnantes.</p></section>
      <section class="panel"><h2>Fuites préflop, quand tu entres en premier</h2><div class="tw"><table class="t"><thead><tr><th>Fuite</th><th class="n">Cas</th><th>Exemples</th><th>Pourquoi</th></tr></thead><tbody>
        ${leakRow('Limp en premier', r.leaks.limps, 'Relance ou couche-toi : le limp abandonne l\'initiative.')}
        ${leakRow('Ouverture hors range', r.leaks.tooLoose, 'Trop large pour la position, sauf blindes très faibles.')}
        ${leakRow('Fold d\'une main de la range', r.leaks.tooTight, 'Tu laisses passer des ouvertures rentables.')}</tbody></table></div></section>
      <section class="panel"><h2>Adversaires et plan d'exploitation</h2><div class="tw"><table class="t"><thead><tr><th>Joueur</th><th class="n">Mains</th><th class="n">VPIP</th><th class="n">PFR</th><th class="n">Agress.</th><th class="n">C-bet</th><th class="n">Fold c-bet</th><th>Profil</th><th class="n">Perte (bb)</th></tr></thead><tbody>
        ${r.opponents.slice(0, 25).map((o) => `<tr><td><button class="btn small" data-act="opp" data-n="${esc(o.name)}">${esc(o.name)}</button></td><td class="n">${o.hands}</td><td class="n">${rate(o.vpip, o.hands)}</td><td class="n">${rate(o.pfr, o.hands)}</td><td class="n">${o.calls ? fr(o.aggr / o.calls, 1) : '—'}</td><td class="n">${rate(o.cbet, o.cbetOpp)}</td><td class="n">${rate(o.ftc, o.ftcOpp)}</td><td><span class="pill ${o.profile.key === 'station' || o.profile.key === 'recreatif' ? 'good' : o.profile.key === 'reg' ? 'bad' : ''}">${o.profile.label}</span></td><td class="n">${sgn(-o.net, 1)}</td></tr>
          ${anOpen === o.name ? `<tr><td colspan="9"><div class="advice">${HH.EXPLOIT[o.profile.key].map((t) => `<div>${esc(t)}</div>`).join('')}</div></td></tr>` : ''}`).join('')}</tbody></table></div>
        <p class="note">Clique un joueur pour son plan d'exploitation. « Perte » : ce qu'il a perdu à la table, toutes mains confondues. Profil fiable à partir d'une cinquantaine de mains.</p></section>
      <section class="panel"><h2>Plus gros pots</h2>${r.pots.map((p, i) => `<details><summary><span class="mono">${sgn(p.bb, 1)} bb</span> · main ${esc(p.id)}${p.hand.heroCards ? ' · ' + p.hand.heroCards.map(E.cardStr).join(' ') : ''}</summary><div class="row" style="margin:8px 0"><button class="btn small" data-act="rppot" data-i="${i}">Rejouer pas à pas</button><button class="btn small" data-act="libpot" data-i="${i}">Sauvegarder dans la bibliothèque</button></div><pre class="hh">${esc(p.hand.raw)}</pre></details>`).join('')}</section>`;
    }
    const known = Object.entries(state.notes.opponents).filter(([, o]) => o.hands >= 15).sort((a, b) => b[1].hands - a[1].hands).slice(0, 30);
    return head('Analyse de tes mains', 'Après la session, colle tes historiques Winamax ou PokerStars : résultat, chance aux all-in, fuites préflop, profil de chaque adversaire. Uniquement tes propres mains : analyser des mains achetées ou partagées est interdit par les rooms.') +
      `<section class="panel"><label class="f">Historiques (texte brut)<textarea id="antext" class="f mono" rows="7" style="font-size:12px" placeholder="Winamax Poker - CashGame - HandId: #…">${esc(anText)}</textarea></label>
        <div class="row"><button class="btn primary" data-act="analyze">Analyser</button><label class="btn" for="anfile">Charger des fichiers .txt</label><input type="file" id="anfile" accept=".txt,text/plain" multiple hidden>
        <button class="btn" data-act="ansample">Exemple : 300 mains simulées</button></div>
        <p class="note">Winamax enregistre tes historiques dans le dossier « history » de son répertoire d'installation. Parseur testé sur des historiques Winamax et sur ceux de la table d'entraînement. Si un fichier récent ne passe pas, envoie-moi une main d'exemple : le parseur s'ajuste.</p>
        ${anErr ? `<p class="pill bad" style="white-space:normal">${esc(anErr)}</p>` : ''}</section>${res}
      ${known.length ? `<section class="panel"><h2>Fiches adversaires cumulées</h2><div class="tw"><table class="t"><thead><tr><th>Joueur</th><th class="n">Mains</th><th class="n">VPIP</th><th class="n">PFR</th><th>Profil</th></tr></thead><tbody>${known.map(([n, o]) => `<tr><td>${esc(n)}</td><td class="n">${o.hands}</td><td class="n">${rate(o.vpip, o.hands)}</td><td class="n">${rate(o.pfr, o.hands)}</td><td>${HH.profileOf(o).label}</td></tr>`).join('')}</tbody></table></div><p class="note">Cumul de tous tes imports. Relis-les avant une session, jamais pendant.</p></section>` : ''}`;
  };

  // ---------- Journal ----------
  const ROOMS = ['Winamax', 'PokerStars.fr', 'Betclic', 'PMU', 'Casino', 'Autre'], FORMATS = ['Cash', 'MTT', 'Expresso', 'Sit&Go'];
  let jMsg = '', confirmDel = null;
  const sim = { wr: 5, sd: 90, hands: 50000, bi: 40, seed: 1 };
  VIEWS.journal = () => {
    const js = journalStats(), ms = maxStake(js.bank);
    const rows = js.ss.slice().reverse().map((s) => `<tr><td class="mono">${s.date.split('-').reverse().join('/')}</td><td>${esc(s.room)}</td><td>${esc(s.format)} ${esc(s.stake)}</td><td class="n" style="color:var(${s.result >= 0 ? '--good' : '--bad'})">${eur(s.result)}</td><td class="n">${s.hands || '—'}</td><td>${'●'.repeat(s.tilt || 0) || '—'}</td><td class="note">${esc(s.notes)}</td><td><button class="btn small" data-act="${confirmDel === s.id ? 'delok' : 'del'}" data-id="${s.id}">${confirmDel === s.id ? 'Confirmer' : 'Supprimer'}</button></td></tr>`).join('');
    return head('Journal', 'Chaque session juste après l\'avoir jouée. Le journal applique ton stop-loss et dit quelle limite ta bankroll autorise.') +
      `<div class="stats">
        <div class="stat hero"><span>Bankroll</span><b>${eur(js.bank)}</b><span>départ ${eur(+state.settings.bankroll0 || 0)}</span></div>
        <div class="stat"><span>Résultat total</span><b style="color:var(${js.total >= 0 ? '--good' : '--bad'})">${eur(js.total)}</b><span>${js.ss.length} sessions</span></div>
        <div class="stat"><span>Par heure</span><b>${js.mins ? eur(js.total / js.mins * 60) : '—'}</b><span>${Math.round(js.mins / 60)} h jouées</span></div>
        <div class="stat"><span>Winrate cash</span><b>${js.wr !== null ? fr(js.wr, 1) : '—'}</b><span>${js.wr !== null ? `bb/100 · ±${fr(js.ci, 1)} (95 %) sur ${js.hands.toLocaleString('fr-FR')} mains` : 'renseigne les mains jouées'}</span></div>
        <div class="stat"><span>Limite max</span><b>${ms || '—'}</b><span>règle des ${state.settings.biRule} caves</span></div></div>
      ${js.wr !== null ? '<p class="note">Intervalle calculé avec un écart-type de 90 bb/100, valeur courante en 6-max. Tant qu\'il contient 0, le résultat ne prouve rien.</p>' : ''}
      ${jMsg ? `<div class="warnbox" role="alert">${jMsg}</div>` : ''}
      <section class="panel"><span class="eyebrow">Nouvelle session</span><form id="jform" class="form">
        <label class="f">Date<input id="jdate" name="date" type="date" value="${today()}" required></label>
        <label class="f">Room<select id="jroom" name="room">${ROOMS.map((r) => `<option>${r}</option>`).join('')}</select></label>
        <label class="f">Format<select id="jformat" name="format">${FORMATS.map((r) => `<option>${r}</option>`).join('')}</select></label>
        <label class="f">Limite (NL10) ou buy-in (€)<input id="jstake" name="stake" value="NL5" required></label>
        <label class="f">Résultat net (€)<input id="jres" name="result" inputmode="decimal" placeholder="−4,20" required></label>
        <label class="f">Mains jouées (cash)<input id="jhands" name="hands" inputmode="numeric" placeholder="600"></label>
        <label class="f">Durée (min)<input id="jmin" name="minutes" inputmode="numeric" placeholder="60"></label>
        <label class="f">Tilt ressenti<select id="jtilt" name="tilt"><option value="0">Aucun</option><option value="1">Léger</option><option value="2">Net</option><option value="3">Fort</option></select></label>
        <label class="f" style="grid-column:1/-1">Note (une main à revoir, une leçon)<input id="jnotes" name="notes" maxlength="200"></label>
        <div class="row" style="grid-column:1/-1"><button class="btn primary" type="submit">Enregistrer la session</button></div></form></section>
      <section class="panel"><span class="eyebrow">Courbe</span><h2>Bankroll</h2>${js.ss.length ? '<canvas id="bankc" height="220" aria-label="Courbe de bankroll"></canvas>' : '<p class="note">Aucune session pour l\'instant. Renseigne ta bankroll de départ ci-dessous, puis ta première session : la courbe apparaîtra ici.</p>'}</section>
      ${rows ? `<section class="panel"><span class="eyebrow">Sessions</span><div class="tw"><table class="t"><thead><tr><th>Date</th><th>Room</th><th>Jeu</th><th class="n">Résultat</th><th class="n">Mains</th><th>Tilt</th><th>Note</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></section>` : ''}
      <section class="panel"><span class="eyebrow">Réglages</span><div class="form">

<script>// Solveur postflop SIGMA 52 — Discounted CFR (Brown & Sandholm 2019) vectorisé par main, deux joueurs, arbre de mises configurable.
// River : exact. Turn : exact (les 46 rivers). Flop : exact possible mais lourd ; par défaut, échantillon stratifié de turns et de rivers (approché).
// Convention de gain : le pot de départ est mort. À l'abattage, le gagnant reçoit pot de départ + mise adverse, le perdant perd sa mise.
// EV affichée = part du pot de départ que la main récupère en moyenne (somme des EV des deux ranges = pot de départ).
(function (root) {
  const E = root.Engine || require('./engine.js');
  const OOP = 0, IP = 1;
  const ACT = 0, CHANCE = 1, FOLD = 2, SHOW = 3;
  const STREET = ['flop', 'turn', 'river'];

  // ---- Ranges pondérées : "AA, KK:0.5, AKs:50%, AhKh, 76s-54s:0.25" ----
  const keyOf = (a, b) => (a > b ? a * 52 + b : b * 52 + a);
  function parseWeighted(str, dead = []) {
    const d = new Set(dead), map = new Map();

      if (!(w >= 0 && w <= 1)) throw new Error('Poids illisible : ' + raw);

      if (/^[2-9tjqka][shdc][2-9tjqka][shdc]$/i.test(tok)) { const [a, b] = E.parseCards(tok); if (a === b) throw new Error('Combo illisible : ' + raw); list = [[a, b]]; }
      else list = [...E.parseRange(tok)].flatMap((h) => E.combos(h));
      for (const [a, b] of list) { if (d.has(a) || d.has(b)) continue; if (w > 0) map.set(keyOf(a, b), w); else map.delete(keyOf(a, b)); }
    }

  }
  // Range pondérée -> texte compact (mains abstraites quand tous les combos ont le même poids).
  function rangeText(hands) {
    const by = new Map();
    for (const [a, b, w] of hands) { const h = E.abstractOf(a, b); if (!by.has(h)) by.set(h, []); by.get(h).push([a, b, w]); }
    const out = [];
    for (const h of E.ALL169) {
      const l = by.get(h); if (!l) continue;
      const full = E.combos(h).length, w0 = l[0][2];
      if (l.length === full && l.every((x) => Math.abs(x[2] - w0) < 1e-9)) out.push(w0 === 1 ? h : `${h}:${+w0.toFixed(3)}`);
      else for (const [a, b, w] of l) out.push(E.cardStr(a) + E.cardStr(b) + (w === 1 ? '' : ':' + +w.toFixed(3)));
    }
    return out.join(', ');
  }

  // ---- Tailles : "33 75 a" (en % du pot ; a = tapis) ----
  const parseSizes = (s) => (Array.isArray(s) ? s : String(s || '').split(/[\s,;]+/).filter(Boolean)).map((x) => (/^(a|ai|allin|tapis)$/i.test(String(x)) ? 'a' : +String(x).replace('%', ''))).filter((x) => x === 'a' || x > 0);
  const DEFAULT_SIZES = {
    flop: [{ bet: [], raise: [] }, { bet: [33, 75], raise: [] }],
    turn: [{ bet: [], raise: [] }, { bet: [66], raise: [] }],
    river: [{ bet: [], raise: [] }, { bet: [66], raise: [] }],
  };

  // Rand reproductible.
  const rng = E.rng;
  function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

  // Échantillon stratifié de cartes : une par rang tant que possible, couleurs tournantes en commençant par celles du board.
  function sampleCards(deck, board, k, seed, must = []) {

<script>// Vues ajoutées à SIGMA 52 : Simulateur (table avec coach, préparation et bilan, mains guidées, Expresso),

(function () {

  ACT.simsub = (t) => { sub = t.dataset.s; render(); };
  const SIMVIEWS = {};

  // ---- Rendu commun d'une table (cash 6 joueurs ou Expresso 3 joueurs) ----
  function tableHTML(t, o = {}) {

  function decide(g, type, to) {

  function decisionsHTML(list, mode) {
    if (!list.length) return '';
    return `<div class="tw"><table class="t"><thead><tr><th>Rue</th><th>Ta décision</th><th>Conseil</th><th></th></tr></thead><tbody>${list.map((d) => `<tr><td>${{ pre: 'Préflop', flop: 'Flop', turn: 'Turn', river: 'River' }[d.street]}${d.board.length ? ' ' + d.board.map(E.cardStr).join(' ') : ''}</td><td>${Co.ACT_FR[d.act]}</td><td>${esc(d.recTxt)}</td><td><span class="pill ${d.ok ? 'good' : 'bad'}">${d.ok ? 'Juste' : 'À revoir'}</span></td></tr>

  ACT.cashnew = () => { cash = null; render(); };
  ACT.showprof = (t) => { showProfiles = t.checked; render(); };
  ACT.tb2an = () => { const g = sub === 'expresso' ? xp : cash; if (!g) return; X.runAnalysis(g.tb.exportHH(), 'table'); anSub = 'import'; go('analyse'); };
  ACT.libtable = () => { const g = cur(); addToLibrary(g.tb.history[g.tb.history.length - 1], g.kind === 'xp' ? 'Expresso simulé' : 'Simulateur', g.decisions.some((d) => d.hand === g.tb.handNo && !d.ok) ? ['erreur'] : []); render(); };
  ACT.rptable = () => { const g = cur(); openReplay(g.tb.history[g.tb.history.length - 1]); };

  // ---- Expresso ----
  const XP_LEVELS = [[10, 20], [15, 30], [20, 40], [30, 60], [40, 80], [50, 100], [60, 120], [80, 160], [100, 200], [150, 300], [200, 400]];
  const XP_LINEUPS = { mix: ['reg', 'station'], agressifs: ['maniaque', 'reg'], serres: ['nit', 'reg'] };
  const xprep = { lineup: 'mix', mode: 'live' };
  let xp = null;
  SIMVIEWS.expresso = () => {
    const e = state.progress.expresso || { games: 0, places: [0, 0, 0, 0] };
    const record = `<div class="stats"><div class="stat hero"><span>Parties simulées</span><b>${e.games || 0}</b><span>1er : ${e.places?.[1] || 0} · 2e : ${e.places?.[2] || 0} · 3e : ${e.places?.[3] || 0}</span></div>
      <div class="stat"><span>Taux de victoire</span><b>${e.games ? pct((e.places?.[1] || 0) / e.games) : '—'}</b><span>33 % = niveau égal à 3 joueurs</span></div></div>`;
    if (!xp) {
      return `<section class="panel"><span class="eyebrow">Expresso simulé</span><h2>3 joueurs, 500 jetons, blindes qui montent toutes les 6 mains</h2>
        <p class="note">Structure hyper-turbo inspirée du format, pas la structure officielle d'une room. Le gagnant prend tout : l'équilibre en jetons s'applique. Sous 15 bb, le coach utilise le solveur de Nash en tête-à-tête et une estimation à 3 joueurs.</p>
        <div class="row"><span class="note">Adversaires :</span>${Object.entries({ mix: 'Régulier + fish', agressifs: 'Maniaque + régulier', serres: 'Nit + régulier' }).map(([k, l]) => `<button class="chip" aria-pressed="${xprep.lineup === k}" data-act="xpl" data-v="${k}">${l}</button>`).join('')}</div>
        <div class="row"><span class="note">Coach :</span>${[['live', 'En direct'], ['exam', 'Examen'], ['free', 'Sans aide']].map(([k, l]) => `<button class="chip" aria-pressed="${xprep.mode === k}" data-act="xpm" data-v="${k}">${l}</button>`).join('')}</div>
        <div class="warnbox">Avant de jouer : <button class="btn small" data-act="openmod" data-id="expresso">Module Expresso</button> <button class="btn small" data-act="openmod" data-id="icm">Module Tapis courts</button> <button class="btn small" data-act="drill" data-type="pushfold">Spots tapis ou couché</button></div>
        <div class="row"><button class="btn primary" data-act="xpstart">Lancer une partie</button></div></section>${record}`;
    }
    const t = xp.tb, L = !t.done && t.toAct === 0 && !t.players[0].out ? t.legal() : null, handDec = xp.decisions.filter((d) => d.hand === t.handNo);
    let out = `<div class="row"><span class="pill acc">Main ${t.handNo} · blindes ${t.sb}/${t.bb}</span><span class="pill">${t.active().length} joueurs</span>${xp.fmt && xp.fmt !== 'expresso' ? `<span class="pill">${esc(xp.name)}</span>` : ''}<button class="btn small" data-act="xpquit" style="margin-left:auto">Abandonner la partie</button></div>${tableHTML(t, { chips: true, showProfiles: true })}`;
    if (L) out += `<section class="panel"><span class="eyebrow">À toi · ${TS.posName(t, 0)} · ${E.abstractOf(t.players[0].cards[0], t.players[0].cards[1])} · ${fr(t.effStack(0) / t.bb, 1)} bb effectifs</span>${actionsHTML(t)}</section>` + (xp.mode === 'live' ? coachHTML(adviceFor(xp), t) : '');
    if (t.done) {
      out += `<section class="panel"><div class="row" style="justify-content:space-between"><h2>${t.over ? (t.place === 1 ? `Victoire : tu remportes ${xp.name || 'l\'Expresso'}` : `Partie terminée : ${t.place}e place`) : 'Fin de la main'}</h2><div class="row"><button class="btn small" data-act="libtable">Sauvegarder la main</button><button class="btn small" data-act="rptable">Rejouer</button>${t.over ? '<button class="btn primary" data-act="xpnew">Nouvelle partie</button>' : '<button class="btn primary" data-act="xpnext">Main suivante <span style="opacity:.7">Entrée</span></button>'}</div></div>
        ${decisionsHTML(handDec, xp.mode)}${t.over ? `<h3>Ta partie</h3>${catTable(xp.decisions)}` : ''}</section>`;
    }
    return out + (xp.fmt === 'expresso' ? record : '');
  };
  ACT.xpl = (t) => { xprep.lineup = t.dataset.v; render(); };
  ACT.xpm = (t) => { xprep.mode = t.dataset.v; render(); };
  ACT.xpstart = () => { xp = { kind: 'xp', fmt: 'expresso', name: 'l\'Expresso', tb: new TS.Table({ lineup: XP_LINEUPS[xprep.lineup], stack: 500, rebuy: false, levels: XP_LEVELS, handsPerLevel: 6 }), mode: xprep.mode, decisions: [], adv: null }; nextHand(xp); };
  // Tournoi lancé depuis Champions › Types de partie : Sit & Go, table finale, Expresso, avec la table choisie.
  X.startTourney = (o) => {
    xp = { kind: 'xp', fmt: o.id, name: o.title || 'le tournoi', tb: new TS.Table({ lineup: o.lineup, stack: o.stack, rebuy: false, levels: o.levels, handsPerLevel: o.hpl || 6 }), mode: o.mode || 'live', decisions: [], adv: null };
    sub = 'expresso'; xp.tb.newHand(); xp.tb.runBots(); if (xp.tb.done) afterHand(xp); X.go('sim');
  };
  ACT.xpnext = () => { if (xp && !xp.tb.over) { nextHand(xp); while (xp.tb.done && xp.tb.players[0].out === true && !xp.tb.over) nextHand(xp); } };
  ACT.xpnew = () => { const f = xp?.fmt; xp = null; if (f && f !== 'expresso') X.go('champions'); else render(); };
  ACT.xpquit = () => { xp = null; render(); };

  // ---- Mains guidées ----
  let gd = null; // { id, k, ans: {}, info: {} }
  SIMVIEWS.guided = () => {
    if (!gd) {
      return `<p class="lead">Des mains réelles de micro-limites, rejouées décision par décision. À chaque étape : choisis, puis lis l'explication de chaque option, avec ton équité réelle contre la range adverse.</p>` +
        K.LEVELS.filter((L) => G.SCENARIOS.some((s) => s.level === L.n)).map((L) => `<section style="display:grid;gap:8px"><div><span class="eyebrow">Niveau ${L.n}</span><h2>${L.title}</h2></div><div class="modlist">${G.SCENARIOS.filter((s) => s.level === L.n).map((s) => { const sc = state.progress.guided?.[s.id]; return `<button class="mod${sc >= 0.75 ? ' done' : ''}" data-act="gdopen" data-id="${s.id}"><span class="n">${sc >= 0.75 ? '✓' : s.steps.length}</span><span><h3>${esc(s.title)}</h3><span class="note">${esc(s.intro)}</span></span><span class="note mono" style="text-align:right">${s.steps.length} décision${s.steps.length > 1 ? 's' : ''}${sc !== undefined ? '<br>' + pct(sc) : ''}</span></button>`; }).join('')}</div></section>`).join('');
    }
    const sc = G.SCENARIOS.find((s) => s.id === gd.id), k = gd.k, st = sc.steps[k];
    if (k >= sc.steps.length) {
      const pts = sc.steps.reduce((a, _, i) => a + G.optionGrade(sc, i, gd.ans[i], gd.info[i]), 0), score = pts / (2 * sc.steps.length);
      return `<div class="row"><button class="btn small" data-act="gdclose">← Toutes les mains guidées</button></div>
        <section class="panel"><span class="eyebrow">Fin de la main</span><h2>${esc(sc.title)} : ${pct(score)}</h2><p>${esc(sc.outro)}</p>
        <div class="row"><button class="btn" data-act="gdopen" data-id="${sc.id}">Rejouer cette main</button>${sc.lesson ? `<button class="btn" data-act="openmod" data-id="${sc.lesson}">Module lié</button>` : ''}<button class="btn primary" data-act="gdnextsc">Main guidée suivante</button></div></section>`;
    }
    if (!gd.info[k]) gd.info[k] = G.stepInfo(sc, k);
    const info = gd.info[k], a = gd.ans[k];
    const opts = st.options.map((o, oi) => {
      const grd = G.optionGrade(sc, k, oi, info);
      return `<button class="opt${a !== undefined ? (grd === 2 ? ' ok' : grd === 0 && oi === a ? ' ko' : '') : ''}" data-act="gdans" data-i="${oi}" ${a !== undefined ? 'disabled' : ''}>${esc(o[0])}${a !== undefined ? ` <span class="pill ${grd === 2 ? 'good' : grd === 1 ? '' : 'bad'}">${['Erreur', 'Défendable', 'Meilleure'][grd]}</span>` : ''}</button>`;
    }).join('');
    return `<div class="row"><button class="btn small" data-act="gdclose">← Toutes les mains guidées</button><span class="eyebrow">${esc(sc.title)} · décision ${k + 1} sur ${sc.steps.length}</span></div>
      ${k === 0 ? `<p class="lead">${esc(sc.intro)}</p>` : ''}
      <div class="felt"><div class="row" style="justify-content:space-between"><span class="eyebrow">${{ pre: 'Préflop', flop: 'Flop', turn: 'Turn', river: 'River' }[st.street]} · pot ${String(st.pot).replace('.', ',')} bb${st.toCall ? ` · à payer ${String(st.toCall).replace('.', ',')} bb` : ''}</span><span class="pill">${esc(sc.villain.name)} · ${esc(sc.villain.profile)} · ${esc(sc.villain.pos)}</span></div>
        ${info.board.length ? cardsHTML(info.board) : ''}<span class="eyebrow">Ta main · ${esc(sc.pos)}</span>${cardsHTML(info.hero)}</div>
      <section class="panel"><p style="font-size:17px">${esc(st.story)}</p><div class="opts">${opts}</div>
        ${a !== undefined ? `<div class="verdict ${G.optionGrade(sc, k, a, info) === 2 ? 'good' : G.optionGrade(sc, k, a, info) === 1 ? '' : 'bad'}" style="background:var(--sunk)"><b>${esc(info.line)}</b></div>
          <div class="advice">${st.options.map((o, oi) => { const grd = G.optionGrade(sc, k, oi, info); return `<div class="${grd === 2 ? 'good' : grd === 1 ? 'warn' : 'bad'}"><strong>${esc(o[0])}</strong> : ${esc(o[2])}</div>`; }).join('')}</div>
          <div class="row"><button class="btn primary" data-act="gdnext">${k + 1 < sc.steps.length ? 'Décision suivante' : 'Voir le bilan'}</button></div>` : ''}</section>`;
  };
  ACT.gdopen = (t) => { gd = { id: t.dataset.id, k: 0, ans: {}, info: {} }; sub = 'guided'; go('sim'); };
  ACT.gdclose = () => { gd = null; render(); };
  ACT.gdans = (t) => {
    gd.ans[gd.k] = +t.dataset.i;
    const sc = G.SCENARIOS.find((s) => s.id === gd.id);
    if (Object.keys(gd.ans).length === sc.steps.length) {
      const score = sc.steps.reduce((a, _, i) => a + G.optionGrade(sc, i, gd.ans[i], gd.info[i] || (gd.info[i] = G.stepInfo(sc, i))), 0) / (2 * sc.steps.length);
      state.progress.guided = state.progress.guided || {}; state.progress.guided[sc.id] = Math.max(state.progress.guided[sc.id] || 0, score); save('progress');
    }
    render();
  };
  ACT.gdnext = () => { gd.k++; render(); window.scrollTo(0, 0); };
  ACT.gdnextsc = () => { const i = G.SCENARIOS.findIndex((s) => s.id === gd.id), nx = G.SCENARIOS[(i + 1) % G.SCENARIOS.length]; gd = { id: nx.id, k: 0, ans: {}, info: {} }; render(); window.scrollTo(0, 0); };
  ONKEY.push((e, tab) => {
    if (tab !== 'sim' || sub !== 'guided' || !gd) return;
    const sc = G.SCENARIOS.find((s) => s.id === gd.id); if (gd.k >= sc.steps.length) return;
    if (/^[1-4]$/.test(e.key) && gd.ans[gd.k] === undefined && +e.key <= sc.steps[gd.k].options.length) { ACT.gdans({ dataset: { i: +e.key - 1 } }); return true; }
    if (e.key === 'Enter' && gd.ans[gd.k] !== undefined) { ACT.gdnext(); return true; }
  });

  // ================= Analyse : replayer et bibliothèque =================
  let anSub = 'import', rp = null; // rp = { raw, h, steps, k }
  X.getReplay = () => rp;
  const baseAnalyse = VIEWS.analyse;
  VIEWS.analyse = () => {
    const tabs = `<div class="subtabs" role="tablist">${[['import', 'Import et statistiques'], ['replay', 'Replayer'], ['library', `Bibliothèque (${state.library.hands.length})`]].map(([k, l]) => `<button class="chip" aria-pressed="${anSub === k}" data-act="ansub" data-s="${k}">${l}</button>`).join('')}</div>`;
    if (anSub === 'import') return baseAnalyse().replace('</section>', '</section>' + tabs);
    return head('Analyse de tes mains', 'Après la session : rejoue tes mains rue par rue, garde les plus instructives dans ta bibliothèque.') + tabs + (anSub === 'replay' ? replayHTML() : libraryHTML());
  };
  ACT.ansub = (t) => { anSub = t.dataset.s; render(); };
  function openReplay(raw) {
    const h = HH.parseHand(raw); if (!h.seats.length) return;
    rp = { raw, h, ...HH.replay(h), k: 0 }; anSub = 'replay'; go('analyse');
  }
  function replayHTML() {
    if (!rp) return `<section class="panel"><p>Choisis une main : bouton « Rejouer » dans le débrief du simulateur, sur les plus gros pots d'une analyse, dans ta bibliothèque, ou colle une main ci-dessous.</p>
      <textarea id="rptext" class="f mono" rows="8" style="font-size:12px" placeholder="Winamax Poker - CashGame - HandId: #…"></textarea><div class="row"><button class="btn primary" data-act="rppaste">Rejouer cette main</button></div></section>`;
    const st = rp.steps[rp.k], h = rp.h, bb = h.bb || 1;
    const seats = rp.seats.map((name) => {
      const folded = !st.alive.includes(name), cards = rp.known[name], eq = st.eq?.[name];
      return `<div class="rpseat${folded ? ' out' : ''}${st.who === name ? ' turn' : ''}"><span class="nm">${esc(name)}${name === rp.hero && !/^toi$/i.test(name) ? ' (toi)' : ''}</span>
        <div class="cards">${cards ? cards.map((c) => cardHTML(c, true)).join('') : backHTML(true) + backHTML(true)}</div><span class="stk">${fr(st.stacks[name] / bb, 1)} bb</span>${eq !== undefined ? `<span class="bet">${pct(eq, 0)}</span>` : ''}</div>`;
    }).join('');
    return `<section class="panel"><div class="row" style="justify-content:space-between"><span class="eyebrow">Main ${esc(h.id)} · ${esc(h.site)} · blindes ${h.sb}/${h.bb}</span><div class="row"><button class="btn small" data-act="rp2solver" title="Ouvre le solveur au moment de la décision affichée">Retravailler au solveur</button><button class="btn small" data-act="librp">Sauvegarder</button><button class="btn small" data-act="rpclose">Autre main</button></div></div>
      <div class="felt"><div class="rpseats">${seats}</div><div class="row" style="justify-content:center;gap:16px">${st.board.length ? cardsHTML(st.board) : '<span style="opacity:.7">Préflop</span>'}<span class="pot" style="font:700 14px var(--f-display)">Pot ${fr(st.pot / bb, 1)} bb</span></div></div>
      <p style="font-size:17px"><strong>${rp.k + 1}/${rp.steps.length}</strong> · ${esc(st.text)}</p>
      <div class="row"><button class="btn" data-act="rpgo" data-k="0">⏮ Début</button><button class="btn" data-act="rpgo" data-k="${rp.k - 1}" ${rp.k ? '' : 'disabled'}>◀ Précédent</button><button class="btn primary" data-act="rpgo" data-k="${rp.k + 1}" ${rp.k < rp.steps.length - 1 ? '' : 'disabled'}>Suivant ▶</button><button class="btn" data-act="rpgo" data-k="${rp.steps.length - 1}">Fin ⏭</button><span class="note">Flèches ← → du clavier</span></div>
      <p class="note">Les pourcentages sont les équités de chaque joueur dont les cartes sont connues (toi, et ceux qui ont montré), calculées à chaque étape.</p>
      <details><summary class="note">Toutes les actions</summary><ol class="note" style="margin:8px 0 0;padding-left:1.4em">${rp.steps.map((s, i) => `<li${i === rp.k ? ' style="font-weight:600;color:var(--ink)"' : ''}>${esc(s.text)}</li>`).join('')}</ol></details></section>`;
  }
  ACT.rpgo = (t) => { rp.k = Math.max(0, Math.min(rp.steps.length - 1, +t.dataset.k)); render(); };
  ACT.rpclose = () => { rp = null; render(); };
  ACT.rppaste = () => { const v = $('#rptext').value, parts = HH.split(v); if (parts.length) openReplay(parts[0]); };
  ACT.rppot = (t) => { const r = X.getAnRes(); if (r) openReplay(r.pots[+t.dataset.i].hand.raw); };
  ONKEY.push((e, tab) => {
    if (tab !== 'analyse' || anSub !== 'replay' || !rp) return;
    if (e.key === 'ArrowRight') { rp.k = Math.min(rp.steps.length - 1, rp.k + 1); render(); return true; }
    if (e.key === 'ArrowLeft') { rp.k = Math.max(0, rp.k - 1); render(); return true; }
  });

  // Bibliothèque de mains (120 mains maximum, stockées à part)
  const TAGS = ['erreur', 'à revoir', 'value', 'bluff', 'hero call', 'préflop', 'tapis court', 'bien jouée'];
  let libFilter = '', libDel = null;
  function addToLibrary(raw, source, tags = []) {
    if (!raw) return;
    const h = HH.parseHand(raw), a = HH.analyzeHand(h);
    const id = 'm' + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36);
    state.library.hands.unshift({ id, raw, source, tags, note: '', date: today(), cards: h.heroCards ? h.heroCards.map(E.cardStr).join(' ') : '', net: h.hero && a.net[h.hero] !== undefined ? a.net[h.hero] / (h.bb || 1) : 0 });
    if (state.library.hands.length > 120) state.library.hands.length = 120;
    save('library'); X.libMsg = 'Main ajoutée à ta bibliothèque.';
  }
  ACT.librp = () => { addToLibrary(rp.raw, 'Replayer'); render(); };
  ACT.libpot = (t) => { const r = X.getAnRes(); if (r) { addToLibrary(r.pots[+t.dataset.i].hand.raw, r.kind === 'real' ? 'Mes historiques' : 'Analyse'); render(); } };
  function libraryHTML() {
    const list = state.library.hands.filter((m) => !libFilter || m.tags.includes(libFilter));
    return `${X.libMsg ? `<div class="warnbox" role="status">${esc(X.libMsg)}</div>` : ''}
      <div class="row"><span class="note">Filtre :</span><button class="chip" aria-pressed="${!libFilter}" data-act="libf" data-v="">Toutes</button>${TAGS.map((tg) => `<button class="chip" aria-pressed="${libFilter === tg}" data-act="libf" data-v="${tg}">${tg}</button>`).join('')}</div>
      ${list.length ? list.map((m) => `<section class="panel" style="gap:8px"><div class="row" style="justify-content:space-between"><span><strong class="mono">${esc(m.cards || '—')}</strong> · <span class="mono" style="color:var(${m.net >= 0 ? '--good' : '--bad'})">${sgn(m.net, 1)} bb</span> · <span class="note">${esc(m.source)} · ${m.date.split('-').reverse().join('/')}</span></span>
        <div class="row"><button class="btn small" data-act="librep" data-id="${m.id}">Rejouer</button><button class="btn small" data-act="${libDel === m.id ? 'libdelok' : 'libdel'}" data-id="${m.id}">${libDel === m.id ? 'Confirmer la suppression' : 'Supprimer'}</button></div></div>
        <div class="row">${TAGS.map((tg) => `<button class="chip" style="font-size:12px;padding:3px 9px" aria-pressed="${m.tags.includes(tg)}" data-act="libtag" data-id="${m.id}" data-v="${tg}">${tg}</button>`).join('')}</div>
        <label class="f">Note<input id="libn_${m.id}" data-libnote="${m.id}" value="${esc(m.note)}" maxlength="240" placeholder="La leçon de cette main"></label></section>`).join('')
        : `<section class="panel"><p class="note">${state.library.hands.length ? 'Aucune main avec cette étiquette.' : 'Ta bibliothèque est vide. Sauvegarde une main depuis le débrief du simulateur, le replayer ou les plus gros pots d\'une analyse.'}</p></section>`}`;
  }
  ACT.libf = (t) => { libFilter = t.dataset.v; render(); };
  ACT.librep = (t) => { const m = state.library.hands.find((x) => x.id === t.dataset.id); if (m) openReplay(m.raw); };
  ACT.libtag = (t) => { const m = state.library.hands.find((x) => x.id === t.dataset.id), v = t.dataset.v; if (!m) return; m.tags = m.tags.includes(v) ? m.tags.filter((x) => x !== v) : [...m.tags, v]; save('library'); render(); };
  ACT.libdel = (t) => { libDel = t.dataset.id; render(); };
  ACT.libdelok = (t) => { state.library.hands = state.library.hands.filter((x) => x.id !== t.dataset.id); libDel = null; X.libMsg = 'Main supprimée.'; save('library'); render(); };
  ONCHANGE.push((t) => { if (t.dataset.libnote) { const m = state.library.hands.find((x) => x.id === t.dataset.libnote); if (m) { m.note = t.value.slice(0, 240); save('library'); } return true; } });

  // ================= Outils : distribution d'équité, deal ICM, mémo =================
  TOOLS.push(['dist', 'Distribution'], ['deal', 'Deal ICM'], ['memo', 'Mémo']);
  const ds = { a: C.RFI.CO.range, b: C.FACING.CO.BB.call, board: 'Kh7c2d', res: null, err: '' };
  TOOLVIEWS.dist = () => {
    const r = ds.res;
    return `<section class="panel"><p class="note">Équité de chaque combinaison d'une range contre l'autre sur un board. La courbe montre qui a l'avantage de range (équité moyenne) et l'avantage de nuts (part des mains au-dessus de 80 %).</p>
      <div class="form"><label class="f" style="grid-column:1/-1">Range A<input id="dsa" data-ds="a" value="${esc(ds.a)}" spellcheck="false"></label><label class="f" style="grid-column:1/-1">Range B<input id="dsb" data-ds="b" value="${esc(ds.b)}" spellcheck="false"></label><label class="f">Board (3 à 5 cartes)<input id="dsboard" data-ds="board" value="${esc(ds.board)}" spellcheck="false"></label></div>
