      <div class="lgrid"><label class="f">Tapis de départ<input data-lst="stack" value="${esc(s.stack)}" inputmode="numeric"></label><label class="f">Joueurs<input data-lst="players" value="${esc(s.players)}" inputmode="numeric"></label>
        <label class="f">Durée visée (heures)<input data-lst="hours" value="${esc(s.hours)}" inputmode="decimal"></label><label class="f">Minutes par niveau<input data-lst="levelMin" value="${esc(s.levelMin)}" inputmode="numeric"></label><label class="f">Plus petit jeton<input data-lst="smallChip" value="${esc(s.smallChip)}" inputmode="numeric"></label></div>
      <div class="tw"><table class="t"><thead><tr><th>Niveau</th><th class="n">Petite</th><th class="n">Grosse</th><th class="n">Ante (BB)</th><th class="n">Minutes</th></tr></thead><tbody>${lv.levels.map((l) => `<tr><td>${l.n}</td><td class="n">${fr(l.sb, 0)}</td><td class="n">${fr(l.bb, 0)}</td><td class="n">${l.ante ? fr(l.ante, 0) : '–'}</td><td class="n">${l.min}</td></tr>`).join('')}</tbody></table></div>
      <p class="note">Départ à 100 grosses blindes, fin vers un quinzième des jetons en jeu par grosse blinde. Ante de grosse blinde à partir du niveau 4 : un seul joueur la paie pour toute la table.</p>
      <div class="row"><button class="btn primary" data-act="lvuse">Utiliser au minuteur</button></div></section>
      <section class="panel"><h2>Jetons par joueur</h2>
      <div class="lgrid"><label class="f">Tapis de départ<input data-lch="stack" value="${esc(c.stack)}" inputmode="numeric"></label><label class="f">Joueurs<input data-lch="players" value="${esc(c.players)}" inputmode="numeric"></label></div>
      <div class="tw"><table class="t"><thead><tr><th>Valeur</th><th>Stock (facultatif)</th></tr></thead><tbody>${c.denoms.map((d, i) => `<tr><td><input class="mono lin" data-lchd="${i}" value="${esc(d)}" inputmode="numeric" aria-label="Valeur ${i + 1}"></td><td><input class="mono lin" data-lchc="${i}" value="${esc(c.counts[i])}" inputmode="numeric" aria-label="Stock ${i + 1}"></td></tr>`).join('')}</tbody></table></div>
      <div class="tw"><table class="t"><thead><tr><th class="n">Valeur</th><th class="n">Par joueur</th><th class="n">Montant</th><th class="n">Total nécessaire</th></tr></thead><tbody>${res.rows.map((r) => `<tr><td class="n">${fr(r.value, 0)}</td><td class="n">${r.count}</td><td class="n">${fr(r.total, 0)}</td><td class="n">${r.need}${r.have !== null && r.need > r.have ? ` <span class="pill bad">stock ${r.have}</span>` : ''}</td></tr>`).join('')}</tbody></table></div>
      ${res.short ? `<p class="note"><b>Stock insuffisant</b> : il manque ${fr(res.rest, 0)} par joueur${res.stockTotal ? ` (stock total ${fr(res.stockTotal, 0)} pour ${fr(+c.stack * +c.players, 0)} nécessaires)` : ''}. Baisse le tapis de départ ou le nombre de joueurs.</p>` : res.rest ? `<p class="note">Reste ${fr(res.rest, 0)} non distribuable avec ces valeurs.</p>` : ''}</section>
      <section class="panel"><h2>Places (points ou lots)</h2><div class="row"><label class="f">Joueurs<input data-lv="places" value="${esc(lv.places)}" inputmode="numeric"></label></div>
      <p>${pay.map((p, i) => `<strong>${i + 1}<sup>${i ? 'e' : 'er'}</sup></strong> ${p} %`).join(' · ')}</p>
      <p class="note">Pour un accord en fin de partie selon les tapis, utilise l'outil Deal ICM.</p></section>`;
  }
  ONCHANGE.push((t) => {
    if (t.dataset.lst) { lv.st[t.dataset.lst] = +t.value || lv.st[t.dataset.lst]; ls.set('st', lv.st); lv.levels = L.structure(lv.st); render(); return true; }
    if (t.dataset.lch) { lv.ch[t.dataset.lch] = +t.value || lv.ch[t.dataset.lch]; ls.set('ch', lv.ch); render(); return true; }
    if (t.dataset.lchd !== undefined) { lv.ch.denoms[+t.dataset.lchd] = t.value; ls.set('ch', lv.ch); render(); return true; }
    if (t.dataset.lchc !== undefined) { lv.ch.counts[+t.dataset.lchc] = t.value; ls.set('ch', lv.ch); render(); return true; }
  });
  ACT.lvuse = () => { lv.timer = { i: 0, left: lv.levels[0].min * 60, running: false, last: 0 }; lv.sub = 'timer'; render(); };
  X.liveState = lv;
})();
</script>
<script>// Studio : crée des visuels et des vidéos courtes à partir de tes contenus SIGMA 52 (main jouée, quiz, leçon, solveur,
// champion, bilan) aux formats Short 9:16, post 1:1, portrait 4:5 et YouTube 16:9. Joueurs anonymisés par position.
(function () {
  const X = window.__S52, K = window.Course, S = window.Spots, CH = window.Champions, PF = window.Postflop;
  const { E, HH, $, esc, fr, pct, state, render, head, VIEWS, ACT, ONCHANGE, ONINPUT } = X;
  const FORMATS = { short: { w: 1080, h: 1920, l: 'Short / Reel 9:16', safeT: 220, safeB: 400 }, portrait: { w: 1080, h: 1350, l: 'Portrait 4:5', safeT: 90, safeB: 120 }, post: { w: 1080, h: 1080, l: 'Post 1:1', safeT: 80, safeB: 110 }, yt: { w: 1920, h: 1080, l: 'YouTube 16:9', safeT: 80, safeB: 100 } };
  const THEMES = {
    bordeaux: { bg: ['#2A0711', '#6E1A2D'], ink: '#F7E9EC', muted: 'rgba(247,233,236,.72)', acc: '#C9A227', panel: 'rgba(0,0,0,.28)', felt: ['#7A1F33', '#3A0B16'] },
    nuit: { bg: ['#0B0709', '#1C1115'], ink: '#F4E9EC', muted: 'rgba(244,233,236,.68)', acc: '#E25A7B', panel: 'rgba(255,255,255,.06)', felt: ['#2C1820', '#120A0D'] },
    creme: { bg: ['#F7F2F3', '#EADFE2'], ink: '#1B1014', muted: 'rgba(27,16,20,.66)', acc: '#8C1D36', panel: 'rgba(140,29,54,.08)', felt: ['#7A1F33', '#3A0B16'] },
  };
  const TPL = [['main', 'Main jouée'], ['quiz', 'Quiz'], ['lecon', 'Leçon'], ['solveur', 'Solveur'], ['champion', 'Champion'], ['bilan', 'Bilan']];
  const MENTION = 'Jouer comporte des risques : endettement, dépendance… Appelez le 09 74 75 13 13 (appel non surtaxé). Interdit aux moins de 18 ans.';
  const st = { tpl: 'main', fmt: 'short', theme: 'bordeaux', hook: '', handle: '', mention: true, frame: 0, handSrc: '', quiz: null, quizType: 'mix', mod: 'mdf', champ: 'ivey', rec: null, msg: '' };

  // ---------------- Sources ----------------
  function handSources() {
    const out = [];
    const rp = X.getReplay?.(); if (rp) out.push(['replay', 'Main ouverte dans le replayer', rp.raw]);
    const g = X.getCash?.(); if (g?.tb?.history?.length) out.push(['sim', 'Dernière main du simulateur', g.tb.history[g.tb.history.length - 1]]);
    state.library.hands.slice(0, 30).forEach((m) => out.push(['lib:' + m.id, `Bibliothèque · ${m.date} · ${m.cards || '?'} · ${m.net >= 0 ? '+' : ''}${fr(m.net, 1)} bb`, m.raw]));
    return out;
  }
  const SIGN = { s: '♠', h: '♥', d: '♦', c: '♣' }, RED = { h: '#C8202F', d: '#1D5FD1', c: '#17803F', s: '#1B1014' };
  function handFrames(raw) {
    const h = HH.parseHand(raw); if (!h.seats.length) return null;
    const pos = HH.positions(h), bb = h.bb || 1, who = (p) => (p === h.hero ? 'Moi (' + (pos[p] || '?') + ')' : pos[p] || 'Adversaire');
    const f = (x) => fr(x / bb, x / bb >= 10 ? 0 : 1);
    const streets = ['pre', 'flop', 'turn', 'river'], N = { pre: 0, flop: 3, turn: 4, river: 5 }, frames = [];
    let put = 0, streetPut = {}, cur = 'pre';
    const by = { pre: [], flop: [], turn: [], river: [] };
    for (const a of h.actions) {
      if (a.street !== cur) { cur = a.street; streetPut = {}; }
      if (a.type === 'post') { put += a.amt; if (a.kind !== 'ante') streetPut[a.p] = (streetPut[a.p] || 0) + a.amt; continue; }
      let add = 0, t = '';
      if (a.type === 'folds') t = `${who(a.p)} se couche`;
      else if (a.type === 'checks') t = `${who(a.p)} checke`;
      else if (a.type === 'calls') { add = a.amt; t = `${who(a.p)} suit ${f(a.amt)} bb`; }
      else if (a.type === 'bets') { add = a.amt; t = `${who(a.p)} mise ${f(a.amt)} bb`; }
      else if (a.type === 'raises') { const to = a.to || a.amt; add = to - (streetPut[a.p] || 0); t = `${who(a.p)} relance à ${f(to)} bb`; }
      if (a.allin) t += ' (tapis)';
      streetPut[a.p] = (streetPut[a.p] || 0) + add; put += add;
      if (by[a.street]) by[a.street].push({ t, pot: put });
    }
    for (const s of streets) {
      if (s !== 'pre' && h.board.length < N[s]) break;
      const last = by[s][by[s].length - 1];
      frames.push({ label: { pre: 'Préflop', flop: 'Flop', turn: 'Turn', river: 'River' }[s], board: h.board.slice(0, N[s]), lines: by[s].map((x) => x.t), pot: (last ? last.pot : put) / bb });
    }
    const won = Object.entries(h.collected).map(([p, v]) => `${who(p)} remporte ${f(v)} bb`);
    const shown = Object.entries(h.shown).filter(([p]) => p !== h.hero).map(([p, c]) => ({ who: who(p), cards: c }));
    frames.push({ label: 'Résultat', board: h.board.slice(), lines: won.length ? won : ['Fin de la main'], pot: put / bb, shown, result: true });
    return { frames, hero: h.heroCards, heroPos: pos[h.hero] || '', stakes: `${h.sb}/${h.bb}`, site: h.site };
  }
  const pretty = (t) => String(t).replace(/<[^>]+>/g, '').replace(/\b([2-9TJQKA])([shdc])\b/g, (m, r, su) => (r === 'T' ? '10' : r) + SIGN[su]);
  function newQuiz() {
    const r = Math.random; let q, k = 0;
    do q = st.quizType === 'mix' ? S.mix(r) : S.GEN[st.quizType](r); while ((!q || q.opts.length > 4) && k++ < 20);
    st.quiz = q; st.frame = 0;
  }

  // ---------------- Dessin ----------------
  const FD = '"Unbounded", "Arial Black", sans-serif', FB = '"IBM Plex Sans", system-ui, sans-serif', FM = '"IBM Plex Mono", ui-monospace, monospace';
  function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
  function wrap(g, text, maxW) {
    const words = String(text).split(/\s+/), lines = []; let line = '';
    for (const w of words) { const t = line ? line + ' ' + w : w; if (g.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
    if (line) lines.push(line); return lines;
  }
  function text(g, s, x, y, o = {}) {
    g.font = `${o.weight || 500} ${o.size || 40}px ${o.font || FB}`; g.fillStyle = o.color || '#fff'; g.textAlign = o.align || 'left'; g.textBaseline = 'alphabetic';
    const lines = o.maxW ? wrap(g, s, o.maxW) : [String(s)], lh = (o.size || 40) * (o.lh || 1.25);
    const lim = o.maxLines ? lines.slice(0, o.maxLines) : lines;
    lim.forEach((l, i) => g.fillText(i === lim.length - 1 && lines.length > lim.length ? l.replace(/.{0,2}$/, '…') : l, x, y + i * lh));
    return y + lim.length * lh;
  }
  function cardAt(g, c, x, y, w) {
    const h = w * 1.4, r = E.RANKS[c >> 2].replace('T', '10'), su = E.SUITS[c & 3];
    g.save(); g.shadowColor = 'rgba(0,0,0,.35)'; g.shadowBlur = w * 0.12; g.shadowOffsetY = w * 0.04;
    rr(g, x, y, w, h, w * 0.12); g.fillStyle = '#FFFDFB'; g.fill(); g.restore();
    g.fillStyle = RED[su]; g.textAlign = 'center'; g.font = `600 ${w * 0.5}px ${FM}`; g.fillText(r, x + w / 2, y + h * 0.5);
    g.font = `${w * 0.42}px ${FB}`; g.fillText(SIGN[su], x + w / 2, y + h * 0.86);
  }
  function cardsRow(g, cards, cx, y, w, gap) { const tw = cards.length * w + (cards.length - 1) * gap; cards.forEach((c, i) => cardAt(g, c, cx - tw / 2 + i * (w + gap), y, w)); return y + w * 1.4; }
  function frame(g, F, T) {
    const gr = g.createLinearGradient(0, 0, F.w * 0.3, F.h); gr.addColorStop(0, T.bg[0]); gr.addColorStop(1, T.bg[1]);
    g.fillStyle = gr; g.fillRect(0, 0, F.w, F.h);
    // Filigrane σ en fond
    g.save(); g.globalAlpha = 0.05; g.fillStyle = T.ink; g.font = `800 ${F.w * 0.9}px ${FD}`; g.textAlign = 'center'; g.fillText('σ', F.w * 0.78, F.h * 0.62); g.restore();
  }
  function header(g, F, T, kicker, title) {
    const pad = F.w > F.h ? 90 : 70, top = F.safeT;
    g.fillStyle = T.acc; g.font = `600 ${F.w > F.h ? 30 : 32}px ${FM}`; g.textAlign = 'left'; g.fillText(kicker.toUpperCase(), pad, top);
    const y = text(g, title, pad, top + (F.w > F.h ? 70 : 84), { font: FD, weight: 700, size: F.w > F.h ? 62 : 66, color: T.ink, maxW: F.w - pad * 2, lh: 1.12, maxLines: 3 });
    return y + 10;
  }
  function footer(g, F, T) {
    const pad = F.w > F.h ? 90 : 70, y = F.h - F.safeB + 50;
    g.fillStyle = T.ink; g.font = `800 34px ${FD}`; g.textAlign = 'left'; g.fillText('σ52', pad, y);
    g.fillStyle = T.muted; g.font = `500 26px ${FM}`; g.fillText(st.handle ? st.handle : 'SIGMA 52 · labo poker', pad + 100, y);
    if (st.mention) text(g, MENTION, pad, y + 46, { size: 22, color: T.muted, maxW: F.w - pad * 2, lh: 1.3, maxLines: 3 });
  }
  const FRAMES = {
    main(g, F, T, k) {
      const src = handSources().find((x) => x[0] === st.handSrc) || handSources()[0];
      if (!src) return emptyFrame(g, F, T, 'Aucune main', 'Ouvre une main dans le replayer, joue au simulateur ou sauvegarde une main dans ta bibliothèque.');
      const H = handFrames(src[2]); if (!H) return emptyFrame(g, F, T, 'Main illisible', '');
      const fr_ = H.frames[Math.min(k, H.frames.length - 1)], pad = F.w > F.h ? 90 : 70, land = F.w > F.h;
      let y = header(g, F, T, `${fr_.label} · pot ${fr(fr_.pot, 1)} bb`, st.hook || 'Comment tu joues cette main ?');
      // Tapis
      const fx = pad, fw = land ? F.w * 0.55 : F.w - pad * 2, fy = y + 20, fh = land ? F.h - fy - F.safeB - 40 : Math.min(620, F.h * 0.34);
      const fg = g.createRadialGradient(fx + fw / 2, fy + fh * 0.35, 20, fx + fw / 2, fy + fh / 2, fw * 0.7); fg.addColorStop(0, T.felt[0]); fg.addColorStop(1, T.felt[1]);
      rr(g, fx, fy, fw, fh, fh * 0.45); g.fillStyle = fg; g.fill(); g.strokeStyle = 'rgba(201,162,39,.55)'; g.lineWidth = 4; g.stroke();
      const cw = Math.min(118, fw / 6.6);
      if (fr_.board.length) cardsRow(g, fr_.board, fx + fw / 2, fy + fh * 0.16, cw, cw * 0.14);
      else text(g, 'Préflop', fx + fw / 2, fy + fh * 0.36, { align: 'center', size: 44, font: FD, weight: 700, color: 'rgba(247,233,236,.6)' });
      if (H.hero) { text(g, `Moi${H.heroPos ? ' · ' + H.heroPos : ''}`, fx + fw / 2, fy + fh * 0.66, { align: 'center', size: 30, color: '#F7E9EC', font: FM, weight: 600 }); cardsRow(g, H.hero, fx + fw / 2, fy + fh * 0.7, cw * 0.82, cw * 0.12); }
      // Actions
      let ay = land ? fy : fy + fh + 50; const ax = land ? fx + fw + 60 : pad, aw = land ? F.w - ax - pad : F.w - pad * 2;
      const lines = fr_.lines.slice(-(land ? 9 : 8));
      for (const l of lines) { rr(g, ax, ay, aw, land ? 64 : 70, 16); g.fillStyle = T.panel; g.fill(); text(g, l, ax + 24, ay + (land ? 43 : 47), { size: land ? 30 : 34, color: T.ink, maxW: aw - 40, maxLines: 1 }); ay += land ? 76 : 84; }
      if (fr_.result && fr_.shown?.length) for (const s of fr_.shown.slice(0, 2)) { text(g, s.who + ' montre', ax, ay + 40, { size: 30, color: T.muted }); cardsRow(g, s.cards, ax + 170 + 60, ay + 60, 70, 10); ay += 170; }
      footer(g, F, T); return H.frames.length;

    rec.onstop = () => { const ext = (rec.mimeType || '').includes('mp4') ? 'mp4' : 'webm'; download(new Blob(chunks, { type: rec.mimeType || 'video/webm' }), fname() + '.' + ext); st.rec = null; st.msg = `Vidéo prête (${ext.toUpperCase()}, ${fr(imgs.length * 2.4, 1)} s).`; render(); };
    const g = cv.getContext('2d'), per = 2400, fade = 450, t0 = performance.now(), total = imgs.length * per;
    st.rec = rec; st.msg = 'Enregistrement en cours…'; $('#stframes').insertAdjacentHTML('afterend', '<p class="note" id="strec">Enregistrement en cours…</p>');
    rec.start(200);
    const step = (now) => {
      const t = now - t0; if (t >= total) { rec.stop(); return; }
      const i = Math.floor(t / per), local = t - i * per;
      g.globalAlpha = 1; g.drawImage(imgs[i], 0, 0);
      if (local < fade && i > 0) { g.globalAlpha = 1 - local / fade; g.drawImage(imgs[i - 1], 0, 0); g.globalAlpha = 1; }
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  };
})();
</script>
<script>// Confort d'utilisation : recherche globale (Ctrl+K ou /), thème clair/sombre/auto, aide des raccourcis (?).
(function () {
  const X = window.__S52, K = window.Course, S = window.Spots, CH = window.Champions;
  const { $, esc, render, ACT, TOOLS } = X;
  const norm = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

  // ---------------- Thème ----------------
  const THEMES = ['auto', 'light', 'dark'], TLABEL = { auto: 'Thème automatique', light: 'Thème clair', dark: 'Thème sombre' };
  const TICON = {
    auto: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.5"/><path d="M12 4.5v15a7.5 7.5 0 0 0 0-15z" fill="currentColor"/></svg>',
    light: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>',
    dark: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"/></svg>',
  };
  let theme = 'auto';
  try { theme = localStorage.getItem('sigma52.theme') || 'auto'; } catch (e) { /* stockage indisponible */ }
  function applyTheme() {
    if (theme === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = theme;
    const b = $('#themeBtn'); if (b) { b.innerHTML = TICON[theme]; b.setAttribute('aria-label', TLABEL[theme] + ' (changer)'); b.title = TLABEL[theme]; }
  }
  ACT.theme = () => { theme = THEMES[(THEMES.indexOf(theme) + 1) % 3]; try { localStorage.setItem('sigma52.theme', theme); } catch (e) { /* ignoré */ } applyTheme(); X.AFTER[X.getTab()]?.(); };
  applyTheme();

  // ---------------- Recherche globale ----------------
  function entries() {
    const out = [];
    const tabDesc = { jour: 'Programme, révisions, spots du jour', cours: '60 modules, 6 niveaux', spots: 'Exercices corrigés', sim: 'Table avec coach, mains guidées, Expresso', champions: 'Styles inspirés de joueurs connus', live: 'Décision éclair, minuteur de blindes (parties amicales)', solveur: 'Équilibre postflop, entraîneur river', analyse: 'Historiques, replayer, bibliothèque', outils: 'Équité, board, push/fold, calculs', journal: 'Sessions, bankroll, variance', studio: 'Images et vidéos à partir de tes mains' };
    X.TABS.forEach(([k, l]) => out.push({ kind: 'Onglet', title: l, desc: tabDesc[k] || '', run: () => X.go(k) }));
    K.MODULES.forEach((m) => out.push({ kind: 'Module', title: m.title, desc: `Niveau ${m.level} · ${K.LEVELS[m.level - 1].title} · ${m.minutes} min`, extra: m.sections.map((s) => s[0]).join(' '), run: () => { X.setOpenMod(m.id); X.go('cours'); } }));
    Object.entries(S.TYPES).forEach(([k, l]) => out.push({ kind: 'Exercice', title: l, desc: 'Spots corrigés', run: () => { X.setSpotMode(k); X.go('spots'); } }));
    TOOLS.forEach(([k, l]) => out.push({ kind: 'Outil', title: l, desc: 'Onglet Outils', run: () => { X.setTool(k); X.go('outils'); } }));
    if (CH) CH.STYLES.forEach((s) => out.push({ kind: 'Champion', title: s.name, desc: 'Inspiré de ' + s.inspired, extra: s.inspired, run: () => { X.champSelect?.(s.id); X.go('champions'); } }));
    K.GLOSSARY.forEach(([t, d]) => out.push({ kind: 'Lexique', title: t, desc: d, run: () => { X.go('cours'); } }));
    out.push({ kind: 'Action', title: 'Résoudre une river au hasard', desc: 'Solveur exact, en une seconde', run: () => { const sv = X.solverState; const d = [...Array(52).keys()].sort(() => Math.random() - 0.5); sv.sub = 'solve'; sv.board = d.slice(0, 5).map(window.Engine.cardStr).join(''); sv.game = null; X.go('solveur'); } });
    out.push({ kind: 'Action', title: 'Entraîneur river', desc: 'Décisions notées en perte d\'EV', run: () => { X.solverState.sub = 'train'; X.go('solveur'); } });
    out.push({ kind: 'Action', title: 'Défi mystère', desc: 'Identifier un style en 60 mains', run: () => ACT.chmyst?.() });
    out.push({ kind: 'Action', title: 'Changer de thème', desc: 'Automatique, clair, sombre', run: () => ACT.theme() });
    out.push({ kind: 'Action', title: 'Raccourcis clavier', desc: 'Toutes les touches', run: () => setTimeout(help, 10) });
    return out;
  }
  let pal = null; // { q, sel, list }
  function score(e, q) {
    if (!q) return e.kind === 'Onglet' ? 3 : e.kind === 'Action' ? 2 : 0;
    const t = norm(e.title), d = norm(e.desc + ' ' + (e.extra || ''));
    if (t.startsWith(q)) return 10; if (t.includes(q)) return 7;
    const words = q.split(/\s+/).filter(Boolean);
    if (words.every((w) => t.includes(w))) return 6; if (words.every((w) => (t + ' ' + d).includes(w))) return 3;
    return 0;
  }
  function results() {
    const q = norm(pal.q.trim()), all = entries().map((e) => ({ e, s: score(e, q) })).filter((x) => x.s > 0);
    all.sort((a, b) => b.s - a.s); return all.slice(0, 40).map((x) => x.e);
  }
  function drawPalette() {
    const box = $('#cmdk'); if (!pal) { box.hidden = true; box.innerHTML = ''; return; }
    pal.list = results(); pal.sel = Math.min(pal.sel, Math.max(0, pal.list.length - 1));
    const ul = pal.list.length ? pal.list.map((e, i) => `<li><button data-pi="${i}" aria-selected="${i === pal.sel}"><span class="k">${esc(e.kind)}</span><span>${esc(e.title)}<span class="d">${esc(e.desc)}</span></span></button></li>`).join('') : '<li class="note" style="padding:12px">Aucun résultat.</li>';
    if (box.hidden || !box.querySelector('input')) {
      box.hidden = false;
      box.innerHTML = `<div class="box" role="dialog" aria-label="Recherche"><input id="cmdkq" placeholder="Module, outil, exercice, terme, champion…" autocomplete="off" spellcheck="false" aria-label="Rechercher"><ul id="cmdkl" role="listbox"></ul><div class="foot"><span>↑ ↓ pour choisir</span><span>Entrée pour ouvrir</span><span>Échap pour fermer</span></div></div>`;
      const inp = $('#cmdkq'); inp.value = pal.q; inp.focus();
      inp.addEventListener('input', () => { pal.q = inp.value; pal.sel = 0; drawPalette(); });
    }
    $('#cmdkl').innerHTML = ul;
    $('#cmdkl [aria-selected="true"]')?.scrollIntoView({ block: 'nearest' });
  }
  function openPalette() { pal = { q: '', sel: 0, list: [] }; drawPalette(); }
  function closePalette() { pal = null; drawPalette(); }
  function runSel(i) { const e = pal?.list[i]; closePalette(); if (e) e.run(); }
  ACT.cmdk = () => openPalette();
  document.addEventListener('click', (e) => {
    if (!pal) return;
    const b = e.target.closest('[data-pi]'); if (b) { e.stopPropagation(); runSel(+b.dataset.pi); return; }
    if (e.target.id === 'cmdk') closePalette();
  }, true);

  // ---------------- Aide des raccourcis ----------------
  function help() {
    pal = null; const box = $('#cmdk'); box.hidden = false;
    const rows = [['Ctrl K ou /', 'Recherche globale'], ['?', 'Cette aide'], ['Échap', 'Fermer'], ['Spots : 1 à 4', 'Répondre'], ['Spots : Entrée', 'Spot suivant'], ['Simulateur : F / C', 'Se coucher / parole ou suivre'], ['Simulateur : Entrée', 'Main suivante'], ['Replayer : ← →', 'Étape précédente / suivante'], ['Entraîneur : 1 à 5, Entrée', 'Répondre, spot suivant']];
    box.innerHTML = `<div class="box" role="dialog" aria-label="Raccourcis clavier"><div style="padding:16px 18px"><h2>Raccourcis clavier</h2></div><ul>${rows.map(([k, d]) => `<li><div style="display:grid;grid-template-columns:180px 1fr;gap:10px;padding:8px 12px"><span class="mono">${k}</span><span>${d}</span></div></li>`).join('')}</ul><div class="foot"><button class="btn small" data-act="closehelp">Fermer</button></div></div>`;
  }
  ACT.closehelp = () => { $('#cmdk').hidden = true; $('#cmdk').innerHTML = ''; };
  const typing = (el) => el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable);
  document.addEventListener('keydown', (e) => {
    const open = !$('#cmdk').hidden;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); e.stopPropagation(); pal ? closePalette() : openPalette(); return; }
    if (open) {
      e.stopPropagation();
      if (e.key === 'Escape') { e.preventDefault(); pal ? closePalette() : ACT.closehelp(); return; }
      if (!pal) return;
      if (e.key === 'ArrowDown') { e.preventDefault(); pal.sel = Math.min(pal.list.length - 1, pal.sel + 1); drawPalette(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); pal.sel = Math.max(0, pal.sel - 1); drawPalette(); }
      else if (e.key === 'Enter') { e.preventDefault(); runSel(pal.sel); }
      return;
    }
    if (typing(e.target)) return;
    if (e.key === '/') { e.preventDefault(); e.stopPropagation(); openPalette(); }
    else if (e.key === '?') { e.preventDefault(); e.stopPropagation(); help(); }
  }, true);
})();
</script>
