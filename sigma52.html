<script>// Moteur NUTS : cartes, évaluateur 7 cartes, ranges, équité Monte-Carlo / exacte.
// Carte = entier 0..51 : rang = c >> 2 (0 = 2 ... 12 = As), couleur = c & 3.
(function (root) {
  const RANKS = '23456789TJQKA';
  const SUITS = 'shdc'; // pique, coeur, carreau, trèfle
  const SUIT_SYM = { s: '♠', h: '♥', d: '♦', c: '♣' };
  const CAT_FR = ['Hauteur', 'Paire', 'Double paire', 'Brelan', 'Suite', 'Couleur', 'Full', 'Carré', 'Quinte flush'];

  const card = (s) => {
    const r = RANKS.indexOf(s[0].toUpperCase()), u = SUITS.indexOf(s[1].toLowerCase());
    if (r < 0 || u < 0) throw new Error('Carte invalide : ' + s);
    return (r << 2) | u;
  };
  const cardStr = (c) => RANKS[c >> 2] + SUITS[c & 3];
  const parseCards = (str) => (str || '').replace(/[\s,]+/g, '').match(/.{2}/g)?.map(card) || [];

  // Plus haute suite contenue dans un masque de rangs (bit i = rang i). -1 si aucune.
  function straightHigh(m) {
    for (let hi = 12; hi >= 4; hi--) if (((m >> (hi - 4)) & 31) === 31) return hi;
    if ((m & 0b1000000001111) === 0b1000000001111) return 3; // roue A-2-3-4-5
    return -1;
  }
  const topBits = (m, n) => { const out = []; for (let r = 12; r >= 0 && out.length < n; r--) if (m & (1 << r)) out.push(r); return out; };
  const pack = (cat, ks) => { let v = cat; for (let i = 0; i < 5; i++) v = v * 16 + (ks[i] ?? 0); return v; };

  // Valeur d'une main de 5 à 7 cartes : plus grand = meilleur. Catégorie = Math.floor(v / 16**5).
  function evaluate(cards) {
    const cnt = new Array(13).fill(0), suitMask = [0, 0, 0, 0], suitCnt = [0, 0, 0, 0];
    let mask = 0;
    for (const c of cards) { const r = c >> 2, s = c & 3; cnt[r]++; mask |= 1 << r; suitMask[s] |= 1 << r; suitCnt[s]++; }
    for (let s = 0; s < 4; s++) if (suitCnt[s] >= 5) {
      const sf = straightHigh(suitMask[s]);
      if (sf >= 0) return pack(8, [sf]);
      return pack(5, topBits(suitMask[s], 5));
    }
    const quads = [], trips = [], pairs = [];
    for (let r = 12; r >= 0; r--) { if (cnt[r] === 4) quads.push(r); else if (cnt[r] === 3) trips.push(r); else if (cnt[r] === 2) pairs.push(r); }
    if (quads.length) return pack(7, [quads[0], topBits(mask & ~(1 << quads[0]), 1)[0]]);
    if (trips.length && (trips.length > 1 || pairs.length)) return pack(6, [trips[0], trips.length > 1 ? Math.max(trips[1], pairs[0] ?? -1) : pairs[0]]);
    const st = straightHigh(mask);
    if (st >= 0) return pack(4, [st]);
    if (trips.length) return pack(3, [trips[0], ...topBits(mask & ~(1 << trips[0]), 2)]);
    if (pairs.length >= 2) return pack(2, [pairs[0], pairs[1], topBits(mask & ~(1 << pairs[0]) & ~(1 << pairs[1]), 1)[0]]);
    if (pairs.length) return pack(1, [pairs[0], ...topBits(mask & ~(1 << pairs[0]), 3)]);
    return pack(0, topBits(mask, 5));
  }
  const category = (v) => Math.floor(v / 1048576);
  const categoryName = (v) => CAT_FR[category(v)];

  // ---- Ranges ----
  // Les 169 mains de départ, grille 13x13 : diagonale = paires, haut-droite = assorties (s), bas-gauche = dépareillées (o).
  function handName(i, j) { // i, j = index ligne/colonne, 0 = As
    const a = 12 - i, b = 12 - j;
    if (i === j) return RANKS[a] + RANKS[a];
    return i < j ? RANKS[a] + RANKS[b] + 's' : RANKS[b] + RANKS[a] + 'o';
  }
  const ALL169 = []; for (let i = 0; i < 13; i++) for (let j = 0; j < 13; j++) ALL169.push(handName(i, j));

  // Combos concrets d'une main abstraite ("AKs" -> 4, "AKo" -> 12, "QQ" -> 6, "AK" -> 16).
  function combos(h) {
    const a = RANKS.indexOf(h[0]), b = RANKS.indexOf(h[1]), out = [];
    if (a < 0 || b < 0) throw new Error('Main invalide : ' + h);
    for (let s1 = 0; s1 < 4; s1++) for (let s2 = 0; s2 < 4; s2++) {
      if (a === b && s2 <= s1) continue;
      if (h[2] === 's' && s1 !== s2) continue;
      if (h[2] === 'o' && s1 === s2) continue;
      out.push([(a << 2) | s1, (b << 2) | s2]);
    }
    return out;
  }

  // Parse "22+, A2s+, KTs+, QJo, 76s-54s, AKo, random" -> Set de mains abstraites.
  function parseRange(str) {
    const set = new Set();
    for (let tok of (str || '').split(/[\s,]+/).filter(Boolean)) {
      tok = tok.trim();
      if (/^(random|any|100%)$/i.test(tok)) { ALL169.forEach((h) => set.add(h)); continue; }
      tok = tok[0].toUpperCase() + tok[1].toUpperCase() + tok.slice(2).toLowerCase();
      const m = tok.match(/^([2-9TJQKA])([2-9TJQKA])([so]?)(\+?)(?:-([2-9TJQKA])([2-9TJQKA])([so]?))?$/);
      if (!m) throw new Error('Range illisible : ' + tok);
      let [, r1, r2, sfx, plus, e1, e2] = m;
      let a = RANKS.indexOf(r1), b = RANKS.indexOf(r2);
      if (b > a) [a, b] = [b, a];
      const add = (x, y) => {
        if (x === y) set.add(RANKS[x] + RANKS[x]);
        else if (sfx) set.add(RANKS[x] + RANKS[y] + sfx);
        else { set.add(RANKS[x] + RANKS[y] + 's'); set.add(RANKS[x] + RANKS[y] + 'o'); }
      };
      if (a === b) { // paires
        const lo = e1 ? Math.min(a, RANKS.indexOf(e1)) : a, hi = plus ? 12 : e1 ? Math.max(a, RANKS.indexOf(e1)) : a;
        for (let r = lo; r <= hi; r++) add(r, r);

      else if (e1) {

<script>// Solveur : équilibre de Nash tapis/couché en tête-à-tête (SB contre BB), en jetons (chipEV) ou en argent (ICM).
// Repose sur la matrice d'équité préflop 169 x 169 et sur le nombre de combinaisons compatibles entre classes (effet de blocage).
(function (root) {
  const E = root.Engine || require('./engine.js');
  const M = root.Matrix || require('./matrix.js');
  const N = 169;
  let EQ = null, CNT = null, W = null;

  function init() {
    if (EQ) return;
    const bin = typeof atob === 'function' ? Uint8Array.from(atob(M.B64), (c) => c.charCodeAt(0)) : new Uint8Array(Buffer.from(M.B64, 'base64'));
    const u16 = new Uint16Array(bin.buffer, bin.byteOffset, N * N);
    EQ = new Float64Array(N * N); for (let k = 0; k < N * N; k++) EQ[k] = u16[k] / 65535;
    const combos = E.ALL169.map((h) => E.combos(h));
    W = combos.map((c) => c.length);
    CNT = new Float64Array(N * N); // combinaisons concrètes compatibles (paires de mains disjointes)
    for (let i = 0; i < N; i++) for (let j = i; j < N; j++) {
      let n = 0;
      for (const a of combos[i]) for (const b of combos[j]) if (a[0] !== b[0] && a[0] !== b[1] && a[1] !== b[0] && a[1] !== b[1]) n++;
      CNT[i * N + j] = CNT[j * N + i] = n;
    }
  }
  const eq = (i, j) => (init(), EQ[i * N + j]);
  const idx = (h) => E.ALL169.indexOf(h);

  // Équité d'une main contre une range pondérée (vecteur de 169 fréquences), avec effet de blocage.
  function eqVsRange(i, freq) {
    init(); let num = 0, den = 0;
    for (let j = 0; j < N; j++) { const w = CNT[i * N + j] * freq[j]; num += w * EQ[i * N + j]; den += w; }
    return den ? num / den : 0.5;
  }
  // Équité préflop range contre range (fréquences par classe).
  function rangeVsRange(fa, fb) {
    init(); let num = 0, den = 0;
    for (let i = 0; i < N; i++) if (fa[i]) for (let j = 0; j < N; j++) if (fb[j]) { const w = CNT[i * N + j] * fa[i] * fb[j]; num += w * EQ[i * N + j]; den += w; }
    return den ? num / den : 0.5;
  }
  const setToFreq = (set) => E.ALL169.map((h) => (set.has(h) ? 1 : 0));

  // ICM Malmuth-Harville : valeur en argent de chaque tapis. stacks[], payouts[] (1er, 2e, ...).
  function icm(stacks, payouts) {
    const n = stacks.length, val = new Array(n).fill(0), full = (1 << n) - 1;
    const prob = new Map([[0, 1]]); // ensemble des joueurs déjà classés (places 1..k) -> probabilité
    const order = [...Array(full + 1).keys()].sort((a, b) => popcount(a) - popcount(b));
    for (const mask of order) {
      const p = prob.get(mask); if (!p) continue;
      const k = popcount(mask); if (k >= payouts.length || k >= n) continue;
      let rest = 0; for (let i = 0; i < n; i++) if (!(mask & (1 << i)) && stacks[i] > 0) rest += stacks[i];
      if (!rest) continue;
      for (let i = 0; i < n; i++) if (!(mask & (1 << i)) && stacks[i] > 0) {
        const q = p * stacks[i] / rest; val[i] += q * payouts[k];
        const m2 = mask | (1 << i); prob.set(m2, (prob.get(m2) || 0) + q);
      }
    }
    return val;
  }
  function popcount(x) { let c = 0; while (x) { x &= x - 1; c++; } return c; }

  // Jeu tapis/couché SB contre BB. Les valeurs d'issue (fold, vol, gain, perte) sont fournies pour chaque joueur,
  // ce qui couvre le cas en jetons comme le cas ICM. Renvoie fréquences de tapis (SB) et de call (BB) par classe.
  function solveOutcomes(V, iters = 400) {
    init();
    const push = new Float64Array(N).fill(1), call = new Float64Array(N).fill(0.5);
    const avgP = new Float64Array(N), avgC = new Float64Array(N);
    const evP = new Float64Array(N), evC = new Float64Array(N);
    for (let t = 1; t <= iters; t++) {
      // Meilleure réponse de la SB à la stratégie moyenne actuelle de la BB.
      const cs = t === 1 ? call : avgC;
      for (let i = 0; i < N; i++) {
        let den = 0, ev = 0;
        for (let j = 0; j < N; j++) {
          const w = CNT[i * N + j]; if (!w) continue; den += w;
          const c = cs[j], e = EQ[i * N + j];
          ev += w * ((1 - c) * V.sb.steal + c * (e * V.sb.win + (1 - e) * V.sb.lose));
        }
        evP[i] = ev / den - V.sb.fold; push[i] = evP[i] > 0 ? 1 : 0;
      }
      for (let i = 0; i < N; i++) avgP[i] += (push[i] - avgP[i]) / t;
      // Meilleure réponse de la BB à la stratégie moyenne de la SB.
      for (let j = 0; j < N; j++) {
        let den = 0, e = 0;
        for (let i = 0; i < N; i++) { const w = CNT[j * N + i] * avgP[i]; if (!w) continue; den += w; e += w * EQ[j * N + i]; }
        if (!den) { evC[j] = -1; call[j] = 0; continue; }
        e /= den; evC[j] = e * V.bb.win + (1 - e) * V.bb.lose - V.bb.fold; call[j] = evC[j] > 0 ? 1 : 0;
      }
      for (let j = 0; j < N; j++) avgC[j] += (call[j] - avgC[j]) / t;
    }
    // EV finales contre les stratégies moyennes (pour noter les erreurs en perte d'EV).
    for (let i = 0; i < N; i++) {
      let den = 0, ev = 0;
      for (let j = 0; j < N; j++) { const w = CNT[i * N + j]; if (!w) continue; den += w; const c = avgC[j], e = EQ[i * N + j]; ev += w * ((1 - c) * V.sb.steal + c * (e * V.sb.win + (1 - e) * V.sb.lose)); }
      evP[i] = ev / den - V.sb.fold;
    }
    for (let j = 0; j < N; j++) {
      let den = 0, e = 0;
      for (let i = 0; i < N; i++) { const w = CNT[j * N + i] * avgP[i]; if (!w) continue; den += w; e += w * EQ[j * N + i]; }
      evC[j] = den ? (e / den) * V.bb.win + (1 - e / den) * V.bb.lose - V.bb.fold : -1;
    }
    // Nettoyage : les fréquences sous 2 % ou au-dessus de 98 % viennent des premières itérations, pas de l'équilibre.
    const clean = (f) => Array.from(f, (x) => (x < 0.02 ? 0 : x > 0.98 ? 1 : x));
    const pct = (f) => f.reduce((a, x, i) => a + x * W[i], 0) / 1326;
    const P = clean(avgP), Cc = clean(avgC);
    return { push: P, call: Cc, evPush: Array.from(evP), evCall: Array.from(evC), pushPct: pct(P), callPct: pct(Cc) };
  }

  // Cas en jetons : tapis effectif S (en bb), ante par joueur a (en bb). Valeurs = tapis final de chacun, en bb.
  function chipOutcomes(S, a = 0) {
    return {
      sb: { fold: S - 0.5 - a, steal: S + 1 + a, win: 2 * S, lose: 0 },
      bb: { fold: S - 1 - a, win: 2 * S, lose: 0 },
    };
  }
  function solveChip(S, a = 0) { return solveOutcomes(chipOutcomes(S, a)); }

  // Cas ICM : stacks de tous les joueurs (en bb, blindes non postées), indices de la SB et de la BB, payouts.
  // Les autres joueurs se sont couchés ; leurs antes restent au pot.
  function icmOutcomes(stacks, sb, bb, payouts, ante = 0) {
    const n = stacks.length, base = stacks.map((s) => s - ante), dead = ante * n;
    const after = (f) => { const s = base.slice(); f(s); return icm(s, payouts); };
    const E2 = Math.min(stacks[sb], stacks[bb]) - ante; // part de chaque tapis engagée en cas de call
    const vFold = after((s) => { s[sb] -= 0.5; s[bb] += 0.5 + dead; });
    const vSteal = after((s) => { s[bb] -= 1; s[sb] += 1 + dead; });
    const vWin = after((s) => { s[sb] += E2 + dead; s[bb] -= E2; });
    const vLose = after((s) => { s[sb] -= E2; s[bb] += E2 + dead; });
    return {
      V: { sb: { fold: vFold[sb], steal: vSteal[sb], win: vWin[sb], lose: vLose[sb] }, bb: { fold: vSteal[bb], win: vLose[bb], lose: vWin[bb] } },
      chips: { fold: vFold, steal: vSteal, win: vWin, lose: vLose },
    };
  }

  const api = { init, eq, idx, eqVsRange, rangeVsRange, setToFreq, icm, solveOutcomes, chipOutcomes, solveChip, icmOutcomes, get W() { init(); return W; } };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.Solver = api;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>// Ranges d'ouverture (RFI, premier à entrer dans le coup) — Hold'em No Limit 6-max, 100 bb, en ligne.
// Point de départ standard inspiré des charts publics : pas une sortie de solveur. Contre des fish, on élargit (voir cours).
(function (root) {
  const RFI = {

<script>// Générateur de spots d'entraînement. Chaque spot : { type, title, prompt, cards?, board?, opts, ok (index ou liste), why }.
(function (root) {
  const E = root.Engine || require('./engine.js');
  const Charts = root.Charts || require('./charts.js');
  const Course = root.Course || require('./course.js');
  const Solver = root.Solver || require('./solver.js');

  const TYPES = {
    rfi: 'Ouverture', odds: 'Cotes du pot', tirage: 'Tirage au turn', pushfold: 'Tapis ou couché', outs: 'Compter les outs', meilleure: 'Meilleure main', situations: 'Situations',
  };
  const pick = (a, r) => a[(r() * a.length) | 0];
  const pct = (x) => (x * 100).toFixed(1).replace('.', ',') + ' %';
  const eur = (x) => x.toFixed(2).replace('.', ',') + ' €';
  function deal(n, r, exclude = []) {
    const used = new Set(exclude), out = [];
    while (out.length < n) { const c = (r() * 52) | 0; if (!used.has(c)) { used.add(c); out.push(c); } }
    return out;
  }

  // Ouverture : position + main -> ouvrir ou passer, selon les ranges RFI.
  function rfi(r) {
    const pos = pick(Charts.POS, r), set = E.parseRange(Charts.RFI[pos].range);
    // Moitié des mains tirées près de la frontière de la range (là où on se trompe), moitié au hasard.
    let cards, h;
    for (let i = 0; i < 40; i++) {
      cards = deal(2, r); h = E.abstractOf(cards[0], cards[1]);
      if (r() < 0.5) break;
      const ri = E.RANKS.indexOf(h[0]), rj = E.RANKS.indexOf(h[1]);
      const neighbours = [[ri, rj - 1], [ri, rj + 1], [ri - 1, rj]].filter(([a, b]) => a >= 0 && b >= 0 && a <= 12 && b <= 12 && a !== b)
        .map(([a, b]) => E.RANKS[Math.max(a, b)] + E.RANKS[Math.min(a, b)] + (h[2] || ''));
      if (neighbours.some((x) => set.has(x) !== set.has(h))) break;
    }
    const open = set.has(h);
    return {
      type: 'rfi', title: 'Ouverture · ' + Charts.RFI[pos].label,
      prompt: `Tout le monde a passé jusqu'à toi. Tu es <strong>${pos}</strong> avec <strong>${h}</strong>.`,
      cards, opts: [`Ouvrir à ${Charts.RFI[pos].size}`, 'Se coucher'], ok: open ? 0 : 1,
      why: `${h} est ${open ? '' : 'hors de '}la range d'ouverture ${pos} (${E.rangePct(set).toFixed(0)} % des mains). ` +
        (open ? 'Relance, ne limpe jamais en premier.' : 'Trop de joueurs parlent après toi pour cette main, ou elle est dominée trop souvent.'),
    };
  }

  // Cotes du pot : quelle équité faut-il pour suivre ?
  function odds(r) {
    const pot = pick([0.6, 0.8, 1, 1.2, 1.5, 2, 2.4, 3, 4, 5], r), f = pick([0.25, 0.33, 0.5, 0.66, 0.75, 1, 1.5, 2], r);
    const bet = Math.round(pot * f * 100) / 100, need = bet / (pot + 2 * bet);
    const wrong = [bet / (pot + bet), bet / pot, need * 0.6].filter((x) => Math.abs(x - need) > 0.02 && x < 1);
    const opts = [need, ...wrong.slice(0, 2)].sort(() => r() - 0.5);
    return {
      type: 'odds', title: 'Cotes du pot',
      prompt: `Pot de <strong>${eur(pot)}</strong>. L'adversaire mise <strong>${eur(bet)}</strong>. Quelle équité te faut-il au minimum pour suivre ?`,
      opts: opts.map(pct), ok: opts.indexOf(need),
      ev: null,
      why: `Tu paies ${eur(bet)} pour un pot final de ${eur(pot + 2 * bet)} : ${eur(bet)} ÷ ${eur(pot + 2 * bet)} = ${pct(need)}. Erreur classique : diviser par le pot avant ta mise (${pct(bet / (pot + bet))}).`,
    };
  }

  // Tirage au turn : équité exacte contre une range « paire ou mieux » vs cotes du pot.
  function villainRange(board) {
    const base = E.category(E.evaluate(board)), out = [];
    for (const h of E.ALL169) for (const c of E.combos(h)) {
      if (board.includes(c[0]) || board.includes(c[1])) continue;
      if (E.category(E.evaluate([...c, ...board])) > base) out.push(c);
    }
    return out;
  }
  function exactVsRange(hero, range, board) {
    let eq = 0, n = 0;
    const dead = new Set([...hero, ...board]);
    for (const v of range) {
      if (dead.has(v[0]) || dead.has(v[1])) continue;
      for (let c = 0; c < 52; c++) {
        if (dead.has(c) || c === v[0] || c === v[1]) continue;
        const b = [...board, c], a = E.evaluate([...hero, ...b]), d = E.evaluate([...v, ...b]);
        eq += a > d ? 1 : a === d ? 0.5 : 0; n++;
      }
    }
    return eq / n;
  }
  function drawKind(hero, board) {
    const all = [...hero, ...board], kinds = [];
    for (let s = 0; s < 4; s++) if (all.filter((c) => (c & 3) === s).length === 4 && hero.some((c) => (c & 3) === s)) kinds.push('tirage couleur');
    const m = all.reduce((acc, c) => acc | (1 << (c >> 2)), 0);
    const hasStraight = (x) => { for (let hi = 12; hi >= 4; hi--) if (((x >> (hi - 4)) & 31) === 31) return true; return (x & 0b1000000001111) === 0b1000000001111; };
    let st = 0;
    if (!hasStraight(m)) for (let rank = 0; rank < 13; rank++) if (!(m & (1 << rank)) && hasStraight(m | (1 << rank))) st++;
    if (st >= 2) kinds.push('suite par les deux bouts'); else if (st === 1) kinds.push('suite ventrale');
    return kinds;
  }
  function tirage(r) {
    for (let tries = 0; tries < 400; tries++) {
      const board = deal(4, r);
      if (new Set(board.map((c) => c >> 2)).size < 4) continue;
      const hero = deal(2, r, board);
      if (E.category(E.evaluate([...hero, ...board])) !== 0) continue;
      const kinds = drawKind(hero, board);
      if (!kinds.length) continue;
      const range = villainRange([...board]).filter((c) => !hero.includes(c[0]) && !hero.includes(c[1]));
      const eq = exactVsRange(hero, range, board);
      const pot = pick([1, 1.5, 2, 3, 4], r), f = pick([0.33, 0.5, 0.66, 0.75, 1], r);
      const bet = Math.round(pot * f * 100) / 100, need = bet / (pot + 2 * bet);
      if (Math.abs(eq - need) < 0.03) continue;
      const call = eq > need;
      return {
        type: 'tirage', title: 'Tirage au turn · une carte à venir',
        prompt: `Turn. Tu as un ${kinds.join(' + ')}. Pot de <strong>${eur(pot)}</strong>, l'adversaire mise <strong>${eur(bet)}</strong>. Suppose qu'il a toujours au moins une paire avec une de ses cartes. Tu ne gagneras rien de plus à la river si tu touches.`,
        cards: hero, board, opts: ['Suivre', 'Se coucher'], ok: call ? 0 : 1,
        why: `Ton équité exacte à la river contre cette range (${range.length} combinaisons) : ${pct(eq)}. Équité requise : ${pct(need)}. ` +

  // Tapis ou couché : équilibre de Nash tête-à-tête (SB contre BB), en jetons. Noté en perte d'EV.
  const nashCache = {};

      cards, opts: sb ? ['Tapis', 'Se coucher'] : ['Payer', 'Se coucher'], ok: yes ? 0 : 1,
      why: `Équilibre de Nash à ${S} bb : la SB pousse ${pct(sol.pushPct)} des mains, la BB paie ${pct(sol.callPct)}. ` +

      const left = 52 - 4 - n;

        type: 'outs', title: n === 3 ? 'Outs au flop' : 'Outs au turn',
        prompt: `Tu es derrière. Combien de cartes te font passer devant à la ${n === 3 ? 'turn' : 'river'} ? (Les cartes de l'adversaire sont connues.)`,
        cards: hero, board, vil, opts: opts.map(String), ok: opts.indexOf(o),
        why: `${o} outs sur ${left} cartes inconnues : ${pct(o / left)} à la prochaine carte` + (n === 3 ? `, ${pct(1 - ((left - o) * (left - o - 1)) / (left * (left - 1)))} d'ici la river si tu vois les deux cartes.` : '.') + ' Règle du 2 et 4 : ' + (o * 2) + ' % ' + (n === 3 ? 'puis ' + (o * 4) + ' %.' : '.'),
      };

  // Meilleure main : 3 mains, un board, qui gagne ?
  function meilleure(r) {

      type: 'meilleure', title: 'Meilleure main', prompt: 'Qui gagne le pot à l\'abattage ?',
      board, hands, opts, ok: win.length > 1 ? 3 : win[0],
      why: vals.map((v, i) => `Joueur ${i + 1} : ${E.categoryName(v)}`).join(' · ') + (win.length > 1 ? ' → égalité exacte, partage.' : ` → le joueur ${win[0] + 1} gagne.`),
    };
  }

  function situation(r, cat) {
    const pool = Course.SITUATIONS.filter((s) => !cat || s.cat === cat), s = pick(pool, r);
    return { type: 'situations', title: 'Situation · ' + s.cat, prompt: s.q, opts: s.opts, ok: s.ok, why: s.why, sid: s.id };

    let x = r() * w.reduce((a, b) => a + b, 0);
    for (let i = 0; i < types.length; i++) { x -= w[i]; if (x <= 0) return GEN[types[i]](r); }

<script>// Analyse de board : comment une range touche un board (main faite + tirages), combinaison par combinaison.
(function (root) {
  const E = root.Engine || require('./engine.js');
  const MADE = ['Quinte flush', 'Carré', 'Full', 'Couleur', 'Suite', 'Brelan (set)', 'Brelan (trips)', 'Double paire', 'Overpair', 'Top paire', 'Paire moyenne', 'Petite paire', 'Rien'];
  const DRAWS = ['Tirage couleur', 'Suite deux bouts', 'Ventrale', 'Deux overcards'];
  const hasStraight = (m) => { for (let hi = 12; hi >= 4; hi--) if (((m >> (hi - 4)) & 31) === 31) return true; return (m & 0b1000000001111) === 0b1000000001111; };

  // Catégorie précise d'une main sur un board (3 à 5 cartes), du point de vue des cartes privées.
  function classify(hole, board) {
    const v = E.evaluate([...hole, ...board]), cat = E.category(v), br = board.map((c) => c >> 2), hr = hole.map((c) => c >> 2);
    const top = Math.max(...br), sorted = [...new Set(br)].sort((a, b) => b - a);
    let made;
    if (cat === 8) made = 0; else if (cat === 7) made = 1; else if (cat === 6) made = 2; else if (cat === 5) made = 3; else if (cat === 4) made = 4;
    else {
      const pocket = hr[0] === hr[1], hits = [...new Set(hr.filter((r) => br.includes(r)))];
      const pairClass = (r) => (pocket && r === hr[0] && !br.includes(r)) ? (r > top ? 8 : r > sorted[sorted.length - 1] ? 10 : 11) : r === top ? 9 : r === sorted[1] ? 10 : 11;
      if (cat === 3) made = pocket && br.includes(hr[0]) ? 5 : hits.length ? 6 : 12;
      else if (cat === 2 && !pocket && hits.length === 2) made = 7;
      else if (pocket && !br.includes(hr[0])) made = pairClass(hr[0]); // paire servie, éventuelle paire du board partagée
      else if (hits.length === 1) made = pairClass(hits[0]);
      else made = 12; // seul le board fait la main
    }
    const draws = [];
    if (board.length < 5 && made > 3) {
      for (let s = 0; s < 4; s++) if ([...hole, ...board].filter((c) => (c & 3) === s).length === 4 && hole.some((c) => (c & 3) === s)) draws.push(0);
      if (made > 4) {
        const m = [...hole, ...board].reduce((a, c) => a | (1 << (c >> 2)), 0), bm = board.reduce((a, c) => a | (1 << (c >> 2)), 0);
        let outs = 0; for (let r = 0; r < 13; r++) if (!(m & (1 << r)) && hasStraight(m | (1 << r)) && !hasStraight(bm | (1 << r))) outs++;
        if (outs >= 2) draws.push(1); else if (outs === 1) draws.push(2);
      }
      if (made === 12 && hr[0] > top && hr[1] > top) draws.push(3);
    }
    return { made, draws };
  }

  // Répartition d'une range (Set de mains abstraites) sur un board. Retourne combos par catégorie et la liste des mains.
  function analyze(range, board, dead = []) {
    const combos = E.rangeCombos(range, [...board, ...dead]);
    const made = new Array(MADE.length).fill(0), draws = new Array(DRAWS.length).fill(0), byMade = MADE.map(() => new Map());
    let comboDraw = 0;
    for (const c of combos) {
      const k = classify(c, board); made[k.made]++;
      const h = E.abstractOf(c[0], c[1]); byMade[k.made].set(h, (byMade[k.made].get(h) || 0) + 1);
      if (k.draws.length) comboDraw++; k.draws.forEach((d) => draws[d]++);
    }
    return { total: combos.length, made, draws, comboDraw, byMade };
  }

  // Texture : description factuelle d'un flop.
  function texture(board) {
    const suits = board.slice(0, 3).map((c) => c & 3), ranks = board.slice(0, 3).map((c) => c >> 2).sort((a, b) => b - a);
    const ns = new Set(suits).size, paired = new Set(ranks).size < 3, span = ranks[0] - ranks[2];
    const tags = [ns === 1 ? 'monocolore' : ns === 2 ? 'deux couleurs' : 'arc-en-ciel'];
    if (paired) tags.push('pairé');
    if (!paired && span <= 4) tags.push('connecté'); else if (!paired && span >= 8) tags.push('sec');
    if (ranks[0] >= 9) tags.push('haut (' + E.RANKS[ranks[0]] + ')'); else tags.push('bas');
    return tags;
  }

  const api = { MADE, DRAWS, classify, analyze, texture };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.Board = api;
})(typeof window !== 'undefined' ? window : globalThis);

<script>// Import d'historiques de mains (Winamax, PokerStars) : parsing, statistiques, fuites préflop, EV des all-in, profils adversaires.
// Uniquement des mains que tu as jouées, analysées après la session.
(function (root) {
  const E = root.Engine || require('./engine.js');
  const Charts = root.Charts || require('./charts.js');

  const num = (s) => +String(s).replace(/[€$£\s]|EUR|USD/g, '').replace(/,(?=\d{3}\b)/g, '').replace(',', '.');
  const AMT = '[€$£]?[\\d.,]+[€$£]?';
  const ACT = new RegExp(`^(.+?):? (folds|checks|calls|bets|raises)(?: (${AMT}))?(?: to (${AMT}))?(.*all-in.*)?$`);

  function split(text) {
    return text.replace(/\r/g, '').replace(/^﻿/, '').split(/\n(?=(?:Winamax Poker|PokerStars (?:Hand|Zoom Hand|Game)) )/).map((s) => s.trim()).filter((s) => /^(Winamax Poker|PokerStars)/.test(s));
  }

  function parseHand(txt) {
    const L = txt.split('\n').map((l) => l.trim()).filter(Boolean);
    const site = /^Winamax/.test(L[0]) ? 'Winamax' : 'PokerStars';
    const h = { site, raw: txt, id: (L[0].match(/(?:HandId: #|Hand #)([\w-]+)/) || [])[1] || '', tournament: /Tournament|Tournoi/i.test(L[0]),
      seats: [], button: 0, hero: null, heroCards: null, actions: [], board: [], shown: {}, collected: {}, returned: {}, posts: {}, rake: 0, sb: 0, bb: 0 };

    const date = L[0].match(/(\d{4})[/-](\d{2})[/-](\d{2})/); h.date = date ? `${date[1]}-${date[2]}-${date[3]}` : '';
    const btn = txt.match(/Seat #(\d+) is the button/); h.button = btn ? +btn[1] : 0;
    let street = 'pre', summary = false;
    for (const l of L.slice(1)) {
      if (/^\*\*\* SUMMARY/.test(l)) { summary = true; continue; }
      const st = l.match(/^\*\*\* (PRE-FLOP|HOLE CARDS|FLOP|TURN|RIVER|SHOW ?DOWN)/);
      if (st) {
        street = { 'PRE-FLOP': 'pre', 'HOLE CARDS': 'pre', FLOP: 'flop', TURN: 'turn', RIVER: 'river' }[st[1]] || 'sd';
        const cards = [...l.matchAll(/\[([^\]]+)\]/g)].map((m) => m[1]).join(' ');
        if (street !== 'pre' && street !== 'sd') h.board = E.parseCards(cards);

        if (num(m[3]) > 0 && !m[4]) h.seats.push({ seat: +m[1], name: m[2], stack: num(m[3]) }); continue;
      }

        h.actions.push({ street: 'pre', p: m[1], type: 'post', kind, amt: num(m[3]) }); continue;
      }

      if ((m = l.match(/^(.+?) collected (\S+) from (?:side |main )?pot/))) { h.collected[m[1]] = (h.collected[m[1]] || 0) + num(m[2]); continue; }
      if ((m = l.match(/^(.+?):? shows \[([^\]]+)\]/))) { h.shown[m[1]] = E.parseCards(m[2]); continue; }
      if ((m = l.match(ACT))) {

  // Positions : ordre de parole à partir du joueur qui suit le bouton.

  function allinLuck(h, a) {
    if (!h.hero || !h.heroCards) return null;
    const allinIdx = h.actions.findIndex((x) => x.allin && x.street !== 'river');
    if (allinIdx < 0) return null;
    const alive = h.seats.map((s) => s.name).filter((p) => !h.actions.some((x) => x.p === p && x.type === 'folds'));
    if (alive.length !== 2 || !alive.includes(h.hero)) return null;

  function profileOf(s) {

  }
  const EXPLOIT = {
    station: ['Mise ta valeur gros (70-100 % du pot), même la deuxième paire.', 'Zéro bluff : il ne se couche pas.', 'Ses grosses mises à la turn ou à la river sont de la valeur : couche tes mains moyennes.', 'Isole-le préflop et assieds-toi à sa gauche.'],
    maniaque: ['Laisse-le bluffer : check tes mains fortes, paie plus large.', 'Ne bluffe pas contre lui.', '4-bet plus fin pour la valeur (TT+, AQ+).', 'Réduis tes tables : la variance monte.'],
    nit: ['Vole ses blindes en permanence.', 'Couche tout ce qui n\'est pas premium contre ses relances.', 'Pas de value fine : il ne paie pas.'],
    reg: ['Évite les gros pots sans main nette.', 'Choisis d\'autres tables si possible.', 'Défends tes blindes selon les ranges standard.'],

  function analyze(text) {
    const hands = split(text).map(parseHand).filter((h) => h.seats.length >= 2 && h.bb > 0);
    const heroCount = {}; hands.forEach((h) => h.hero && (heroCount[h.hero] = (heroCount[h.hero] || 0) + 1));
    const hero = Object.entries(heroCount).sort((a, b) => b[1] - a[1])[0]?.[0] || null;
    const opp = {}, me = { hands: 0, net: 0, netBB: 0, vpip: 0, pfr: 0, threeOpp: 0, three: 0, sawFlop: 0, sd: 0, wsd: 0, aggr: 0, calls: 0, byPos: {}, luck: 0, allins: [], rake: 0 };
    const leaks = { tooLoose: [], tooTight: [], limps: [] }, pots = [];

        const tgt = p === hero ? me : (opp[p] = opp[p] || { name: p, hands: 0, vpip: 0, pfr: 0, threeOpp: 0, three: 0, sawFlop: 0, sd: 0, wsd: 0, aggr: 0, calls: 0, net: 0 });
        tgt.hands++; if (f.vpip) tgt.vpip++; if (f.pfr) tgt.pfr++; if (f.threeOpp) tgt.threeOpp++; if (f.three) tgt.three++;
        if (f.sawFlop) tgt.sawFlop++; if (f.sd) { tgt.sd++; if (f.won) tgt.wsd++; } tgt.aggr += f.aggr; tgt.calls += f.calls;
        if (p !== hero) tgt.net += a.net[p] / h.bb;
      }
      if (hero && a.net[hero] !== undefined) {
        const nbb = a.net[hero] / h.bb; me.net += a.net[hero]; me.netBB += nbb;
        const ps = a.pos[hero] || '?'; const bp = me.byPos[ps] = me.byPos[ps] || { hands: 0, bb: 0 }; bp.hands++; bp.bb += nbb;
        pots.push({ id: h.id, bb: nbb, eur: a.net[hero], hand: h });
        const fi = a.firstIn;
        if (fi && h.heroCards && CHART_POS[fi.pos] && !h.tournament) {
          const hc = E.abstractOf(h.heroCards[0], h.heroCards[1]), inR = E.parseRange(Charts.RFI[CHART_POS[fi.pos]].range).has(hc);
          const rec = { id: h.id, pos: fi.pos, hand: hc };
          if (fi.action === 'calls') leaks.limps.push(rec);
          else if (fi.action === 'raises' && !inR) leaks.tooLoose.push(rec);
          else if (fi.action === 'folds' && inR) leaks.tooTight.push(rec);

        if (L) { me.luck += L.luck; me.allins.push({ id: h.id, ...L, bb: h.bb }); }

    const opponents = Object.values(opp).sort((a, b) => b.hands - a.hands).map((o) => ({ ...o, profile: profileOf(o) }));
    return { hands: hands.length, hero, me, opponents, leaks, pots: pots.slice(0, 10), sites: [...new Set(hands.map((h) => h.site))], from: hands[0]?.date, to: hands[hands.length - 1]?.date };
  }

  const api = { split, parseHand, positions, analyzeHand, allinLuck, analyze, profileOf, EXPLOIT };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.HH = api;

<script>// Table d'entraînement : 6-max cash, toi contre 5 bots aux profils réels (fish passif, maniaque, nit, régulier).
// Moteur de main complet (blindes, relances minimales, tapis, pots annexes) + historique au format Winamax pour l'import.
(function (root) {
  const E = root.Engine || require('./engine.js');
  const Solver = root.Solver || require('./solver.js');

  const PROFILES = {
    station: { label: 'Fish passif', vpip: 0.56, pfr: 0.06, cont: 0.95, three: 0.15, callF: 0.55, value: 0.55, bluff: 0.03, raise: 0.9, size: [0.33, 0.5] },
    maniaque: { label: 'Maniaque', vpip: 0.55, pfr: 0.4, cont: 0.6, three: 0.5, callF: 0.75, value: 0.9, bluff: 0.4, raise: 0.72, size: [0.8, 1.2] },
    nit: { label: 'Nit', vpip: 0.13, pfr: 0.11, cont: 0.45, three: 0.25, callF: 1.35, value: 0.7, bluff: 0.02, raise: 0.9, size: [0.5, 0.66] },
    reg: { label: 'Régulier', vpip: 0.25, pfr: 0.22, cont: 0.6, three: 0.3, callF: 1.0, value: 0.75, bluff: 0.18, raise: 0.85, size: [0.5, 0.75] },
  };
  const NAMES = { station: ['Gégé31', 'Mimi_Lol', 'TontonFlop', 'ChanceuxDu82'], maniaque: ['AllinKevin', 'Turbo_Raz'], nit: ['Roc_Solide', 'PapyNit'], reg: ['GrindZ', 'Reg_6max'] };

  // Rang préflop : percentile combo-pondéré de l'équité contre une main aléatoire (0 = meilleure main).
  let PCT = null;
  function preflopPct() {
    if (PCT) return PCT;
    const all = new Array(169).fill(1), w = Solver.W;
    const eqs = E.ALL169.map((h, i) => [i, Solver.eqVsRange(i, all)]).sort((a, b) => b[1] - a[1]);
    PCT = new Array(169); let cum = 0;
    for (const [i] of eqs) { PCT[i] = (cum + w[i] / 2) / 1326; cum += w[i]; }
    return PCT;

  const handPct = (cards) => preflopPct()[E.ALL169.indexOf(E.abstractOf(cards[0], cards[1]))];

  function strength(cards, board, nOpp, r, sims = 250) {
    const used = new Set([...cards, ...board]); let eq = 0;
    for (let s = 0; s < sims; s++) {
      const u = new Set(used), draw = () => { let c; do { c = (r() * 52) | 0; } while (u.has(c)); u.add(c); return c; };
      const opp = []; for (let k = 0; k < nOpp; k++) opp.push([draw(), draw()]);
      const full = board.slice(); while (full.length < 5) full.push(draw());
      const me = E.evaluate([...cards, ...full]); let best = true, tie = 1;
      for (const o of opp) { const v = E.evaluate([...o, ...full]); if (v > me) { best = false; break; } if (v === me) tie++; }
      if (best) eq += 1 / tie;
    }
    return eq / sims;
  }

  class Table {
    constructor(opts = {}) {
      this.r = opts.random || Math.random;
      this.sb = 0.05; this.bb = 0.1; this.handNo = 0;
      const lineup = opts.lineup || ['station', 'reg', 'maniaque', 'station', 'nit'];
      const used = {};
      this.players = [{ name: 'Toi', hero: true, stack: 10, profile: null }]
        .concat(lineup.map((p) => { used[p] = (used[p] || 0) + 1; return { name: NAMES[p][(used[p] - 1) % NAMES[p].length], profile: p, stack: 10 }; }));
      this.button = (this.r() * 6) | 0; this.log = []; this.history = []; this.session = { hands: 0, net: 0 };
    }
    get pot() { return this.players.reduce((a, p) => a + p.total, 0); }
    seatOrder(from) { const o = []; for (let k = 1; k <= 6; k++) o.push((from + k) % 6); return o; }
    newHand() {
      this.handNo++;
      // Recave à 100 bb sous 40 bb ; au-delà de 250 bb, le joueur quitte la table et un nouveau s'assoit à 100 bb.
      for (const p of this.players) { if (p.stack < this.bb * 40 || p.stack > this.bb * 250) p.stack = 10; }
      this.button = (this.button + 1) % 6;
      const deck = [...Array(52).keys()]; for (let i = 51; i > 0; i--) { const j = (this.r() * (i + 1)) | 0; [deck[i], deck[j]] = [deck[j], deck[i]]; }
      this.deck = deck; this.board = []; this.street = 'pre'; this.done = false; this.notes = []; this.seq = [];
      this.players.forEach((p) => Object.assign(p, { cards: [deck.pop(), deck.pop()], inHand: true, allin: false, put: 0, total: 0, start: p.stack, acts: [] }));
      const [sbi, bbi] = this.seatOrder(this.button);
      this.sbi = sbi; this.bbi = bbi;
      this.lines = [`Winamax Poker - CashGame - HandId: #${900000 + this.handNo}-1-${Date.now()} - Holdem no limit (0.05€/0.10€) - ${new Date().toISOString().slice(0, 19).replace('T', ' ').replace(/-/g, '/')} UTC`,
        `Table: 'SIGMA Entraînement' 6-max (real money) Seat #${this.button + 1} is the button`,
        ...this.players.map((p, i) => `Seat ${i + 1}: ${p.name} (${p.stack.toFixed(2)}€)`), '*** ANTE/BLINDS ***'];
      this.post(sbi, this.sb, 'small blind'); this.post(bbi, this.bb, 'big blind');
      this.lines.push(`Dealt to Toi [${this.players[0].cards.map(E.cardStr).join(' ')}]`, '*** PRE-FLOP *** ');
      this.cur = this.bb; this.minRaise = this.bb; this.raises = 1; this.acted = new Set(); this.toAct = (bbi + 1) % 6; this.lastAggr = bbi;
      this.skipToNext(true);
    }
    post(i, amt, label) { const p = this.players[i]; const a = Math.min(amt, p.stack); p.stack -= a; p.put += a; p.total += a; this.lines.push(`${p.name} posts ${label} ${a.toFixed(2)}€`); }
    alive() { return this.players.filter((p) => p.inHand); }
    canAct(i) { const p = this.players[i]; return p.inHand && !p.allin; }
    roundOver() {
      const act = this.players.map((p, i) => i).filter((i) => this.canAct(i));
      if (this.alive().length <= 1) return true;
      return act.every((i) => this.acted.has(i) && this.players[i].put >= this.cur - 1e-9) || act.length === 0 || (act.length === 1 && this.players[act[0]].put >= this.cur - 1e-9 && this.acted.has(act[0]));
    }
    skipToNext(first) {
      if (!first) this.toAct = (this.toAct + 1) % 6;
      for (let k = 0; k < 6 && !this.canAct(this.toAct); k++) this.toAct = (this.toAct + 1) % 6;
    }
    legal() {
      const p = this.players[this.toAct], toCall = Math.min(this.cur - p.put, p.stack);
      const minTo = Math.min(this.cur + this.minRaise, p.put + p.stack);
      return { toCall, canCheck: toCall <= 1e-9, minTo, maxTo: p.put + p.stack, pot: this.pot, stack: p.stack };
    }
    act(type, to = 0) {
      const i = this.toAct, p = this.players[i], L = this.legal(), pot0 = this.pot;
      if (type === 'raise' && L.maxTo <= this.cur + 1e-9) type = 'call'; // tapis insuffisant pour relancer : c'est un call
      const rec = { street: this.street, type, toCall: L.toCall, pot: pot0 };
      if (type === 'fold') { if (L.canCheck) type = 'check'; else { p.inHand = false; this.lines.push(`${p.name} folds`); } }
      if (type === 'check') this.lines.push(`${p.name} checks`);
      if (type === 'call') { const a = L.toCall; p.stack -= a; p.put += a; p.total += a; if (p.stack <= 1e-9) p.allin = true; this.lines.push(`${p.name} calls ${a.toFixed(2)}€${p.allin ? ' and is all-in' : ''}`); }
      if (type === 'raise') {
        to = Math.max(L.minTo, Math.min(to, L.maxTo)); to = Math.round(to * 100) / 100;
        const add = to - p.put, wasBet = this.cur <= 1e-9;
        if (to - this.cur >= this.minRaise - 1e-9) this.minRaise = to - this.cur;
        p.stack -= add; p.put = to; p.total += add; if (p.stack <= 1e-9) p.allin = true;
        this.lines.push(wasBet ? `${p.name} bets ${add.toFixed(2)}€${p.allin ? ' and is all-in' : ''}` : `${p.name} raises ${(to - this.cur).toFixed(2)}€ to ${to.toFixed(2)}€${p.allin ? ' and is all-in' : ''}`);
        if (to > this.cur) { this.cur = to; this.acted = new Set(); this.raises++; this.lastAggr = i; }
        rec.size = add / Math.max(pot0, 1e-9);
      }
      rec.final = p.inHand ? type : 'fold';
      p.acts.push(rec); this.seq.push({ i, street: rec.street, final: rec.final });
      this.acted.add(i);
      if (this.roundOver()) this.nextStreet(); else this.skipToNext();
    }
    nextStreet() {
      if (this.alive().length <= 1) return this.finish();
      this.players.forEach((p) => (p.put = 0)); this.cur = 0; this.minRaise = this.bb; this.acted = new Set(); this.raises = 0;
      const canStill = this.players.filter((p) => p.inHand && !p.allin).length;
      const deal = (n) => { for (let k = 0; k < n; k++) this.board.push(this.deck.pop()); };
      if (this.street === 'pre') { this.street = 'flop'; deal(3); this.lines.push(`*** FLOP *** [${this.board.map(E.cardStr).join(' ')}]`); }
      else if (this.street === 'flop') { this.street = 'turn'; deal(1); this.lines.push(`*** TURN *** [${this.board.slice(0, 3).map(E.cardStr).join(' ')}] [${E.cardStr(this.board[3])}]`); }
      else if (this.street === 'turn') { this.street = 'river'; deal(1); this.lines.push(`*** RIVER *** [${this.board.slice(0, 4).map(E.cardStr).join(' ')}] [${E.cardStr(this.board[4])}]`); }
      else return this.finish();
      if (canStill <= 1) return this.nextStreet();
      this.toAct = this.button; this.skipToNext();
    }
    finish() {
      this.done = true; const alive = this.alive();
      // Pot non suivi : la part de la plus grosse mise que personne n'a égalée revient à son auteur.
      const totals = this.players.map((p) => p.total), sorted = [...new Set(totals)].sort((a, b) => a - b);
      const win = new Array(6).fill(0);
      if (alive.length === 1) { const w = this.players.indexOf(alive[0]); win[w] = this.pot; }
      else {
        while (this.board.length < 5) this.board.push(this.deck.pop());
        this.lines.push('*** SHOW DOWN ***');
        alive.forEach((p) => this.lines.push(`${p.name} shows [${p.cards.map(E.cardStr).join(' ')}] (${E.categoryName(E.evaluate([...p.cards, ...this.board]))})`));
        let prev = 0;
        for (const lvl of sorted) {
          if (lvl <= prev) continue;
          const contrib = this.players.reduce((a, p) => a + Math.min(Math.max(p.total - prev, 0), lvl - prev), 0);
          const elig = this.players.map((p, i) => i).filter((i) => this.players[i].inHand && this.players[i].total >= lvl - 1e-9);
          if (elig.length) {
            const vals = elig.map((i) => E.evaluate([...this.players[i].cards, ...this.board])), best = Math.max(...vals);
            const ws = elig.filter((_, k) => vals[k] === best), c = Math.round(contrib * 100), q = Math.floor(c / ws.length);
            ws.forEach((i, k) => (win[i] += (q + (k === 0 ? c - q * ws.length : 0)) / 100)); // partage au centime, reste au premier
          } else { const top = this.players.map((p, i) => i).filter((i) => this.players[i].total >= lvl - 1e-9); top.forEach((i) => (win[i] += contrib / top.length)); }
          win.forEach((w, i) => (win[i] = Math.round(w * 100) / 100));
          prev = lvl;
        }
      }
      win.forEach((w, i) => { if (w > 0) { this.players[i].stack += w; this.lines.push(`${this.players[i].name} collected ${w.toFixed(2)}€ from pot`); } });
      this.lines.push('*** SUMMARY ***', `Total pot ${this.pot.toFixed(2)}€ | No rake`, `Board: [${this.board.map(E.cardStr).join(' ')}]`);
      this.result = this.players.map((p) => ({ name: p.name, profile: p.profile, cards: p.cards, net: p.stack - p.start, showed: p.inHand && alive.length > 1 }));
      const heroNet = this.players[0].stack - this.players[0].start;
      this.session.hands++; this.session.net += heroNet / this.bb;
      this.history.push(this.lines.join('\n'));
      if (this.history.length > 300) this.history.shift();
      this.notes = coach(this);
    }
    // Décision d'un bot.
    botAct() {
      const i = this.toAct, p = this.players[i], pr = PROFILES[p.profile], L = this.legal(), r = this.r;
      if (this.street === 'pre') {
        const pct = handPct(p.cards), facing = this.raises; // 1 = seulement la BB
        if (facing <= 1) {
          if (pct < pr.pfr) return this.act('raise', this.bb * (p.profile === 'maniaque' ? 3.5 : 2.5) + this.bb * this.limpers());
          if (pct < pr.vpip && (p.profile === 'station' || pct < pr.pfr * 1.3)) return this.act(L.canCheck ? 'check' : 'call');
          return this.act(L.canCheck ? 'check' : 'fold');
        }
        if (facing === 2) {
          if (pct < pr.vpip * pr.cont * pr.three) return this.act('raise', this.cur * 3);
          if (pct < pr.vpip * pr.cont || (L.toCall <= this.bb && pct < pr.vpip)) return this.act('call');
          return this.act('fold');
        }
        if (pct < (p.profile === 'maniaque' ? 0.07 : 0.025)) return this.act('raise', L.maxTo);
        if (pct < pr.vpip * pr.cont * 0.35 || (p.profile === 'station' && pct < 0.12)) return this.act('call');
        return this.act('fold');
      }
      const s = strength(p.cards, this.board, this.alive().length - 1, r);
      const size = () => L.pot * (pr.size[0] + r() * (pr.size[1] - pr.size[0]));
      if (L.canCheck) {
        if (s > 0.62 && r() < pr.value) return this.act('raise', size());
        if (s < 0.35 && r() < pr.bluff) return this.act('raise', size());
        return this.act('check');
      }
      // Face à une mise, l'équité contre des mains au hasard surestime la main : on la décote selon l'agressivité déjà vue.
      const bets = this.seq.filter((x) => x.street === this.street && x.final === 'raise').length;
      const sAdj = p.profile === 'station' ? s : s - (p.profile === 'maniaque' ? 0.05 : 0.13) * bets - (this.street === 'river' ? 0.05 : 0);
      const need = L.toCall / (L.pot + L.toCall);
      if (sAdj > pr.raise && r() < 0.6) return this.act('raise', this.cur + Math.max(this.minRaise, L.pot * 0.8));
      if (p.profile === 'maniaque' && s < 0.3 && r() < 0.12) return this.act('raise', this.cur * 2.5);
      if (sAdj > need * pr.callF || (p.profile === 'station' && s > 0.3 && r() < 0.7)) return this.act('call');
      return this.act('fold');
    }
    limpers() { return this.players.filter((p) => p.inHand && p.total === this.bb && p.acts.some((a) => a.street === 'pre' && a.final === 'call')).length; }
    // Avance jusqu'au tour du héros ou la fin de la main.
    runBots() { let n = 0; while (!this.done && this.toAct !== 0 && n++ < 200) this.botAct(); if (!this.done && !this.canAct(0)) { while (!this.done && n++ < 400) { if (this.toAct === 0) this.act('check'); else this.botAct(); } } }
    // Fait jouer le héros par un profil de bot (pour générer des historiques d'exemple).
    autoHero(profile = 'reg') { const p = this.players[0]; p.profile = profile; this.botAct(); p.profile = null; }
    heroHelp() {
      const p = this.players[0], L = this.legal();
      const s = this.street === 'pre' ? Solver.eqVsRange(E.ALL169.indexOf(E.abstractOf(p.cards[0], p.cards[1])), new Array(169).fill(1)) : strength(p.cards, this.board, this.alive().length - 1, this.r, 1500);
      return { eqRandom: s, need: L.toCall > 0 ? L.toCall / (L.pot + L.toCall) : 0, toCall: L.toCall, pot: L.pot };
    }
    exportHH() { return this.history.join('\n\n\n'); }
  }

  // Débrief : règles d'exploitation appliquées à la main jouée.
  function coach(t) {
    const out = [], hero = t.players[0], acts = hero.acts, res = t.result;
    const first = acts.find((a) => a.street === 'pre'), hc = E.abstractOf(hero.cards[0], hero.cards[1]);
    const k0 = t.seq.findIndex((x) => x.i === 0 && x.street === 'pre');
    const firstIn = k0 >= 0 && t.seq.slice(0, k0).every((x) => x.street !== 'pre' || x.final === 'fold' || x.final === 'check');
    const pos = posName(t, 0), chart = root.Charts || require('./charts.js');
    if (first && firstIn && pos !== 'BB') {
      const inR = E.parseRange(chart.RFI[pos].range).has(hc);
      if (first.final === 'call') out.push({ k: 'bad', t: `Limp avec ${hc} en ${pos} : relance ou couche-toi quand tu entres en premier.` });
      else if (first.final === 'raise' && !inR) out.push({ k: 'warn', t: `Ouverture avec ${hc} en ${pos} : hors de la range standard. Acceptable seulement si des fish sont aux blindes.` });
      else if (first.final === 'fold' && inR) out.push({ k: 'warn', t: `Fold de ${hc} en ${pos} : cette main fait partie de la range d'ouverture.` });
      else if (first.final === 'raise') out.push({ k: 'good', t: `Ouverture de ${hc} en ${pos} : dans la range.` });
    }
    for (const a of acts.filter((x) => x.street !== 'pre')) {
      const caller = t.players.find((p, i) => i > 0 && p.profile === 'station' && p.acts.some((b) => b.street === a.street && b.final === 'call'));
      if (a.final === 'raise' && caller) {
        const v = E.evaluate([...hero.cards, ...t.board.slice(0, { flop: 3, turn: 4, river: 5 }[a.street])]);
        if (E.category(v) === 0) out.push({ k: 'bad', t: `Bluff ${a.street === 'river' ? 'à la river' : 'au ' + a.street} contre ${caller.name}, fish passif : il paie. Contre lui, ne mise qu'avec de la valeur.` });
        else if (E.category(v) >= 1 && a.size < 0.45) out.push({ k: 'warn', t: `Value bet de ${Math.round(a.size * 100)} % du pot contre ${caller.name} : il paie aussi une mise de 75-100 %. Tu laisses de la valeur.` });
      }
      if (a.final === 'call' && a.street === 'river') {
        const bettor = t.players.find((p, i) => i > 0 && ['nit', 'station'].includes(p.profile) && p.acts.some((b) => b.street === 'river' && b.final === 'raise'));
        if (bettor && res[0].net < 0) out.push({ k: 'warn', t: `Call river contre ${bettor.name} (${PROFILES[bettor.profile].label}) : ses grosses mises river sont presque toujours de la valeur.` });
      }
      if (a.final === 'fold' && a.toCall > 0) {
        const need = a.toCall / (a.pot + a.toCall), b = t.board.slice(0, { flop: 3, turn: 4, river: 5 }[a.street]);
        const aggr = t.players.find((p, i) => i > 0 && p.profile === 'maniaque' && p.acts.some((x) => x.street === a.street && x.final === 'raise'));
        if (aggr && E.category(E.evaluate([...hero.cards, ...b])) >= 1 && need < 0.35) out.push({ k: 'warn', t: `Fold d'une paire contre ${aggr.name}, maniaque, avec seulement ${Math.round(need * 100)} % d'équité requise : il bluffe trop pour ce fold.` });
      }
    }
    const reveal = res.map((r, i) => ({ ...r, i })).filter((r) => r.i > 0 && t.players[r.i].acts.some((a) => a.final !== 'fold' || a.street !== 'pre'));
    return { advice: out, reveal, net: res[0].net / t.bb };
  }

<script>// Interface SIGMA 52 : onglets, stockage (espace privé de la page, sinon navigateur), vues.

    },

  function setSaveState(msg) { $('#saveState').textContent = msg || (Store.mode === 'db' ? '' : 'Données sur cet appareil uniquement'); }

  // ---------- Rendu commun ----------
  const SUITCLS = ['s', 'h', 'd', 'c'];
  const cardHTML = (c, sm) => `<span class="cd ${SUITCLS[c & 3]}${sm ? ' sm' : ''}" aria-label="${E.cardStr(c)}">${E.RANKS[c >> 2].replace('T', '10')}<i>${E.SUIT_SYM[E.SUITS[c & 3]]}</i></span>`;

  const totalStat = () => Object.values(state.progress.stats).reduce((a, s) => ({ ok: a.ok + s.ok, n: a.n + s.n }), { ok: 0, n: 0 });

  VIEWS.jour = () => {

    <div class="stats">

    if (L) {
      const pot = L.pot, sizes = tb.street === 'pre'
        ? [['2,5 bb', tb.bb * 2.5], ['3 bb', tb.bb * 3], ['Isoler', tb.bb * (3.5 + tb.limpers())], ['3 × la relance', tb.cur * 3]].filter(([, v]) => v > tb.cur + 1e-9)
        : [['⅓ pot', pot / 3], ['½ pot', pot / 2], ['¾ pot', pot * 0.75], ['Pot', pot]].map(([l, v]) => [l, tb.cur + Math.max(v, tb.minRaise)]);
      const valid = sizes.filter(([, v]) => v >= L.minTo - 1e-9 && v < L.maxTo).slice(0, 4), canRaise = L.maxTo > tb.cur + 1e-9;
      actions = `<div class="actions">${L.canCheck ? '' : '<button class="btn" data-act="hfold">Se coucher <span class="note">F</span></button>'}
        <button class="btn primary" data-act="hcall">${L.canCheck ? 'Parole' : 'Suivre ' + bbs(L.toCall) + ' bb'} <span style="opacity:.7">C</span></button>
        ${canRaise ? valid.map(([l, v]) => `<button class="btn" data-act="hraise" data-to="${v}">${l} · ${bbs(v)}</button>`).join('') + `<button class="btn" data-act="hraise" data-to="${L.maxTo}">Tapis ${bbs(L.maxTo)}</button>` : ''}</div>
        ${canRaise ? `<div class="row"><label class="f" style="flex:1;min-width:200px">Montant libre : <span class="mono" id="rtv">${bbs(raiseTo || L.minTo)} bb</span><input type="range" id="rto" min="${L.minTo}" max="${L.maxTo}" step="${tb.bb / 2}" value="${raiseTo || L.minTo}"></label><button class="btn" data-act="hraisefree">Miser ce montant</button></div>` : ''}`;
      if (showHelp) { const H = tb.heroHelp(); actions += `<p class="note">Aide du simulateur : équité contre ${tb.alive().length - 1} main(s) au hasard ${pct(H.eqRandom, 1)}${H.toCall > 0 ? ` · équité requise ${pct(H.need, 1)}` : ''}. Contre de vraies ranges, ton équité est plus basse.</p>`; }
    }
    let debrief = '';
    if (tb.done && tb.notes) {
      const n = tb.notes;
      debrief = `<section class="panel"><div class="row" style="justify-content:space-between"><h2>Débrief : ${n.net >= 0 ? '+' : '−'}${fr(Math.abs(n.net), 1)} bb</h2><button class="btn primary" data-act="nexthand">Main suivante <span style="opacity:.7">Entrée</span></button></div>
        <div class="advice">${n.advice.length ? n.advice.map((a) => `<div class="${a.k}">${esc(a.t)}</div>`).join('') : '<div>Rien à signaler sur cette main.</div>'}</div>
        ${n.reveal.length ? `<div class="tw"><table class="t"><thead><tr><th>Joueur</th><th>Profil</th><th>Cartes</th><th class="n">Résultat</th></tr></thead><tbody>${n.reveal.map((r) => `<tr><td>${esc(r.name)}</td><td>${TS.PROFILES[r.profile].label}</td><td>${cardsHTML(r.cards, true)}</td><td class="n">${sgn(r.net / tb.bb)} bb</td></tr>`).join('')}</tbody></table></div>` : ''}</section>`;
    }
    return head('Table d\'entraînement', 'Cash 6-max, 100 bb, contre des bots qui jouent comme les profils réels. C\'est un simulateur : l\'aide y est permise. Tes mains s\'exportent vers Analyse.') +
      `<div class="row"><span class="note">Table :</span>${Object.entries({ equilibree: 'Équilibrée', fish: 'Riche en fish', regs: 'Réguliers' }).map(([k, l]) => `<button class="chip" aria-pressed="${lineup === k}" data-act="lineup" data-l="${k}">${l}</button>`).join('')}
        <label class="check"><input type="checkbox" id="showprof" data-act="showprof" ${showProfiles ? 'checked' : ''}><span class="note">Profils visibles</span></label>
        <label class="check"><input type="checkbox" id="showhelp" data-act="showhelp" ${showHelp ? 'checked' : ''}><span class="note">Aide</span></label></div>
      <div class="pokertable">${[0, 1, 2, 3, 4, 5].map(seat).join('')}
        <div class="mid">${tb.board.length ? cardsHTML(tb.board) : '<span style="opacity:.7">Préflop</span>'}<span class="pot">Pot ${bbs(tb.pot)} bb</span></div></div>
      ${L ? `<section class="panel"><span class="eyebrow">À toi · ${TS.posName(tb, 0)} · ${E.abstractOf(hero.cards[0], hero.cards[1])}</span>${actions}</section>` : ''}
      ${debrief}
      <div class="stats"><div class="stat hero"><span>Session</span><b>${sgn(tb.session.net, 1)} bb</b><span>${tb.session.hands} mains</span></div>
        <div class="stat"><span>Winrate session</span><b>${tb.session.hands ? sgn(tb.session.net / tb.session.hands * 100, 0) : '—'}</b><span>bb/100 · sur peu de mains, surtout de la variance</span></div>
        <div class="stat"><span>Historique</span><b>${tb.history.length}</b><span>mains exportables</span></div></div>
      <div class="row"><button class="btn" data-act="tb2an" ${tb.history.length ? '' : 'disabled'}>Analyser ces mains</button><button class="btn" data-act="newtable">Nouvelle table</button></div>
      <details class="panel"><summary class="note">Historique de la main (format Winamax)</summary><pre class="hh">${esc(tb.lines.join('\n'))}</pre></details>`;
  };

  // ---------- Outils ----------
  let tool = 'equite';
  const TOOLS = [['equite', 'Équité'], ['board', 'Board'], ['pushfold', 'Push/Fold & ICM'], ['ranges', 'Ranges']];
  const TOOLVIEWS = {};
  VIEWS.outils = () => head('Outils', 'Pour étudier hors session : équité exacte, lecture de board, solveur tapis/couché avec ICM, ranges d\'ouverture.') +
    `<div class="subtabs" role="tablist">${TOOLS.map(([k, l]) => `<button class="chip" aria-pressed="${tool === k}" data-act="tool" data-t="${k}">${l}</button>`).join('')}</div>` + TOOLVIEWS[tool]();

  // Équité
  const eqIn = { p: ['AhKh', 'QcQs', '', ''], board: '2h7hJd' };
  let eqOut = null;
  function parsePlayer(s) {
    s = (s || '').trim(); if (!s) return null;
    if (/^([2-9TJQKA][shdc]){2}$/i.test(s.replace(/\s/g, ''))) return { hand: E.parseCards(s), label: s };
    return { combos: E.rangeCombos(s), label: s, set: E.parseRange(s) };
  }
  function runEquity() {
    try {
      const board = E.parseCards(eqIn.board);
      const ps = eqIn.p.map(parsePlayer).map((p, i) => p && { ...p, idx: i }).filter(Boolean);
      if (ps.length < 2) throw new Error('Il faut au moins deux joueurs.');
      if (board.length > 5 || board.length === 1 || board.length === 2) throw new Error('Le board fait 0, 3, 4 ou 5 cartes.');
      const all = [...board, ...ps.flatMap((p) => p.hand || [])];
      if (new Set(all).size !== all.length) throw new Error('Une carte apparaît deux fois.');
      const t0 = performance.now(), r = E.equity(ps, board, { iterations: 80000 });
      let outs = null, matrix = null;
      if (ps.length === 2 && ps[0].hand && ps[1].hand && (board.length === 3 || board.length === 4)) outs = E.outs(ps[0].hand, ps[1].hand, board);
      if (ps.length === 2 && !board.length && (ps[0].set || ps[1].set)) {
        const f = (p) => SV.setToFreq(p.set || new Set([E.abstractOf(p.hand[0], p.hand[1])]));
        matrix = SV.rangeVsRange(f(ps[0]), f(ps[1]));
      }
      eqOut = { ps, r, ms: performance.now() - t0, outs, board, matrix };
    } catch (e) { eqOut = { err: e.message }; }
  }
  const EQEX = [['AA contre KK', ['AsAh', 'KdKc', '', ''], ''], ['Tirage couleur contre top paire', ['AhKh', 'QcQs', '', ''], '2h7hJd'], ['AK contre une range de 3-bet', ['AdKc', 'QQ+, AK', '', ''], ''], ['Ouverture UTG contre BTN', [C.RFI.UTG.range, C.RFI.BTN.range, '', ''], ''], ['Paire de 5 contre 3 joueurs', ['5s5c', 'random', 'random', 'random'], '']];
  TOOLVIEWS.equite = () => {
    if (!eqOut) runEquity();
    let res = '';
    if (eqOut?.err) res = `<p class="pill bad" style="white-space:normal">${esc(eqOut.err)}</p>`;
    else if (eqOut) {
      res = eqOut.ps.map((p, i) => `<div class="eqrow"><div style="display:grid;gap:4px;min-width:0"><span class="note" style="overflow-wrap:anywhere">Joueur ${p.idx + 1} · ${p.hand ? '' : 'range ' + fr(E.rangePct(p.set), 1) + ' % · '}${esc(p.label.length > 60 ? p.label.slice(0, 60) + '…' : p.label)}</span><div class="eqbar"><i style="width:${eqOut.r.equity[i] * 100}%"></i></div></div><b class="mono" style="font-size:18px;text-align:right">${pct(eqOut.r.equity[i], 1)}</b></div>`).join('')
        + `<p class="note">${eqOut.r.exact ? 'Calcul exact' : 'Monte-Carlo'} sur ${eqOut.r.n.toLocaleString('fr-FR')} ${eqOut.r.exact ? 'tirages' : 'simulations'} en ${Math.round(eqOut.ms)} ms.${eqOut.matrix !== null ? ` Matrice préflop (50 000 tirages par paire de mains, effet de blocage inclus) : ${pct(eqOut.matrix, 1)} pour le joueur 1.` : ''}</p>`
        + (eqOut.outs ? `<div class="felt"><span class="eyebrow">Outs du joueur 1 à la prochaine carte : ${eqOut.outs.length} sur ${52 - 4 - eqOut.board.length}</span>${eqOut.outs.length ? cardsHTML(eqOut.outs, true) : '<p>Aucune carte ne le fait passer devant.</p>'}</div>` : '');
    }
    return `<section class="panel"><p class="note">Main : <span class="mono">AhKh</span> (h cœur, d carreau, c trèfle, s pique, T = 10). Range : <span class="mono">22+, A2s+, KQo, 76s-54s</span> ou <span class="mono">random</span>.</p><div class="form">
        ${eqIn.p.map((v, i) => `<label class="f">Joueur ${i + 1}${i === 0 ? ' (toi)' : ''}<input id="eqp${i}" data-eq="${i}" value="${esc(v)}" placeholder="${i < 2 ? 'main ou range' : 'facultatif'}" autocomplete="off" spellcheck="false"></label>`).join('')}
        <label class="f">Board (0, 3, 4 ou 5 cartes)<input id="eqb" data-eq="b" value="${esc(eqIn.board)}" placeholder="2h7hJd" autocomplete="off" spellcheck="false"></label></div>
        <div class="row"><button class="btn primary" data-act="calc">Calculer</button>${EQEX.map(([l], i) => `<button class="btn small" data-act="eqex" data-i="${i}">${l}</button>`).join('')}</div>${res}</section>`;
  };

  // Board
  const bdIn = { range: C.RFI.BTN.range, board: 'Kh7c2d', label: 'BTN' };
  TOOLVIEWS.board = () => {
    let out = '';
    try {
      const board = E.parseCards(bdIn.board); if (board.length < 3 || board.length > 5) throw new Error('Le board fait 3 à 5 cartes.');
      if (new Set(board).size !== board.length) throw new Error('Une carte apparaît deux fois.');
      const a = B.analyze(E.parseRange(bdIn.range), board);
      const row = (l, n) => `<div class="hbar"><span>${l}</span><div class="eqbar"><i style="width:${a.total ? n / a.total * 100 : 0}%"></i></div><span class="mono">${pct(a.total ? n / a.total : 0, 1)} · ${n}</span></div>`;
      const madeRows = B.MADE.map((l, k) => a.made[k] ? row(l, a.made[k]) + `<p class="note mono" style="overflow-wrap:anywhere;margin-top:-6px">${[...a.byMade[k].entries()].sort((x, y) => y[1] - x[1]).slice(0, 14).map(([h, c]) => h + '×' + c).join('  ')}</p>` : '').join('');
      const pairPlus = a.made.slice(0, 12).reduce((x, y) => x + y, 0);
      out = `<div class="felt"><span class="eyebrow">${B.texture(board).join(' · ')}</span>${cardsHTML(board)}</div>
        <div class="stats"><div class="stat hero"><span>Paire ou mieux</span><b>${pct(pairPlus / a.total, 0)}</b><span>${pairPlus} combos sur ${a.total}</span></div>
          <div class="stat"><span>Avec un tirage</span><b>${pct(a.comboDraw / a.total, 0)}</b><span>${a.comboDraw} combos</span></div>
          <div class="stat"><span>Rien</span><b>${pct(a.made[12] / a.total, 0)}</b><span>ni paire ni main faite avec tes cartes</span></div></div>
        <section class="panel"><h2>Mains faites</h2>${madeRows}</section>
        ${board.length < 5 ? `<section class="panel"><h2>Tirages</h2>${B.DRAWS.map((l, k) => row(l, a.draws[k])).join('')}<p class="note">Une main peut cumuler plusieurs tirages.</p></section>` : ''}`;
    } catch (e) { out = `<p class="pill bad" style="white-space:normal">${esc(e.message)}</p>`; }
    return `<section class="panel"><p class="note">Comment une range touche un board : la base pour choisir ta taille de mise et tes bluffs.</p>
      <div class="row">${C.POS.map((p) => `<button class="chip" aria-pressed="${bdIn.label === p}" data-act="bdpos" data-p="${p}">Ouverture ${p}</button>`).join('')}</div>
      <div class="form"><label class="f" style="grid-column:1/-1">Range<input id="bdr" data-bd="range" value="${esc(bdIn.range)}" spellcheck="false"></label><label class="f">Board<input id="bdb" data-bd="board" value="${esc(bdIn.board)}" spellcheck="false"></label></div>
      <div class="row">${['Kh7c2d', '9h8h7c', 'As5s5d', 'QhJhTd', '2c2d2h', 'Ah9s4d6c'].map((b) => `<button class="btn small" data-act="bdex" data-b="${b}">${b}</button>`).join('')}</div></section>${out}`;
  };

  // Push/Fold & ICM
  const pf = { S: 10, ante: 0, view: 'push', icm: false, n: 3, stacks: [12, 8, 20], payouts: '50, 30, 20', sb: 1, bb: 2, sol: null, icmVals: null, err: null };
  const PAYPRESETS = [['Expresso (le gagnant prend tout)', '100'], ['Sit&Go 6 joueurs 65/35', '65, 35'], ['Sit&Go 9 joueurs 50/30/20', '50, 30, 20'], ['Table finale 30/20/14/10/8/6', '30, 20, 14, 10, 8, 6']];
  function solvePF() {
    if (!pf.icm) { pf.sol = SV.solveChip(pf.S, pf.ante); pf.icmVals = null; pf.err = null; return; }
    try {
      const st = pf.stacks.slice(0, pf.n).map(Number), pay = pf.payouts.split(/[;\s,]+/).map((x) => +x).filter((x) => x > 0);
      if (st.some((x) => !(x > 1))) throw new Error('Chaque tapis doit dépasser 1 bb.');
      if (pf.sb === pf.bb || pf.sb >= pf.n || pf.bb >= pf.n) throw new Error('Choisis deux joueurs différents pour la SB et la BB.');
      if (!pay.length) throw new Error('Indique au moins un gain.');
      const o = SV.icmOutcomes(st, pf.sb, pf.bb, pay, pf.ante);
      pf.sol = SV.solveOutcomes(o.V); pf.chip = SV.solveChip(Math.min(st[pf.sb], st[pf.bb]), pf.ante);
      pf.icmVals = { now: SV.icm(st, pay), st, pay, eff: Math.min(st[pf.sb], st[pf.bb]), total: pay.reduce((a, b) => a + b, 0) }; pf.err = null;
    } catch (e) { pf.err = e.message; pf.sol = null; }
  }
  TOOLVIEWS.pushfold = () => {
    if (!pf.sol && !pf.err) solvePF();
    const sol = pf.sol, freq = sol ? (pf.view === 'push' ? sol.push : sol.call) : null, iv = pf.icmVals;
    const g = sol ? grid169((h, i) => `<button class="rc${freq[i] > 0.001 ? ' heat' : ''}" ${heat(freq[i])} data-act="pfcell" data-h="${h}" aria-label="${h} ${Math.round(freq[i] * 100)} %">${h}</button>`) : '';
    const icmBlock = `<div class="form">
        <label class="f">Joueurs<select id="pfn" data-pf="n">${[2, 3, 4, 5, 6].map((n) => `<option ${n === pf.n ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
        ${Array.from({ length: pf.n }, (_, i) => `<label class="f">Tapis J${i + 1} (bb)<input id="pfs${i}" data-pfs="${i}" inputmode="decimal" value="${pf.stacks[i] ?? 10}"></label>`).join('')}
        <label class="f">Petite blinde<select id="pfsb" data-pf="sb">${Array.from({ length: pf.n }, (_, i) => `<option value="${i}" ${i === pf.sb ? 'selected' : ''}>J${i + 1}</option>`).join('')}</select></label>
        <label class="f">Grosse blinde<select id="pfbb" data-pf="bb">${Array.from({ length: pf.n }, (_, i) => `<option value="${i}" ${i === pf.bb ? 'selected' : ''}>J${i + 1}</option>`).join('')}</select></label>
        <label class="f" style="grid-column:1/-1">Gains par place (% du prize pool)<input id="pfpay" data-pf="payouts" value="${esc(pf.payouts)}"></label></div>
      <div class="row">${PAYPRESETS.map(([l, v]) => `<button class="btn small" data-act="pfpreset" data-v="${v}">${l}</button>`).join('')}</div>`;
    return `<section class="panel"><div class="row"><button class="chip" aria-pressed="${!pf.icm}" data-act="pfmode" data-m="chip">En jetons (cash, Expresso)</button><button class="chip" aria-pressed="${pf.icm}" data-act="pfmode" data-m="icm">ICM (Sit&Go, tournoi)</button></div>
      ${pf.icm ? icmBlock : `<label class="f">Tapis effectif : <b class="mono" id="pfsv">${pf.S} bb</b><input type="range" id="pfS" min="1" max="25" step="0.5" value="${pf.S}" data-pf="S"></label>`}
      <label class="check"><input type="checkbox" id="pfante" data-act="pfante" ${pf.ante ? 'checked' : ''}><span>Antes de 12,5 % de la BB par joueur</span></label>
      ${pf.err ? `<p class="pill bad" style="white-space:normal">${esc(pf.err)}</p>` : ''}</section>
      ${sol ? `<div class="stats"><div class="stat hero"><span>La SB pousse</span><b>${pct(sol.pushPct, 1)}</b><span>des mains</span></div><div class="stat"><span>La BB paie</span><b>${pct(sol.callPct, 1)}</b><span>des mains</span></div>
        ${iv ? `<div class="stat"><span>Effet de l'ICM</span><b>${sgn((sol.callPct - pf.chip.callPct) * 100, 1)} pts</b><span>sur les calls de la BB. En jetons, à ${fr(iv.eff, 1)} bb : tapis ${pct(pf.chip.pushPct, 1)}, call ${pct(pf.chip.callPct, 1)}</span></div>` : ''}</div>
      <section class="panel"><div class="row"><button class="chip" aria-pressed="${pf.view === 'push'}" data-act="pfview" data-v="push">Tapis de la SB</button><button class="chip" aria-pressed="${pf.view === 'call'}" data-act="pfview" data-v="call">Call de la BB</button></div>
        ${g}<div class="legend"><span><i style="background:var(--accent)"></i>toujours</span><span><i style="background:color-mix(in srgb, var(--accent) 55%, var(--sunk))"></i>mixte</span><span><i style="background:var(--sunk)"></i>jamais</span></div>
        <p class="note" id="pfdetail">Clique une main pour voir son EV. Solveur : meilleures réponses itérées (400 passes) sur la matrice préflop, effet de blocage inclus. Contrôle : à 10 bb en jetons, la SB pousse 58,4 % des mains, comme la référence publiée.</p></section>
      ${iv ? `<section class="panel"><h2>Équité ICM actuelle</h2><div class="tw"><table class="t"><thead><tr><th>Joueur</th><th class="n">Tapis</th><th class="n">Part des jetons</th><th class="n">Équité ICM</th></tr></thead><tbody>${iv.st.map((s, i) => `<tr><td>J${i + 1}${i === pf.sb ? ' (SB)' : i === pf.bb ? ' (BB)' : ''}</td><td class="n">${fr(s, 1)} bb</td><td class="n">${pct(s / iv.st.reduce((a, b) => a + b, 0), 1)}</td><td class="n">${pct(iv.now[i] / iv.total, 1)}</td></tr>`).join('')}</tbody></table></div>
        <p class="note">Modèle de Malmuth-Harville. Avec une seule place payée, l'équité ICM égale la part de jetons : l'ICM ne change rien en Expresso.</p></section>` : ''}` : ''}`;
  };

  // Ranges
  let rPos = 'BTN', custom = null;
  TOOLVIEWS.ranges = () => {
    const set = custom || E.parseRange(C.RFI[rPos].range);
    return `<section class="panel"><div class="row">${C.POS.map((p) => `<button class="chip" aria-pressed="${p === rPos && !custom}" data-act="pos" data-p="${p}">${p}</button>`).join('')}${custom ? '<span class="pill acc">Range perso</span>' : ''}</div>
      <div class="row" style="justify-content:space-between"><h2>${custom ? 'Range perso' : C.RFI[rPos].label}</h2><b class="mono" style="font-size:20px">${fr(E.rangePct(set), 1)} %</b></div>
      ${grid169((h) => `<button class="rc${set.has(h) ? ' on' : ''}" data-act="cell" data-h="${h}" aria-pressed="${set.has(h)}" aria-label="${h}">${h}</button>`)}
      <p class="note">Premier à entrer, 6-max, 100 bb. Diagonale : paires. Au-dessus : assorties (s). En dessous : dépareillées (o). Ouverture : ${C.RFI[rPos].size}. Clique une case pour créer ta range.</p>
      <p class="mono note" style="overflow-wrap:anywhere">${esc([...set].join(', '))}</p>
      <div class="row"><button class="btn" data-act="r2eq">Envoyer vers Équité</button><button class="btn" data-act="r2bd">Envoyer vers Board</button>${custom ? '<button class="btn" data-act="rreset">Revenir au standard</button>' : ''}<button class="btn" data-act="drill" data-type="rfi">S'entraîner</button></div></section>`;
  };

  // ---------- Analyse ----------
  let anText = '', anRes = null, anOpen = null, anErr = '';
  // kind : 'real' (tes mains, enregistrées), 'table' (table d'entraînement), 'sample' (exemple simulé). Seules les vraies mains alimentent tes fiches.
  function runAnalysis(text, kind) {
    try {
      const r = HH.analyze(text);
      if (!r.hands) throw new Error('Aucune main reconnue. Colle le texte brut des historiques Winamax ou PokerStars (une main commence par « Winamax Poker - » ou « PokerStars Hand »).');
      if (!r.hero) throw new Error('Mains reconnues, mais aucune ligne « Dealt to … » : impossible de savoir qui tu es.');
      const me = r.me;
      r.ev100 = me.hands ? (me.netBB - me.allins.reduce((a, x) => a + x.luck / x.bb, 0)) / me.hands * 100 : 0;
      r.kind = kind; anRes = r; anErr = ''; anOpen = null;
      if (kind === 'real') {
        state.notes.lastImport = { hands: r.hands, bb100: me.hands ? me.netBB / me.hands * 100 : 0, ev100: r.ev100, from: r.from, to: r.to, leaks: r.leaks.limps.length + r.leaks.tooLoose.length + r.leaks.tooTight.length, at: today() };
        for (const o of r.opponents) {
          const prev = state.notes.opponents[o.name] || { hands: 0, vpip: 0, pfr: 0, aggr: 0, calls: 0, sd: 0, sawFlop: 0 };
          state.notes.opponents[o.name] = { hands: prev.hands + o.hands, vpip: prev.vpip + o.vpip, pfr: prev.pfr + o.pfr, aggr: prev.aggr + o.aggr, calls: prev.calls + o.calls, sd: prev.sd + o.sd, sawFlop: prev.sawFlop + o.sawFlop, at: today() };
        }
        const names = Object.keys(state.notes.opponents);

    if (a === 'pfpreset') { pf.payouts = t.dataset.v; pf.sol = null; pf.err = null; return render(); }
    if (a === 'pfcell') {
      const i = E.ALL169.indexOf(t.dataset.h), s = pf.sol, isPush = pf.view === 'push', ev = isPush ? s.evPush[i] : s.evCall[i], f = isPush ? s.push[i] : s.call[i];
      const val = pf.icm ? `${ev >= 0 ? '+' : '−'}${fr(Math.abs(ev) / pf.icmVals.total * 100, 2)} % du prize pool` : `${ev >= 0 ? '+' : '−'}${fr(Math.abs(ev), 2)} bb`;
      $('#pfdetail').textContent = `${t.dataset.h} : ${isPush ? 'tapis' : 'call'} ${f > 0.95 ? 'toujours' : f < 0.05 ? 'jamais' : 'mixte (' + Math.round(f * 100) + ' %)'}. ${isPush ? 'Pousser' : 'Payer'} vaut ${val} par rapport à se coucher.`;
      return;
    }
    if (a === 'pos') { rPos = t.dataset.p; custom = null; return render(); }
    if (a === 'cell') { if (!custom) custom = new Set(E.parseRange(C.RFI[rPos].range)); const h = t.dataset.h; custom.has(h) ? custom.delete(h) : custom.add(h); return render(); }
    if (a === 'rreset') { custom = null; return render(); }
    if (a === 'r2eq') { eqIn.p[1] = [...(custom || E.parseRange(C.RFI[rPos].range))].join(', '); eqIn.board = ''; eqOut = null; tool = 'equite'; return render(); }
    if (a === 'r2bd') { bdIn.range = [...(custom || E.parseRange(C.RFI[rPos].range))].join(', '); bdIn.label = custom ? '' : rPos; tool = 'board'; return render(); }
    // Analyse
    if (a === 'analyze') { anText = $('#antext').value; runAnalysis(anText, 'real'); return render(); }
    if (a === 'ansample') {
      const sim2 = new TS.Table({ lineup: LINEUPS.equilibree });
      for (let h = 0; h < 300; h++) { sim2.newHand(); let g = 0; while (!sim2.done && g++ < 300) { sim2.runBots(); if (!sim2.done) sim2.autoHero('reg'); } }
      anText = ''; runAnalysis(sim2.exportHH(), 'sample'); return render();
    }
    if (a === 'opp') { anOpen = anOpen === t.dataset.n ? null : t.dataset.n; return render(); }
    // Journal
    if (a === 'del') { confirmDel = t.dataset.id; return render(); }
    if (a === 'delok') { state.journal.sessions = state.journal.sessions.filter((s) => s.id !== t.dataset.id); confirmDel = null; jMsg = 'Session supprimée.'; Store.save('journal'); return render(); }
    if (a === 'resim') { sim.seed++; return AFTER.journal(); }
    if (a === 'exp') {
      const ta = $('#jexport'); ta.value = JSON.stringify({ settings: state.settings, journal: state.journal, progress: state.progress, notes: state.notes });
      ta.select(); try { await navigator.clipboard.writeText(ta.value); jMsg = 'Données copiées. Colle-les dans un fichier pour les garder.'; } catch (err) { jMsg = 'Copie automatique refusée : le texte est sélectionné, copie-le à la main.'; }
      const keep = ta.value; render(); $('#jexport').value = keep; $('#jexport').closest('details').open = true; return;
    }
    if (a === 'imp') {
      try { const d = JSON.parse($('#jexport').value); if (!Array.isArray(d.journal?.sessions)) throw new Error();
        Object.assign(state.settings, d.settings || {}); state.journal.sessions = d.journal.sessions; if (d.progress) Object.assign(state.progress, d.progress); if (d.notes) Object.assign(state.notes, d.notes);
        ['settings', 'journal', 'progress', 'notes'].forEach((k) => Store.save(k)); jMsg = d.journal.sessions.length + ' sessions importées.';
      } catch (err) { jMsg = 'Texte illisible : colle exactement le texte copié depuis « Afficher et copier mes données ».'; }
      return render();
    }
  });
  document.addEventListener('change', async (e) => {
    const t = e.target;
    if (t.id === 'sitcat') { sitCat = t.value; spot = null; render(); }
    if (t.dataset.set) { state.settings[t.dataset.set] = +String(t.value).replace(',', '.') || 0; Store.save('settings'); render(); }
    if (t.dataset.sim) { sim[t.dataset.sim] = Math.max(t.dataset.sim === 'hands' ? 100 : t.dataset.sim === 'sd' ? 1 : -50, +String(t.value).replace(',', '.') || 0); render(); }
    if (t.dataset.pf) {
      const k = t.dataset.pf; pf[k] = k === 'payouts' ? t.value : +t.value;
      if (k === 'n') { while (pf.stacks.length < pf.n) pf.stacks.push(10); if (pf.sb >= pf.n) pf.sb = 0; if (pf.bb >= pf.n) pf.bb = 1; }
      pf.sol = null; pf.err = null; render();
    }
    if (t.dataset.pfs !== undefined) { pf.stacks[+t.dataset.pfs] = +String(t.value).replace(',', '.') || 0; pf.sol = null; pf.err = null; render(); }
    if (t.dataset.bd) { bdIn[t.dataset.bd] = t.value; if (t.dataset.bd === 'range') bdIn.label = ''; render(); }
    if (t.id === 'anfile' && t.files.length) { const texts = await Promise.all([...t.files].map((f) => f.text())); anText = texts.join('\n\n'); runAnalysis(anText, 'real'); render(); }
  });
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.dataset.eq) { if (t.dataset.eq === 'b') eqIn.board = t.value; else eqIn.p[+t.dataset.eq] = t.value; }
    if (t.id === 'rto') { raiseTo = +t.value; $('#rtv').textContent = bbs(raiseTo) + ' bb'; }
    if (t.id === 'pfS') $('#pfsv').textContent = t.value + ' bb';
  });
  document.addEventListener('submit', (e) => {
    if (e.target.id !== 'jform') return;
    e.preventDefault();
    const f = new FormData(e.target), num = (k) => +String(f.get(k) || '').replace(/\s/g, '').replace(',', '.').replace('−', '-');
    const s = { id: 's' + Date.now().toString(36), date: f.get('date'), room: f.get('room'), format: f.get('format'), stake: String(f.get('stake')).trim().toUpperCase().replace(/\s/g, ''), result: num('result'), hands: num('hands') || 0, minutes: num('minutes') || 0, tilt: +f.get('tilt'), notes: String(f.get('notes') || '').slice(0, 200) };
    if (!Number.isFinite(s.result)) { jMsg = 'Résultat illisible : écris par exemple −4,20 ou 12.'; return render(); }
    state.journal.sessions.push(s); Store.save('journal');
    const bi = buyIn(s), lost = bi ? -s.result / bi : 0, ms = maxStake(journalStats().bank), bb = bbOf(s.stake);
    jMsg = lost >= 3 ? `<strong>Stop-loss atteint :</strong> ${fr(lost, 1)} caves perdues. Fin de session, pas de retour aux tables aujourd'hui.`
      : s.tilt >= 2 ? '<strong>Tilt noté.</strong> Pause d\'au moins 30 minutes avant toute nouvelle session, et relis le module Mental.'
      : bb && ms && bb > bbOf(ms) ? `<strong>Attention :</strong> ta bankroll autorise au plus ${ms}. Redescends de limite.`
      : 'Session enregistrée.';
    render();
  });

  // ---------- Démarrage ----------
  render();
  Store.init().then(render);
})();
</script>
