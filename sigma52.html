<title>SIGMA 52</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Mise en page : bandeau bordeaux collant, colonne de travail de 1040 px, tapis de jeu en feutre lie-de-vin, cartes en jeu 4 couleurs. */
:root {
  --bg: #F5F1F2; --surface: #FFFFFF; --sunk: #EEE6E8; --ink: #1B1014; --muted: #6A5960; --line: #E2D5D9;
  --wine: #6E1A2D; --wine-deep: #3F0D19; --accent: #8C1D36; --accent-ink: #FFFFFF; --accent-bg: #F6E3E8;
  --good: #1D7547; --good-bg: #E0F1E7; --bad: #C2410C; --bad-bg: #FCE9DE; --warn: #9A6410; --gold: #C9A227;
  --s-s: #1B1014; --s-h: #C8202F; --s-d: #1D5FD1; --s-c: #17803F;
  --felt-1: #6E1A2D; --felt-2: #3A0B16; --on-felt: #F7E9EC;
  --f-display: 'Unbounded', 'Arial Black', system-ui, sans-serif;
  --f-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #120A0D; --surface: #1C1115; --sunk: #26171C; --ink: #F4E9EC; --muted: #B49DA4; --line: #37232A;
  --accent: #E25A7B; --accent-ink: #120A0D; --accent-bg: #3A1520;
  --good: #4CC383; --good-bg: #12291C; --bad: #FF8A57; --bad-bg: #36190F; --warn: #E8AE4A;
  --s-s: #1B1014; --s-h: #C8202F; --s-d: #1D5FD1; --s-c: #17803F; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #120A0D; --surface: #1C1115; --sunk: #26171C; --ink: #F4E9EC; --muted: #B49DA4; --line: #37232A;
  --accent: #E25A7B; --accent-ink: #120A0D; --accent-bg: #3A1520;
  --good: #4CC383; --good-bg: #12291C; --bad: #FF8A57; --bad-bg: #36190F; --warn: #E8AE4A;
  --s-s: #1B1014; --s-h: #C8202F; --s-d: #1D5FD1; --s-c: #17803F; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--wine-deep); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: linear-gradient(180deg, var(--wine-deep), var(--wine)); color: #F7E9EC; box-shadow: 0 1px 0 rgba(0,0,0,.25); }
.bar { display: flex; align-items: center; gap: 14px; padding-block: 12px 0; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.mark { width: 34px; height: 34px; border-radius: 9px; background: #F7E9EC; color: var(--wine-deep); display: grid; place-items: center; font: 800 15px/1 var(--f-display); letter-spacing: -.04em; }
.brand b { font: 800 20px/1 var(--f-display); letter-spacing: .02em; }
.brand small { display: block; font: 500 11px/1.3 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; opacity: .75; }
.offline { margin-left: auto; font: 500 12px var(--f-mono); color: #F2C9A0; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-top: 10px; }
nav.tabs::-webkit-scrollbar { display: none; }
.tab { border: 0; background: none; padding: 10px 14px 12px; color: rgba(247,233,236,.72); font-weight: 500; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; position: relative; }
.tab[aria-selected="true"] { color: #fff; border-bottom-color: var(--gold); }
.tab .badge { font: 600 10px/1 var(--f-mono); background: var(--gold); color: #2B1608; border-radius: 999px; padding: 3px 6px; margin-left: 6px; vertical-align: 2px; }
main { padding-block: 26px 72px; display: grid; gap: 20px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h1 { font: 700 34px/1.1 var(--f-display); letter-spacing: -.01em; }
h2 { font: 700 19px/1.2 var(--f-display); letter-spacing: -.005em; }
h3 { font: 600 16px/1.3 var(--f-body); }
p { margin: 0; }
.lead { color: var(--muted); max-width: 66ch; }
.eyebrow { font: 600 11px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: grid; gap: 14px; min-width: 0; align-content: start; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 4px; align-content: start; }
.stat b { font: 600 23px/1.1 var(--f-mono); font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); }
.stat.hero { background: var(--wine); border-color: var(--wine); color: #F7E9EC; } .stat.hero span { color: rgba(247,233,236,.75); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 14px; border-radius: 9px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: default; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.subtabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
.pill { display: inline-block; font: 600 11px/1 var(--f-mono); letter-spacing: .05em; text-transform: uppercase; padding: 5px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.pill.good { background: var(--good-bg); color: var(--good); } .pill.bad { background: var(--bad-bg); color: var(--bad); } .pill.acc { background: var(--accent-bg); color: var(--accent); }
.note { font-size: 13px; color: var(--muted); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.warnbox { border-left: 3px solid var(--gold); padding: 10px 14px; background: var(--sunk); border-radius: 0 9px 9px 0; }
label.f { display: grid; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
label.f input, label.f select, label.f textarea, textarea.f { padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); color: var(--ink); font-size: 15px; min-width: 0; width: 100%; }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
input[type=range] { width: 100%; accent-color: var(--accent); }
/* Cartes */
.cards { display: flex; gap: 6px; flex-wrap: wrap; }
.cd { width: 46px; height: 64px; border-radius: 7px; background: #FFFDFB; border: 1px solid #D9CCD0; box-shadow: 0 1px 2px rgba(0,0,0,.18); display: grid; place-items: center; align-content: center; font: 600 22px/1 var(--f-mono); }
.cd i { font-style: normal; font-size: 18px; line-height: 1; }
.cd.s { color: var(--s-s); } .cd.h { color: var(--s-h); } .cd.d { color: var(--s-d); } .cd.c { color: var(--s-c); }
.cd.sm { width: 34px; height: 46px; font-size: 16px; } .cd.sm i { font-size: 13px; }
.cd.back { background: repeating-linear-gradient(45deg, #8C1D36 0 5px, #6E1A2D 5px 10px); border-color: #F2DCE2; }
.felt { background: radial-gradient(120% 140% at 50% 30%, var(--felt-1), var(--felt-2)); color: var(--on-felt); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; }
.felt .eyebrow { color: #F2C9A0; }
/* Spots */
.opts { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
.opt { text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); cursor: pointer; font-weight: 500; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt.ok { border-color: var(--good); background: var(--good-bg); color: var(--good); }
.opt.ko { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
.opt:disabled { cursor: default; }
.verdict { border-radius: 9px; padding: 12px 14px; display: grid; gap: 4px; }
.verdict.good { background: var(--good-bg); } .verdict.bad { background: var(--bad-bg); }
.meter { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--accent); }
.typerow { display: grid; grid-template-columns: 140px 1fr 70px; gap: 10px; align-items: center; font-size: 14px; }
/* Cours */
.modlist { display: grid; gap: 6px; }
.mod { display: grid; grid-template-columns: 38px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); cursor: pointer; text-align: left; }
.mod .n { font: 700 18px/1 var(--f-display); color: var(--muted); }
.mod.done .n { color: var(--good); }
.prose { display: grid; gap: 18px; max-width: 70ch; }
article.panel.prose { max-width: none; } article.panel.prose > :not(.grid2) { max-width: 72ch; }
.prose section { display: grid; gap: 10px; }
.prose ul, .prose ol { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.formula { font: 500 14px/1.5 var(--f-mono); background: var(--sunk); padding: 10px 12px; border-radius: 9px; }
.tw { overflow-x: auto; }
table.t { border-collapse: collapse; width: 100%; font-size: 14px; }
table.t th, table.t td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t th { font: 600 11px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
table.t td.n, table.t th.n { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--f-mono); }
/* Grilles 13x13 */
.rgrid { display: grid; grid-template-columns: repeat(13, 1fr); gap: 2px; max-width: 520px; width: 100%; }
.rc { aspect-ratio: 1; max-width: 100%; border: 0; border-radius: 3px; background: var(--sunk); color: var(--muted); font: 600 clamp(7px, 1.8vw, 11px)/1 var(--f-mono); letter-spacing: -.03em; cursor: pointer; padding: 0; }
.rc.on { background: var(--accent); color: var(--accent-ink); }
.rc.heat { color: #fff; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); align-items: center; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; }
/* Barres */
.eqrow { display: grid; grid-template-columns: minmax(0, 1fr) 76px; gap: 10px; align-items: center; }
.eqbar { height: 22px; background: var(--sunk); border-radius: 5px; overflow: hidden; position: relative; }
.eqbar > i { position: absolute; inset: 0 auto 0 0; background: var(--accent); }
.hbar { display: grid; grid-template-columns: 150px minmax(0, 1fr) 118px; gap: 10px; align-items: center; font-size: 14px; }
.hbar .eqbar { height: 14px; }
canvas { width: 100%; max-width: 100%; display: block; }
.check { display: flex; gap: 10px; align-items: flex-start; }
.check input { margin-top: 4px; width: 18px; height: 18px; flex: none; accent-color: var(--accent); }
/* Table de jeu */
.pokertable { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-areas: ". s3 ." "s2 mid s4" "s1 mid s5" ". s0 ."; gap: 10px; background: radial-gradient(90% 80% at 50% 45%, var(--felt-1), var(--felt-2)); border-radius: 120px / 90px; padding: 22px 18px; color: var(--on-felt); border: 6px solid #2A0710; box-shadow: inset 0 0 40px rgba(0,0,0,.45); }
.seat { background: rgba(0,0,0,.28); border-radius: 12px; padding: 8px 10px; display: grid; gap: 4px; justify-items: center; text-align: center; min-width: 0; position: relative; border: 1px solid rgba(255,255,255,.08); }
.seat.turn { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(201,162,39,.35); }
.seat.out { opacity: .45; }
.seat .nm { font-weight: 600; font-size: 13px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seat .pf { font: 600 10px/1 var(--f-mono); letter-spacing: .05em; text-transform: uppercase; color: #F2C9A0; }
.seat .stk { font: 600 13px var(--f-mono); }
.seat .bet { font: 600 12px var(--f-mono); background: var(--gold); color: #2B1608; border-radius: 999px; padding: 2px 8px; }
.seat .dealer { position: absolute; top: -8px; right: -6px; width: 22px; height: 22px; border-radius: 50%; background: #FFFDFB; color: #1B1014; font: 700 11px/22px var(--f-mono); text-align: center; }
.seat .last { font-size: 12px; color: #F7E9EC; opacity: .85; }
.mid { grid-area: mid; display: grid; place-items: center; align-content: center; gap: 8px; }
.mid .pot { font: 700 14px var(--f-display); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.actions .btn { min-width: 84px; }
.advice { display: grid; gap: 8px; }
.advice div { padding: 9px 12px; border-radius: 9px; background: var(--sunk); border-left: 3px solid var(--muted); }
.advice .bad { border-left-color: var(--bad); } .advice .warn { border-left-color: var(--gold); } .advice .good { border-left-color: var(--good); }
pre.hh { font: 12px/1.45 var(--f-mono); background: var(--sunk); padding: 10px 12px; border-radius: 9px; overflow-x: auto; margin: 0; max-height: 300px; }
details summary { cursor: pointer; }
@media (max-width: 560px) {
  h1 { font-size: 25px; } .typerow { grid-template-columns: 110px 1fr 56px; } .panel { padding: 16px; }
  .pokertable { padding: 14px 8px; gap: 6px; border-radius: 40px; } .seat { padding: 6px 4px; } .seat .nm { font-size: 12px; } .cd.sm { width: 26px; height: 36px; font-size: 12px; } .cd.sm i { font-size: 10px; }
  .hbar { grid-template-columns: 100px minmax(0, 1fr) 96px; font-size: 13px; }
}
/* Table à 3 joueurs (Expresso), coach, replayer */
.pokertable.pt3 { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-areas: "s1 s2" "mid mid" "s0 s0"; border-radius: 90px / 70px; }
.pokertable.pt3 .seat[style*="s0"] { justify-self: center; min-width: 50%; }
.coach { border-color: var(--gold); }
.coach h2 { color: var(--accent); }
.rpseats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
.rpseat { background: rgba(0,0,0,.28); border-radius: 10px; padding: 8px; display: grid; gap: 4px; justify-items: center; text-align: center; border: 1px solid rgba(255,255,255,.08); min-width: 0; }
.rpseat.turn { border-color: var(--gold); } .rpseat.out { opacity: .4; }
.rpseat .nm { font-weight: 600; font-size: 13px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rpseat .stk { font: 600 12px var(--f-mono); } .rpseat .bet { font: 600 12px var(--f-mono); background: var(--gold); color: #2B1608; border-radius: 999px; padding: 2px 8px; }
.verdict:not(.good):not(.bad) { background: var(--sunk); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* Solveur : couleurs d'actions (couché bleu ardoise, check/call vert, mises du rose au bordeaux, tapis presque noir). */
:root { --act-f: #5B7EA6; --act-x: #3C9A63; --act-b1: #D9768E; --act-b2: #B23656; --act-b3: #851A33; --act-a: #3A0814; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --act-f: #6F93BD; --act-x: #47B176; --act-b1: #8E3550; --act-b2: #C24464; --act-b3: #EA6E8D; --act-a: #FFC2D0; } }
:root[data-theme="dark"] { --act-f: #6F93BD; --act-x: #47B176; --act-b1: #8E3550; --act-b2: #C24464; --act-b3: #EA6E8D; --act-a: #FFC2D0; }
.pbar { height: 8px; border-radius: 99px; background: var(--sunk); overflow: hidden; } .pbar i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.sbar { display: flex; height: 14px; border-radius: 6px; overflow: hidden; background: var(--sunk); } .sbar.small { height: 10px; } .sbar i { display: block; height: 100%; }
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; } .crumbs .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; }
.crumbs .cd.sm, .actrow .cd.sm, .combos .cd.sm, .cardpick .cd.sm, .note .cd.sm, .panel p .cd.sm { width: 24px; height: 32px; font-size: 12px; display: inline-grid; vertical-align: middle; } .crumbs .cd.sm i, .combos .cd.sm i, .cardpick .cd.sm i, .note .cd.sm i, .panel p .cd.sm i { font-size: 9px; }
.cards.mini { display: inline-flex; gap: 2px; }
.svgrid .rgrid { max-width: 560px; }
.rc.sv { color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,.45); } .rc.sv.lt { color: var(--ink); text-shadow: none; } .rc.sv.off { background: transparent; color: var(--line); text-shadow: none; cursor: default; border: 1px dashed var(--line); }
.rc.sv.sel { outline: 2px solid var(--ink); outline-offset: 1px; }
.actb { display: inline-flex; align-items: center; gap: 8px; } .actb .sw, .legend i, .mini-sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; }
.mini-sw { width: 8px; height: 8px; margin-right: 4px; vertical-align: middle; }
.bestev { color: var(--good) !important; font-weight: 600; }
.cards.picks { gap: 4px; } .cardpick { border: 0; padding: 0; background: none; cursor: pointer; border-radius: 6px; } .cardpick:hover .cd { outline: 2px solid var(--accent); }
table.sizes input { width: 100%; min-width: 70px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--ink); }
.svs .stat { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.18); color: var(--on-felt); } .svs .stat span { color: var(--on-felt); opacity: .8; } .svs .stat.hero { background: rgba(255,255,255,.18); border-color: #F2C9A0; }
details.panel > summary { cursor: pointer; } details.panel[open] > summary { margin-bottom: 4px; }
.painter { display: grid; gap: 10px; }
table.combos td, table.combos th { white-space: nowrap; padding: 6px 8px; }

/* Navigation par espaces, recherche, thème, barre du bas (mobile) */
.hbtns { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.offline { margin-left: 0; }
.hbtn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.08); color: #F7E9EC; border-radius: 9px; padding: 6px 10px; cursor: pointer; font-size: 13px; }
.hbtn:hover { background: rgba(255,255,255,.16); } .hbtn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; }
.hbtn kbd { font: 600 10px var(--f-mono); opacity: .7; border: 1px solid rgba(255,255,255,.3); border-radius: 5px; padding: 1px 5px; }
.subnav { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 8px 0 10px; border-top: 1px solid rgba(255,255,255,.1); }
.subnav::-webkit-scrollbar { display: none; }
.subnav .sub { border: 1px solid rgba(255,255,255,.2); background: transparent; color: rgba(247,233,236,.85); border-radius: 999px; padding: 5px 13px; font-size: 14px; cursor: pointer; white-space: nowrap; }
.subnav .sub[aria-current="page"] { background: #F7E9EC; color: var(--wine-deep); border-color: #F7E9EC; font-weight: 600; }
.subnav .badge { font: 600 10px/1 var(--f-mono); background: var(--gold); color: #2B1608; border-radius: 999px; padding: 3px 6px; margin-left: 6px; }
.bottomnav { display: none; }
@media (max-width: 720px) {
  nav.tabs { display: none; } .hbtn.search span, .hbtn.search kbd { display: none; } .brand small { display: none; } .offline { display: none; }
  .bottomnav { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); box-shadow: 0 -4px 18px rgba(0,0,0,.08); }

<script>// Moteur SIGMA 52 : cartes, évaluateur 7 cartes, ranges, équité Monte-Carlo / exacte.
// Carte = entier 0..51 : rang = c >> 2 (0 = 2 ... 12 = As), couleur = c & 3.
(function (root) {
  const RANKS = '23456789TJQKA';
  const SUITS = 'shdc'; // pique, coeur, carreau, trèfle
  const SUIT_SYM = { s: '♠', h: '♥', d: '♦', c: '♣' };
  const CAT_FR = ['Hauteur', 'Paire', 'Double paire', 'Brelan', 'Suite', 'Couleur', 'Full', 'Carré', 'Quinte flush'];

  const card = (s) => {
    const r = RANKS.indexOf(s[0].toUpperCase()), u = SUITS.indexOf(s[1].toLowerCase());
    if (r < 0 || u < 0) throw new Error('Carte invalide : ' + s);
    return (r << 2) | u;
  };
  const cardStr = (c) => RANKS[c >> 2] + SUITS[c & 3];
  const parseCards = (str) => (str || '').replace(/[\s,]+/g, '').match(/.{2}/g)?.map(card) || [];

  // Plus haute suite contenue dans un masque de rangs (bit i = rang i). -1 si aucune.
  function straightHigh(m) {
    for (let hi = 12; hi >= 4; hi--) if (((m >> (hi - 4)) & 31) === 31) return hi;
    if ((m & 0b1000000001111) === 0b1000000001111) return 3; // roue A-2-3-4-5
    return -1;
  }
  const topBits = (m, n) => { const out = []; for (let r = 12; r >= 0 && out.length < n; r--) if (m & (1 << r)) out.push(r); return out; };
  const pack = (cat, ks) => { let v = cat; for (let i = 0; i < 5; i++) v = v * 16 + (ks[i] ?? 0); return v; };

  // Valeur d'une main de 5 à 7 cartes : plus grand = meilleur. Catégorie = Math.floor(v / 16**5).
  function evaluate(cards) {
    const cnt = new Array(13).fill(0), suitMask = [0, 0, 0, 0], suitCnt = [0, 0, 0, 0];
    let mask = 0;
    for (const c of cards) { const r = c >> 2, s = c & 3; cnt[r]++; mask |= 1 << r; suitMask[s] |= 1 << r; suitCnt[s]++; }
    for (let s = 0; s < 4; s++) if (suitCnt[s] >= 5) {
      const sf = straightHigh(suitMask[s]);
      if (sf >= 0) return pack(8, [sf]);
      return pack(5, topBits(suitMask[s], 5));
    }
    const quads = [], trips = [], pairs = [];
    for (let r = 12; r >= 0; r--) { if (cnt[r] === 4) quads.push(r); else if (cnt[r] === 3) trips.push(r); else if (cnt[r] === 2) pairs.push(r); }
    if (quads.length) return pack(7, [quads[0], topBits(mask & ~(1 << quads[0]), 1)[0]]);
    if (trips.length && (trips.length > 1 || pairs.length)) return pack(6, [trips[0], trips.length > 1 ? Math.max(trips[1], pairs[0] ?? -1) : pairs[0]]);
    const st = straightHigh(mask);
    if (st >= 0) return pack(4, [st]);
    if (trips.length) return pack(3, [trips[0], ...topBits(mask & ~(1 << trips[0]), 2)]);
    if (pairs.length >= 2) return pack(2, [pairs[0], pairs[1], topBits(mask & ~(1 << pairs[0]) & ~(1 << pairs[1]), 1)[0]]);
    if (pairs.length) return pack(1, [pairs[0], ...topBits(mask & ~(1 << pairs[0]), 3)]);
    return pack(0, topBits(mask, 5));
  }
  const category = (v) => Math.floor(v / 1048576);
  const categoryName = (v) => CAT_FR[category(v)];

  // ---- Ranges ----
  // Les 169 mains de départ, grille 13x13 : diagonale = paires, haut-droite = assorties (s), bas-gauche = dépareillées (o).
  function handName(i, j) { // i, j = index ligne/colonne, 0 = As
    const a = 12 - i, b = 12 - j;
    if (i === j) return RANKS[a] + RANKS[a];
    return i < j ? RANKS[a] + RANKS[b] + 's' : RANKS[b] + RANKS[a] + 'o';
  }
  const ALL169 = []; for (let i = 0; i < 13; i++) for (let j = 0; j < 13; j++) ALL169.push(handName(i, j));

  // Combos concrets d'une main abstraite ("AKs" -> 4, "AKo" -> 12, "QQ" -> 6, "AK" -> 16).
  function combos(h) {
    const a = RANKS.indexOf(h[0]), b = RANKS.indexOf(h[1]), out = [];
    if (a < 0 || b < 0) throw new Error('Main invalide : ' + h);
    for (let s1 = 0; s1 < 4; s1++) for (let s2 = 0; s2 < 4; s2++) {
      if (a === b && s2 <= s1) continue;
      if (h[2] === 's' && s1 !== s2) continue;
      if (h[2] === 'o' && s1 === s2) continue;
      out.push([(a << 2) | s1, (b << 2) | s2]);
    }
    return out;
  }

  // Parse "22+, A2s+, KTs+, QJo, 76s-54s, AKo, random" -> Set de mains abstraites.
  function parseRange(str) {
    const set = new Set();
    for (let tok of (str || '').split(/[\s,]+/).filter(Boolean)) {
      tok = tok.trim();
      if (/^(random|any|100%)$/i.test(tok)) { ALL169.forEach((h) => set.add(h)); continue; }
      tok = tok.replace(/[2-9tjqka]/gi, (c) => c.toUpperCase()).replace(/[SO]/g, (c) => c.toLowerCase());
      const m = tok.match(/^([2-9TJQKA])([2-9TJQKA])([so]?)(\+?)(?:-([2-9TJQKA])([2-9TJQKA])([so]?))?$/);
      if (!m) throw new Error('Range illisible : ' + tok);
      let [, r1, r2, sfx, plus, e1, e2] = m;
      let a = RANKS.indexOf(r1), b = RANKS.indexOf(r2);
      if (b > a) [a, b] = [b, a];
      const add = (x, y) => {
        if (x === y) set.add(RANKS[x] + RANKS[x]);
        else if (sfx) set.add(RANKS[x] + RANKS[y] + sfx);
        else { set.add(RANKS[x] + RANKS[y] + 's'); set.add(RANKS[x] + RANKS[y] + 'o'); }
      };
      if (a === b) { // paires
        const lo = e1 ? Math.min(a, RANKS.indexOf(e1)) : a, hi = plus ? 12 : e1 ? Math.max(a, RANKS.indexOf(e1)) : a;
        for (let r = lo; r <= hi; r++) add(r, r);
      } else if (plus) { for (let y = b; y < a; y++) add(a, y); }
      else if (e1) {
        let x2 = RANKS.indexOf(e1), y2 = RANKS.indexOf(e2); if (y2 > x2) [x2, y2] = [y2, x2];
        if (x2 === a) for (let y = Math.min(b, y2); y <= Math.max(b, y2); y++) add(a, y); // A5s-A2s : kicker variable
        else for (let d = Math.min(0, y2 - b); d <= Math.max(0, y2 - b); d++) add(a + d, b + d); // 76s-54s : bande de connecteurs
      }
      else add(a, b);
    }
    return set;
  }
  // Range -> liste de combos, sans les cartes mortes.
  function rangeCombos(range, dead = []) {
    const d = new Set(dead), out = [];
    for (const h of (range instanceof Set ? range : parseRange(range))) for (const c of combos(h)) if (!d.has(c[0]) && !d.has(c[1])) out.push(c);
    return out;
  }
  const rangePct = (set) => [...set].reduce((n, h) => n + combos(h).length, 0) / 1326 * 100;

  // Classement d'une main abstraite dans un ensemble (pour savoir si "KTo" est dans "KTo+", etc.)
  const inRange = (hand, set) => set.has(hand);
  function abstractOf(c1, c2) {
    let a = c1 >> 2, b = c2 >> 2;
    if (a === b) return RANKS[a] + RANKS[a];
    const suited = (c1 & 3) === (c2 & 3);
    if (b > a) [a, b] = [b, a];
    return RANKS[a] + RANKS[b] + (suited ? 's' : 'o');
  }

  // ---- Équité ----
  // Générateur pseudo-aléatoire reproductible (mulberry32) pour des tests stables.
  function rng(seed) { let t = seed >>> 0; return () => { t += 0x6D2B79F5; let x = t; x = Math.imul(x ^ (x >>> 15), x | 1); x ^= x + Math.imul(x ^ (x >>> 7), x | 61); return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }

  // players : tableau de { hand: [c1,c2] } ou { combos: [[c1,c2],...] }. board : 0 à 5 cartes.
  // Retour : { equity: [..], win: [..], tie: [..], n, exact }.
  function equity(players, board = [], opts = {}) {
    const n = players.length, iters = opts.iterations || 50000, rand = opts.random || Math.random;
    const known = new Set(board); players.forEach((p) => p.hand && p.hand.forEach((c) => known.add(c)));
    const fixed = players.every((p) => p.hand);
    const eq = new Array(n).fill(0), win = new Array(n).fill(0), tie = new Array(n).fill(0);
    const need = 5 - board.length;
    let total = 0;
    const score = (hands, full) => {
      let best = -1, winners = [];
      for (let i = 0; i < n; i++) { const v = evaluate([hands[i][0], hands[i][1], ...full]); if (v > best) { best = v; winners = [i]; } else if (v === best) winners.push(i); }
      for (const w of winners) { eq[w] += 1 / winners.length; if (winners.length === 1) win[w]++; else tie[w]++; }
      total++;
    };
    // Exact si mains connues et peu de tirages restants (flop ou plus tard).
    if (fixed && need <= 2) {
      const deck = []; for (let c = 0; c < 52; c++) if (!known.has(c)) deck.push(c);
      const hands = players.map((p) => p.hand);
      if (need === 0) score(hands, board);
      else if (need === 1) for (const c of deck) score(hands, [...board, c]);
      else for (let i = 0; i < deck.length; i++) for (let j = i + 1; j < deck.length; j++) score(hands, [...board, deck[i], deck[j]]);
      return { equity: eq.map((x) => x / total), win: win.map((x) => x / total), tie: tie.map((x) => x / total), n: total, exact: true };
    }
    const pools = players.map((p) => p.hand ? null : p.combos.filter((c) => !known.has(c[0]) && !known.has(c[1])));
    if (pools.some((p) => p && !p.length)) throw new Error('Range vide après retrait des cartes connues');
    const used = new Uint8Array(52);
    for (let it = 0; it < iters; it++) {
      used.fill(0); known.forEach((c) => (used[c] = 1));
      const hands = []; let ok = true;
      for (let i = 0; i < n; i++) {
        if (players[i].hand) { hands.push(players[i].hand); continue; }
        let tries = 0, h;
        do { h = pools[i][(rand() * pools[i].length) | 0]; } while ((used[h[0]] || used[h[1]]) && ++tries < 50);
        if (used[h[0]] || used[h[1]]) { ok = false; break; }
        used[h[0]] = used[h[1]] = 1; hands.push(h);
      }
      if (!ok) continue;
      const full = board.slice();
      while (full.length < 5) { const c = (rand() * 52) | 0; if (!used[c]) { used[c] = 1; full.push(c); } }
      score(hands, full);
    }
    return { equity: eq.map((x) => x / total), win: win.map((x) => x / total), tie: tie.map((x) => x / total), n: total, exact: false };
  }

  // Outs : cartes du talon qui font passer la main du héros devant celle (connue) de l'adversaire à la prochaine carte.
  function outs(hero, villain, board) {
    const known = new Set([...hero, ...villain, ...board]), res = [];
    for (let c = 0; c < 52; c++) if (!known.has(c)) {
      const b = [...board, c];
      if (evaluate([...hero, ...b]) > evaluate([...villain, ...b])) res.push(c);
    }
    return res;
  }

  const api = { RANKS, SUITS, SUIT_SYM, CAT_FR, card, cardStr, parseCards, evaluate, category, categoryName, handName, ALL169, combos, parseRange, rangeCombos, rangePct, inRange, abstractOf, equity, outs, rng };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.Engine = api;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>// Omaha (PLO) : évaluation avec exactement 2 cartes privatives + 3 cartes du board, équité Monte-Carlo ou exacte,
// description d'une main de départ et taille maximale d'une relance pot-limit.
(function (root) {
  const E = root.Engine || require('./engine.js');
  const P2 = [[0, 1], [0, 2], [0, 3], [1, 2], [1, 3], [2, 3]];
  const B3 = []; for (let a = 0; a < 5; a++) for (let b = a + 1; b < 5; b++) for (let c = b + 1; c < 5; c++) B3.push([a, b, c]);
  const five = [0, 0, 0, 0, 0];

  // Meilleure main de 5 cartes : 2 des 4 cartes privatives + 3 des 5 cartes du board (60 combinaisons).
  function evaluate(hole, board) {
    let best = -1;
    const bs = board.length === 5 ? B3 : B3.filter((t) => t.every((i) => i < board.length));
    for (const [i, j] of P2) {
      five[0] = hole[i]; five[1] = hole[j];
      for (const [a, b, c] of bs) { five[2] = board[a]; five[3] = board[b]; five[4] = board[c]; const v = E.evaluate(five); if (v > best) best = v; }
    }

<script>// Solveur : équilibre de Nash tapis/couché en tête-à-tête (SB contre BB), en jetons (chipEV) ou en argent (ICM).
// Repose sur la matrice d'équité préflop 169 x 169 et sur le nombre de combinaisons compatibles entre classes (effet de blocage).
(function (root) {
  const E = root.Engine || require('./engine.js');
  const M = root.Matrix || require('./matrix.js');
  const N = 169;
  let EQ = null, CNT = null, W = null;

  function init() {
    if (EQ) return;
    const bin = typeof atob === 'function' ? Uint8Array.from(atob(M.B64), (c) => c.charCodeAt(0)) : new Uint8Array(Buffer.from(M.B64, 'base64'));
    const u16 = new Uint16Array(bin.buffer, bin.byteOffset, N * N);
    EQ = new Float64Array(N * N); for (let k = 0; k < N * N; k++) EQ[k] = u16[k] / 65535;
    const combos = E.ALL169.map((h) => E.combos(h));
    W = combos.map((c) => c.length);
    CNT = new Float64Array(N * N); // combinaisons concrètes compatibles (paires de mains disjointes)
    for (let i = 0; i < N; i++) for (let j = i; j < N; j++) {
      let n = 0;
      for (const a of combos[i]) for (const b of combos[j]) if (a[0] !== b[0] && a[0] !== b[1] && a[1] !== b[0] && a[1] !== b[1]) n++;
      CNT[i * N + j] = CNT[j * N + i] = n;
    }
  }
  const eq = (i, j) => (init(), EQ[i * N + j]);
  const idx = (h) => E.ALL169.indexOf(h);

  // Équité d'une main contre une range pondérée (vecteur de 169 fréquences), avec effet de blocage.
  function eqVsRange(i, freq) {
    init(); let num = 0, den = 0;
    for (let j = 0; j < N; j++) { const w = CNT[i * N + j] * freq[j]; num += w * EQ[i * N + j]; den += w; }
    return den ? num / den : 0.5;
  }
  // Équité préflop range contre range (fréquences par classe).
  function rangeVsRange(fa, fb) {
    init(); let num = 0, den = 0;
    for (let i = 0; i < N; i++) if (fa[i]) for (let j = 0; j < N; j++) if (fb[j]) { const w = CNT[i * N + j] * fa[i] * fb[j]; num += w * EQ[i * N + j]; den += w; }
    return den ? num / den : 0.5;
  }
  const setToFreq = (set) => E.ALL169.map((h) => (set.has(h) ? 1 : 0));

  // ICM Malmuth-Harville : valeur en argent de chaque tapis. stacks[], payouts[] (1er, 2e, ...).
  function icm(stacks, payouts) {
    const n = stacks.length, val = new Array(n).fill(0), full = (1 << n) - 1;
    const prob = new Map([[0, 1]]); // ensemble des joueurs déjà classés (places 1..k) -> probabilité
    const order = [...Array(full + 1).keys()].sort((a, b) => popcount(a) - popcount(b));
    for (const mask of order) {
      const p = prob.get(mask); if (!p) continue;
      const k = popcount(mask); if (k >= payouts.length || k >= n) continue;
      let rest = 0; for (let i = 0; i < n; i++) if (!(mask & (1 << i)) && stacks[i] > 0) rest += stacks[i];
      if (!rest) continue;
      for (let i = 0; i < n; i++) if (!(mask & (1 << i)) && stacks[i] > 0) {
        const q = p * stacks[i] / rest; val[i] += q * payouts[k];
        const m2 = mask | (1 << i); prob.set(m2, (prob.get(m2) || 0) + q);
      }
    }
    return val;
  }
  function popcount(x) { let c = 0; while (x) { x &= x - 1; c++; } return c; }

  // Jeu tapis/couché SB contre BB. Les valeurs d'issue (fold, vol, gain, perte) sont fournies pour chaque joueur,
  // ce qui couvre le cas en jetons comme le cas ICM. Renvoie fréquences de tapis (SB) et de call (BB) par classe.
  function solveOutcomes(V, iters = 400) {
    init();
    const push = new Float64Array(N).fill(1), call = new Float64Array(N).fill(0.5);
    const avgP = new Float64Array(N), avgC = new Float64Array(N);
    const evP = new Float64Array(N), evC = new Float64Array(N);
    for (let t = 1; t <= iters; t++) {
      // Meilleure réponse de la SB à la stratégie moyenne actuelle de la BB.
      const cs = t === 1 ? call : avgC;
      for (let i = 0; i < N; i++) {
        let den = 0, ev = 0;
        for (let j = 0; j < N; j++) {
          const w = CNT[i * N + j]; if (!w) continue; den += w;
          const c = cs[j], e = EQ[i * N + j];
          ev += w * ((1 - c) * V.sb.steal + c * (e * V.sb.win + (1 - e) * V.sb.lose));
        }
        evP[i] = ev / den - V.sb.fold; push[i] = evP[i] > 0 ? 1 : 0;
      }
      for (let i = 0; i < N; i++) avgP[i] += (push[i] - avgP[i]) / t;
      // Meilleure réponse de la BB à la stratégie moyenne de la SB.
      for (let j = 0; j < N; j++) {
        let den = 0, e = 0;
        for (let i = 0; i < N; i++) { const w = CNT[j * N + i] * avgP[i]; if (!w) continue; den += w; e += w * EQ[j * N + i]; }
        if (!den) { evC[j] = -1; call[j] = 0; continue; }
        e /= den; evC[j] = e * V.bb.win + (1 - e) * V.bb.lose - V.bb.fold; call[j] = evC[j] > 0 ? 1 : 0;
      }
      for (let j = 0; j < N; j++) avgC[j] += (call[j] - avgC[j]) / t;
    }
    // EV finales contre les stratégies moyennes (pour noter les erreurs en perte d'EV).
    for (let i = 0; i < N; i++) {
      let den = 0, ev = 0;
      for (let j = 0; j < N; j++) { const w = CNT[i * N + j]; if (!w) continue; den += w; const c = avgC[j], e = EQ[i * N + j]; ev += w * ((1 - c) * V.sb.steal + c * (e * V.sb.win + (1 - e) * V.sb.lose)); }
      evP[i] = ev / den - V.sb.fold;
    }
    for (let j = 0; j < N; j++) {
      let den = 0, e = 0;
      for (let i = 0; i < N; i++) { const w = CNT[j * N + i] * avgP[i]; if (!w) continue; den += w; e += w * EQ[j * N + i]; }
      evC[j] = den ? (e / den) * V.bb.win + (1 - e / den) * V.bb.lose - V.bb.fold : -1;
    }
    // Nettoyage : les fréquences sous 2 % ou au-dessus de 98 % viennent des premières itérations, pas de l'équilibre.
    const clean = (f) => Array.from(f, (x) => (x < 0.02 ? 0 : x > 0.98 ? 1 : x));
    const pct = (f) => f.reduce((a, x, i) => a + x * W[i], 0) / 1326;
    const P = clean(avgP), Cc = clean(avgC);
    return { push: P, call: Cc, evPush: Array.from(evP), evCall: Array.from(evC), pushPct: pct(P), callPct: pct(Cc) };
  }

  // Cas en jetons : tapis effectif S (en bb), ante par joueur a (en bb). Valeurs = tapis final de chacun, en bb.
  function chipOutcomes(S, a = 0) {
    return {
      sb: { fold: S - 0.5 - a, steal: S + 1 + a, win: 2 * S, lose: 0 },
      bb: { fold: S - 1 - a, win: 2 * S, lose: 0 },
    };
  }
  function solveChip(S, a = 0) { return solveOutcomes(chipOutcomes(S, a)); }

  // Cas ICM : stacks de tous les joueurs (en bb, blindes non postées), indices de la SB et de la BB, payouts.
  // Les autres joueurs se sont couchés ; leurs antes restent au pot.
  function icmOutcomes(stacks, sb, bb, payouts, ante = 0) {
    const n = stacks.length, base = stacks.map((s) => s - ante), dead = ante * n;
    const after = (f) => { const s = base.slice(); f(s); return icm(s, payouts); };
    const E2 = Math.min(stacks[sb], stacks[bb]) - ante; // part de chaque tapis engagée en cas de call
    const vFold = after((s) => { s[sb] -= 0.5; s[bb] += 0.5 + dead; });
    const vSteal = after((s) => { s[bb] -= 1; s[sb] += 1 + dead; });
    const vWin = after((s) => { s[sb] += E2 + dead; s[bb] -= E2; });
    const vLose = after((s) => { s[sb] -= E2; s[bb] += E2 + dead; });
    return {
      V: { sb: { fold: vFold[sb], steal: vSteal[sb], win: vWin[sb], lose: vLose[sb] }, bb: { fold: vSteal[bb], win: vLose[bb], lose: vWin[bb] } },
      chips: { fold: vFold, steal: vSteal, win: vWin, lose: vLose },
    };
  }

  // Deal en table finale : ICM contre chip chop. prizes = montants restants par place (€), stacks = jetons.
  function deal(stacks, prizes) {
    const total = stacks.reduce((a, b) => a + b, 0), pool = prizes.slice(0, stacks.length).reduce((a, b) => a + b, 0);
    const minCash = prizes[Math.min(stacks.length, prizes.length) - 1] || 0, rest = pool - minCash * stacks.length;
    const icmV = icm(stacks, prizes.slice(0, stacks.length));
    const chip = stacks.map((s) => minCash + rest * s / total);
    return stacks.map((s, i) => ({ stack: s, share: s / total, icm: icmV[i], chip: chip[i], diff: chip[i] - icmV[i] }));
  }

  const api = { deal, init, eq, idx, eqVsRange, rangeVsRange, setToFreq, icm, solveOutcomes, chipOutcomes, solveChip, icmOutcomes, get W() { init(); return W; } };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.Solver = api;
})(typeof window !== 'undefined' ? window : globalThis);

      sections: [
        ['Ce que calcule un solveur', `<p>Un solveur reçoit <strong>deux ranges</strong>, un <strong>board</strong>, un <strong>pot</strong>, des <strong>tapis</strong> et un <strong>arbre de mises</strong> (les tailles autorisées à chaque rue). Il renvoie, pour chaque combo, une stratégie souvent mixte (par exemple 60 % mise, 40 % check). L'ensemble forme un <strong>équilibre de Nash</strong> : aucun des deux joueurs ne gagne à changer seul sa stratégie.</p>
          <ul><li><strong>EV</strong> : part du pot qu'un combo récupère en moyenne, moins ce qu'il remet. À l'équilibre, deux actions jouées toutes les deux par un même combo ont la même EV.</li>
          <li><strong>Équité</strong> : part du pot gagnée si toutes les cartes sont distribuées sans autre mise.</li>
          <li><strong>Réalisation d'équité</strong> (EQR) = EV ÷ (équité × pot). Une main en position, avec de bons tirages, réalise souvent plus de 100 % ; une main faible hors de position, souvent moins de 70 %.</li></ul>`],
        ['Comment il calcule', `<p>Les solveurs modernes utilisent une famille d'algorithmes appelée <strong>CFR</strong> (Counterfactual Regret Minimization). À chaque itération, chaque combo, à chaque décision, mesure ce que chaque action aurait rapporté par rapport à sa stratégie actuelle : c'est le <em>regret</em>. Il augmente la fréquence des actions à regret positif. La <strong>moyenne</strong> des stratégies successives converge vers l'équilibre.</p>
          <p>La qualité se mesure par l'<strong>exploitabilité</strong> : ce que gagnerait un adversaire parfait contre la solution, en % du pot. Les outils commerciaux visent 0,3 à 0,5 % du pot. Le solveur de SIGMA 52 utilise <em>Discounted CFR</em> (Brown et Sandholm, 2019), qui pondère davantage les itérations récentes et converge plus vite.</p>`],
        ['Pourquoi l\'arbre explose', `<p>Chaque taille de mise ajoutée multiplie les branches. Et chaque carte à venir multiplie tout l'arbre : 46 rivers possibles après un turn, 47 × 46 = 2 162 couples turn-river après un flop. Un solve de flop complet demande des gigaoctets de mémoire. Les praticiens réduisent l'arbre : 1 à 3 tailles par rue, relances limitées, et regroupent les cartes équivalentes.</p>
          <p>Dans SIGMA 52 : river et turn sont exacts ; au flop, le solveur calcule un échantillon représentatif de turns et de rivers. La stratégie du flop reste fiable en tendance ; pour un turn précis, re-résous-le exactement depuis le nœud.</p>`],
        ['Lire une solution, dans cet ordre', `<ol><li><strong>Fréquences globales</strong> : qui mise, combien, à quelle taille. Sur K♠ 7♦ 2♣, le relanceur préflop mise souvent petit avec une grande partie de sa range ; sur 9♥ 8♥ 7♣, il checke beaucoup plus.</li>
          <li><strong>Par catégorie</strong> : quelles mains faites misent, lesquelles checkent, quels tirages servent de semi-bluffs. C'est là que se trouvent les règles transposables.</li>
          <li><strong>Par combo</strong> : pourquoi A♠5♠ mise et A♦5♣ checke ? Presque toujours une histoire de tirage arrière (backdoor) ou de bloqueur.</li>
          <li><strong>Perte d'EV</strong> : une erreur se mesure en bb ou en % du pot. Une action qui perd 0,1 % du pot est une simplification acceptable ; une action qui perd 5 % du pot est une fuite.</li></ol>`],
        ['Méthode d\'étude', `<ol><li>Écris ta décision et ta raison <em>avant</em> de regarder la solution.</li>
          <li>Regarde l'agrégat sur plusieurs boards de la même famille (par exemple les flops K-x-x secs), pas un seul.</li>
          <li>Tire une règle courte : « Sur flop haut et sec, en position, mise petite avec presque toute la range ».</li>
          <li>Mesure la perte d'EV de ta règle simplifiée par rapport à la solution. Si elle coûte moins de 1 % du pot, garde-la.</li>
          <li>Applique la règle en session, puis vérifie tes mains réelles au replayer et au solveur.</li>
          <li>Contre un adversaire qui s'écarte de l'équilibre, la règle devient un point de départ, pas une obligation (module Exploitation).</li></ol>`],

        ['Sur plusieurs rues', `<p>Au flop et au turn, les « bluffs » sont des semi-bluffs qui peuvent toucher. La proportion de bluffs est donc plus élevée qu'à la river. Ordre de grandeur couramment observé dans les solves : environ 2 bluffs pour 1 valeur au flop, 1 pour 1 au turn, 1 pour 2 à la river avec une mise pot. Ce sont des repères, pas des lois : la texture et les tailles les déplacent.</p>

<script>// Générateur de spots d'entraînement. Chaque spot : { type, title, prompt, cards?, board?, opts, ok (index ou liste), why }.
(function (root) {
  const E = root.Engine || require('./engine.js');
  const Charts = root.Charts || require('./charts.js');
  const Course = root.Course || require('./course.js');
  const Solver = root.Solver || require('./solver.js');

  const TYPES = {
    rfi: 'Ouverture', vsopen: 'Face à une ouverture', odds: 'Cotes du pot', tirage: 'Tirage au turn', pushfold: 'Tapis ou couché', outs: 'Compter les outs', meilleure: 'Meilleure main', situations: 'Situations',
    mdf: 'MDF et ratios', combos: 'Combos et bloqueurs', bounty: 'Primes PKO',
  };
  const pick = (a, r) => a[(r() * a.length) | 0];
  const pct = (x) => (x * 100).toFixed(1).replace('.', ',') + ' %';
  const eur = (x) => x.toFixed(2).replace('.', ',') + ' €';
  function deal(n, r, exclude = []) {
    const used = new Set(exclude), out = [];
    while (out.length < n) { const c = (r() * 52) | 0; if (!used.has(c)) { used.add(c); out.push(c); } }
    return out;
  }

  // Ouverture : position + main -> ouvrir ou passer, selon les ranges RFI.
  function rfi(r) {
    const pos = pick(Charts.POS, r), set = E.parseRange(Charts.RFI[pos].range);
    // Moitié des mains tirées près de la frontière de la range (là où on se trompe), moitié au hasard.
    let cards, h;
    for (let i = 0; i < 40; i++) {
      cards = deal(2, r); h = E.abstractOf(cards[0], cards[1]);
      if (r() < 0.5) break;
      const ri = E.RANKS.indexOf(h[0]), rj = E.RANKS.indexOf(h[1]);
      const neighbours = [[ri, rj - 1], [ri, rj + 1], [ri - 1, rj]].filter(([a, b]) => a >= 0 && b >= 0 && a <= 12 && b <= 12 && a !== b)
        .map(([a, b]) => E.RANKS[Math.max(a, b)] + E.RANKS[Math.min(a, b)] + (h[2] || ''));
      if (neighbours.some((x) => set.has(x) !== set.has(h))) break;
    }
    const open = set.has(h);
    return {
      type: 'rfi', title: 'Ouverture · ' + Charts.RFI[pos].label,
      prompt: `Tout le monde a passé jusqu'à toi. Tu es <strong>${pos}</strong> avec <strong>${h}</strong>.`,
      cards, opts: [`Ouvrir à ${Charts.RFI[pos].size}`, 'Se coucher'], ok: open ? 0 : 1,
      why: `${h} est ${open ? '' : 'hors de '}la range d'ouverture ${pos} (${E.rangePct(set).toFixed(0)} % des mains). ` +
        (open ? 'Relance, ne limpe jamais en premier.' : 'Trop de joueurs parlent après toi pour cette main, ou elle est dominée trop souvent.'),
    };
  }

  // Face à une ouverture : 3-bet, call ou fold selon les charts.
  function vsopen(r) {
    const pairs = []; for (const o in Charts.FACING) for (const h in Charts.FACING[o]) pairs.push([o, h]);
    const [o, h] = pick(pairs, r), f = Charts.FACING[o][h];
    const zone = E.parseRange(f.threebet + (f.call ? ', ' + f.call : ''));
    let cards, hand;
    for (let k = 0; k < 40; k++) {
      cards = deal(2, r); hand = E.abstractOf(cards[0], cards[1]);
      if (r() < 0.35) break;
      const ri = E.RANKS.indexOf(hand[0]), rj = E.RANKS.indexOf(hand[1]);
      const nb = [[ri, rj - 1], [ri, rj + 1], [ri - 1, rj]].filter(([a, b]) => a >= 0 && b >= 0 && a <= 12 && b <= 12 && a !== b).map(([a, b]) => E.RANKS[Math.max(a, b)] + E.RANKS[Math.min(a, b)] + (hand[2] || ''));
      if (zone.has(hand) || nb.some((x) => zone.has(x))) break;
    }
    const act = Charts.facingAction(o, h, hand), opts = ['3-bet', 'Payer', 'Se coucher'], ok = { '3bet': 0, call: 1, fold: 2 }[act];
    const ip = !['SB', 'BB'].includes(h);
    return {
      type: 'vsopen', title: `Face à une ouverture · ${o} ouvre, tu es ${h}`,
      prompt: `Un régulier ouvre à 2,5 bb depuis le <strong>${o}</strong>, tout le monde se couche jusqu'à toi. Tu es <strong>${h}</strong> avec <strong>${hand}</strong>.`,
      cards, opts, ok,
      why: `Référence ${o} contre ${h} : 3-bet ${E.rangePct(E.parseRange(f.threebet)).toFixed(1).replace('.', ',')} % des mains, call ${f.call ? E.rangePct(E.parseRange(f.call)).toFixed(1).replace('.', ',') : '0'} %. ${hand} : ${act === '3bet' ? '3-bet' : act === 'call' ? 'call' : 'fold'}. ` +
        (h === 'SB' ? 'En petite blinde, on joue 3-bet ou fold : un call laisse la BB entrer à bas prix et tu joues hors de position.' : h === 'BB' ? 'En grosse blinde, tu as déjà 1 bb dans le pot : la défense est large, surtout contre les ouvertures tardives.' : ip ? 'En position, les mains jouables postflop se paient ; le haut de range et quelques bloqueurs se 3-bettent.' : '') +
        (o === 'UTG' ? ' Une ouverture UTG est la plus forte : serre-toi.' : ''),
    };
  }

  // Cotes du pot : quelle équité faut-il pour suivre ?
  function odds(r) {
    const pot = pick([0.6, 0.8, 1, 1.2, 1.5, 2, 2.4, 3, 4, 5], r), f = pick([0.25, 0.33, 0.5, 0.66, 0.75, 1, 1.5, 2], r);
    const bet = Math.round(pot * f * 100) / 100, need = bet / (pot + 2 * bet);
    const wrong = [bet / (pot + bet), bet / pot, need * 0.6].filter((x) => Math.abs(x - need) > 0.02 && x < 1);
    const opts = [need, ...wrong.slice(0, 2)].sort(() => r() - 0.5);
    return {
      type: 'odds', title: 'Cotes du pot',
      prompt: `Pot de <strong>${eur(pot)}</strong>. L'adversaire mise <strong>${eur(bet)}</strong>. Quelle équité te faut-il au minimum pour suivre ?`,
      opts: opts.map(pct), ok: opts.indexOf(need),
      ev: null,
      why: `Tu paies ${eur(bet)} pour un pot final de ${eur(pot + 2 * bet)} : ${eur(bet)} ÷ ${eur(pot + 2 * bet)} = ${pct(need)}. Erreur classique : diviser par le pot avant ta mise (${pct(bet / (pot + bet))}).`,
    };
  }

  // Tirage au turn : équité exacte contre une range « paire ou mieux » vs cotes du pot.
  function villainRange(board) {
    const base = E.category(E.evaluate(board)), out = [];
    for (const h of E.ALL169) for (const c of E.combos(h)) {
      if (board.includes(c[0]) || board.includes(c[1])) continue;
      if (E.category(E.evaluate([...c, ...board])) > base) out.push(c);
    }
    return out;
  }
  function exactVsRange(hero, range, board) {
    let eq = 0, n = 0;
    const dead = new Set([...hero, ...board]);
    for (const v of range) {
      if (dead.has(v[0]) || dead.has(v[1])) continue;
      for (let c = 0; c < 52; c++) {
        if (dead.has(c) || c === v[0] || c === v[1]) continue;
        const b = [...board, c], a = E.evaluate([...hero, ...b]), d = E.evaluate([...v, ...b]);
        eq += a > d ? 1 : a === d ? 0.5 : 0; n++;
      }
    }
    return eq / n;
  }
  function drawKind(hero, board) {
    const all = [...hero, ...board], kinds = [];
    for (let s = 0; s < 4; s++) if (all.filter((c) => (c & 3) === s).length === 4 && hero.some((c) => (c & 3) === s)) kinds.push('tirage couleur');
    const m = all.reduce((acc, c) => acc | (1 << (c >> 2)), 0);
    const hasStraight = (x) => { for (let hi = 12; hi >= 4; hi--) if (((x >> (hi - 4)) & 31) === 31) return true; return (x & 0b1000000001111) === 0b1000000001111; };
    let st = 0;
    if (!hasStraight(m)) for (let rank = 0; rank < 13; rank++) if (!(m & (1 << rank)) && hasStraight(m | (1 << rank))) st++;
    if (st >= 2) kinds.push('suite par les deux bouts'); else if (st === 1) kinds.push('suite ventrale');
    return kinds;
  }
  function tirage(r) {
    for (let tries = 0; tries < 400; tries++) {
      const board = deal(4, r);
      if (new Set(board.map((c) => c >> 2)).size < 4) continue;
      const hero = deal(2, r, board);
      if (E.category(E.evaluate([...hero, ...board])) !== 0) continue;
      const kinds = drawKind(hero, board);
      if (!kinds.length) continue;
      const range = villainRange([...board]).filter((c) => !hero.includes(c[0]) && !hero.includes(c[1]));
      const eq = exactVsRange(hero, range, board);
      const pot = pick([1, 1.5, 2, 3, 4], r), f = pick([0.33, 0.5, 0.66, 0.75, 1], r);
      const bet = Math.round(pot * f * 100) / 100, need = bet / (pot + 2 * bet);
      if (Math.abs(eq - need) < 0.03) continue;
      const call = eq > need;
      return {
        type: 'tirage', title: 'Tirage au turn · une carte à venir',
        prompt: `Turn. Tu as un ${kinds.join(' + ')}. Pot de <strong>${eur(pot)}</strong>, l'adversaire mise <strong>${eur(bet)}</strong>. Suppose qu'il a toujours au moins une paire avec une de ses cartes. Tu ne gagneras rien de plus à la river si tu touches.`,
        cards: hero, board, opts: ['Suivre', 'Se coucher'], ok: call ? 0 : 1,
        why: `Ton équité exacte à la river contre cette range (${range.length} combinaisons) : ${pct(eq)}. Équité requise : ${pct(need)}. ` +
          (call ? 'Le call est rentable même sans gains implicites.' : 'Sans gains implicites, le call perd de l\'argent. Contre un fish qui paiera ta couleur à la river, la marge se réduit : c\'est le rôle des cotes implicites.'),
        meta: { eq, need }, ev: { call: eq * (pot + bet) - (1 - eq) * bet, unit: '€' },
      };
    }
    return odds(r);
  }


  // Tapis ou couché : équilibre de Nash tête-à-tête (SB contre BB), en jetons. Noté en perte d'EV.
  const nashCache = {};
  const nash = (S) => nashCache[S] || (nashCache[S] = Solver.solveChip(S));
  function pushfold(r) {
    const S = pick([3, 4, 5, 6, 7, 8, 10, 12, 15, 18, 20], r), sol = nash(S), sb = r() < 0.6;
    let cards, i, freq;
    for (let k = 0; k < 30; k++) {
      cards = deal(2, r); i = E.ALL169.indexOf(E.abstractOf(cards[0], cards[1])); freq = sb ? sol.push[i] : sol.call[i];
      const ev = Math.abs(sb ? sol.evPush[i] : sol.evCall[i]);
      if (freq > 0.05 && freq < 0.95) continue; // mains mixtes : pas de bonne réponse unique
      if (ev < 0.6 || r() < 0.3) break; // privilégie les décisions serrées
    }
    const h = E.ALL169[i], ev = sb ? sol.evPush[i] : sol.evCall[i], yes = freq >= 0.5;
    return {
      type: 'pushfold', title: `Tapis ou couché · ${S} bb · tête-à-tête`,
      prompt: sb ? `Tout le monde s'est couché. Tu es <strong>petite blinde</strong> avec <strong>${h}</strong>, tapis effectif <strong>${S} bb</strong>. Tapis ou couché ?`
        : `La petite blinde fait tapis (${S} bb effectifs). Tu es <strong>grosse blinde</strong> avec <strong>${h}</strong>. Tu paies ?`,
      cards, opts: sb ? ['Tapis', 'Se coucher'] : ['Payer', 'Se coucher'], ok: yes ? 0 : 1,
      why: `Équilibre de Nash à ${S} bb : la SB pousse ${pct(sol.pushPct)} des mains, la BB paie ${pct(sol.callPct)}. ` +
        `${h} : ${sb ? 'pousser' : 'payer'} ${ev >= 0 ? 'rapporte' : 'coûte'} ${Math.abs(ev).toFixed(2).replace('.', ',')} bb de plus que se coucher. ` +
        'Valable en Expresso (le gagnant prend tout, donc les jetons valent leur poids en argent) et en cash ; en tournoi près de l\'argent, l\'ICM resserre.',
      ev: { diff: ev, unit: 'bb' },
    };
  }

  // Compter les outs : main du héros et de l'adversaire visibles, flop ou turn.
  function outsSpot(r) {
    for (let k = 0; k < 300; k++) {
      const n = r() < 0.6 ? 3 : 4, board = deal(n, r), hero = deal(2, r, board), vil = deal(2, r, [...board, ...hero]);
      if (E.evaluate([...hero, ...board]) >= E.evaluate([...vil, ...board])) continue;
      const o = E.outs(hero, vil, board).length;
      if (o < 3 || o > 21) continue;
      const opts = [...new Set([o, o + 2, o - 2, o + 4].filter((x) => x > 0))].slice(0, 4).sort((a, b) => a - b);
      const left = 52 - 4 - n;
      return {
        type: 'outs', title: n === 3 ? 'Outs au flop' : 'Outs au turn',
        prompt: `Tu es derrière. Combien de cartes te font passer devant à la ${n === 3 ? 'turn' : 'river'} ? (Les cartes de l'adversaire sont connues.)`,
        cards: hero, board, vil, opts: opts.map(String), ok: opts.indexOf(o),
        why: `${o} outs sur ${left} cartes inconnues : ${pct(o / left)} à la prochaine carte` + (n === 3 ? `, ${pct(1 - ((left - o) * (left - o - 1)) / (left * (left - 1)))} d'ici la river si tu vois les deux cartes.` : '.') + ' Règle du 2 et 4 : ' + (o * 2) + ' % ' + (n === 3 ? 'puis ' + (o * 4) + ' %.' : '.'),
      };
    }
    return odds(r);
  }

  // Meilleure main : 3 mains, un board, qui gagne ?
  function meilleure(r) {
    const board = deal(5, r), hands = [deal(2, r, board)];
    hands.push(deal(2, r, [...board, ...hands[0]])); hands.push(deal(2, r, [...board, ...hands[0], ...hands[1]]));
    const vals = hands.map((h) => E.evaluate([...h, ...board])), best = Math.max(...vals);
    const win = vals.map((v, i) => (v === best ? i : -1)).filter((i) => i >= 0);
    const opts = ['Joueur 1', 'Joueur 2', 'Joueur 3', 'Partage'];
    return {
      type: 'meilleure', title: 'Meilleure main', prompt: 'Qui gagne le pot à l\'abattage ?',
      board, hands, opts, ok: win.length > 1 ? 3 : win[0],
      why: vals.map((v, i) => `Joueur ${i + 1} : ${E.categoryName(v)}`).join(' · ') + (win.length > 1 ? ' → égalité exacte, partage.' : ` → le joueur ${win[0] + 1} gagne.`),
    };
  }

  function situation(r, cat) {
    const pool = Course.SITUATIONS.filter((s) => !cat || s.cat === cat), s = pick(pool, r);
    return { type: 'situations', title: 'Situation · ' + s.cat, prompt: s.q, opts: s.opts, ok: s.ok, why: s.why, sid: s.id };
  }


  // MDF, équité requise, part de bluffs : formules du module Élite « Défense minimale ».
  const fmtp = (x) => (Math.round(x * 1000) / 10).toString().replace('.', ',') + ' %';
  // Trois options triées dont la bonne réponse occupe une position tirée au hasard. Distracteurs : erreurs de formule
  // typiques (bad) en priorité, complétées par des valeurs voisines. gap = écart minimal, step = pas des valeurs voisines.
  function place(r, good, bad, gap, step, min = 0, max = Infinity) {
    const R = gap >= 1 ? Math.round : (x) => x;
    const k = (r() * 3) | 0, lo = [], hi = [];
    const ok = (x, arr) => x >= min && x <= max && Math.abs(x - good) >= gap && arr.every((y) => Math.abs(y - x) >= gap);
    for (const b of bad.slice().sort(() => r() - 0.5)) { if (b < good && lo.length < k && ok(b, lo)) lo.push(b); else if (b > good && hi.length < 2 - k && ok(b, hi)) hi.push(b); }
    for (let i = 1; lo.length < k && i < 40; i++) { const x = R(good - step * (i + r())); if (ok(x, lo)) lo.push(x); }
    for (let i = 1; hi.length < 3 - lo.length - 1 && i < 60; i++) { const x = R(good + step * (i + r())); if (ok(x, hi)) hi.push(x); } // borne basse atteinte : on complète vers le haut
    const vals = [...lo, good, ...hi].sort((a, b) => a - b);
    return { vals, ok: vals.indexOf(good) };
  }
  const threeOpts = (r, good, bad) => { const p = place(r, good, bad, 0.02, 0.06, 0.01, 0.99); return { opts: p.vals.map(fmtp), ok: p.ok }; };
  function mdf(r) {
    const P = pick([20, 30, 40, 50, 60, 80, 100, 120, 150, 200], r), f = pick([0.25, 0.33, 0.5, 0.66, 0.75, 1, 1.5, 2], r), B = Math.round(P * f);
    const alpha = B / (P + B), md = P / (P + B), need = B / (P + 2 * B), kind = pick(['need', 'mdf', 'bluff', 'ratio'], r);
    const head = `River. Pot de <strong>${P} bb</strong>, mise de <strong>${B} bb</strong> (${Math.round(B / P * 100)} % du pot).`;
    if (kind === 'ratio') {
      const v = pick([6, 8, 9, 10, 12, 14, 15, 18, 20], r), bl = Math.round(v * need / (1 - need));
      const pl = place(r, bl, [Math.round(v * alpha / (1 - alpha)), Math.round(v / 2), v], 1, 1, 0);
      return { type: 'mdf', title: 'Construire une range de mise river', prompt: `${head} Tu as <strong>${v} combos de valeur</strong> dans ta range de mise. Combien de bluffs pour être équilibré ?`, opts: pl.vals.map((x) => String(Math.round(x))), ok: pl.ok,
        why: `Part de bluffs à l'équilibre = B ÷ (P + 2B) = ${B} ÷ ${P + 2 * B} = ${fmtp(need)}. Bluffs = valeur × part ÷ (1 − part) = ${v} × ${fmtp(need)} ÷ ${fmtp(1 - need)} ≈ ${bl}.` };
    }
    const lowWrong = B / (2 * (P + B)); // erreur fréquente : diviser la mise par le pot total puis par deux
    const q = { need: ['Équité requise pour payer ?', need, r() < 0.5 ? [alpha, lowWrong] : [alpha, B / (P + 3 * B)], `B ÷ (P + 2B) = ${B} ÷ ${P + 2 * B} = ${fmtp(need)}.`],
      mdf: ['Défense minimale (MDF) de ta range ?', md, [alpha, 1 - need], `P ÷ (P + B) = ${P} ÷ ${P + B} = ${fmtp(md)}.`],
      bluff: ['Part de bluffs d\'une range de mise équilibrée ?', need, r() < 0.5 ? [alpha, lowWrong] : [alpha, B / (P + 3 * B)], `À la river, la part de bluffs équilibrée égale l'équité requise du défenseur : B ÷ (P + 2B) = ${fmtp(need)}.`] }[kind];
    const o = threeOpts(r, q[1], q[2]);
    return { type: 'mdf', title: 'MDF et cotes', prompt: `${head} ${q[0]}`, opts: o.opts, ok: o.ok, why: q[3] };
  }

  // Combos et bloqueurs : compter les combinaisons d'une main en tenant compte du board et de tes cartes.
  function combos(r) {
    for (let k = 0; k < 60; k++) {
      const board = deal(3, r), hero = deal(2, r, board), dead = [...board, ...hero];
      const pool = [...board, ...hero].map((c) => c >> 2);
      const a = pick(pool, r), b = r() < 0.35 ? a : pick([...pool, (r() * 13) | 0], r);
      const hi = Math.max(a, b), lo = Math.min(a, b);
      const suited = hi !== lo && r() < 0.25;
      const h = E.RANKS[hi] + E.RANKS[lo] + (hi === lo ? '' : suited ? 's' : '');
      const all = hi === lo ? E.combos(h) : suited ? E.combos(h) : E.combos(h + 's').concat(E.combos(h + 'o'));
      const n = all.filter(([x, y]) => !dead.includes(x) && !dead.includes(y)).length;
      const nb = all.filter(([x, y]) => !board.includes(x) && !board.includes(y)).length;
      const full = all.length;
      if (n === nb && n === full) continue; // aucun effet de carte : peu instructif
      const pl = place(r, n, [nb, full], 1, 1, 0), cand = pl.vals.map((x) => Math.round(x));
      const label = hi === lo ? `de paire de ${E.RANKS[hi].replace('T', '10')} (${h})` : `de ${h}${suited ? '' : ' (assorties et dépareillées)'}`;
      return { type: 'combos', title: 'Compter les combos', prompt: `Board <strong>${board.map(E.cardStr).join(' ')}</strong>. Tu tiens <strong>${hero.map(E.cardStr).join(' ')}</strong>. Combien de combos ${label} ton adversaire peut-il avoir ?`,
        cards: hero, board, opts: cand.map(String), ok: pl.ok,
        why: `${full} combos au départ, ${nb} après les cartes du board, ${n} après tes propres cartes. ${hi === lo ? 'Paire : cartes restantes du rang, prises deux à deux (4 → 6, 3 → 3, 2 → 1).' : suited ? 'Assortie : une combinaison par couleur où les deux cartes sont encore disponibles.' : 'Non appariée : cartes restantes du premier rang × cartes restantes du second.'}` };
    }
    return mdf(r);
  }

  // PKO : prime ajoutée au pot pour un call à tapis contre un joueur couvert.
  function bounty(r) {
    const S0 = 10000, bb = pick([100, 200, 300, 400], r), shove = bb * pick([6, 8, 10, 12, 15], r);
    const stage = pick([[0.25, 'début de tournoi'], [0.3, 'milieu de tournoi'], [0.4, 'fin de tournoi']], r);
    const mult = pick([1, 1, 1.5, 2], r), prime = Math.round(S0 * stage[0] * mult / 50) * 50;
    const dead = Math.round(bb * 1.5 + bb), call = shove - bb, need = call / (call + shove + dead + prime), needNo = call / (call + shove + dead);
    const o = threeOpts(r, need, [needNo, call / (call + shove + dead + 2 * prime)]);
    return { type: 'bounty', title: 'PKO : la prime dans les cotes',
      prompt: `PKO, tapis de départ ${S0.toLocaleString('fr-FR')}, ${stage[1]}. Blindes ${bb / 2}/${bb} avec ante de grosse blinde (${bb}). Le bouton pousse <strong>${shove.toLocaleString('fr-FR')}</strong> ; tu es BB et tu le couvres. Sa prime encaissable vaut environ <strong>${prime.toLocaleString('fr-FR')} jetons</strong>${mult > 1 ? ' (sa prime a grossi)' : ''}. Équité requise pour payer ?`,
      opts: o.opts, ok: o.ok,
      why: `Ne compte que la part encaissée de la prime, pas la prime entière. À payer : ${call.toLocaleString('fr-FR')}. À gagner : son tapis ${shove.toLocaleString('fr-FR')} + blindes et ante ${dead.toLocaleString('fr-FR')} + prime ${prime.toLocaleString('fr-FR')}. Équité requise = ${call.toLocaleString('fr-FR')} ÷ ${(call + shove + dead + prime).toLocaleString('fr-FR')} = ${fmtp(need)} (sans la prime : ${fmtp(needNo)}).` };
  }

  const GEN = { rfi, vsopen, odds, tirage, pushfold, outs: outsSpot, meilleure, situations: situation, mdf, combos, bounty };
  // Mix : favorise les types les moins réussis (stats = { type: { ok, n } }).
  function mix(r, stats = {}) {
    const types = Object.keys(GEN), w = types.map((t) => { const s = stats[t] || { ok: 0, n: 0 }; return 1.5 - (s.ok + 1) / (s.n + 2); });
    let x = r() * w.reduce((a, b) => a + b, 0);
    for (let i = 0; i < types.length; i++) { x -= w[i]; if (x <= 0) return GEN[types[i]](r); }
    return GEN[types[0]](r);
  }

  const api = { TYPES, GEN, mix, villainRange, exactVsRange, drawKind };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.Spots = api;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>// Analyse de board : comment une range touche un board (main faite + tirages), combinaison par combinaison.
(function (root) {
  const E = root.Engine || require('./engine.js');
  const MADE = ['Quinte flush', 'Carré', 'Full', 'Couleur', 'Suite', 'Brelan (set)', 'Brelan (trips)', 'Double paire', 'Overpair', 'Top paire', 'Paire moyenne', 'Petite paire', 'Rien'];
  const DRAWS = ['Tirage couleur', 'Suite deux bouts', 'Ventrale', 'Deux overcards'];
  const hasStraight = (m) => { for (let hi = 12; hi >= 4; hi--) if (((m >> (hi - 4)) & 31) === 31) return true; return (m & 0b1000000001111) === 0b1000000001111; };

  // Catégorie précise d'une main sur un board (3 à 5 cartes), du point de vue des cartes privées.
  function classify(hole, board) {
    const v = E.evaluate([...hole, ...board]), cat = E.category(v), br = board.map((c) => c >> 2), hr = hole.map((c) => c >> 2);
    const top = Math.max(...br), sorted = [...new Set(br)].sort((a, b) => b - a);
    let made;
    if (cat === 8) made = 0; else if (cat === 7) made = 1; else if (cat === 6) made = 2; else if (cat === 5) made = 3; else if (cat === 4) made = 4;
    else {
      const pocket = hr[0] === hr[1], hits = [...new Set(hr.filter((r) => br.includes(r)))];
      const pairClass = (r) => (pocket && r === hr[0] && !br.includes(r)) ? (r > top ? 8 : r > sorted[sorted.length - 1] ? 10 : 11) : r === top ? 9 : r === sorted[1] ? 10 : 11;
      if (cat === 3) made = pocket && br.includes(hr[0]) ? 5 : hits.length ? 6 : 12;
      else if (cat === 2 && !pocket && hits.length === 2) made = 7;
      else if (pocket && !br.includes(hr[0])) made = pairClass(hr[0]); // paire servie, éventuelle paire du board partagée
      else if (hits.length === 1) made = pairClass(hits[0]);
      else made = 12; // seul le board fait la main
    }
    const draws = [];
    if (board.length < 5 && made > 3) {
      for (let s = 0; s < 4; s++) if ([...hole, ...board].filter((c) => (c & 3) === s).length === 4 && hole.some((c) => (c & 3) === s)) draws.push(0);
      if (made > 4) {
        const m = [...hole, ...board].reduce((a, c) => a | (1 << (c >> 2)), 0), bm = board.reduce((a, c) => a | (1 << (c >> 2)), 0);
        let outs = 0; for (let r = 0; r < 13; r++) if (!(m & (1 << r)) && hasStraight(m | (1 << r)) && !hasStraight(bm | (1 << r))) outs++;
        if (outs >= 2) draws.push(1); else if (outs === 1) draws.push(2);
      }
      if (made === 12 && hr[0] > top && hr[1] > top) draws.push(3);
    }
    return { made, draws };
  }

  // Répartition d'une range (Set de mains abstraites) sur un board. Retourne combos par catégorie et la liste des mains.
  function analyze(range, board, dead = []) {
    const combos = E.rangeCombos(range, [...board, ...dead]);
    const made = new Array(MADE.length).fill(0), draws = new Array(DRAWS.length).fill(0), byMade = MADE.map(() => new Map());
    let comboDraw = 0;
    for (const c of combos) {
      const k = classify(c, board); made[k.made]++;
      const h = E.abstractOf(c[0], c[1]); byMade[k.made].set(h, (byMade[k.made].get(h) || 0) + 1);
      if (k.draws.length) comboDraw++; k.draws.forEach((d) => draws[d]++);
    }
    return { total: combos.length, made, draws, comboDraw, byMade };
  }

  // Texture : description factuelle d'un flop.
  function texture(board) {
    const suits = board.slice(0, 3).map((c) => c & 3), ranks = board.slice(0, 3).map((c) => c >> 2).sort((a, b) => b - a);
    const ns = new Set(suits).size, paired = new Set(ranks).size < 3, span = ranks[0] - ranks[2];
    const tags = [ns === 1 ? 'monocolore' : ns === 2 ? 'deux couleurs' : 'arc-en-ciel'];
    if (paired) tags.push('pairé');
    if (!paired && span <= 4) tags.push('connecté'); else if (!paired && span >= 8) tags.push('sec');
    if (ranks[0] >= 9) tags.push('haut (' + E.RANKS[ranks[0]] + ')'); else tags.push('bas');
    return tags;
  }

  // Distribution d'équité : équité de chaque combinaison d'une range contre l'autre range, sur un board donné.
  function equityDistribution(rangeA, rangeB, board, opts = {}) {
    const R = opts.random || Math.random, it = opts.iterations || 250, maxN = opts.max || 140;
    const ca = E.rangeCombos(rangeA, board), cb = E.rangeCombos(rangeB, board);
    const sample = (arr) => { if (arr.length <= maxN) return arr; const out = [], step = arr.length / maxN; for (let k = 0; k < maxN; k++) out.push(arr[Math.floor(k * step)]); return out; };
    const side = (mine, theirs) => sample(mine).map((c) => {
      const opp = theirs.filter((x) => x[0] !== c[0] && x[0] !== c[1] && x[1] !== c[0] && x[1] !== c[1]);
      return opp.length ? E.equity([{ hand: c }, { combos: opp }], board, { iterations: it, random: R }).equity[0] : 0.5;
    }).sort((x, y) => y - x);
    const a = side(ca, cb), b = side(cb, ca), avg = (v) => v.reduce((x, y) => x + y, 0) / (v.length || 1);
    const nuts = (v) => v.filter((x) => x > 0.8).length / (v.length || 1);
    return { a, b, avgA: avg(a), avgB: avg(b), nutsA: nuts(a), nutsB: nuts(b), nA: ca.length, nB: cb.length };
  }

  const api = { MADE, DRAWS, classify, analyze, texture, equityDistribution };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.Board = api;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>// Import d'historiques de mains (Winamax, PokerStars) : parsing, statistiques, fuites préflop, EV des all-in, profils adversaires.
// Uniquement des mains que tu as jouées, analysées après la session.
(function (root) {
  const E = root.Engine || require('./engine.js');
  const Charts = root.Charts || require('./charts.js');

  const num = (s) => +String(s).replace(/[€$£\s]|EUR|USD/g, '').replace(/,(?=\d{3}\b)/g, '').replace(',', '.');
  const AMT = '[€$£]?[\\d.,]+[€$£]?';
  const ACT = new RegExp(`^(.+?):? (folds|checks|calls|bets|raises)(?: (${AMT}))?(?: to (${AMT}))?(.*all-in.*)?$`);

  function split(text) {
    return text.replace(/\r/g, '').replace(/^﻿/, '').split(/\n(?=(?:Winamax Poker|PokerStars (?:Hand|Zoom Hand|Game)) )/).map((s) => s.trim()).filter((s) => /^(Winamax Poker|PokerStars)/.test(s));
  }

  function parseHand(txt) {
    const L = txt.split('\n').map((l) => l.trim()).filter(Boolean);
    const site = /^Winamax/.test(L[0]) ? 'Winamax' : 'PokerStars';
    const h = { site, raw: txt, id: (L[0].match(/(?:HandId: #|Hand #)([\w-]+)/) || [])[1] || '', tournament: /Tournament|Tournoi/i.test(L[0]),
      seats: [], button: 0, hero: null, heroCards: null, actions: [], board: [], shown: {}, collected: {}, returned: {}, posts: {}, rake: 0, sb: 0, bb: 0 };
    const bl = [...L[0].matchAll(/\(([^()]*\/[^()]*)\)/g)].pop();
    if (bl) { const p = bl[1].split('/').map(num).filter((x) => !isNaN(x)); h.bb = p[p.length - 1]; h.sb = p[p.length - 2]; }
    const date = L[0].match(/(\d{4})[/-](\d{2})[/-](\d{2})/); h.date = date ? `${date[1]}-${date[2]}-${date[3]}` : '';
    const btn = txt.match(/Seat #(\d+) is the button/); h.button = btn ? +btn[1] : 0;
    let street = 'pre', summary = false;
    for (const l of L.slice(1)) {
      if (/^\*\*\* SUMMARY/.test(l)) { summary = true; continue; }
      const st = l.match(/^\*\*\* (PRE-FLOP|HOLE CARDS|FLOP|TURN|RIVER|SHOW ?DOWN)/);
      if (st) {
        street = { 'PRE-FLOP': 'pre', 'HOLE CARDS': 'pre', FLOP: 'flop', TURN: 'turn', RIVER: 'river' }[st[1]] || 'sd';
        const cards = [...l.matchAll(/\[([^\]]+)\]/g)].map((m) => m[1]).join(' ');
        if (street !== 'pre' && street !== 'sd') h.board = E.parseCards(cards);
        continue;
      }
      if (summary) { const tp = l.match(/Rake (\S+)/); if (tp) h.rake = num(tp[1]); continue; }
      let m;
      if ((m = l.match(/^Seat (\d+): (.+?) \((?:[€$£]?)([\d.,]+)[€$£]?(?: in chips)?[^)]*\)( is sitting out| out of hand)?/)) && street === 'pre' && !h.actions.length) {
        if (num(m[3]) > 0 && !m[4]) h.seats.push({ seat: +m[1], name: m[2], stack: num(m[3]) }); continue;
      }
      if ((m = l.match(/^Dealt to (.+?) \[([^\]]+)\]/))) { if (!h.hero) { h.hero = m[1]; h.heroCards = E.parseCards(m[2]); } continue; }
      if ((m = l.match(/^(.+?):? posts (small blind|big blind|ante|the ante|small & big blinds) (\S+)/))) {
        const kind = /small &/.test(m[2]) ? 'both' : /small/.test(m[2]) ? 'sb' : /big/.test(m[2]) ? 'bb' : 'ante';
        h.actions.push({ street: 'pre', p: m[1], type: 'post', kind, amt: num(m[3]) }); continue;
      }
      if ((m = l.match(/^Uncalled bet \((\S+)\) returned to (.+)$/))) { h.returned[m[2]] = (h.returned[m[2]] || 0) + num(m[1]); continue; }
      if ((m = l.match(/^(.+?) collected (\S+) from (?:side |main )?pot/))) { h.collected[m[1]] = (h.collected[m[1]] || 0) + num(m[2]); continue; }
      if ((m = l.match(/^(.+?):? shows \[([^\]]+)\]/))) { h.shown[m[1]] = E.parseCards(m[2]); continue; }
      if ((m = l.match(ACT))) {
        h.actions.push({ street, p: m[1], type: m[2], amt: m[3] ? num(m[3]) : 0, to: m[4] ? num(m[4]) : 0, allin: !!m[5] });
      }
    }

  }

  // Positions : ordre de parole à partir du joueur qui suit le bouton.
  function positions(h) {
    const seats = h.seats.slice().sort((a, b) => a.seat - b.seat), n = seats.length, pos = {};
    if (n < 2) return pos;
    const sbP = h.actions.find((a) => a.type === 'post' && a.kind === 'sb')?.p, bbP = h.actions.find((a) => a.type === 'post' && a.kind === 'bb')?.p;
    let bi = seats.findIndex((s) => s.seat >= h.button); if (bi < 0) bi = 0; if (seats[bi].seat !== h.button) bi = (bi - 1 + n) % n;
    const order = []; for (let k = 1; k <= n; k++) order.push(seats[(bi + k) % n].name); // SB en premier normalement, bouton en dernier
    if (n === 2) { pos[order[1]] = 'BTN'; pos[order[0]] = 'BB'; if (sbP) pos[sbP] = 'BTN'; if (bbP) pos[bbP] = 'BB'; return pos; }
    const rest = order.filter((p) => p !== sbP && p !== bbP);
    if (sbP) pos[sbP] = 'SB'; if (bbP) pos[bbP] = 'BB';
    const tail = ['BTN', 'CO', 'HJ', 'LJ', 'UTG+2', 'UTG+1', 'UTG'];
    rest.reverse().forEach((p, k) => { pos[p] = k < tail.length - 1 ? tail[k] : 'UTG'; });
    if (rest.length && pos[rest[rest.length - 1]] !== 'BTN') pos[rest[rest.length - 1]] = rest.length >= 4 ? 'UTG' : pos[rest[rest.length - 1]];

  function analyzeHand(h) {
    const players = h.seats.map((s) => s.name), put = {}, facts = {};
    players.forEach((p) => { put[p] = 0; facts[p] = { vpip: false, pfr: false, threeOpp: false, three: false, sawFlop: false, folded: false, aggr: 0, calls: 0, sd: false, won: false, cbetOpp: false, cbet: false, ftcOpp: false, ftc: false }; });

    for (const a of h.actions) {
      if (!(a.p in put)) continue;
      if (a.street !== cur) { cur = a.street; streetPut = {}; }

      if (a.type === 'post') { put[a.p] += a.amt; if (a.kind !== 'ante') streetPut[a.p] = (streetPut[a.p] || 0) + (a.kind === 'both' ? a.amt : a.amt); continue; }
      if (cur === 'pre') {
        if (a.p === h.hero && !heroActed) { heroActed = true; if (!voluntary) firstIn = { pos: pos[a.p], action: a.type }; }
        if (raises === 1 && a.type !== 'post') { f.threeOpp = true; if (a.type === 'raises') f.three = true; }
        if (a.type === 'calls' || a.type === 'raises' || a.type === 'bets') { f.vpip = true; voluntary = true; }
        if (a.type === 'raises' || a.type === 'bets') { f.pfr = true; raises++; }
      } else {
        if (a.type === 'bets' || a.type === 'raises') f.aggr++;
        if (a.type === 'calls') f.calls++;
      }

      else if (this.street === 'turn') { this.street = 'river'; deal(1); this.lines.push(`*** RIVER *** [${this.board.slice(0, 4).map(E.cardStr).join(' ')}] [${E.cardStr(this.board[4])}]`); }

    // Décision d'un bot. Les quatre profils d'origine gardent exactement leur logique ; les styles ajoutent des paramètres

          if (pct < pr.vpip && (kind === 'station' || pr.loose || pct < pr.pfr * (pr.flat ?? 1.3))) return this.act(L.canCheck ? 'check' : 'call');

<script>// Coach de la table d'entraînement : avant chaque décision du héros, estime la range de chaque adversaire
// (profil + actions de la main), calcule l'équité contre ces ranges, compare aux cotes et recommande une action.
// La table est un simulateur : cette aide n'existe que là, jamais pendant une vraie partie.
(function (root) {
  const E = root.Engine || require('./engine.js');
  const C = root.Charts || require('./charts.js');
  const B = root.Board || require('./board.js');
  const TS = root.TableSim || require('./table.js');
  const SV = root.Solver || require('./solver.js');

  const CATS = {
    rfi: 'Ouvertures (premier à entrer)', iso: 'Isolation des limpers', pfdef: 'Face aux relances préflop',
    odds: 'Calls et folds selon les cotes', value: 'Value bets', nobluff: 'Pas de bluff contre les fish', bluff: 'Bluffs ciblés',
    pushfold: 'Tapis ou couché',
  };
  const STREET_N = { flop: 3, turn: 4, river: 5 };
  const pctOf = (h) => TS.preflopPct()[E.ALL169.indexOf(h)];
  const fmtP = (x) => (x * 100).toFixed(1).replace('.', ',') + ' %';

  // Intervalle de percentile préflop [lo, hi[ joué par un bot selon son profil, son action et le nombre de relances devant lui.
  // Reprend exactement la logique de décision des bots (table.js).
