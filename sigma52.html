  VIEWS.solveur = () => head('Solveur', 'Calcule l\'équilibre (GTO) d\'un spot à deux joueurs après le flop : quelle action, à quelle fréquence, avec quelle main. Outil d\'étude hors table : l\'utiliser pendant une main en cours est de l\'aide en temps réel, interdite par toutes les rooms.') +
    `<div class="subtabs" role="tablist">${SUBS.map(([k, l]) => `<button class="chip" aria-pressed="${sv.sub === k}" data-act="svsub" data-s="${k}">${l}</button>`).join('')}</div>` +
    (sv.sub === 'solve' ? solveHTML() : sv.sub === 'train' ? X.trainerHTML() : helpHTML());
  ACT.svsub = (t) => { sv.sub = t.dataset.s; render(); };

  function rangeStat(txt) {
    try { const h = Array.isArray(txt) ? txt : PF.parseWeighted(txt); const w = h.reduce((a, x) => a + x[2], 0); return `${fr(w, w % 1 ? 1 : 0)} combos · ${fr(w / 1326 * 100, 1)} %`; } catch (e) { return `<span style="color:var(--bad)">${esc(e.message)}</span>`; }
  }
  function solveHTML() {
    const sc = SCEN.find((s) => s.id === sv.scen), g = sv.game;
    const scOpts = ['Pot simple', 'Pot 3-bet'].map((t) => `<optgroup label="${t}">${SCEN.filter((s) => s.type === t).map((s) => `<option value="${s.id}"${s.id === sv.scen ? ' selected' : ''}>${esc(s.label)}</option>`).join('')}</optgroup>`).join('') + `<option value="custom"${!sc ? ' selected' : ''}>Personnalisé / main importée</option>`;
    const sizeRows = ST.map((st) => `<tr><th>${st}</th>${[0, 1].map((p) => `<td><input class="mono" data-svsz="${st}.${p}.bet" value="${esc(sv.sizes[st][p].bet)}" aria-label="Mises ${st} ${sv.names[p]}" placeholder="aucune"></td><td><input class="mono" data-svsz="${st}.${p}.raise" value="${esc(sv.sizes[st][p].raise)}" aria-label="Relances ${st} ${sv.names[p]}" placeholder="aucune"></td>`).join('')}</tr>`).join('');
    const setup = `<section class="panel">
      <div class="form">
        <label class="f" style="grid-column:1/-1">Scénario préflop<select data-svf="scen">${scOpts}</select></label>
        <label class="f">Board (flop, turn ou river)<input data-svf="board" value="${esc(sv.board)}" spellcheck="false" autocomplete="off" placeholder="Ks7d2c"></label>
        <label class="f">Pot au début de la rue (bb)<input data-svf="pot" inputmode="decimal" value="${esc(sv.pot)}"></label>
        <label class="f">Tapis effectif restant (bb)<input data-svf="stack" inputmode="decimal" value="${esc(sv.stack)}"></label>
        <label class="f">Ta main (facultatif)<input data-svf="hero" value="${esc(sv.hero)}" placeholder="AhKd" spellcheck="false" autocomplete="off"></label>
      </div>
      <div class="row"><button class="btn small" data-act="svrand" data-n="3">Flop au hasard</button><button class="btn small" data-act="svrand" data-n="4">Turn au hasard</button><button class="btn small" data-act="svrand" data-n="5">River au hasard</button></div>
      ${[0, 1].map((p) => `<label class="f">Range ${p ? 'IP (parle en dernier)' : 'OOP (parle en premier)'} · ${esc(sv.names[p])} · <span class="mono">${rangeStat(sv.r[p])}</span>
        <textarea class="mono" rows="${sv.r[p].length > 400 ? 5 : 2}" data-svr="${p}" spellcheck="false" style="font-size:13px">${esc(sv.r[p])}</textarea></label>
        <div class="row"><button class="btn small" data-act="svpaint" data-p="${p}" aria-pressed="${sv.paint === p}">${sv.paint === p ? 'Fermer la grille' : 'Modifier sur la grille'}</button><span class="note">Poids : <span class="mono">KK:0.5</span> ou <span class="mono">AKs:25%</span> ; combos exacts : <span class="mono">AhKh</span></span></div>
        ${sv.paint === p ? painterHTML(p) : ''}`).join('')}
      ${sv.note ? `<p class="note" style="color:var(--warn)">${esc(sv.note)}</p>` : ''}
      <div class="row"><span class="note">Tailles :</span>${Object.entries(PRESETS).map(([k, v]) => `<button class="chip" aria-pressed="${sv.preset === k}" data-act="svpreset" data-v="${k}" title="${v.note}">${v.label}</button>`).join('')}<button class="btn small" data-act="svsizes">${sv.showSizes ? 'Masquer le détail' : 'Détail des tailles'}</button></div>
      ${sv.showSizes ? `<div class="tw"><table class="t sizes"><thead><tr><th>Rue</th><th>Mises ${esc(sv.names[0])}</th><th>Relances ${esc(sv.names[0])}</th><th>Mises ${esc(sv.names[1])}</th><th>Relances ${esc(sv.names[1])}</th></tr></thead><tbody>${sizeRows}</tbody></table></div>
        ${E.parseCards(sv.board).length === 3 ? '<p class="note">Solve depuis le flop : turn et river réduits à une mise de 75 % sans relance pour tenir dans le navigateur. Pour le détail d\'un turn, résous le flop puis « Re-résoudre exactement d\'ici ».</p>' : ''}
        <p class="note">En % du pot, séparées par des espaces ; <span class="mono">a</span> = tapis. Une relance de 60 % = relancer de 60 % du pot après avoir payé. Relances maximum par rue : <input class="mono" data-svf="maxRaises" value="${sv.maxRaises}" style="width:3em" aria-label="Relances maximum par rue">. Une mise qui engage plus de 67 % du tapis restant devient un tapis.</p>` : ''}
      <div class="row"><span class="note">Précision :</span>${Object.entries(ACC).map(([k, v]) => `<button class="chip" aria-pressed="${sv.acc === k}" data-act="svacc" data-v="${k}">${v.label}</button>`).join('')}</div>
      ${E.parseCards(sv.board).length === 3 ? `<div class="row"><span class="note">Tirages du flop :</span>${Object.entries(SAMPLES).map(([k, v]) => `<button class="chip" aria-pressed="${sv.sample === k}" data-act="svsample" data-v="${k}">${v.label}</button>`).join('')}</div>` : ''}
      <p class="note" id="svest">${estimateText()}</p>
      ${sv.err ? `<p class="pill bad" style="white-space:normal">${esc(sv.err)}</p>` : ''}
      <div class="row">${sv.running ? '<button class="btn" data-act="svstop">Arrêter et voir le résultat</button>' : '<button class="btn primary" data-act="svgo">Résoudre</button>'}${g && !sv.running ? '<button class="btn small" data-act="svreset">Nouveau spot</button>' : ''}</div>
    </section>`;
    const prog = g ? `<section class="panel" id="svprog">${progressHTML()}</section>` : '';
    return (g && !sv.running && sv.info ? resultHTML() + prog + `<details class="panel"${sv.setupOpen ? ' open' : ''}><summary data-act="svsetup"><strong>Modifier le spot</strong></summary>${setup}</details>` : setup + prog);
  }

  // Peintre de range sur la grille 13 × 13 (poids par classe de mains).
  function classWeights(p) {
    let h = []; try { h = PF.parseWeighted(sv.r[p]); } catch (e) { /* range illisible : grille vide */ }
    const m = new Map(); for (const [a, b, w] of h) { const k = E.abstractOf(a, b), x = m.get(k) || [0, 0]; x[0] += w; x[1]++; m.set(k, x); }
    const out = new Map(); for (const [k, [s]] of m) out.set(k, s / E.combos(k).length); return out;
  }
  function painterHTML(p) {
    const w = classWeights(p);
    return `<div class="painter"><div class="row"><span class="note">Pinceau :</span>${[1, 0.75, 0.5, 0.25, 0].map((b) => `<button class="chip" aria-pressed="${sv.brush === b}" data-act="svbrush" data-v="${b}">${b ? Math.round(b * 100) + ' %' : 'Gomme'}</button>`).join('')}<button class="btn small" data-act="svclear" data-p="${p}">Vider</button></div>
      ${grid169((h) => { const f = w.get(h) || 0; return `<button class="rc${f ? ' on' : ''}" data-act="svcell" data-p="${p}" data-h="${h}" ${f && f < 1 ? `style="background:color-mix(in srgb, var(--accent) ${Math.round(30 + 70 * f)}%, var(--sunk))"` : ''} title="${h} : ${Math.round(f * 100)} %">${h}</button>`; })}</div>`;
  }
  function setClassWeight(p, h, wt) {
    const w = classWeights(p); if (wt > 0) w.set(h, wt); else w.delete(h);
    const toks = []; for (const k of E.ALL169) if (w.has(k)) { const x = w.get(k); toks.push(x >= 0.999 ? k : `${k}:${+x.toFixed(3)}`); }
    sv.r[p] = toks.join(', ');
  }

  // ---------------- Résultats ----------------
  const nm = (p) => esc(sv.names[p]);
  function crumbs() {
    const g = sv.game; let node = g.root; const out = [`<button class="chip" data-act="svpath" data-k="0">${cardsHTML(g.board.slice(0, 3), true).replace('class="cards"', 'class="cards mini"')}${g.board.length > 3 ? ' ' + g.board.slice(3).map((c) => cardHTML(c, true)).join('') : ''}</button>`];
    sv.path.forEach((x, i) => {
      let txt;
      if (node.t === PF.ACT) { txt = `${nm(node.p)} : ${esc(g.label(node, x))}`; node = node.ch[x]; }
      else if (node.t === PF.CHANCE) { txt = `${node.board.length === 3 ? 'Turn' : 'River'} ${cardHTML(x, true)}`; node = node.ch[node.cards.indexOf(x)]; }
      out.push(`<button class="chip" data-act="svpath" data-k="${i + 1}">${txt}</button>`);
    });
    return `<div class="crumbs">${out.join('<span aria-hidden="true">›</span>')}</div>`;
  }
  function resultHTML() {
    const g = sv.game, r = sv.info, node = r.node, st = g.stats();
    const approx = st.approx ? `<p class="note" style="color:var(--warn)">Flop approché : turns et rivers échantillonnés (${SAMPLES[sv.sample].turn} × ${SAMPLES[sv.sample].river}). Les fréquences du flop sont une bonne indication ; pour un turn ou une river précis, utilise « Re-résoudre exactement d'ici ».</p>` : '';
    const top = `<section class="panel"><div class="row" style="justify-content:space-between"><span class="eyebrow">${r.board.length === 3 ? 'Flop' : r.board.length === 4 ? 'Turn' : 'River'} · pot ${fr(r.pot, 1)} bb · tapis ${fr(g.S - Math.max(r.C[0], r.C[1]), 1)} bb</span><span class="note mono">exploitabilité ${sv.ex ? fr(sv.ex.pct, 2) : '?'} % du pot</span></div>
      ${crumbs()}
      <div class="felt"><div class="row" style="justify-content:center;gap:16px">${cardsHTML(r.board)}</div>
      <div class="stats svs">${[0, 1].map((p) => `<div class="stat${node.t === PF.ACT && node.p === p ? ' hero' : ''}"><span>${nm(p)} · ${p ? 'IP' : 'OOP'}</span><b>${isFinite(r.eqMean[p]) ? pct(r.eqMean[p], 1) : '–'}</b><span>équité · EV ${isFinite(r.evMean[p]) ? fr(r.evMean[p], 2) + ' bb' : '–'}</span></div>`).join('')}</div></div>${approx}</section>`;
    let body = '';
    if (node.t === PF.ACT) body = actHTML(r);
    else if (node.t === PF.CHANCE) body = chanceHTML(node);
    else body = `<section class="panel"><h2>${node.t === PF.FOLD ? `${nm(1 - node.winner)} se couche : ${nm(node.winner)} remporte le pot` : 'Abattage'}</h2><p>Fin de la branche. Pot final ${fr(r.pot, 1)} bb. Reviens en arrière avec le fil d'Ariane.</p></section>`;
    return top + body;
  }
  function chanceHTML(node) {
    const g = sv.game, full = node.cards.length === 52 - node.board.length;
    const cell = (c) => `<button class="cardpick" data-act="svcard" data-c="${c}" aria-label="${E.cardStr(c)}">${cardHTML(c, true)}</button>`;
    const bySuit = [3, 2, 1, 0].map((s) => node.cards.filter((c) => (c & 3) === s).sort((a, b) => b - a));
    return `<section class="panel"><h2>Choisis la ${node.board.length === 3 ? 'turn' : 'river'}</h2>${full ? '' : `<p class="note">Solve approché : seules ${node.cards.length} cartes ont été calculées (échantillon représentatif de rangs et de couleurs).</p>`}
      ${bySuit.map((l) => l.length ? `<div class="cards picks">${l.map(cell).join('')}</div>` : '').join('')}
      ${g.cfg.include ? `<p class="note">Carte réelle de la main : ${g.cfg.include.filter((c) => node.cards.includes(c)).map((c) => cardHTML(c, true)).join(' ')}</p>` : ''}</section>`;
  }
  function actHTML(r) {
    const g = sv.game, node = r.node, p = node.p, n = g.N[p], A = node.acts.length, cls = actClasses(node), hands = g.hands[p], reach = r.reach[p];
    // Agrégat par classe de mains.
    const agg = new Map();
    for (let i = 0; i < n; i++) {
      const h = E.abstractOf(hands[i][0], hands[i][1]); let x = agg.get(h); if (!x) agg.set(h, x = { m: 0, f: new Array(A).fill(0), eq: 0, ev: 0, n: 0 });
      x.n++; const w = reach[i]; if (w <= 0) continue; x.m += w;
      for (let a = 0; a < A; a++) x.f[a] += w * r.strategy[a * n + i];
      if (isFinite(r.eq[p][i])) x.eq += w * r.eq[p][i]; if (isFinite(r.ev[p][i])) x.ev += w * r.ev[p][i];
    }
    const totalMass = reach.reduce((a, b) => a + b, 0);
    let evMin = Infinity, evMax = -Infinity; for (const x of agg.values()) if (x.m > 0) { const v = x.ev / x.m; evMin = Math.min(evMin, v); evMax = Math.max(evMax, v); }
    const cellHTML = (h) => {
      const x = agg.get(h), on = x && x.m > 1e-9, full = E.combos(h).length;
      if (!on) return `<button class="rc sv off" data-act="svhand" data-h="${h}" disabled>${h}</button>`;
      let bg, light = false;
      if (sv.view === 'strat') bg = grad(node.acts.map((_, a) => [cls[a], x.f[a] / x.m]));
      else if (sv.view === 'eq') { const v = x.eq / x.m; bg = `color-mix(in srgb, var(--act-x) ${Math.round(v * 100)}%, var(--act-f))`; }
      else { const v = (x.ev / x.m - evMin) / Math.max(1e-9, evMax - evMin); bg = `color-mix(in srgb, var(--accent) ${Math.round(15 + v * 85)}%, var(--sunk))`; light = v < 0.45; }
      const op = Math.max(0.35, Math.min(1, x.m / full));
      return `<button class="rc sv${sv.cell === h ? ' sel' : ''}${light ? ' lt' : ''}" data-act="svhand" data-h="${h}" style="background:${bg};opacity:${op.toFixed(2)}" title="${h}">${h}</button>`;
    };
    const freqBar = `<div class="sbar">${node.acts.map((_, a) => r.freq[a] > 0.001 ? `<i style="width:${(r.freq[a] * 100).toFixed(2)}%;background:var(--act-${cls[a]})"></i>` : '').join('')}</div>`;
    const btns = node.acts.map((_, a) => `<button class="btn actb" data-act="svact" data-a="${a}"><i class="sw" style="background:var(--act-${cls[a]})"></i>${esc(g.label(node, a))} <span class="mono">${pct(r.freq[a], 1)}</span></button>`).join('');
    const resolve = node.board.length > g.board.length && node.bets[0] === 0 && node.bets[1] === 0 && node.p === 0 && (g.stats().approx || node.board.length === 5 && g.board.length === 4)
      ? `<button class="btn" data-act="svresolve">Re-résoudre exactement d'ici</button>` : '';
    return `<section class="panel"><div class="row" style="justify-content:space-between"><h2>${nm(p)} parle · ${fr(totalMass, 1)} combos</h2>${resolve}</div>
      ${freqBar}<div class="row actrow">${btns}</div>
      <div class="row"><span class="note">Grille :</span>${[['strat', 'Stratégie'], ['eq', 'Équité'], ['ev', 'EV']].map(([k, l]) => `<button class="chip" aria-pressed="${sv.view === k}" data-act="svview" data-v="${k}">${l}</button>`).join('')}</div>
      <div class="svgrid">${grid169(cellHTML)}</div>
      <p class="note">Couleur = mélange d'actions de la classe de mains, pondéré par les combos encore présents ; une case pâle = peu de combos de cette main arrivent ici. Clique une case pour le détail par combo.</p>
      ${sv.cell ? comboHTML(r, sv.cell) : ''}</section>
      ${heroHTML(r)}${categoryHTML(r)}`;
  }
  const evTxt = (v) => (isFinite(v) ? fr(v, 2) + ' bb' : '–');
  function comboHTML(r, h) {
    const g = sv.game, node = r.node, p = node.p, n = g.N[p], cls = actClasses(node), rows = [];
    g.hands[p].forEach(([a, b], i) => {
      if (E.abstractOf(a, b) !== h || r.reach[p][i] <= 1e-9) return;
      const best = Math.max(...r.actEv.map((v) => v[i]));
      rows.push(`<tr><td>${cardHTML(a, true)}${cardHTML(b, true)}</td><td class="n mono">${fr(r.reach[p][i], 2)}</td><td class="n mono">${isFinite(r.eq[p][i]) ? pct(r.eq[p][i], 1) : '–'}</td><td class="n mono">${evTxt(r.ev[p][i])}</td>
        ${node.acts.map((_, ai) => { const f = r.strategy[ai * n + i], v = r.actEv[ai][i]; return `<td class="n"><span class="mini-sw" style="background:var(--act-${cls[ai]})"></span><span class="mono">${pct(f, 0)}</span><br><span class="note mono${Math.abs(v - best) < 1e-6 ? ' bestev' : ''}">${evTxt(v)}</span></td>`; }).join('')}</tr>`);
    });
    return `<div class="tw"><table class="t combos"><thead><tr><th>Combo ${esc(h)}</th><th class="n">Poids</th><th class="n">Équité</th><th class="n">EV</th>${node.acts.map((_, a) => `<th class="n">${esc(g.label(node, a))}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>
      <p class="note">Sous chaque fréquence : l'EV de l'action (en bb, part du pot récupérée moins ce que tu remets). Une main qui mélange deux actions a des EV presque égales : les deux sont correctes.</p>`;
  }
  function heroHTML(r) {
    const hc = sv.heroCombo, g = sv.game; if (!hc) return '';
    const key = (a, b) => (a > b ? a * 52 + b : b * 52 + a), k = key(hc[0], hc[1]);
    const node = r.node, out = [];
    for (let p = 0; p < 2; p++) {
      const i = g.hands[p].findIndex(([a, b]) => key(a, b) === k); if (i < 0) continue;
      if (r.reach[p][i] <= 1e-9) { out.push(`<p>${cardHTML(hc[0], true)}${cardHTML(hc[1], true)} n'arrive pas à ce nœud dans la stratégie d'équilibre de ${nm(p)} (le solveur l'a jouée autrement avant, ou une carte du board la bloque).</p>`); continue; }
      let line = `<p>${cardHTML(hc[0], true)}${cardHTML(hc[1], true)} chez ${nm(p)} : équité ${pct(r.eq[p][i], 1)}, EV ${evTxt(r.ev[p][i])}.</p>`;
      if (node.t === PF.ACT && node.p === p) {
        const n = g.N[p], fr_ = node.acts.map((_, a) => r.strategy[a * n + i]), evs = r.actEv.map((v) => v[i]), best = Math.max(...evs), bi = evs.indexOf(best);
        const main = node.acts.map((_, a) => a).filter((a) => fr_[a] >= 0.05).sort((a, b) => fr_[b] - fr_[a]);
        line += `<div class="advice">${node.acts.map((_, a) => `<div class="${a === bi ? 'good' : best - evs[a] > 0.05 * r.pot ? 'bad' : 'warn'}"><strong>${esc(g.label(node, a))}</strong> · fréquence ${pct(fr_[a], 0)} · EV ${evTxt(evs[a])}${a === bi ? ' · meilleure EV' : ` · perte ${fr(best - evs[a], 2)} bb (${pct((best - evs[a]) / r.pot, 1)} du pot)`}</div>`).join('')}</div>
          <p>${main.length > 1 ? `Main mixte : le solveur alterne ${main.map((a) => esc(g.label(node, a).toLowerCase())).join(' et ')}. Les EV sont proches, les deux sont acceptables ; contre un adversaire réel, choisis celle qui exploite sa faiblesse.` : `Action pure : ${esc(g.label(node, main[0] ?? bi).toLowerCase())}.`}</p>`;
      }
      out.push(line);
    }
    return out.length ? `<section class="panel"><h2>Ta main</h2>${out.join('')}</section>` : `<section class="panel"><h2>Ta main</h2><p>${cardHTML(hc[0], true)}${cardHTML(hc[1], true)} n'est dans aucune des deux ranges (ou est bloquée par le board). Ajoute-la à ta range pour l'étudier.</p></section>`;
  }
  // Rapport par catégorie de main (main faite + tirage).
  function categoryHTML(r) {
    const g = sv.game, node = r.node, p = node.p, n = g.N[p], A = node.acts.length, cls = actClasses(node), cats = new Map();
    let tot = 0;
    g.hands[p].forEach(([a, b], i) => {
      const w = r.reach[p][i]; if (w <= 1e-9) return;
      const c = B.classify([a, b], node.board), name = B.MADE[c.made] + (c.draws.length && c.made >= 7 ? ' + tirage' : '');
      let x = cats.get(name); if (!x) cats.set(name, x = { m: 0, f: new Array(A).fill(0), eq: 0, order: c.made * 2 + (c.draws.length ? 0 : 1) });
      x.m += w; tot += w; for (let k = 0; k < A; k++) x.f[k] += w * r.strategy[k * n + i]; if (isFinite(r.eq[p][i])) x.eq += w * r.eq[p][i];
    });
    const rows = [...cats].sort((a, b) => a[1].order - b[1].order).map(([name, x]) => `<tr><td>${esc(name)}</td><td class="n mono">${pct(x.m / tot, 1)}</td><td class="n mono">${pct(x.eq / x.m, 0)}</td><td style="min-width:140px"><div class="sbar small">${x.f.map((f, k) => f / x.m > 0.001 ? `<i style="width:${(f / x.m * 100).toFixed(2)}%;background:var(--act-${cls[k]})" title="${esc(g.label(node, k))} ${pct(f / x.m, 0)}"></i>` : '').join('')}</div></td></tr>`).join('');
    return `<section class="panel"><h2>Stratégie par catégorie de main</h2><div class="tw"><table class="t"><thead><tr><th>Catégorie</th><th class="n">Part</th><th class="n">Équité</th><th>Actions</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="legend">${node.acts.map((_, a) => `<span><i style="background:var(--act-${cls[a]})"></i>${esc(g.label(node, a))}</span>`).join('')}</div></section>`;
  }

  // ---------------- Actions ----------------
  ACT.svgo = () => { sv.target = sv.pendingTarget || null; sv.pendingTarget = null; start(); };
  ACT.svstop = () => { sv.running = false; if (sv.game) { sv.ex = sv.game.exploitability(); finish(); } };
  ACT.svsetup = (t, e) => { e.preventDefault(); sv.setupOpen = !sv.setupOpen; render(); };
  ACT.svreset = () => { sv.game = null; sv.info = null; sv.path = []; sv.target = null; render(); };
  ACT.svpath = (t) => { sv.path = sv.path.slice(0, +t.dataset.k); sv.cell = null; refreshInfo(); render(); };
  ACT.svact = (t) => { sv.path.push(+t.dataset.a); sv.cell = null; refreshInfo(); render(); };
  ACT.svcard = (t) => { sv.path.push(+t.dataset.c); sv.cell = null; refreshInfo(); render(); };

  // ---------------- Retravailler une main du replayer ----------------

      else { const y2 = y === oop || y === ip ? y : (raises[1].p); rng[y2] = 'TT+, AQ+, A5s-A4s, KQs'; rng[y2 === oop ? ip : oop] = 'JJ-77, AQs-ATs, KQs, QJs, JTs, AQo'; desc = 'pot 3-bet (squeeze ou caller)'; }
    } else { const last = raises[raises.length - 1].p; rng[last] = 'QQ+, AKs, AKo, A5s'; rng[last === oop ? ip : oop] = 'QQ-JJ, AKs, AKo, AQs'; desc = 'pot 4-bet'; }
    const lastR = raises.length ? raises[raises.length - 1].p : null, agg = lastR === oop ? 0 : 1;
    // Tailles réelles converties en % du pot pour qu'elles existent dans l'arbre.
    const extra = { flop: [{ bet: [], raise: [] }, { bet: [], raise: [] }], turn: [{ bet: [], raise: [] }, { bet: [], raise: [] }], river: [{ bet: [], raise: [] }, { bet: [], raise: [] }] };
    const seq = [];

    return `<section class="panel prose"><h2>Ce que fait le solveur</h2>
      <p>Il cherche l'<strong>équilibre de Nash</strong> d'un spot à deux joueurs : une paire de stratégies où aucun des deux ne gagne à changer seul. Algorithme : <em>Discounted CFR</em> (Brown et Sandholm, 2019), le même principe que PioSolver, GTO+ ou GTO Wizard. À chaque itération, chaque combo augmente la fréquence des actions qui auraient rapporté plus ; la moyenne des stratégies converge vers l'équilibre.</p>

      <h2>Exact ou approché</h2>

      const rows = B.MADE.map((l, k) => [l, a.made[k], b.made[k]]).filter((x) => x[1]).map(([l, x, y]) => `<tr><td>${l}</td><td class="n mono">${x}</td><td class="n mono">${y}</td><td class="n mono">${y - x ? (y - x) : '·'}</td><td class="n mono">${pct(y / b.total, 1)}</td></tr>`).join('');
      const drows = B.DRAWS.map((l, k) => [l, a.draws[k], b.draws[k]]).filter((x) => x[1]).map(([l, x, y]) => `<tr><td>${l}</td><td class="n mono">${x}</td><td class="n mono">${y}</td><td class="n mono">${y - x ? (y - x) : '·'}</td><td class="n mono">${pct(y / b.total, 1)}</td></tr>`).join('');
      out = `<div class="felt"><div class="row" style="justify-content:center;gap:16px">${cardsHTML(board)}<span>Ta main</span>${cardsHTML(hero, true)}</div></div>
        <div class="stats"><div class="stat hero"><span>Combos adverses</span><b>${b.total}</b><span>${a.total} sans tes cartes (${a.total - b.total} bloqués)</span></div></div>
        <div class="tw"><table class="t"><thead><tr><th>Catégorie</th><th class="n">Sans tes cartes</th><th class="n">Avec</th><th class="n">Écart</th><th class="n">Part</th></tr></thead><tbody>${rows}</tbody></table></div>
        ${drows ? `<h3>Tirages</h3><div class="tw"><table class="t"><thead><tr><th>Tirage</th><th class="n">Sans</th><th class="n">Avec</th><th class="n">Écart</th><th class="n">Part</th></tr></thead><tbody>${drows}</tbody></table></div>` : ''}
        <p class="note">Bon bluff : tes cartes retirent des combos qui paient (paires, mains faites) et laissent ceux qui couchent (tirages ratés, rien). Bon bluff-catcher : l'inverse, elles retirent de la valeur et laissent les bluffs.</p>`;
    } catch (e) { out = `<p class="pill bad" style="white-space:normal">${esc(e.message)}</p>`; }
    return `<section class="panel"><p class="note">Effet de tes deux cartes sur la range adverse : combos retirés par catégorie. Module Élite « Combinatoire et bloqueurs ».</p>
      <div class="form"><label class="f" style="grid-column:1/-1">Range adverse<input data-bq="range" value="${esc(bq.range)}" spellcheck="false"></label><label class="f">Board<input data-bq="board" value="${esc(bq.board)}" spellcheck="false"></label><label class="f">Ta main<input data-bq="hero" value="${esc(bq.hero)}" spellcheck="false"></label></div></section>
      <section class="panel">${out}</section>`;
  };

  // ---------------- PKO ----------------
  const pk = { S0: '10000', share: '50', field: '50', mult: '1', bb: '200', shove: '2800', range: '22+, A2s+, K5s+, Q8s+, J8s+, T8s+, 98s, A7o+, KTo+, QJo' };
  ONCHANGE.push((t) => { if (t.dataset.pk) { pk[t.dataset.pk] = t.value; render(); return true; } });
  ACT.pkcell = (t) => { const d = $('#pkdetail'); if (d) d.textContent = t.title; };
  TOOLVIEWS.pko = () => {
    const S0 = num(pk.S0), share = num(pk.share) / 100, f = Math.max(0.001, Math.min(1, num(pk.field) / 100)), m = num(pk.mult), bb = num(pk.bb), shove = num(pk.shove);
    const prime = S0 * share / (1 + Math.sqrt(f)) * m; // modèle pratique : 25 % du tapis de départ au début (part prime 50 %), tend vers 50 %
    const dead = bb * 0.5 + bb, call = Math.max(0, shove - bb), need = call / (call + shove + dead + prime), needNo = call / (call + shove + dead);
    let grid = '', err = '';
    try {
      const set = E.parseRange(pk.range), fq = SV.setToFreq(set);
      const eq = E.ALL169.map((h, i) => SV.eqVsRange(i, fq));
      const nCall = (th) => E.ALL169.reduce((a, h, i) => a + (eq[i] >= th ? E.combos(h).length : 0), 0) / 1326 * 100;
      grid = `<div class="stats"><div class="stat hero"><span>Range de call avec la prime</span><b>${fr(nCall(need), 0)} %</b><span>des mains (équité ≥ ${pct(need, 1)})</span></div><div class="stat"><span>Sans la prime</span><b>${fr(nCall(needNo), 0)} %</b><span>équité ≥ ${pct(needNo, 1)}</span></div></div>
        ${grid169((h, i) => { const e = eq[i], c = e >= needNo ? 'var(--act-x)' : e >= need ? 'var(--act-b2)' : ''; return `<button class="rc${c ? ' sv' : ''}" data-act="pkcell" title="${h} : ${pct(e, 1)} d'équité contre sa range" ${c ? `style="background:${c}"` : ''}>${h}</button>`; })}
        <div class="legend"><span><i style="background:var(--act-x)"></i>Call même sans prime</span><span><i style="background:var(--act-b2)"></i>Call grâce à la prime</span></div><p class="note" id="pkdetail">Touche une case pour voir son équité.</p>`;
    } catch (e) { err = e.message; }
    return `<section class="panel"><p class="note">Valeur en jetons de la prime encaissée immédiatement (modèle pratique publié par PokerListings : environ 25 % du tapis de départ en début de PKO standard, jusqu'à 50 % en fin de tournoi), puis équité requise pour payer un tapis d'un joueur que tu couvres. Module Élite « Tournois avancés ».</p>
      <div class="form"><label class="f">Tapis de départ<input data-pk="S0" value="${esc(pk.S0)}" inputmode="numeric"></label><label class="f">Part du buy-in en primes (%)<input data-pk="share" value="${esc(pk.share)}" inputmode="numeric"></label>
      <label class="f">Joueurs restants (% du champ)<input data-pk="field" value="${esc(pk.field)}" inputmode="decimal"></label><label class="f">Sa prime ÷ prime moyenne<input data-pk="mult" value="${esc(pk.mult)}" inputmode="decimal"></label>
      <label class="f">Grosse blinde (ante de BB égale)<input data-pk="bb" value="${esc(pk.bb)}" inputmode="numeric"></label><label class="f">Son tapis poussé<input data-pk="shove" value="${esc(pk.shove)}" inputmode="numeric"></label>
      <label class="f" style="grid-column:1/-1">Sa range de tapis<input data-pk="range" value="${esc(pk.range)}" spellcheck="false"></label></div></section>
      <section class="panel"><div class="stats"><div class="stat hero"><span>Prime encaissable</span><b>${fr(prime, 0)}</b><span>jetons (${fr(prime / S0 * 100, 1)} % du tapis de départ)</span></div>
        <div class="stat"><span>Équité requise avec prime</span><b>${pct(need, 1)}</b><span>${fr(call, 0)} à payer</span></div><div class="stat"><span>Sans prime</span><b>${pct(needNo, 1)}</b><span>calcul en jetons classique</span></div></div>
        ${err ? `<p class="pill bad">${esc(err)}</p>` : grid}<p class="note">Tu es en grosse blinde et tu couvres le tapis adverse. Calcul en jetons : sur la bulle ou en table finale, ajoute la prime de risque ICM.</p></section>`;
  };
  // ---------------- Omaha (PLO) ----------------
  const om = { h: ['AsAhKsKh', 'JdTd9c8c', '', ''], board: '', res: null, pot: '10', call: '0' };
  ONCHANGE.push((t) => { if (t.dataset.om !== undefined) { const k = t.dataset.om; if (k === 'board' || k === 'pot' || k === 'call') om[k] = t.value; else om.h[+k] = t.value; om.res = null; render(); return true; } });
  ACT.omrun = () => {
    try {
      const hands = om.h.map((x) => x.trim()).filter((x, i) => x || i < 2).map((x) => (x === '' || /^(\?|x|aléatoire|random)$/i.test(x) ? null : E.parseCards(x)));
      const board = E.parseCards(om.board);
      if (hands.some((h) => h && h.length !== 4)) throw new Error('Chaque main d\'Omaha fait 4 cartes (ou laisse vide pour une main aléatoire).');
      if (![0, 3, 4, 5].includes(board.length)) throw new Error('Le board fait 0, 3, 4 ou 5 cartes.');
      const all = [...board, ...hands.flat().filter((c) => c !== null && c !== undefined)];
      if (new Set(all).size !== all.length) throw new Error('Une carte apparaît deux fois.');
      const t0 = performance.now(), r = window.Omaha.equity(hands, board, { iterations: 8000 });

    render();

  ACT.omex = (t) => { const ex = { a: ['AsAhKsKh', 'JdTd9c8c', '', '', ''], b: ['AsAd7c2h', 'JhTh9c8c', '', '', ''], c: ['KsKd4c2h', 'AhQh8c3s', '', '', 'Kh7h2s'], d: ['AsKsJhTh', '', '', '', ''] }[t.dataset.v]; om.h = ex.slice(0, 4); om.board = ex[4]; ACT.omrun(); };
  const omHand = (h) => `<span class="omh mono">${h.map((c) => { const k = E.cardStr(c); return `<b>${k[0] === 'T' ? '10' : k[0]}</b><i class="su-${k[1]}">${E.SUIT_SYM[k[1]]}</i>`; }).join('')}</span>`;

    else if (r) out = `${r.board.length ? `<div class="felt"><div class="row" style="justify-content:center">${cardsHTML(r.board)}</div></div>` : ''}<div class="tw"><table class="t"><thead><tr><th>Main</th><th>Profil</th><th class="n">Équité</th><th class="n">Gagne</th><th class="n">Partage</th></tr></thead><tbody>${r.hands.map((h, i) => `<tr><td>${h ? omHand(h) : '<span class="note">aléatoire</span>'}</td><td class="note">${h ? esc(O.describe(h).tags.join(', ')) : ''}</td><td class="n mono"><b>${pct(r.r.equity[i], 1)}</b></td><td class="n mono">${pct(r.r.win[i], 1)}</td><td class="n mono">${pct(r.r.tie[i], 1)}</td></tr>`).join('')}</tbody></table></div>

    return `<section class="panel"><h2>Équité Omaha (PLO)</h2>
      <div class="form">${om.h.map((x, i) => `<label class="f">Main ${i + 1}${i > 1 ? ' (facultatif)' : ''}<input data-om="${i}" value="${esc(x)}" spellcheck="false" placeholder="${i < 2 ? 'vide = aléatoire' : 'vide = absent'}"></label>`).join('')}<label class="f">Board (0, 3, 4 ou 5 cartes)<input data-om="board" value="${esc(om.board)}" spellcheck="false"></label></div>

      <section class="panel"><h2>Relance maximale (pot-limit)</h2><div class="form"><label class="f">Pot (mises de la rue comprises)<input inputmode="decimal" data-om="pot" value="${esc(om.pot)}"></label><label class="f">À payer<input inputmode="decimal" data-om="call" value="${esc(om.call)}"></label></div>

  // Valeurs exactes (combinatoire) ou mesurées sur 200 000 tirages par le moteur SIGMA 52 (marquées ≈).
  const PROBAS = [
    ['Préflop', [['Recevoir une paire', '5,9 %', '3 ÷ 51'], ['Recevoir une paire donnée (ex. AA)', '0,45 %', '1 fois sur 221'], ['Recevoir deux cartes assorties', '23,5 %', '12 ÷ 51'], ['Recevoir AK (assorti ou non)', '1,2 %', '16 ÷ 1 326'], ['Tu as KK : un adversaire précis a AA', '0,49 %', '6 ÷ 1 225 ; ≈ 3,9 % qu\'un des 8 adversaires l\'ait']]],

  ACT.golivprep = () => { if (X.liveState) X.liveState.sub = 'prep'; X.go('live'); };
})();

<script>// Entraîneur solveur : décisions river tirées de mains complètes (flop et turn joués selon l'équilibre, ranges qui en découlent),
// résolues à la volée par le solveur exact de river, notées en perte d'EV.
(function () {
  const X = window.__S52, PF = window.Postflop, TS = window.TrainerSpots;
  const { E, $, esc, fr, pct, state, Store, render, cardHTML, cardsHTML, ACT } = X;
  const tr = { spot: null, si: -1, g: null, path: [], node: null, info: null, p: 0, hi: -1, ans: null, busy: false, err: '' };
  const SIZES = { river: [{ bet: [33, 75, 125], raise: ['a'] }, { bet: [33, 75, 125], raise: ['a'] }] };
  const pickW = (items, w) => { let t = w.reduce((a, b) => a + b, 0), x = Math.random() * t; for (let i = 0; i < items.length; i++) { x -= w[i]; if (x <= 0) return items[i]; } return items[items.length - 1]; };

  function newSpot() {
    if (!TS || !TS.SPOTS.length) { tr.err = 'Aucun spot disponible.'; render(); return; }
    let si; do si = Math.floor(Math.random() * TS.SPOTS.length); while (TS.SPOTS.length > 1 && si === tr.si);
    tr.si = si; tr.spot = TS.SPOTS[si]; tr.ans = null; tr.busy = true; tr.err = ''; render();
    const sp = tr.spot;
    setTimeout(() => {
      try {
        tr.g = PF.create({ board: sp.board, pot: sp.pot, stack: sp.stack, ranges: [TS.decode(sp.r[0]), TS.decode(sp.r[1])], sizes: SIZES, maxRaises: 1 });
        let ex = 100; for (let k = 0; k < 30 && ex > 0.3; k++) { tr.g.iterate(20); ex = tr.g.exploitability().pct; }
        choose(); tr.busy = false; render();
      } catch (e) { tr.busy = false; tr.err = e.message; render(); }
    }, 20);
  }
  // Choisit un nœud de décision (premier à parler, après check, face à une mise) puis un combo instructif de la range qui y arrive.
  function choose() {
    const g = tr.g; let path = [];
    const depth = pickW([0, 1, 2], [0.4, 0.35, 0.25]);
    for (let d = 0; d < depth; d++) {
      const r = g.info(path), node = r.node; if (node.t !== PF.ACT) break;
      const ok = node.acts.map((_, i) => i).filter((i) => node.acts[i].k !== 'f' && node.acts[i].k !== 'c');
      if (!ok.length) break;
      const nx = pickW(ok, ok.map((i) => r.freq[i] + 0.02));
      const child = node.ch[nx]; if (child.t !== PF.ACT) break;
      path = [...path, nx];
    }
    const info = g.info(path), node = info.node, p = node.p, n = g.N[p];
    // Combo : pondéré par la reach, avec un bonus pour les mains où les actions ont des EV éloignées.
    const idx = [], w = [];
    for (let i = 0; i < n; i++) {
      const m = info.reach[p][i]; if (m < 1e-4) continue;
      const evs = info.actEv.map((v) => v[i]).filter(isFinite), spread = Math.max(...evs) - Math.min(...evs);
      idx.push(i); w.push(m * (0.25 + Math.min(1, spread / (0.05 * info.pot))));
    }
    tr.path = path; tr.info = info; tr.node = node; tr.p = p; tr.hi = pickW(idx, w);
  }
  function answer(a) {
    const info = tr.info, node = tr.node, p = tr.p, i = tr.hi, n = tr.g.N[p];
    const evs = info.actEv.map((v) => v[i]), best = Math.max(...evs), loss = best - evs[a], lossPct = loss / info.pot;
    const freq = info.strategy[a * n + i];
    const grade = lossPct < 0.005 || freq >= 0.25 ? 'Meilleure' : lossPct < 0.02 ? 'Correcte' : lossPct < 0.06 ? 'Inexacte' : 'Erreur';
    tr.ans = { a, loss, lossPct, freq, grade, best: evs.indexOf(best) };
    const T = state.progress.trainer || (state.progress.trainer = { n: 0, ok: 0, loss: 0, hist: [] });
    T.n++; if (grade === 'Meilleure' || grade === 'Correcte') T.ok++; T.loss += lossPct;
    T.hist = [...(T.hist || []), Math.round(lossPct * 1000) / 1000].slice(-50);
    Store.save('progress'); render();
  }
  const nm = (p) => esc(tr.spot.names[p]);
  function lineText() {
    const g = tr.g; let node = g.root; const out = [];
    for (const x of tr.path) { out.push(`${nm(node.p)} ${esc(g.label(node, x).toLowerCase())}`); node = node.ch[x]; }
    return out.join(', ');
  }
  X.trainerHTML = () => {
    const T = state.progress.trainer || { n: 0, ok: 0, loss: 0, hist: [] };
    const stats = `<div class="stats"><div class="stat hero"><span>Décisions notées</span><b>${T.n}</b><span>${T.n ? pct(T.ok / T.n) + ' meilleures ou correctes' : 'pas encore de décision'}</span></div>
      <div class="stat"><span>Perte moyenne</span><b>${T.n ? fr(T.loss / T.n * 100, 2) + ' %' : '–'}</b><span>du pot par décision</span></div>
      <div class="stat"><span>50 dernières</span><b>${T.hist?.length ? fr(T.hist.reduce((a, b) => a + b, 0) / T.hist.length * 100, 2) + ' %' : '–'}</b><span>perte moyenne récente</span></div></div>`;
    const intro = `<section class="panel"><p>Des décisions de river tirées de mains complètes : le flop et le turn ont été joués selon l'équilibre, puis la river est résolue exactement. Choisis ton action ; la note dépend de la perte d'EV par rapport à la meilleure action, en % du pot.</p>
      <p class="note">${TS ? TS.SPOTS.length : 0} situations (pots simples et pots 3-bet, 6-max, 100 bb). Barème : meilleure (perte &lt; 0,5 % du pot ou action jouée ≥ 25 % par le solveur), correcte (&lt; 2 %), inexacte (&lt; 6 %), erreur au-delà.</p>
      <div class="row"><button class="btn primary" data-act="trnew" ${tr.busy ? 'disabled' : ''}>${tr.spot ? 'Spot suivant' : 'Commencer'}</button><span class="note">Touche Entrée pour le spot suivant</span></div>
      ${tr.err ? `<p class="pill bad" style="white-space:normal">${esc(tr.err)}</p>` : ''}</section>`;
    if (tr.busy) return stats + intro + '<section class="panel"><p>Calcul de l\'équilibre de la river…</p><div class="pbar"><i style="width:60%"></i></div></section>';
    if (!tr.spot || !tr.info) return stats + intro;
    const sp = tr.spot, g = tr.g, info = tr.info, node = tr.node, p = tr.p, i = tr.hi, n = g.N[p], hand = g.hands[p][i];
    const board = E.parseCards(sp.board);
    const head = `<section class="panel"><span class="eyebrow">${esc(sp.sc)} · tu es ${nm(p)} (${p ? 'en position' : 'hors de position'})</span>
      <p class="note">${esc(sp.line)} · River ${cardHTML(board[4], true)}${tr.path.length ? ' : ' + lineText() : ''}</p>
      <div class="felt"><div class="row" style="justify-content:center;gap:16px">${cardsHTML(board)}</div>
      <div class="row" style="justify-content:center;gap:18px"><span>Ta main</span>${cardsHTML(hand.slice(0, 2))}<span class="mono">Pot ${fr(info.pot, 1)} bb · tapis ${fr(g.S - Math.max(node.C[0], node.C[1]), 1)} bb</span></div></div>
      <div class="row">${node.acts.map((_, a) => `<button class="btn${tr.ans && tr.ans.a === a ? ' primary' : ''}" data-act="trans" data-a="${a}" ${tr.ans ? 'disabled' : ''}>${esc(g.label(node, a))}</button>`).join('')}</div>`;
    if (!tr.ans) return stats + intro + head + '</section>';
    const A = tr.ans, evs = info.actEv.map((v) => v[i]);
    const cls = A.grade === 'Meilleure' ? 'good' : A.grade === 'Correcte' ? 'good' : 'bad';
    const res = `<div class="verdict ${cls}"><strong>${A.grade}.</strong> ${A.loss < 1e-6 ? 'Meilleure EV.' : `Perte ${fr(A.loss, 2)} bb, soit ${fr(A.lossPct * 100, 2)} % du pot.`}</div>
      <div class="advice">${node.acts.map((_, a) => `<div class="${a === A.best ? 'good' : evs[A.best] - evs[a] > 0.02 * info.pot ? 'bad' : 'warn'}"><strong>${esc(g.label(node, a))}</strong> · solveur ${pct(info.strategy[a * n + i], 0)} · EV ${fr(evs[a], 2)} bb</div>`).join('')}</div>
      <p class="note">Équité de ta main contre la range qui arrive ici : ${pct(info.eq[p][i], 1)}. Range adverse : ${fr(info.reach[1 - p].reduce((x, y) => x + y, 0), 1)} combos pondérés.</p>
      <div class="row"><button class="btn primary" data-act="trnew">Spot suivant</button><button class="btn" data-act="tropen">Explorer dans le solveur</button></div>`;
    return stats + intro + head + res + '</section>';
  };
  ACT.trnew = () => newSpot();
  ACT.trans = (t) => { if (!tr.ans) answer(+t.dataset.a); };
  ACT.tropen = () => {
    const sv = X.solverState, sp = tr.spot; if (!sv) return;
    sv.sub = 'solve'; sv.scen = 'custom'; sv.agg = sp.agg; sv.names = sp.names.slice(); sv.board = sp.board; sv.pot = sp.pot; sv.stack = sp.stack;
    sv.r = [PF.rangeText(TS.decode(sp.r[0])), PF.rangeText(TS.decode(sp.r[1]))];
    sv.sizes = { flop: [{ bet: '', raise: '' }, { bet: '', raise: '' }], turn: [{ bet: '', raise: '' }, { bet: '', raise: '' }], river: SIZES.river.map((x) => ({ bet: x.bet.join(' '), raise: x.raise.join(' ') })) };
    sv.sizesCustom = true; sv.maxRaises = 1; sv.include = null; sv.hero = tr.g.hands[tr.p][tr.hi].slice(0, 2).map(E.cardStr).join(''); sv.heroCombo = tr.g.hands[tr.p][tr.hi].slice(0, 2);
    sv.note = `Spot de l'entraîneur : ${sp.sc}. ${sp.line}.`;
    sv.game = tr.g; sv.running = false; sv.path = tr.path.slice(); sv.ex = tr.g.exploitability(); sv.info = tr.g.info(sv.path); sv.cell = null; sv.elapsed = 0;
    X.go('solveur');
  };
  X.ONKEY.push((e, tab) => {
    if (tab !== 'solveur' || X.solverState?.sub !== 'train') return;
    if (e.key === 'Enter' && !tr.busy && (tr.ans || !tr.spot)) { newSpot(); return true; }
    if (/^[1-5]$/.test(e.key) && tr.info && !tr.ans && +e.key <= tr.node.acts.length) { answer(+e.key - 1); return true; }
  });
})();
</script>

      <span class="eyebrow">${esc(st.level)}${st.format === 'hu' ? ' · tête-à-tête' : ''}</span><h3>${esc(st.name)}</h3><span class="note">Inspiré de ${esc(st.inspired)}</span>
      <span>${esc(st.tagline)}</span>${r ? `<span class="note mono">${r.hands} mains · ${sgn(r.bb, 0)} bb</span>` : ''}</button>`;
  }
  function statsTable(st) {
    if (!st.stats) return '';
    const S = st.stats;
    return `<div class="tw"><table class="t"><thead><tr><th>VPIP</th><th>PFR</th><th>3-bet</th><th>C-bet flop</th><th>Fold to c-bet</th></tr></thead><tbody><tr>${[S.vpip, S.pfr, S.three, S.cbet, S.ftc].map((v) => `<td class="mono">${v} %</td>`).join('')}</tr></tbody></table></div>
      <p class="note">Repères mesurés par SIGMA 52 sur 1 500 à 2 000 mains simulées${st.format === 'hu' ? ' en tête-à-tête' : ' à 6 joueurs'}. Le bot élargit ses ranges en tête-à-tête.</p>`;
  }
  function briefing(st) {
    const fmts = st.format === 'live' ? [['live', 'Table live, 200 bb']] : st.format === 'hu' ? [['hu', 'Tête-à-tête 100 bb']] : [['hu', 'Tête-à-tête 100 bb'], ['six', 'Table à 6 avec lui'], ['legends', 'Table des légendes (5 styles)']];
    if (!fmts.some(([k]) => k === ch.fmt)) ch.fmt = fmts[0][0];
    return `<section class="panel brief"><span class="eyebrow">Briefing · inspiré de ${esc(st.inspired)} (${esc(st.flag)})</span><h2>${esc(st.name)}</h2><p>${esc(st.tagline)}</p>
      <div class="grid2"><div><h3>Ce que disent les sources</h3><ul>${st.facts.map((f) => `<li>${esc(f)}</li>`).join('')}</ul><p class="note">Sources : ${srcLinks(st)}</p></div>
      <div><h3>Ce que fait ce bot</h3><ul>${st.traits.map((f) => `<li>${esc(f)}</li>`).join('')}</ul>${statsTable(st)}</div></div>
      <div class="warnbox"><strong>Comment t'adapter</strong><ul>${st.adapt.map((f) => `<li>${esc(f)}</li>`).join('')}</ul></div>
      <div class="row"><span class="note">Format :</span>${fmts.map(([k, l]) => `<button class="chip" aria-pressed="${ch.fmt === k}" data-act="chfmt" data-v="${k}">${l}</button>`).join('')}</div>
      <div class="row"><span class="note">Durée :</span>${[25, 50, 100].map((n) => `<button class="chip" aria-pressed="${ch.target === n}" data-act="chtarget" data-v="${n}">${n} mains</button>`).join('')}</div>
      <div class="row"><span class="note">Coach :</span>${[['exam', 'Examen (après la main)'], ['live', 'En direct'], ['free', 'Sans aide']].map(([k, l]) => `<button class="chip" aria-pressed="${ch.mode === k}" data-act="chmode" data-v="${k}">${l}</button>`).join('')}</div>
      <p class="note">Le coach estime les ranges de ces styles à partir du profil le plus proche : ses conseils sont plus approximatifs qu'aux tables normales. Le rapport de fin de session compare ce que tu as observé au style réel du bot.</p>
      <div class="row"><button class="btn primary" data-act="chplay">Jouer</button><button class="btn" data-act="openmod" data-id="styles">Module : affronter les grands styles</button></div></section>`;
  }
  function stylesHTML() {
    const st = styleOf(ch.sel);
    return `<div class="champs">${CH.STYLES.map(card).join('')}</div>${st ? briefing(st) : '<p class="note">Choisis un adversaire pour lire son briefing.</p>'}`;
  }
  ACT.chsel = (t) => { ch.sel = t.dataset.id; render(); setTimeout(() => $('.brief')?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 30); };
  ACT.chfmt = (t) => { ch.fmt = t.dataset.v; render(); };
  ACT.chtarget = (t) => { ch.target = +t.dataset.v; render(); };
  ACT.chmode = (t) => { ch.mode = t.dataset.v; render(); };
  ACT.chplay = () => {
    const st = styleOf(ch.sel); if (!st) return;
    const lineup = ch.fmt === 'legends' ? CH.LEGENDS.slice() : CH.lineupFor(st, ch.fmt === 'six' ? 'six' : 'hu');
    X.startCash({ lineup, stackBB: st.format === 'live' ? 200 : 100, mode: ch.mode, target: ch.target, objectives: [], champ: { id: st.id, profile: st.profile, legends: ch.fmt === 'legends' } });
  };

  // ---- Types de partie : profondeur, structure, composition de la table ----
  const fm = { id: 'cash100', arch: 'mix', mode: 'exam', target: 50 };
  const K = window.Course;
  function formatsHTML() {
    const F = CH.FORMATS.find((f) => f.id === fm.id) || CH.FORMATS[0], fixed = !!F.lineup, rec = state.progress.formats?.[F.id];
    const modBtn = (id) => { const m = K.MODULES.find((x) => x.id === id); return m ? `<button class="btn small" data-act="openmod" data-id="${id}">Module : ${esc(m.title)}</button>` : ''; };
    const arch = F.kind === 'mtt' ? CH.ARCH[fm.arch].slice(0, F.players - 1) : F.lineup || CH.ARCH[fm.arch];
    return `<div class="champs">${CH.FORMATS.map((f) => `<button class="champ${f.id === F.id ? ' on' : ''}" data-act="fmsel" data-id="${f.id}"><span class="eyebrow">${f.kind === 'mtt' ? 'Tournoi' : 'Cash'}</span><h3>${esc(f.name)}</h3><span>${esc(f.desc)}</span></button>`).join('')}</div>
      <section class="panel brief"><span class="eyebrow">${F.kind === 'mtt' ? `Tournoi · ${F.players} joueurs · ${fr(F.stack, 0)} jetons` : `Cash · ${F.stackBB} bb · recave automatique`}</span><h2>${esc(F.name)}</h2><p>${esc(F.desc)}</p>
      <div class="warnbox"><strong>Ce qui change</strong><ul>${F.keys.map((k) => `<li>${esc(k)}</li>`).join('')}</ul></div>
      ${fixed ? `<p class="note">Table imposée : ${arch.map((p) => esc(window.TableSim.PROFILES[p].label)).join(', ')}.</p>` : `<div class="row"><span class="note">Table :</span>${Object.keys(CH.ARCH).map((k) => `<button class="chip" aria-pressed="${fm.arch === k}" data-act="fmarch" data-v="${k}">${esc(CH.ARCH_LABEL[k])}</button>`).join('')}</div><p class="note">Adversaires : ${arch.map((p) => esc(window.TableSim.PROFILES[p].label)).join(', ')}.</p>`}
      ${F.kind === 'cash' ? `<div class="row"><span class="note">Durée :</span>${[25, 50, 100].map((n) => `<button class="chip" aria-pressed="${fm.target === n}" data-act="fmtarget" data-v="${n}">${n} mains</button>`).join('')}</div>` : ''}
      <div class="row"><span class="note">Coach :</span>${[['exam', 'Examen (après la main)'], ['live', 'En direct'], ['free', 'Sans aide']].map(([k, l]) => `<button class="chip" aria-pressed="${fm.mode === k}" data-act="fmmode" data-v="${k}">${l}</button>`).join('')}</div>

  ACT.fmsel = (t) => { fm.id = t.dataset.id; render(); };

  ACT.fmplay = () => {

      X.startTourney({ id: F.id, title: F.id === 'ft' ? 'la table finale' : F.id === 'expresso' ? 'l\'Expresso' : 'le Sit & Go', lineup, stack: F.stack, levels: F.levels.slice(F.start || 0), hpl: F.hpl, mode: fm.mode });

  };

  // ---- Défi mystère : identifier le style à partir de ce qu'on observe ----
  function mysteryHTML() {
    const m = prog().mystery;
    return `<section class="panel"><h2>Qui est en face ?</h2><p>Tu joues 60 mains en tête-à-tête contre un style tiré au hasard, nom caché, sans coach. À la fin, tu dis lequel c'était. C'est l'exercice de profilage qu'on fait à chaque nouvelle table : VPIP, agressivité, c-bet, réaction à tes mises.</p>
      <p class="note">${m.n ? `${m.ok} bonne${m.ok > 1 ? 's' : ''} identification${m.ok > 1 ? 's' : ''} sur ${m.n}.` : 'Pas encore de défi joué.'}</p>
      <div class="row"><button class="btn primary" data-act="chmyst">Lancer un défi</button></div></section>`;
  }
  ACT.chmyst = () => {
    const pool = CH.STYLES.filter((s) => s.profile), st = pool[Math.floor(Math.random() * pool.length)];
    ch.guess = null;
    X.startCash({ lineup: [st.profile], stackBB: 100, mode: 'free', target: 60, champ: { id: st.id, profile: st.profile, hidden: true } });
  };

  // ---- Classement ----
  function moneyHTML() {
    return `<section class="panel"><h2>Gains en tournois live : les 40 premiers</h2>
      <p class="note">Classement des gains bruts en tournois live (Hendon Mob), relevé fourni le 19/10/2026. Ce sont des gains, pas des bénéfices : les buy-ins (souvent 25 000 à 250 000 $ en high roller), les parts vendues à des investisseurs et les pertes en cash game ne sont pas déduits. Un gros total montre le volume joué à très haute limite, pas l'argent réellement gagné.</p>
      <div class="tw"><table class="t"><thead><tr><th class="n">#</th><th>Joueur</th><th>Pays</th><th class="n">Gains bruts</th><th>Style d'entraînement</th></tr></thead><tbody>
      ${CH.MONEY.map(([n, c, v], i) => { const sid = CH.STYLE_OF[n]; return `<tr><td class="n mono">${i + 1}</td><td>${esc(n)}</td><td>${esc(c)}</td><td class="n mono">${fr(v, 0)} $</td><td>${sid ? `<button class="btn small" data-act="chgo" data-id="${sid}">${esc(styleOf(sid).name)}</button>` : '<span class="note">—</span>'}</td></tr>`; }).join('')}</tbody></table></div>
      <p class="note">Seuls les joueurs dont le style est décrit publiquement (livres, cours, interviews) ont un style d'entraînement. Aucun profil n'est inventé pour les autres.</p></section>`;
  }
  X.champSelect = (id) => { ch.sub = 'styles'; ch.sel = id; };
  ACT.chgo = (t) => { ch.sub = 'styles'; ch.sel = t.dataset.id; render(); };

  // ---- Bandeau pendant la session et rapport de fin ----
  X.champBanner = (g) => {
    const c = g.champ, st = styleOf(c.id);
    if (c.hidden) return `<div class="warnbox"><strong>Défi mystère :</strong> observe ses ouvertures, ses 3-bets, ses c-bets et sa réaction à tes mises. Tu devras l'identifier à la fin.</div>`;
    if (c.legends) return `<details class="panel"><summary><strong>Table des légendes :</strong> cinq styles autour de toi. Rappels d'adaptation</summary>${CH.LEGENDS.map((id) => { const s = styleOf(id); return `<p><strong>${esc(s.name)}</strong> : ${esc(s.adapt[0])}</p>`; }).join('')}</details>`;
    return `<details class="panel"><summary><strong>Contre ${esc(st.name)}</strong> (inspiré de ${esc(st.inspired)}) · rappels</summary><ul>${st.adapt.map((a) => `<li>${esc(a)}</li>`).join('')}</ul></details>`;
  };
  function observed(g) {
    const a = HH.analyze(g.tb.history.join('\n\n')), out = {};
    for (const o of a.opponents) out[o.name] = { hands: o.hands, vpip: o.vpip / o.hands, pfr: o.pfr / o.hands, three: o.threeOpp ? o.three / o.threeOpp : null, cbet: o.cbetOpp ? o.cbet / o.cbetOpp : null, ftc: o.ftcOpp ? o.ftc / o.ftcOpp : null, n3: o.threeOpp, nc: o.cbetOpp, nf: o.ftcOpp, net: o.net };
    return out;
  }
  X.champReport = (g) => {
    const c = g.champ, t = g.tb, obs = observed(g), P = prog();
    if (!g.recorded) {
      g.recorded = true;
      const key = c.legends ? 'legends' : c.id, r = P.by[key] || (P.by[key] = { sessions: 0, hands: 0, bb: 0 });
      r.sessions++; r.hands += t.session.hands; r.bb += t.session.net; Store.save('progress');
    }
    const champs = t.players.filter((p, i) => i > 0 && TS.PROFILES[p.profile]?.like);
    const se = (p, n) => (n ? Math.sqrt(p * (1 - p) / n) : null);
    const rows = champs.map((p) => {
      const o = obs[p.name] || {}, st = CH.STYLES.find((s) => s.profile === p.profile), S = st?.stats;
      const cell = (v, n, ref) => (v === null || v === undefined ? '<td class="mono">–</td>' : `<td class="mono">${pct(v)}${n ? ` <span class="note">±${fr(2 * se(v, n) * 100, 0)}</span>` : ''}${ref !== undefined && !c.hidden ? `<br><span class="note">repère ${ref} %</span>` : ''}</td>`);
      return `<tr><td>${esc(c.hidden ? 'Mystère' : p.name)}</td><td class="mono">${o.hands || 0}</td>${cell(o.vpip, o.hands, S?.vpip)}${cell(o.pfr, o.hands, S?.pfr)}${cell(o.three, o.n3, S?.three)}${cell(o.cbet, o.nc, S?.cbet)}${cell(o.ftc, o.nf, S?.ftc)}</tr>`;
    }).join('');
    const ho = t.heroObs, foldRate = ho.faced ? ho.folds / ho.faced : null;
    const adaptive = champs.some((p) => TS.PROFILES[p.profile].adapt);
    let guess = '';
    if (c.hidden) {
      const st = styleOf(c.id);
      if (ch.guess === null) guess = `<h3>Alors, qui était-ce ?</h3><div class="row">${CH.STYLES.filter((s) => s.profile).map((s) => `<button class="btn" data-act="chguess" data-id="${s.id}">${esc(s.name)}</button>`).join('')}</div>`;
      else guess = `<div class="verdict ${ch.guess === c.id ? 'good' : 'bad'}"><b>${ch.guess === c.id ? 'Bien vu.' : 'Raté.'}</b><span>C'était ${esc(st.name)} (inspiré de ${esc(st.inspired)}). ${esc(st.tagline)}</span></div>`;
    }
    return `<section class="panel" style="border-color:var(--gold)"><span class="eyebrow">Rapport d'adaptation</span><h2>${c.hidden ? 'Profil observé' : 'Ce que tu as vu, comparé au style réel'}</h2>
      <div class="tw"><table class="t"><thead><tr><th>Adversaire</th><th>Mains</th><th>VPIP</th><th>PFR</th><th>3-bet</th><th>C-bet</th><th>Fold to c-bet</th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="note">± = intervalle approximatif à 95 % (deux erreurs types). Sur 50 mains, seules VPIP et PFR sont à peu près lisibles : c'est normal, et c'est la leçon.</p>
      ${foldRate !== null ? `<p>Face à ses mises après le flop, tu as couché <strong>${pct(foldRate)}</strong> du temps (${ho.folds} sur ${ho.faced}).${adaptive ? (foldRate > 0.45 && ho.faced >= 12 ? ' Au-delà de 45 %, les styles lecteurs augmentent leurs bluffs : c\'est ce qui s\'est passé.' : ' Sous 45 %, les styles lecteurs n\'ont pas pu augmenter leurs bluffs.') : ''}</p>` : ''}
      ${guess}</section>`;
  };
  ACT.chguess = (t) => {
    const g = X.getCash(); if (!g?.champ?.hidden || ch.guess !== null) return;
    ch.guess = t.dataset.id; const m = prog().mystery; m.n++; if (ch.guess === g.champ.id) m.ok++; Store.save('progress'); render();
  };
})();
</script>
<script>// Moteur de la Table live (parties amicales, joueurs informés) : une décision en moins d'une seconde à partir de ta main,
// du board, de ta position, du nombre et du type d'adversaires, du pot et de la mise à payer.
// Préflop : charts et équité de la matrice préflop contre la range estimée. Après le flop : Monte-Carlo contre la range estimée,
// filtrée par l'action de l'adversaire sur la rue. C'est une estimation rapide, pas un solve.
(function (root) {
  const E = root.Engine || require('./engine.js');
  const C = root.Charts || require('./charts.js');
  const SV = root.Solver || require('./solver.js');
  const TS = root.TableSim || require('./table.js');
  const B = root.Board || require('./board.js');

  // Types d'adversaires : part des mains avec lesquelles il relance / paie avant le flop, et ce qu'il garde face à une mise.
  const TYPES = {
    serre: { label: 'Serré', raise: 0.07, call: 0.16, keep: 'strong' },
    normal: { label: 'Normal', raise: 0.16, call: 0.3, keep: 'pair' },
    large: { label: 'Large', raise: 0.28, call: 0.45, keep: 'pair' },
    fish: { label: 'Fish (paie tout)', raise: 0.1, call: 0.6, keep: 'any' },
    maniaque: { label: 'Maniaque', raise: 0.45, call: 0.65, keep: 'wide' },
  };
  const POSITIONS = ['UTG', 'MP', 'HJ', 'CO', 'BTN', 'SB', 'BB'];
  const chartPos = (p) => (p === 'MP' ? 'UTG' : p);
  const fmt = (x, d = 1) => (Math.round(x * 10 ** d) / 10 ** d).toLocaleString('fr-FR');
  const pctS = (x) => Math.round(x * 100) + ' %';

  let PCT = null;
  const pctOf = (h) => { PCT = PCT || TS.preflopPct(); return PCT[E.ALL169.indexOf(h)]; };
  function topSet(x) { PCT = PCT || TS.preflopPct(); return new Set(E.ALL169.filter((h, i) => PCT[i] < x)); }
  const freqOf = (set) => E.ALL169.map((h) => (set.has(h) ? 1 : 0));

  // Range d'un adversaire après le préflop selon son action ('raise' | 'call' | 'limp').
  function preRange(type, act) {
    const T = TYPES[type] || TYPES.normal;
    if (act === 'raise') return topSet(T.raise);
    if (act === 'limp') { const all = topSet(Math.min(0.85, T.call + 0.15)), strong = topSet(Math.min(0.06, T.raise)); return new Set([...all].filter((h) => !strong.has(h))); }
    return topSet(T.call);
  }
  // Filtre postflop : ce qu'il garde quand il mise ou relance sur cette rue.
  function keepOnBet(type, combos, board, raised) {
    const T = TYPES[type] || TYPES.normal;
    return combos.filter((c) => {
      const k = B.classify(c, board), pair = k.made <= 11, strongMade = k.made <= 9, draw = k.draws.length > 0 && k.draws[0] !== 3;
      if (T.keep === 'wide') return raised ? pair || draw || k.made <= 11 : true;
      if (T.keep === 'any') return raised ? k.made <= 10 : pair || draw || k.draws.includes(3);
      if (T.keep === 'strong') return raised ? k.made <= 7 : strongMade || (draw && k.draws[0] === 0);
      return raised ? k.made <= 8 || (draw && k.draws[0] <= 1) : pair || draw;
    });
  }
  const outsOf = (k) => { const d = k.draws; if (d.includes(0) && d.includes(1)) return 15; if (d.includes(0) && d.includes(2)) return 12; if (d.includes(0)) return 9; if (d.includes(1)) return 8; if (d.includes(2)) return 4; if (d.includes(3)) return 6; return 0; };

  // ---------------- Préflop ----------------
  function preflop(o) {
    const [c1, c2] = o.hero, h = E.abstractOf(c1, c2), pct = pctOf(h), hi = E.ALL169.indexOf(h), pos = o.pos, T = TYPES[o.type] || TYPES.normal;
    const ip = ['CO', 'BTN'].includes(pos), blind = pos === 'SB' || pos === 'BB', stack = o.stackBB || 100, lines = [];
    const res = (action, size, tone, extra = {}) => ({ street: 'pre', hand: h, action, size, tone, lines, ...extra });
    // Tapis court : tapis ou couché.
    if (stack <= 15 && (o.pre === 'open' || o.pre === 'raise')) {
      const sol = SV.solveChip(Math.max(1, Math.min(25, Math.round(stack * 2) / 2)));
      if (o.pre === 'open') {
        const left = { UTG: 6, MP: 5, HJ: 4, CO: 3, BTN: 2, SB: 1, BB: 0 }[pos] ?? 3, k = left <= 1 ? 1 : left === 2 ? 0.75 : left === 3 ? 0.6 : 0.45;
        const push = pct < sol.pushPct * k;
        lines.push(`${fmt(stack)} bb : jeu tapis ou couché. Référence : environ ${pctS(sol.pushPct * k)} des mains depuis ta position.`);
        return res(push ? 'TAPIS' : pos === 'BB' ? 'CHECK' : 'COUCHE', push ? 'tout' : '', push ? 'good' : 'bad');
      }
      const shover = topSet(Math.min(0.9, sol.pushPct * (o.type === 'serre' ? 0.6 : o.type === 'maniaque' ? 1.4 : 1))), eq = SV.eqVsRange(hi, freqOf(shover));
      const need = (stack - (pos === 'BB' ? 1 : pos === 'SB' ? 0.5 : 0)) / (2 * stack + (pos === 'BB' || pos === 'SB' ? 0.5 : 1.5));
      lines.push(`Contre un tapis ${T.label.toLowerCase()} : ton équité ${pctS(eq)}, il en faut ${pctS(need)}.`);
      return res(eq >= need ? 'SUIS' : 'COUCHE', '', eq >= need ? 'good' : 'bad', { eq, need });
    }
    if (o.pre === 'open') {
      if (pos === 'BB') { lines.push('Tout le monde s\'est couché : tu remportes les blindes.'); return res('CHECK', '', 'good'); }
      const R = E.parseRange(C.RFI[chartPos(pos)].range), inR = R.has(h);
      const size = pos === 'SB' ? 3 : 2.5 + (o.live ? 0.5 : 0);
      lines.push(`${h} ${inR ? 'est dans' : 'est hors de'} la range d'ouverture ${pos} (${Math.round(E.rangePct(R))} % des mains).`);
      if (inR) lines.push('Relance, ne limpe pas : tu prends l\'initiative.');
      return res(inR ? 'RELANCE' : 'COUCHE', inR ? fmt(size) + ' BB' : '', inR ? 'good' : 'bad');
    }
    if (o.pre === 'limp') {
      const k = Math.max(1, o.limpers || 1), thr = blind ? 0.12 : (o.type === 'fish' ? 0.3 : 0.2) + (ip ? 0.04 : 0);
      const size = 4 + k + (o.type === 'fish' ? 1 : 0);
      if (pct < thr) { lines.push(`${k} limper${k > 1 ? 's' : ''} : ${h} est assez fort pour isoler. Relance à ${size} BB (4 + 1 par limper${o.type === 'fish' ? ' + 1 contre un fish' : ''}).`); return res('RELANCE', size + ' BB', 'good'); }
      const spec = h[0] === h[1] || (h[2] === 's' && (Math.abs(E.RANKS.indexOf(h[0]) - E.RANKS.indexOf(h[1])) <= 2 || h[0] === 'A'));
      if (pos === 'BB') { lines.push('Grosse blinde : check gratuit, ne gonfle pas le pot avec une main moyenne.'); return res('CHECK', '', 'warn'); }
      if (spec && k >= 1 && pct < 0.5 && stack >= 60) { lines.push(`${h} joue bien à plusieurs avec des tapis profonds (brelan, couleur, suite) : suis pour 1 BB.`); return res('SUIS', '1 BB', 'warn'); }
      lines.push(`${h} ne vaut ni une isolation ni un limp derrière.`); return res('COUCHE', '', 'bad');
    }

    lines.push(`${cat}. Équité contre ${n > 1 ? n + ' adversaires' : 'sa range'} (${T.label.toLowerCase()}) : ${pctS(eq)}.`);
    if (outs && toCome) lines.push(`${outs} outs : ≈ ${pctS(Math.min(1, outs * (toCome === 2 ? 4 : 2) / 100))} de toucher ${toCome === 2 ? 'd\'ici la river' : 'à la prochaine carte'} (règle des 2 et 4).`);
    if (toCall <= 0) {

  // de 1 % du tapis de départ jusqu'à environ un quinzième des jetons en jeu ; ante de grosse blinde à partir du niveau 4.
  function structure({ stack = 10000, players = 6, hours = 3, levelMin = 15, smallChip = 25 } = {}) {

  }

    if (n <= 5) return [70, 30];
    if (n <= 9) return [50, 30, 20];
    if (n <= 15) return [45, 27, 18, 10];

  ACT.lvraised = (t) => { lv.raised = t.checked; render(); };
  ACT.lvnew = () => { lv.cards = lv.cards.map(() => null); lv.slot = 0; lv.rank = null; lv.pot = ''; lv.toCall = ''; lv.pre = 'open'; lv.raised = false; render(); };
  ACT.lvnext = () => { const i = POS.indexOf(lv.pos); lv.pos = POS[(i - 1 + POS.length) % POS.length]; ACT.lvnew(); };
  ACT.lvdiscret = () => { lv.discret = !lv.discret; document.body.classList.toggle('discret-on', lv.discret); render(); };
  ACT.lvwake = async () => { try { if (lv.wake) { await lv.wake.release(); lv.wake = null; } else { lv.wake = await navigator.wakeLock.request('screen'); lv.wake.addEventListener?.('release', () => { lv.wake = null; }); } } catch (e) { lv.wake = null; } render(); };
  ONCHANGE.push((t) => { if (t.dataset.lv) { lv[t.dataset.lv] = t.value; if (t.dataset.lv === 'bb') ls.set('bb', t.value); render(); return true; } });
  // Clavier : saisie « Ah », « Kd »… ; Entrée = nouvelle main ; Retour arrière = efface la dernière carte.
  ONKEY.push((e, tab) => {
    if (tab !== 'live' || lv.sub !== 'decision' || !lv.consent) return;
    const k = e.key;
    if (/^[2-9tjqka]$/i.test(k)) { lv.rank = k.toUpperCase(); render(); return true; }
    if (/^[shdc]$/i.test(k) && lv.rank) { ACT.lvsuit({ dataset: { s: k.toLowerCase() } }); return true; }
    if (k === 'Backspace') { const last = lv.cards.map((c, i) => [c, i]).filter(([c]) => c !== null).pop(); if (last) { lv.cards[last[1]] = null; lv.slot = last[1]; render(); } return true; }
    if (k === 'Enter') { ACT.lvnew(); return true; }
  });

  // ---------------- Minuteur de blindes ----------------
  const mmss = (s) => `${Math.floor(Math.max(0, s) / 60)}:${String(Math.floor(Math.max(0, s) % 60)).padStart(2, '0')}`;
  function lvl(i) { return lv.levels[Math.min(i, lv.levels.length - 1)]; }
  function timerHTML() {
    const T = lv.timer, c = lvl(T.i), n = lvl(T.i + 1); if (T.left === null) T.left = c.min * 60;
    return `<section class="panel ltimer" id="ltimer"><span class="eyebrow">Niveau ${c.n} sur ${lv.levels.length}</span>
      <div class="lblinds">${fr(c.sb, 0)} / ${fr(c.bb, 0)}${c.ante ? `<small>ante ${fr(c.ante, 0)}</small>` : ''}</div>
      <div class="lclock" id="lclock">${mmss(T.left)}</div>

      <div class="row" style="justify-content:center"><button class="btn" data-act="lvtprev" aria-label="Niveau précédent">⏮</button><button class="btn primary" data-act="lvtgo">${T.running ? 'Pause' : 'Démarrer'}</button><button class="btn" data-act="lvtnext" aria-label="Niveau suivant">⏭</button><button class="btn" data-act="lvtplus">+1 min</button><button class="btn" data-act="lvtfull">Plein écran</button></div>
      <p class="note">Bip au changement de niveau. Structure modifiable dans « Préparer la partie ».</p></section>`;
  }
  function beep() { try { const A = window.AudioContext || window.webkitAudioContext, a = new A(), o = a.createOscillator(), g = a.createGain(); o.frequency.value = 880; o.connect(g); g.connect(a.destination); g.gain.setValueAtTime(0.2, a.currentTime); g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.8); o.start(); o.stop(a.currentTime + 0.8); } catch (e) { /* son indisponible */ } }
  setInterval(() => {
    const T = lv.timer; if (!T.running) return;
    const now = performance.now(), dt = (now - T.last) / 1000; T.last = now; T.left -= dt;
    if (T.left <= 0) { if (T.i < lv.levels.length - 1) { T.i++; T.left = lvl(T.i).min * 60; } else { T.left = 0; T.running = false; } beep(); if (X.getTab() === 'live' && lv.sub === 'timer') render(); return; }
    const el = document.getElementById('lclock'); if (el) el.textContent = mmss(T.left);
  }, 250);
  ACT.lvtgo = () => { const T = lv.timer; T.running = !T.running; T.last = performance.now(); render(); };
  ACT.lvtnext = () => { const T = lv.timer; T.i = Math.min(lv.levels.length - 1, T.i + 1); T.left = lvl(T.i).min * 60; render(); };
  ACT.lvtprev = () => { const T = lv.timer; T.i = Math.max(0, T.i - 1); T.left = lvl(T.i).min * 60; render(); };
  ACT.lvtplus = () => { lv.timer.left += 60; render(); };

  // ---------------- Préparer la partie ----------------
  function prepHTML() {
    const s = lv.st, c = lv.ch;
    const res = L.chips({ stack: +c.stack, players: +c.players, denoms: c.denoms.map((x) => +x).filter((x, i) => x > 0 || false), counts: c.counts.filter((_, i) => +c.denoms[i] > 0) });
