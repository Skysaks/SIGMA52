}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {

  --bg: #0D1116; --surface: #151B23; --sunk: #1C242E; --ink: #E7ECF1; --muted: #93A0AF; --line: #27313C;
  --accent: #7C94FF; --accent-ink: #0D1116; --good: #4CC37E; --bad: #FF7A6B; --warn: #E6A945;
  --s-s: #E7ECF1; --s-h: #FF6F62; --s-d: #78A6FF; --s-c: #4CC37E;

* { box-sizing: border-box; }

.stat b { font: 600 24px/1.1 var(--f-mono); font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 14px; border-radius: 8px; cursor: pointer; font-weight: 500; }

.pill.good { background: var(--good-bg); color: var(--good); } .pill.bad { background: var(--bad-bg); color: var(--bad); }
.note { font-size: 13px; color: var(--muted); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.warnbox { border-left: 3px solid var(--warn); padding: 10px 14px; background: var(--sunk); border-radius: 0 8px 8px 0; }
label.f { display: grid; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
label.f input, label.f select, label.f textarea { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font-size: 15px; min-width: 0; width: 100%; }

/* Cartes à jouer, jeu 4 couleurs */
.cards { display: flex; gap: 6px; flex-wrap: wrap; }
.cd { width: 46px; height: 64px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 1px 0 var(--line); display: grid; place-items: center; align-content: center; font: 600 22px/1 var(--f-mono); }
.cd i { font-style: normal; font-size: 18px; line-height: 1; }
.cd.s { color: var(--s-s); } .cd.h { color: var(--s-h); } .cd.d { color: var(--s-d); } .cd.c { color: var(--s-c); }
.cd.sm { width: 34px; height: 46px; font-size: 16px; } .cd.sm i { font-size: 13px; }
.felt { background: var(--sunk); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; }
/* Spots */
.opts { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
.opt { text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; font-weight: 500; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt.ok { border-color: var(--good); background: var(--good-bg); color: var(--good); }

.opt:disabled { cursor: default; }
.verdict { border-radius: 8px; padding: 12px 14px; }
.verdict.good { background: var(--good-bg); } .verdict.bad { background: var(--bad-bg); }
.verdict b { display: block; margin-bottom: 4px; }
.meter { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--accent); }
.typerow { display: grid; grid-template-columns: 130px 1fr 64px; gap: 10px; align-items: center; font-size: 14px; }
/* Cours */
.modlist { display: grid; gap: 6px; }
.mod { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; text-align: left; }
.mod .n { font: 800 22px/1 var(--f-display); color: var(--muted); }
.mod.done .n { color: var(--good); }
.prose { display: grid; gap: 18px; max-width: 68ch; }
.prose section { display: grid; gap: 10px; }
.prose ul, .prose ol { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.formula { font: 500 14px/1.5 var(--f-mono); background: var(--sunk); padding: 10px 12px; border-radius: 8px; }
.tw { overflow-x: auto; }
table.t { border-collapse: collapse; width: 100%; font-size: 14px; }
table.t th, table.t td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); }
table.t th { font: 600 11px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
table.t td:last-child, table.t th:last-child { font-variant-numeric: tabular-nums; }
/* Grille de ranges */
.rgrid { display: grid; grid-template-columns: repeat(13, 1fr); gap: 2px; max-width: 560px; }
.rc { aspect-ratio: 1; max-width: 100%; border: 0; border-radius: 3px; background: var(--sunk); color: var(--muted); font: 600 clamp(7px, 1.9vw, 11px)/1 var(--f-mono); letter-spacing: -.03em; cursor: pointer; padding: 0; }
.rc.on { background: var(--accent); color: var(--accent-ink); }
/* Équité */
.eqrow { display: grid; grid-template-columns: minmax(0, 1fr) 70px; gap: 10px; align-items: center; }
.eqbar { height: 22px; background: var(--sunk); border-radius: 4px; overflow: hidden; position: relative; }
.eqbar > i { position: absolute; inset: 0 auto 0 0; background: var(--accent); }
canvas { width: 100%; max-width: 100%; display: block; }
.check { display: flex; gap: 10px; align-items: flex-start; }
.check input { margin-top: 4px; width: 18px; height: 18px; flex: none; }
@media (max-width: 520px) { h1 { font-size: 32px; } .typerow { grid-template-columns: 100px 1fr 52px; } .panel { padding: 16px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

<script>// Moteur NUTS : cartes, évaluateur 7 cartes, ranges, équité Monte-Carlo / exacte.
// Carte = entier 0..51 : rang = c >> 2 (0 = 2 ... 12 = As), couleur = c & 3.
(function (root) {
  const RANKS = '23456789TJQKA';
  const SUITS = 'shdc'; // pique, coeur, carreau, trèfle
  const SUIT_SYM = { s: '♠', h: '♥', d: '♦', c: '♣' };
  const CAT_FR = ['Hauteur', 'Paire', 'Double paire', 'Brelan', 'Suite', 'Couleur', 'Full', 'Carré', 'Quinte flush'];

  const card = (s) => {
    const r = RANKS.indexOf(s[0].toUpperCase()), u = SUITS.indexOf(s[1].toLowerCase());
    if (r < 0 || u < 0) throw new Error('Carte invalide : ' + s);
    return (r << 2) | u;
  };
  const cardStr = (c) => RANKS[c >> 2] + SUITS[c & 3];
  const parseCards = (str) => (str || '').replace(/[\s,]+/g, '').match(/.{2}/g)?.map(card) || [];

  // Plus haute suite contenue dans un masque de rangs (bit i = rang i). -1 si aucune.
  function straightHigh(m) {
    for (let hi = 12; hi >= 4; hi--) if (((m >> (hi - 4)) & 31) === 31) return hi;
    if ((m & 0b1000000001111) === 0b1000000001111) return 3; // roue A-2-3-4-5
    return -1;
  }
  const topBits = (m, n) => { const out = []; for (let r = 12; r >= 0 && out.length < n; r--) if (m & (1 << r)) out.push(r); return out; };
  const pack = (cat, ks) => { let v = cat; for (let i = 0; i < 5; i++) v = v * 16 + (ks[i] ?? 0); return v; };

  // Valeur d'une main de 5 à 7 cartes : plus grand = meilleur. Catégorie = Math.floor(v / 16**5).
  function evaluate(cards) {
    const cnt = new Array(13).fill(0), suitMask = [0, 0, 0, 0], suitCnt = [0, 0, 0, 0];
    let mask = 0;
    for (const c of cards) { const r = c >> 2, s = c & 3; cnt[r]++; mask |= 1 << r; suitMask[s] |= 1 << r; suitCnt[s]++; }
    for (let s = 0; s < 4; s++) if (suitCnt[s] >= 5) {
      const sf = straightHigh(suitMask[s]);
      if (sf >= 0) return pack(8, [sf]);
      return pack(5, topBits(suitMask[s], 5));
    }
    const quads = [], trips = [], pairs = [];
    for (let r = 12; r >= 0; r--) { if (cnt[r] === 4) quads.push(r); else if (cnt[r] === 3) trips.push(r); else if (cnt[r] === 2) pairs.push(r); }
    if (quads.length) return pack(7, [quads[0], topBits(mask & ~(1 << quads[0]), 1)[0]]);
    if (trips.length && (trips.length > 1 || pairs.length)) return pack(6, [trips[0], trips.length > 1 ? Math.max(trips[1], pairs[0] ?? -1) : pairs[0]]);
    const st = straightHigh(mask);
    if (st >= 0) return pack(4, [st]);
    if (trips.length) return pack(3, [trips[0], ...topBits(mask & ~(1 << trips[0]), 2)]);
    if (pairs.length >= 2) return pack(2, [pairs[0], pairs[1], topBits(mask & ~(1 << pairs[0]) & ~(1 << pairs[1]), 1)[0]]);
    if (pairs.length) return pack(1, [pairs[0], ...topBits(mask & ~(1 << pairs[0]), 3)]);
    return pack(0, topBits(mask, 5));
  }
  const category = (v) => Math.floor(v / 1048576);
  const categoryName = (v) => CAT_FR[category(v)];

  // ---- Ranges ----
  // Les 169 mains de départ, grille 13x13 : diagonale = paires, haut-droite = assorties (s), bas-gauche = dépareillées (o).
  function handName(i, j) { // i, j = index ligne/colonne, 0 = As
    const a = 12 - i, b = 12 - j;
    if (i === j) return RANKS[a] + RANKS[a];
    return i < j ? RANKS[a] + RANKS[b] + 's' : RANKS[b] + RANKS[a] + 'o';
  }
  const ALL169 = []; for (let i = 0; i < 13; i++) for (let j = 0; j < 13; j++) ALL169.push(handName(i, j));

  // Combos concrets d'une main abstraite ("AKs" -> 4, "AKo" -> 12, "QQ" -> 6, "AK" -> 16).
  function combos(h) {
    const a = RANKS.indexOf(h[0]), b = RANKS.indexOf(h[1]), out = [];
    if (a < 0 || b < 0) throw new Error('Main invalide : ' + h);
    for (let s1 = 0; s1 < 4; s1++) for (let s2 = 0; s2 < 4; s2++) {
      if (a === b && s2 <= s1) continue;
      if (h[2] === 's' && s1 !== s2) continue;
      if (h[2] === 'o' && s1 === s2) continue;
      out.push([(a << 2) | s1, (b << 2) | s2]);
    }
    return out;
  }

  // Parse "22+, A2s+, KTs+, QJo, 76s-54s, AKo, random" -> Set de mains abstraites.
  function parseRange(str) {
    const set = new Set();
    for (let tok of (str || '').split(/[\s,]+/).filter(Boolean)) {
      tok = tok.trim();
      if (/^(random|any|100%)$/i.test(tok)) { ALL169.forEach((h) => set.add(h)); continue; }
      tok = tok[0].toUpperCase() + tok[1].toUpperCase() + tok.slice(2).toLowerCase();
      const m = tok.match(/^([2-9TJQKA])([2-9TJQKA])([so]?)(\+?)(?:-([2-9TJQKA])([2-9TJQKA])([so]?))?$/);
      if (!m) throw new Error('Range illisible : ' + tok);
      let [, r1, r2, sfx, plus, e1, e2] = m;
      let a = RANKS.indexOf(r1), b = RANKS.indexOf(r2);
      if (b > a) [a, b] = [b, a];
      const add = (x, y) => {
        if (x === y) set.add(RANKS[x] + RANKS[x]);
        else if (sfx) set.add(RANKS[x] + RANKS[y] + sfx);
        else { set.add(RANKS[x] + RANKS[y] + 's'); set.add(RANKS[x] + RANKS[y] + 'o'); }
      };
      if (a === b) { // paires
        const lo = e1 ? Math.min(a, RANKS.indexOf(e1)) : a, hi = plus ? 12 : e1 ? Math.max(a, RANKS.indexOf(e1)) : a;
        for (let r = lo; r <= hi; r++) add(r, r);
      } else if (plus) { for (let y = b; y < a; y++) add(a, y); }
      else if (e1) {
        let x2 = RANKS.indexOf(e1), y2 = RANKS.indexOf(e2); if (y2 > x2) [x2, y2] = [y2, x2];
        if (x2 === a) for (let y = Math.min(b, y2); y <= Math.max(b, y2); y++) add(a, y); // A5s-A2s : kicker variable
        else for (let d = Math.min(0, y2 - b); d <= Math.max(0, y2 - b); d++) add(a + d, b + d); // 76s-54s : bande de connecteurs
      }
      else add(a, b);
    }
    return set;
  }
  // Range -> liste de combos, sans les cartes mortes.
  function rangeCombos(range, dead = []) {
    const d = new Set(dead), out = [];
    for (const h of (range instanceof Set ? range : parseRange(range))) for (const c of combos(h)) if (!d.has(c[0]) && !d.has(c[1])) out.push(c);
    return out;
  }
  const rangePct = (set) => [...set].reduce((n, h) => n + combos(h).length, 0) / 1326 * 100;

  // Classement d'une main abstraite dans un ensemble (pour savoir si "KTo" est dans "KTo+", etc.)
  const inRange = (hand, set) => set.has(hand);
  function abstractOf(c1, c2) {
    let a = c1 >> 2, b = c2 >> 2;
    if (a === b) return RANKS[a] + RANKS[a];
    const suited = (c1 & 3) === (c2 & 3);
    if (b > a) [a, b] = [b, a];
    return RANKS[a] + RANKS[b] + (suited ? 's' : 'o');
  }

  // ---- Équité ----
  // Générateur pseudo-aléatoire reproductible (mulberry32) pour des tests stables.
  function rng(seed) { let t = seed >>> 0; return () => { t += 0x6D2B79F5; let x = t; x = Math.imul(x ^ (x >>> 15), x | 1); x ^= x + Math.imul(x ^ (x >>> 7), x | 61); return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }

  // players : tableau de { hand: [c1,c2] } ou { combos: [[c1,c2],...] }. board : 0 à 5 cartes.
  // Retour : { equity: [..], win: [..], tie: [..], n, exact }.
  function equity(players, board = [], opts = {}) {
    const n = players.length, iters = opts.iterations || 50000, rand = opts.random || Math.random;
    const known = new Set(board); players.forEach((p) => p.hand && p.hand.forEach((c) => known.add(c)));
    const fixed = players.every((p) => p.hand);
    const eq = new Array(n).fill(0), win = new Array(n).fill(0), tie = new Array(n).fill(0);
    const need = 5 - board.length;
    let total = 0;
    const score = (hands, full) => {
      let best = -1, winners = [];
      for (let i = 0; i < n; i++) { const v = evaluate([hands[i][0], hands[i][1], ...full]); if (v > best) { best = v; winners = [i]; } else if (v === best) winners.push(i); }
      for (const w of winners) { eq[w] += 1 / winners.length; if (winners.length === 1) win[w]++; else tie[w]++; }
      total++;
    };
    // Exact si mains connues et peu de tirages restants (flop ou plus tard).
    if (fixed && need <= 2) {
      const deck = []; for (let c = 0; c < 52; c++) if (!known.has(c)) deck.push(c);
      const hands = players.map((p) => p.hand);
      if (need === 0) score(hands, board);
      else if (need === 1) for (const c of deck) score(hands, [...board, c]);
      else for (let i = 0; i < deck.length; i++) for (let j = i + 1; j < deck.length; j++) score(hands, [...board, deck[i], deck[j]]);
      return { equity: eq.map((x) => x / total), win: win.map((x) => x / total), tie: tie.map((x) => x / total), n: total, exact: true };
    }
    const pools = players.map((p) => p.hand ? null : p.combos.filter((c) => !known.has(c[0]) && !known.has(c[1])));
    if (pools.some((p) => p && !p.length)) throw new Error('Range vide après retrait des cartes connues');
    const used = new Uint8Array(52);
    for (let it = 0; it < iters; it++) {
      used.fill(0); known.forEach((c) => (used[c] = 1));
      const hands = []; let ok = true;
      for (let i = 0; i < n; i++) {
        if (players[i].hand) { hands.push(players[i].hand); continue; }
        let tries = 0, h;
        do { h = pools[i][(rand() * pools[i].length) | 0]; } while ((used[h[0]] || used[h[1]]) && ++tries < 50);
        if (used[h[0]] || used[h[1]]) { ok = false; break; }
        used[h[0]] = used[h[1]] = 1; hands.push(h);
      }
      if (!ok) continue;
      const full = board.slice();
      while (full.length < 5) { const c = (rand() * 52) | 0; if (!used[c]) { used[c] = 1; full.push(c); } }
      score(hands, full);
    }
    return { equity: eq.map((x) => x / total), win: win.map((x) => x / total), tie: tie.map((x) => x / total), n: total, exact: false };
  }

  // Outs : cartes du talon qui font passer la main du héros devant celle (connue) de l'adversaire à la prochaine carte.
  function outs(hero, villain, board) {
    const known = new Set([...hero, ...villain, ...board]), res = [];

  mod('bankroll', 'Bankroll, variance, rake', 10, 'situations', [
    ['Combien de caves', `<table class="t"><thead><tr><th>Format</th><th>Repère prudent</th></tr></thead><tbody>

  mod('mental', 'Mental et tilt', 8, 'situations', [

  mod('progression', 'Plan de progression', 6, 'situations', [

    ['Préflop', 'Bouton, tu as D♠ D♦. Le cutoff ouvre à 2,5 bb. Action ?', ['Suivre', '3-bet à ~7,5 bb', 'Tapis 100 bb'], 1, 'QQ est une main de valeur : 3-bet environ 3 fois l\'ouverture en position. Le tapis direct ne fait payer que les mains qui te battent.'],
    ['Préflop', 'Grosse blinde, tout le monde limpe, tu as 7♣ 2♦. Action ?', ['Se coucher', 'Checker', 'Relancer'], 1, 'Voir le flop est gratuit. Se coucher sans mise à payer est une erreur pure.'],
    ['Préflop', 'Tu ouvres UTG avec A♦ D♦. Un joueur passif (VPIP 25, 3-bet 2 %) te sur-relance. Action par défaut ?', ['4-bet', 'Suivre ou se coucher, sans 4-bet', 'Tapis'], 1, 'Un 3-bet à 2 % ne contient presque que QQ+ et AK. AQs est dominée : pas de 4-bet bluff contre une range aussi forte.'],
    ['Maths', 'Pot 100, l\'adversaire mise 50. Quelle équité te faut-il pour suivre ?', ['33 %', '25 %', '50 %'], 1, '50 ÷ (100 + 50 + 50) = 25 %.'],
    ['Maths', 'Tirage couleur au flop, sans autre out. Chances de toucher d\'ici la river ?', ['~19 %', '~35 %', '~50 %'], 1, '9 outs, deux cartes : 35 % (règle du 4 : 36 %). Une seule carte : ~19 %.'],

    ['Maths', 'Un As est au flop. Combien de combinaisons de AA reste-t-il ?', ['6', '3', '1'], 1, '4 As au départ, un au board : C(3,2) = 3 combinaisons.'],
    ['Maths', 'Tu suis préflop avec 5-5 pour toucher un brelan. Probabilité au flop ?', ['~6 %', '~12 %', '~25 %'], 1, '11,8 %, environ 1 fois sur 8,5. Il faut donc de gros gains implicites pour suivre une relance.'],
    ['Maths', 'L\'adversaire mise la taille du pot. Défense minimale théorique ?', ['33 %', '50 %', '67 %'], 1, 'MDF = P ÷ (P + B) = 100 ÷ 200 = 50 %. À ajuster : contre un joueur qui ne bluffe jamais, couche plus.'],
    ['Postflop', 'Tu ouvres au bouton, la BB paie. Flop R♠ 7♦ 2♣. Plan par défaut ?', ['Petite mise avec presque toute ta range', 'Check toute ta range', 'Grosse mise uniquement avec un roi'], 0, 'Board sec qui favorise ta range (plus de rois, d\'As, de paires hautes). Une petite mise (~33 %) suffit.'],
    ['Postflop', 'Tu ouvres UTG, la BB paie. Flop 9♥ 8♥ 7♣. Plan par défaut ?', ['Petite mise avec toute ta range', 'Checker souvent, miser gros tes meilleures mains et tirages', 'Tapis'], 1, 'Board connecté qui favorise la BB (98, T9, 65, 77…). Une mise automatique perd de l\'argent.'],
    ['Postflop', 'River sans danger. Tu as top paire bon kicker contre un fish passif qui a payé flop et turn. Action ?', ['Check', 'Petite mise', 'Grosse mise (70-100 % du pot)'], 2, 'Il paie avec pire bien trop souvent. La taille de mise est le levier principal contre lui.'],
    ['Postflop', 'River ratée, tu n\'as rien. L\'adversaire est une calling station qui a payé flop et turn. Action ?', ['Bluffer gros', 'Abandonner (check)', 'Petit bluff'], 1, 'Il ne se couche pas. Ton bluff n\'a pas de fold equity : check et passe.'],
    ['Postflop', 'Un nit (VPIP 12) check-relance la river. Tu as top paire. Action ?', ['Payer', 'Se coucher', 'Sur-relancer'], 1, 'Un nit ne check-relance pas la river en bluff. Ta top paire ne bat presque rien de sa range.'],
    ['Postflop', 'Tu as un brelan sur un board avec tirages couleur et suite, contre un fish. Action ?', ['Slowplay', 'Grosse mise', 'Mise minimum'], 1, 'Valeur et protection : il paiera avec ses tirages et ses paires. Le slowplay lui donne des cartes gratuites.'],
    ['Fish', 'HUD : VPIP 52 / PFR 4. Quel profil ?', ['Régulier', 'Fish passif', 'Maniaque'], 1, 'Joue une main sur deux, ne relance presque jamais : il paie. Value bet gros, zéro bluff.'],
    ['Fish', 'Où t\'asseoir par rapport au fish ?', ['À sa droite', 'À sa gauche', 'En face'], 1, 'À sa gauche, tu parles après lui sur la plupart des coups : position maximale contre le joueur qui te rapporte le plus.'],
    ['Fish', 'Un fish passif mise gros à la river après avoir checké-payé. Tu as deuxième paire. Action ?', ['Payer', 'Se coucher', 'Relancer'], 1, 'Les joueurs passifs bluffent rarement gros à la river. Sa grosse mise est presque toujours de la valeur.'],
    ['Fish', 'Un fish te bat avec un call absurde. Que fais-tu ?', ['Lui expliquer son erreur dans le chat', 'Rien, ou « bien joué »', 'Quitter la table'], 1, 'Il doit rester et recaver. Chaque commentaire le pousse à progresser ou à partir.'],
    ['Fish', 'Contre un maniaque qui mise chaque street, tu as top paire au flop. Plan ?', ['Relancer tout de suite', 'Payer et le laisser bluffer', 'Se coucher'], 1, 'Laisse-le miser avec ses bluffs. Relancer ne fait coucher que ses mains les plus faibles, celles que tu veux voir continuer.'],
    ['Tournoi', 'Bulle d\'un tournoi. Tu as 15 bb en BB, le chip leader fait tapis du bouton. Tu as A♣ V♦. Par rapport au cash ?', ['Payer plus souvent', 'Se coucher plus souvent', 'Aucune différence'], 1, 'ICM : perdre ton tapis te sort sans gain, doubler ne double pas ta part du prize pool. Couche des mains rentables en jetons.'],
    ['Tournoi', 'Tournoi, 8 bb, tu es SB, tous ont passé. Tu as A♦ 4♣. Action ?', ['Limper', 'Tapis', 'Se coucher'], 1, 'À 8 bb, A4o est un tapis rentable depuis la SB contre la seule BB.'],
    ['Tournoi', 'Les antes arrivent. Effet sur tes vols de blindes ?', ['Voler moins', 'Voler plus', 'Aucun'], 1, 'Le pot de départ grossit : chaque vol rapporte plus pour le même risque.'],
    ['Mental', 'Tu viens de perdre 3 caves dans la session et tu es énervé. Que fais-tu ?', ['Monter de limite pour se refaire', 'Continuer', 'Arrêter la session'], 2, 'Stop-loss atteint. Le tilt coûte plus que n\'importe quelle mauvaise main.'],
    ['Mental', 'Bankroll 250 €, règle des 40 caves en cash. Limite maximale ?', ['NL5', 'NL10', 'NL25'], 0, 'NL5 : 40 × 5 € = 200 €. NL10 demanderait 400 €.'],
    ['Mental', 'Après 5 000 mains à +10 bb/100, tu sais que tu es gagnant ?', ['Oui', 'Non'], 1, 'Avec un écart-type de ~90 bb/100, l\'intervalle à 95 % sur 5 000 mains fait environ ±25 bb/100. Rien n\'est prouvé.'],
    ['Légal', 'Un ami regarde ton écran et te conseille pendant la main. C\'est…', ['Autorisé', 'Interdit'], 1, 'Aide extérieure pendant le jeu : sanction possible jusqu\'à la fermeture du compte.'],
    ['Légal', 'Tu veux vérifier un spot dans un solveur entre deux mains, tables ouvertes. C\'est…', ['Autorisé', 'Interdit'], 1, 'PokerStars interdit solveurs et charts pendant le jeu ; les autres rooms sanctionnent le RTA. Note la main et étudie après la session.'],
    ['Légal', 'Utiliser le HUD intégré de Winamax pendant le jeu. C\'est…', ['Autorisé', 'Interdit'], 0, 'Le HUD intégré est fourni par la room. Les HUD dynamiques de logiciels tiers, eux, sont interdits chez Winamax.'],
  ].map(([cat, q, opts, ok, why], i) => ({ id: 's' + i, cat, q, opts, ok, why }));

  const api = { MODULES: M, SITUATIONS: S };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.Course = api;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>// Générateur de spots d'entraînement. Chaque spot : { type, title, prompt, cards?, board?, opts, ok (index ou liste), why }.
(function (root) {
  const E = root.Engine || require('./engine.js');
  const Charts = root.Charts || require('./charts.js');
  const Course = root.Course || require('./course.js');

  const TYPES = {
    rfi: 'Ouverture', odds: 'Cotes du pot', tirage: 'Tirage au turn', meilleure: 'Meilleure main', situations: 'Situations',
  };
  const pick = (a, r) => a[(r() * a.length) | 0];
  const pct = (x) => (x * 100).toFixed(1).replace('.', ',') + ' %';
  const eur = (x) => x.toFixed(2).replace('.', ',') + ' €';
  function deal(n, r, exclude = []) {
    const used = new Set(exclude), out = [];
    while (out.length < n) { const c = (r() * 52) | 0; if (!used.has(c)) { used.add(c); out.push(c); } }
    return out;
  }

  // Ouverture : position + main -> ouvrir ou passer, selon les ranges RFI.
  function rfi(r) {
    const pos = pick(Charts.POS, r), set = E.parseRange(Charts.RFI[pos].range);
    // Moitié des mains tirées près de la frontière de la range (là où on se trompe), moitié au hasard.
    let cards, h;
    for (let i = 0; i < 40; i++) {
      cards = deal(2, r); h = E.abstractOf(cards[0], cards[1]);
      if (r() < 0.5) break;
      const ri = E.RANKS.indexOf(h[0]), rj = E.RANKS.indexOf(h[1]);
      const neighbours = [[ri, rj - 1], [ri, rj + 1], [ri - 1, rj]].filter(([a, b]) => a >= 0 && b >= 0 && a <= 12 && b <= 12 && a !== b)
        .map(([a, b]) => E.RANKS[Math.max(a, b)] + E.RANKS[Math.min(a, b)] + (h[2] || ''));
      if (neighbours.some((x) => set.has(x) !== set.has(h))) break;
    }
    const open = set.has(h);
    return {
      type: 'rfi', title: 'Ouverture · ' + Charts.RFI[pos].label,
      prompt: `Tout le monde a passé jusqu'à toi. Tu es <strong>${pos}</strong> avec <strong>${h}</strong>.`,
      cards, opts: [`Ouvrir à ${Charts.RFI[pos].size}`, 'Se coucher'], ok: open ? 0 : 1,
      why: `${h} est ${open ? '' : 'hors de '}la range d'ouverture ${pos} (${E.rangePct(set).toFixed(0)} % des mains). ` +
        (open ? 'Relance, ne limpe jamais en premier.' : 'Trop de joueurs parlent après toi pour cette main, ou elle est dominée trop souvent.'),
    };
  }

  // Cotes du pot : quelle équité faut-il pour suivre ?
  function odds(r) {
    const pot = pick([0.6, 0.8, 1, 1.2, 1.5, 2, 2.4, 3, 4, 5], r), f = pick([0.25, 0.33, 0.5, 0.66, 0.75, 1, 1.5, 2], r);
    const bet = Math.round(pot * f * 100) / 100, need = bet / (pot + 2 * bet);
    const wrong = [bet / (pot + bet), bet / pot, need * 0.6].filter((x) => Math.abs(x - need) > 0.02 && x < 1);
    const opts = [need, ...wrong.slice(0, 2)].sort(() => r() - 0.5);
    return {
      type: 'odds', title: 'Cotes du pot',
      prompt: `Pot de <strong>${eur(pot)}</strong>. L'adversaire mise <strong>${eur(bet)}</strong>. Quelle équité te faut-il au minimum pour suivre ?`,
      opts: opts.map(pct), ok: opts.indexOf(need),
      why: `Tu paies ${eur(bet)} pour un pot final de ${eur(pot + 2 * bet)} : ${eur(bet)} ÷ ${eur(pot + 2 * bet)} = ${pct(need)}. Erreur classique : diviser par le pot avant ta mise (${pct(bet / (pot + bet))}).`,
    };
  }

  // Tirage au turn : équité exacte contre une range « paire ou mieux » vs cotes du pot.
  function villainRange(board) {
    const base = E.category(E.evaluate(board)), out = [];
    for (const h of E.ALL169) for (const c of E.combos(h)) {
      if (board.includes(c[0]) || board.includes(c[1])) continue;
      if (E.category(E.evaluate([...c, ...board])) > base) out.push(c);
    }
    return out;
  }
  function exactVsRange(hero, range, board) {
    let eq = 0, n = 0;
    const dead = new Set([...hero, ...board]);
    for (const v of range) {
      if (dead.has(v[0]) || dead.has(v[1])) continue;
      for (let c = 0; c < 52; c++) {
        if (dead.has(c) || c === v[0] || c === v[1]) continue;
        const b = [...board, c], a = E.evaluate([...hero, ...b]), d = E.evaluate([...v, ...b]);
        eq += a > d ? 1 : a === d ? 0.5 : 0; n++;
      }
    }
    return eq / n;
  }
  function drawKind(hero, board) {
    const all = [...hero, ...board], kinds = [];
    for (let s = 0; s < 4; s++) if (all.filter((c) => (c & 3) === s).length === 4 && hero.some((c) => (c & 3) === s)) kinds.push('tirage couleur');
    const m = all.reduce((acc, c) => acc | (1 << (c >> 2)), 0);
    const hasStraight = (x) => { for (let hi = 12; hi >= 4; hi--) if (((x >> (hi - 4)) & 31) === 31) return true; return (x & 0b1000000001111) === 0b1000000001111; };
    let st = 0;
    if (!hasStraight(m)) for (let rank = 0; rank < 13; rank++) if (!(m & (1 << rank)) && hasStraight(m | (1 << rank))) st++;
    if (st >= 2) kinds.push('suite par les deux bouts'); else if (st === 1) kinds.push('suite ventrale');
    return kinds;
  }
  function tirage(r) {
    for (let tries = 0; tries < 400; tries++) {
      const board = deal(4, r);
      if (new Set(board.map((c) => c >> 2)).size < 4) continue;
      const hero = deal(2, r, board);
      if (E.category(E.evaluate([...hero, ...board])) !== 0) continue;
      const kinds = drawKind(hero, board);
      if (!kinds.length) continue;
      const range = villainRange([...board]).filter((c) => !hero.includes(c[0]) && !hero.includes(c[1]));
      const eq = exactVsRange(hero, range, board);
      const pot = pick([1, 1.5, 2, 3, 4], r), f = pick([0.33, 0.5, 0.66, 0.75, 1], r);
      const bet = Math.round(pot * f * 100) / 100, need = bet / (pot + 2 * bet);
      if (Math.abs(eq - need) < 0.03) continue;
      const call = eq > need;
      return {
        type: 'tirage', title: 'Tirage au turn · une carte à venir',
        prompt: `Turn. Tu as un ${kinds.join(' + ')}. Pot de <strong>${eur(pot)}</strong>, l'adversaire mise <strong>${eur(bet)}</strong>. Suppose qu'il a toujours au moins une paire avec une de ses cartes. Tu ne gagneras rien de plus à la river si tu touches.`,
        cards: hero, board, opts: ['Suivre', 'Se coucher'], ok: call ? 0 : 1,
        why: `Ton équité exacte à la river contre cette range (${range.length} combinaisons) : ${pct(eq)}. Équité requise : ${pct(need)}. ` +
          (call ? 'Le call est rentable même sans gains implicites.' : 'Sans gains implicites, le call perd de l\'argent. Contre un fish qui paiera ta couleur à la river, la marge se réduit : c\'est le rôle des cotes implicites.'),
        meta: { eq, need },
      };
    }
    return odds(r);
  }

  // Meilleure main : 3 mains, un board, qui gagne ?
  function meilleure(r) {
    const board = deal(5, r), hands = [deal(2, r, board)];
    hands.push(deal(2, r, [...board, ...hands[0]])); hands.push(deal(2, r, [...board, ...hands[0], ...hands[1]]));
    const vals = hands.map((h) => E.evaluate([...h, ...board])), best = Math.max(...vals);
    const win = vals.map((v, i) => (v === best ? i : -1)).filter((i) => i >= 0);
    const opts = ['Joueur 1', 'Joueur 2', 'Joueur 3', 'Partage'];
    return {
      type: 'meilleure', title: 'Meilleure main', prompt: 'Qui gagne le pot à l\'abattage ?',
      board, hands, opts, ok: win.length > 1 ? 3 : win[0],
      why: vals.map((v, i) => `Joueur ${i + 1} : ${E.categoryName(v)}`).join(' · ') + (win.length > 1 ? ' → égalité exacte, partage.' : ` → le joueur ${win[0] + 1} gagne.`),
    };
  }

  function situation(r, cat) {
    const pool = Course.SITUATIONS.filter((s) => !cat || s.cat === cat), s = pick(pool, r);
    return { type: 'situations', title: 'Situation · ' + s.cat, prompt: s.q, opts: s.opts, ok: s.ok, why: s.why, sid: s.id };
  }

  const GEN = { rfi, odds, tirage, meilleure, situations: situation };
  // Mix : favorise les types les moins réussis (stats = { type: { ok, n } }).
  function mix(r, stats = {}) {
    const types = Object.keys(GEN), w = types.map((t) => { const s = stats[t] || { ok: 0, n: 0 }; return 1.5 - (s.ok + 1) / (s.n + 2); });
    let x = r() * w.reduce((a, b) => a + b, 0);
    for (let i = 0; i < types.length; i++) { x -= w[i]; if (x <= 0) return GEN[types[i]](r); }
    return GEN[types[0]](r);
  }

  const api = { TYPES, GEN, mix, villainRange, exactVsRange, drawKind };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.Spots = api;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>// Interface NUTS : onglets, stockage (db privé par utilisateur, sinon navigateur), vues.

  function journalStats() {

    const wr = hands ? bbWon / hands * 100 : null, ci = hands ? 1.96 * 90 / Math.sqrt(hands / 100) : null;

  VIEWS.jour = () => {

      ${Object.entries(S.TYPES).map(([k, l]) => { const s = statOf(k), r = s.n ? s.ok / s.n : 0; return `<div class="typerow"><span>${l}</span><div class="meter"><i style="width:${r * 100}%"></i></div><span class="mono">${s.n ? pct(r) : '—'}</span></div>`; }).join('')}
      <p class="note">Objectif avant de jouer en argent réel : 90 % en Ouverture et en Cotes du pot.</p></section>

        .map((t, i) => `<label class="check"><input type="checkbox" id="ck${i}" data-act="check"><span>${t}</span></label>`).join('')}

    return `<section style="display:grid;gap:8px"><h1>Cours A-Z</h1><p class="lead">Dans l'ordre. Chaque module se termine par un exercice dans Spots. Total : ${K.MODULES.reduce((a, m) => a + m.minutes, 0)} minutes de lecture.</p></section>
      <div class="modlist">${K.MODULES.map((m, i) => `<button class="mod${state.progress.read[m.id] ? ' done' : ''}" data-act="openmod" data-id="${m.id}"><span class="n">${state.progress.read[m.id] ? '✓' : String(i + 1).padStart(2, '0')}</span><span><h3>${esc(m.title)}</h3><span class="note">${m.sections.map((s) => s[0]).join(' · ')}</span></span><span class="note mono">${m.minutes} min</span></button>`).join('')}</div>`;

      ${daily ? `<div class="row"><span class="pill">Entraînement du jour · ${d.date === today() ? d.done : 0}/10</span></div>` : ''}

  };
  document.addEventListener('keydown', (e) => {

    else if (e.key === 'Enter' && answered !== null) { newSpot(); render(); }
  });

  // ---------- Équité ----------
  const eqIn = { p: ['AhKh', 'QcQs', '', ''], board: '2h7hJd' };
  let eqOut = null;

  function runEquity() {
    try {
      const board = E.parseCards(eqIn.board);

      <div class="row">${C.POS.map((p) => `<button class="chip" aria-pressed="${p === rPos && !custom}" data-act="pos" data-p="${p}">${p}</button>`).join('')}${custom ? '<span class="pill">Range perso</span>' : ''}</div>
      <section class="panel"><div class="row" style="justify-content:space-between"><h2>${custom ? 'Range perso' : C.RFI[rPos].label}</h2><b class="mono" style="font-size:20px">${fr(E.rangePct(set), 1)} %</b></div>
        <div class="rgrid" role="group" aria-label="Grille des 169 mains">${cells.join('')}</div>
        <p class="note">Diagonale : paires. Au-dessus : mains assorties (s). En dessous : dépareillées (o). Taille d'ouverture : ${C.RFI[rPos].size}.</p>
        <p class="mono note" style="word-break:break-word">${esc([...set].join(', '))}</p>
        <div class="row"><button class="btn" data-act="r2eq">Utiliser comme range adverse dans Équité</button>${custom ? '<button class="btn" data-act="rreset">Revenir à la range standard</button>' : ''}<button class="btn" data-act="drill" data-type="rfi">S'entraîner aux ouvertures</button></div></section>`;
  };

  // ---------- Journal ----------
  const ROOMS = ['Winamax', 'PokerStars.fr', 'Betclic', 'PMU', 'Casino', 'Autre'], FORMATS = ['Cash', 'MTT', 'Expresso', 'Sit&Go'];
  let jMsg = '', confirmDel = null, sim = { wr: 5, sd: 90, hands: 50000, bi: 40, seed: 1 };
  VIEWS.journal = () => {
    const js = journalStats(), ms = maxStake(js.bank);
    const rows = js.ss.slice().reverse().map((s) => `<tr><td class="mono">${s.date.split('-').reverse().join('/')}</td><td>${esc(s.room)}</td><td>${esc(s.format)} ${esc(s.stake)}</td><td class="mono" style="color:var(${s.result >= 0 ? '--good' : '--bad'})">${eur(s.result)}</td><td class="mono">${s.hands || '—'}</td><td>${'●'.repeat(s.tilt || 0) || '—'}</td><td class="note">${esc(s.notes)}</td><td><button class="btn small" data-act="${confirmDel === s.id ? 'delok' : 'del'}" data-id="${s.id}">${confirmDel === s.id ? 'Confirmer' : 'Supprimer'}</button></td></tr>`).join('');
    return `<section style="display:grid;gap:8px"><h1>Journal</h1><p class="lead">Saisis chaque session juste après l'avoir jouée. Le journal applique ton stop-loss et dit quelle limite ta bankroll autorise.</p></section>
      <div class="stats">
        <div class="stat"><span>Bankroll</span><b>${eur(js.bank)}</b><span>départ ${eur(+state.settings.bankroll0 || 0)}</span></div>
        <div class="stat"><span>Résultat total</span><b style="color:var(${js.total >= 0 ? '--good' : '--bad'})">${eur(js.total)}</b><span>${js.ss.length} sessions</span></div>
        <div class="stat"><span>Par heure</span><b>${js.mins ? eur(js.total / js.mins * 60) : '—'}</b><span>${Math.round(js.mins / 60)} h jouées</span></div>
        <div class="stat"><span>Winrate cash</span><b>${js.wr !== null ? fr(js.wr, 1) : '—'}</b><span>${js.wr !== null ? `bb/100 · ±${fr(js.ci, 1)} (95 %) sur ${js.hands.toLocaleString('fr-FR')} mains` : 'renseigne les mains jouées'}</span></div>
        <div class="stat"><span>Limite max</span><b>${ms || '—'}</b><span>règle des ${state.settings.biRule} caves</span></div>
      </div>
      ${js.wr !== null ? `<p class="note">L'intervalle suppose un écart-type de 90 bb/100, valeur courante en 6-max. Tant qu'il contient 0, le résultat ne prouve rien.</p>` : ''}
      ${jMsg ? `<div class="warnbox" role="alert">${jMsg}</div>` : ''}
      <section class="panel"><span class="eyebrow">Nouvelle session</span><form id="jform" class="form">
        <label class="f">Date<input id="jdate" name="date" type="date" value="${today()}" required></label>
        <label class="f">Room<select id="jroom" name="room">${ROOMS.map((r) => `<option>${r}</option>`).join('')}</select></label>
        <label class="f">Format<select id="jformat" name="format">${FORMATS.map((r) => `<option>${r}</option>`).join('')}</select></label>
        <label class="f">Limite (NL10) ou buy-in (€)<input id="jstake" name="stake" value="NL5" required></label>
        <label class="f">Résultat net (€)<input id="jres" name="result" inputmode="decimal" placeholder="−4,20" required></label>
        <label class="f">Mains jouées (cash)<input id="jhands" name="hands" inputmode="numeric" placeholder="600"></label>
        <label class="f">Durée (min)<input id="jmin" name="minutes" inputmode="numeric" placeholder="60"></label>
        <label class="f">Tilt ressenti<select id="jtilt" name="tilt"><option value="0">Aucun</option><option value="1">Léger</option><option value="2">Net</option><option value="3">Fort</option></select></label>
        <label class="f" style="grid-column:1/-1">Note (une main à revoir, une leçon)<input id="jnotes" name="notes" maxlength="200"></label>
        <div class="row" style="grid-column:1/-1"><button class="btn primary" type="submit">Enregistrer la session</button></div></form></section>
      <section class="panel"><span class="eyebrow">Courbe</span><h2>Bankroll</h2>${js.ss.length ? '<canvas id="bankc" height="220" aria-label="Courbe de bankroll"></canvas>' : '<p class="note">Aucune session pour l\'instant. Renseigne ta bankroll de départ ci-dessous, puis ta première session : la courbe apparaîtra ici.</p>'}</section>
      ${rows ? `<section class="panel"><span class="eyebrow">Sessions</span><div class="tw"><table class="t"><thead><tr><th>Date</th><th>Room</th><th>Jeu</th><th>Résultat</th><th>Mains</th><th>Tilt</th><th>Note</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></section>` : ''}
      <section class="panel"><span class="eyebrow">Réglages</span><div class="form">
        <label class="f">Bankroll de départ (€)<input id="sbank" data-set="bankroll0" inputmode="decimal" value="${state.settings.bankroll0 || ''}" placeholder="200"></label>
        <label class="f">Règle de caves (cash)<input id="sbi" data-set="biRule" inputmode="numeric" value="${state.settings.biRule}"></label></div>
        <details><summary class="note" style="cursor:pointer">Sauvegarde manuelle (copier / coller)</summary><div style="display:grid;gap:8px;margin-top:10px">
          <textarea id="jexport" rows="4" class="mono" style="width:100%;font-size:12px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px" aria-label="Données du journal"></textarea>
          <div class="row"><button class="btn small" data-act="exp">Afficher et copier mes données</button><button class="btn small" data-act="imp">Importer le texte collé</button></div></div></details></section>
      <section class="panel"><span class="eyebrow">Simulateur de variance</span><h2>À quoi ressemblent ${sim.hands.toLocaleString('fr-FR')} mains</h2>
        <div class="form">
          <label class="f">Vrai winrate (bb/100)<input id="vwr" data-sim="wr" inputmode="decimal" value="${sim.wr}"></label>
          <label class="f">Écart-type (bb/100)<input id="vsd" data-sim="sd" inputmode="decimal" value="${sim.sd}"></label>
          <label class="f">Mains<input id="vh" data-sim="hands" inputmode="numeric" value="${sim.hands}"></label>
          <label class="f">Bankroll (caves)<input id="vbi" data-sim="bi" inputmode="numeric" value="${sim.bi}"></label></div>
        <canvas id="simc" height="240" aria-label="Trajectoires simulées"></canvas><div id="simstats" class="stats"></div>
        <div class="row"><button class="btn" data-act="resim">Relancer 30 trajectoires</button></div>
        <p class="note">Chaque courbe est un joueur au même niveau réel. Les écarts entre elles, c'est la chance. Risque de ruine : formule exp(−2 × winrate × bankroll ÷ écart-type²).</p></section>`;
  };
  function drawLines(cv, series, opts = {}) {
    const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.height / (cv._dpr || 1);
    cv._dpr = dpr; cv.width = w * dpr; cv.height = h * dpr; cv.style.height = h + 'px'; const g = cv.getContext('2d'); g.scale(dpr, dpr);
    const cs = getComputedStyle(document.documentElement), col = (v) => cs.getPropertyValue(v).trim();
    const all = series.flatMap((s) => s.pts), z = opts.zero !== false ? [0] : [];
    let ymin = Math.min(...z, ...all, opts.floor ?? all[0]), ymax = Math.max(...z, ...all);
    if (ymax - ymin < 1e-9) { ymin -= 1; ymax += 1; } else if (opts.zero === false) { const m = (ymax - ymin) * 0.1; ymin -= m; ymax += m; }
    const pad = { l: 56, r: 10, t: 10, b: 22 }, n = Math.max(...series.map((s) => s.pts.length)) - 1 || 1;
    const X = (i) => pad.l + (w - pad.l - pad.r) * i / n, Y = (v) => pad.t + (h - pad.t - pad.b) * (1 - (v - ymin) / ((ymax - ymin) || 1));
    g.font = '11px ' + col('--f-mono'); g.fillStyle = col('--muted'); g.strokeStyle = col('--line'); g.lineWidth = 1;
    for (let k = 0; k <= 4; k++) { const v = ymin + (ymax - ymin) * k / 4, y = Y(v); g.beginPath(); g.moveTo(pad.l, y); g.lineTo(w - pad.r, y); g.stroke(); g.fillText((opts.fmt || ((x) => fr(x, 0)))(v), 4, y + 4); }
    if (opts.zero !== false) { g.strokeStyle = col('--muted'); g.beginPath(); g.moveTo(pad.l, Y(0)); g.lineTo(w - pad.r, Y(0)); g.stroke(); }
    if (opts.floor !== undefined) { g.strokeStyle = col('--bad'); g.setLineDash([4, 4]); g.beginPath(); g.moveTo(pad.l, Y(opts.floor)); g.lineTo(w - pad.r, Y(opts.floor)); g.stroke(); g.setLineDash([]); }
    series.forEach((s) => { g.strokeStyle = col(s.color || '--accent'); g.globalAlpha = s.alpha ?? 1; g.lineWidth = s.width || 2; g.beginPath(); s.pts.forEach((v, i) => (i ? g.lineTo(X(i), Y(v)) : g.moveTo(X(i), Y(v)))); g.stroke(); });
    g.globalAlpha = 1;
    if (opts.xlabel) { g.fillStyle = col('--muted'); g.fillText(opts.xlabel, w - pad.r - g.measureText(opts.xlabel).width, h - 6); }
  }
  function runSim() {
    const R = E.rng(sim.seed), steps = Math.max(1, Math.round(sim.hands / 100)), paths = [];
    const gauss = () => { let u = 0, v = 0; while (!u) u = R(); v = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
    let losers = 0, dds = [];
    for (let p = 0; p < 30; p++) {
      const pts = [0]; let x = 0, peak = 0, dd = 0;
      for (let s = 0; s < steps; s++) { x += sim.wr + sim.sd * gauss(); pts.push(x); peak = Math.max(peak, x); dd = Math.max(dd, peak - x); }
      if (x < 0) losers++; dds.push(dd); paths.push(pts.filter((_, i) => i % Math.ceil(steps / 300) === 0 || i === steps));
    }
    dds.sort((a, b) => a - b);
    const ror = sim.wr > 0 ? Math.exp(-2 * sim.wr * sim.bi * 100 / (sim.sd * sim.sd)) : 1;
    return { paths, losers, ddMed: dds[15] / 100, ror };
  }
  AFTER.journal = () => {
    const js = journalStats();
    const bc = $('#bankc');
    if (bc) { let b = +state.settings.bankroll0 || 0; const pts = [b, ...js.ss.map((s) => (b += s.result))]; drawLines(bc, [{ pts }], { zero: false, fmt: (v) => fr(v, 0) + ' €' }); }
    const r = runSim(), sc = $('#simc');
    drawLines(sc, r.paths.map((pts, i) => ({ pts, color: i === 0 ? '--accent' : '--muted', alpha: i === 0 ? 1 : 0.35, width: i === 0 ? 2.5 : 1 })), { floor: -sim.bi * 100, fmt: (v) => fr(v / 100, 0) + ' c', xlabel: 'mains →' });
    $('#simstats').innerHTML = `<div class="stat"><span>Trajectoires perdantes</span><b>${r.losers}/30</b><span>avec un vrai winrate de ${fr(sim.wr, 1)}</span></div>
      <div class="stat"><span>Pire chute (médiane)</span><b>${fr(r.ddMed, 1)} caves</b><span>du sommet au creux</span></div>
      <div class="stat"><span>Risque de ruine</span><b>${sim.wr > 0 ? pct(r.ror, r.ror < 0.01 ? 2 : 0) : '100 %'}</b><span>bankroll de ${sim.bi} caves</span></div>`;
  };

  // ---------- Événements ----------
  document.addEventListener('click', async (e) => {
    const t = e.target.closest('[data-tab],[data-act]'); if (!t) return;
    if (t.dataset.tab) return go(t.dataset.tab);
    const a = t.dataset.act;
    if (a === 'check') { const all = [...document.querySelectorAll('[data-act=check]')].every((c) => c.checked); $('#ckDone').hidden = !all; return; }
    if (a === 'daily') { daily = true; spotMode = 'mix'; spot = null; return go('spots'); }
    if (a === 'openmod') { openMod = t.dataset.id; return go('cours'); }
    if (a === 'closemod') { openMod = null; return render(); }
    if (a === 'readmod') { state.progress.read[t.dataset.id] = true; Store.save('progress'); return render(); }
    if (a === 'drill') { spotMode = t.dataset.type; daily = false; spot = null; return go('spots'); }
    if (a === 'mode') { spotMode = t.dataset.mode; daily = false; spot = null; return render(); }
    if (a === 'ans') return answer(+t.dataset.i);
    if (a === 'next') { newSpot(); render(); $('.opt')?.focus(); return; }
    if (a === 'toEq') {
      if (spot.hands) { eqIn.p = spot.hands.map((h) => h.map(E.cardStr).join('')).concat(['']); eqIn.board = spot.board.slice(0, 3).map(E.cardStr).join(''); }
      else { eqIn.p = [spot.cards.map(E.cardStr).join(''), '', '', '']; eqIn.board = spot.board.map(E.cardStr).join(''); const v = S.villainRange(spot.board).filter((c) => !spot.cards.includes(c[0]) && !spot.cards.includes(c[1])); eqIn.p[1] = [...new Set(v.map((c) => E.abstractOf(c[0], c[1])))].join(', '); }
      eqOut = null; return go('equite');
    }
    if (a === 'calc') { runEquity(); return render(); }
    if (a === 'eqex') { const [p, b] = EQEX[+t.dataset.i]; eqIn.p = p.slice(); eqIn.board = b; runEquity(); return render(); }
    if (a === 'pos') { rPos = t.dataset.p; custom = null; return render(); }
    if (a === 'cell') { if (!custom) custom = new Set(E.parseRange(C.RFI[rPos].range)); const h = t.dataset.h; custom.has(h) ? custom.delete(h) : custom.add(h); return render(); }
    if (a === 'rreset') { custom = null; return render(); }
    if (a === 'r2eq') { eqIn.p[1] = [...(custom || E.parseRange(C.RFI[rPos].range))].join(', '); eqIn.board = ''; eqOut = null; return go('equite'); }
    if (a === 'del') { confirmDel = t.dataset.id; return render(); }
    if (a === 'delok') { state.journal.sessions = state.journal.sessions.filter((s) => s.id !== t.dataset.id); confirmDel = null; jMsg = 'Session supprimée.'; Store.save('journal'); return render(); }
    if (a === 'resim') { sim.seed++; return AFTER.journal(); }
    if (a === 'exp') {
      const ta = $('#jexport'); ta.value = JSON.stringify({ settings: state.settings, journal: state.journal, progress: state.progress });
      ta.select(); try { await navigator.clipboard.writeText(ta.value); jMsg = 'Données copiées. Colle-les dans un fichier pour les garder.'; } catch (err) { jMsg = 'Copie automatique refusée : le texte est sélectionné, copie-le à la main.'; }
      const keep = ta.value; render(); $('#jexport').value = keep; $('details').open = true; return;
    }
    if (a === 'imp') {
      try { const d = JSON.parse($('#jexport').value); if (!Array.isArray(d.journal?.sessions)) throw new Error();
        Object.assign(state.settings, d.settings || {}); state.journal.sessions = d.journal.sessions; if (d.progress) Object.assign(state.progress, d.progress);
        ['settings', 'journal', 'progress'].forEach((k) => Store.save(k)); jMsg = d.journal.sessions.length + ' sessions importées.';
      } catch (err) { jMsg = 'Texte illisible : colle exactement le texte copié depuis « Afficher et copier mes données ».'; }
      return render();
    }
  });
  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.id === 'sitcat') { sitCat = t.value; spot = null; render(); }
    if (t.dataset.set) { state.settings[t.dataset.set] = +String(t.value).replace(',', '.') || 0; Store.save('settings'); render(); }
    if (t.dataset.sim) { sim[t.dataset.sim] = Math.max(t.dataset.sim === 'hands' ? 100 : t.dataset.sim === 'sd' ? 1 : -50, +String(t.value).replace(',', '.') || 0); render(); }
  });
  document.addEventListener('input', (e) => {
    const t = e.target; if (!t.dataset.eq) return;
    if (t.dataset.eq === 'b') eqIn.board = t.value; else eqIn.p[+t.dataset.eq] = t.value;
  });
  document.addEventListener('submit', (e) => {
    if (e.target.id !== 'jform') return;
    e.preventDefault();
    const f = new FormData(e.target), num = (k) => +String(f.get(k) || '').replace(/\s/g, '').replace(',', '.').replace('−', '-');
    const s = { id: 's' + Date.now().toString(36), date: f.get('date'), room: f.get('room'), format: f.get('format'), stake: String(f.get('stake')).trim().toUpperCase().replace(/\s/g, ''), result: num('result'), hands: num('hands') || 0, minutes: num('minutes') || 0, tilt: +f.get('tilt'), notes: String(f.get('notes') || '').slice(0, 200) };
    if (!Number.isFinite(s.result)) { jMsg = 'Résultat illisible : écris par exemple −4,20 ou 12.'; return render(); }
    state.journal.sessions.push(s); Store.save('journal');
    const bi = buyIn(s), lost = bi ? -s.result / bi : 0;
    const ms = maxStake(journalStats().bank), bb = bbOf(s.stake);
    jMsg = lost >= 3 ? `<strong>Stop-loss atteint :</strong> ${fr(lost, 1)} caves perdues. Fin de session, pas de retour aux tables aujourd'hui.`
      : s.tilt >= 2 ? '<strong>Tilt noté.</strong> Pause d\'au moins 30 minutes avant toute nouvelle session, et relis le module Mental.'
      : bb && ms && bb * 100 > bbOf(ms) * 100 ? `<strong>Attention :</strong> ta bankroll autorise au plus ${ms}. Redescends de limite.`
      : 'Session enregistrée.';
    render();
  });

  // ---------- Démarrage ----------
  render();
  Store.init().then(render);
})();
</script>
